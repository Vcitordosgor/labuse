# LA BUSE — jails fail2ban (mandat VPS V5). Défense en PROFONDEUR : l'app verrouille
# déjà le COMPTE après 5 échecs (15 min) ; ici on bannit l'IP au pare-feu — la couche
# qui protège aussi /login/2fa et absorbe un brute-force distribué par compte inconnu.
# Pose : install -m 644 deploy/fail2ban/jail-labuse.conf /etc/fail2ban/jail.d/labuse.conf
#        puis systemctl reload fail2ban && fail2ban-client status labuse-login
[labuse-login]
enabled = true
port    = http,https
filter  = labuse-login
logpath = /var/log/caddy/access.log
maxretry = 10
findtime = 300
bantime  = 3600
