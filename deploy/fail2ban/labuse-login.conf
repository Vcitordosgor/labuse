# LA BUSE — filtre fail2ban : brute-force sur POST /login (mandat VPS V5).
# Matière : le journal d'accès JSON de Caddy (/var/log/caddy/access.log).
# Un échec de login = POST /login répondu 401 par l'app (message neutre côté client).
# Pose : install -m 644 deploy/fail2ban/labuse-login.conf /etc/fail2ban/filter.d/labuse-login.conf
[Definition]
failregex = ^.*"client_ip":"<HOST>".*"method":"POST".*"uri":"/login(/2fa)?".*"status":401.*$
ignoreregex =
