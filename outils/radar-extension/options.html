<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <style>
    body { font: 14px/1.5 -apple-system, system-ui, sans-serif; max-width: 560px; margin: 30px auto; padding: 0 16px; color: #1a1a1a; }
    h1 { font-size: 18px; }
    label { display: block; margin: 14px 0 4px; font-weight: 600; }
    input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    .row { display: flex; gap: 12px; }
    .row > div { flex: 1; }
    button { margin-top: 18px; padding: 10px 18px; border: 0; border-radius: 6px; background: #1f8a4c; color: #fff; font-size: 14px; cursor: pointer; }
    .hint { font-size: 12px; color: #666; margin-top: 2px; }
    #saved { color: #1f8a4c; margin-left: 12px; }
  </style>
</head>
<body>
  <h1>LABUSE Radar — Options</h1>

  <label for="searchUrl">URL de recherche Leboncoin (île entière)</label>
  <input id="searchUrl" type="url" placeholder="https://www.leboncoin.fr/recherche?..." />
  <div class="hint">Ouvrir la recherche normalement dans le navigateur, puis coller l'URL.</div>

  <label for="labuseUrl">URL du back LABUSE</label>
  <input id="labuseUrl" type="url" placeholder="http://localhost:8205" />
  <div class="hint">Si différent de localhost, éditer aussi host_permissions dans manifest.json.</div>

  <label for="token">Jeton (X-Radar-Token)</label>
  <input id="token" type="text" placeholder="jeton partagé" />

  <div class="row">
    <div>
      <label for="hour">Heure de base</label>
      <input id="hour" type="number" min="0" max="23" />
    </div>
    <div>
      <label for="jitterMaxMin">Jitter max (minutes)</label>
      <input id="jitterMaxMin" type="number" min="0" max="600" />
    </div>
  </div>

  <button id="save">Enregistrer</button><span id="saved"></span>

  <script src="options.js"></script>
</body>
</html>
