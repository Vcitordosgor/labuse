<head>

<title>LABUSE — Circuit de la donnée (maquette v5, sur l'inventaire CIRCUIT-0)</title>
<style>
  :root{
    --bg:#0f1512; --panel:#141b17; --panel-2:#1a221d; --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.18);
    --text:#e7ece8; --muted:#94a099; --faint:#66716a;
    --mint:#4ADE80; --ink:#0b1a10; --mint-soft:rgba(74,222,128,.11);
    --mauve:#c084fc; --jaune:#facc15; --ambre:#f5b942; --rouge:#f87171; --gris:#7c877f;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --row:21px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font:13px/1.45 var(--sans);font-variant-numeric:tabular-nums}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
  code{font-family:var(--mono);font-size:11.5px}
  .muted{color:var(--muted)}
  .app-bar{display:flex;align-items:center;gap:22px;height:46px;padding:0 20px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:10}
  .wordmark{font-weight:800;letter-spacing:.06em;font-size:15px} .wordmark b{color:var(--mint);font-weight:800}
  .crumb{color:var(--muted)} .crumb span{color:var(--text)}
  .spacer{flex:1}
  .page{padding:16px 20px 220px;max-width:1560px;margin:0 auto}
  .status{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 14px;border:1px solid var(--line);border-radius:6px;background:var(--panel);margin-bottom:10px}
  .status h1{font-size:17px;font-weight:650;margin:0 10px 0 0;letter-spacing:-.01em}
  .pill{display:inline-flex;align-items:center;gap:7px;padding:4px 10px;border-radius:14px;border:1px solid;font-weight:600;font-size:12px}
  .pill i{width:8px;height:8px;border-radius:50%;display:inline-block}
  .pill.rouge{color:var(--rouge);border-color:var(--rouge)} .pill.rouge i{background:var(--rouge)}
  .pill.ambre{color:var(--ambre);border-color:var(--ambre)} .pill.ambre i{background:var(--ambre)}
  .pill.mint{color:var(--mint);border-color:var(--mint)} .pill.mint i{background:var(--mint)}
  .pill.gris{color:var(--muted);border-color:var(--line-2)} .pill.gris i{background:var(--gris)}
  .btn{padding:7px 13px;border:1px solid var(--mint);color:var(--mint);border-radius:6px;font-weight:600;font-size:12.5px}
  .btn:hover{background:var(--mint);color:var(--ink)}
  .btn.ghost{border-color:var(--line-2);color:var(--text)} .btn.ghost:hover{background:var(--mint);border-color:var(--mint);color:var(--ink)}
  .btn.ambre{border-color:var(--ambre);color:var(--ambre)} .btn.ambre:hover{background:var(--ambre);color:var(--ink)}
  .btn.mauve{border-color:var(--mauve);color:var(--mauve)} .btn.mauve:hover{background:var(--mauve);color:var(--ink)}
  .btn[disabled]{opacity:.4;pointer-events:none}
  .legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);margin:0 0 12px 2px;font-size:12px;align-items:center}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .legend i{display:inline-block;width:22px;height:0;border-top:2px solid var(--mint)}
  .legend i.rouge{border-top:2px dashed var(--rouge)} .legend i.grey{border-top-color:rgba(255,255,255,.25)}
  .legend input{background:var(--panel);border:1px solid var(--line);color:var(--text);padding:5px 9px;border-radius:5px;font:inherit;min-width:260px;margin-left:auto}
  .legend input::placeholder{color:var(--faint)}

  .cl{cursor:pointer}
  .cl:not(.active):hover{background:var(--mint) !important;border-color:var(--mint) !important;color:var(--ink) !important}
  .cl:not(.active):hover *{color:var(--ink) !important;border-color:var(--ink) !important}
  .cl:not(.active):hover .drop{background:var(--ink)}
  .cl:not(.active):hover .water::after{background:var(--ink);animation:none}
  .cl.active{background:var(--mint-soft)}

  .circuit{position:relative;display:grid;grid-template-columns:330px 230px 320px;justify-content:center;column-gap:64px}
  .circuit svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
  .col h3{margin:14px 0 4px;font-size:11.5px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
  .col h3:first-child{margin-top:0}
  .col h3 .n{color:var(--faint);font-weight:400}
  .col h3 .tog{margin-left:auto;color:var(--faint);font-weight:400}
  .col h3.top{color:var(--ambre);cursor:default}
  .grp.closed .row{display:none}
  .row{display:flex;align-items:center;gap:7px;height:var(--row);padding:0 8px;border:1px solid var(--line);border-radius:4px;background:var(--panel);margin-bottom:3px;width:100%;text-align:left;font-size:12px;position:relative}
  .row.child{padding-left:20px} .row.child::before{content:"›";position:absolute;left:8px;color:var(--faint)}
  .row .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .meta{color:var(--muted);font-size:11px;flex:none;white-space:nowrap}
  .row .meta.hm{color:var(--ambre)}
  .row.dim{opacity:.2}
  .row.lit{border-color:var(--mint)}
  .row.sel{border-color:var(--mint);box-shadow:0 0 0 1px var(--mint),0 0 14px rgba(74,222,128,.25)}
  .row.hide{display:none}
  .row.flash{animation:flash .5s ease-out}
  @keyframes flash{0%{background:var(--mint);color:var(--ink)}100%{background:var(--panel)}}
  .water{width:7px;height:14px;border:1px solid var(--line-2);border-radius:2px;position:relative;overflow:hidden;flex:none;background:transparent}
  .water::after{content:"";position:absolute;left:0;right:0;bottom:0;height:100%;background:var(--mint)}
  .water.nouvelle::after{background:var(--ambre);animation:blink 1.1s ease-in-out infinite}
  .water.manuel::after{background:var(--gris);height:60%}
  .water.direct::after{background:var(--mint);opacity:.55}
  .water.vide::after{height:0} .water.vide{border-style:dashed}
  @keyframes blink{50%{opacity:.35}}
  .clock{font-size:11px;flex:none;color:var(--mint)} .clock.attendu{color:var(--ambre)}
  .chk{font-size:10.5px;color:var(--muted);flex:none;padding:0 5px;border:1px solid var(--line);border-radius:3px;line-height:14px;white-space:nowrap}
  .chk.ok{color:var(--mint);border-color:rgba(74,222,128,.45)}
  .chk.warn{color:var(--ambre);border-color:rgba(245,185,66,.55)}
  .chk.bad{color:var(--rouge);border-color:rgba(248,113,113,.55)}
  .chk.run{color:var(--mauve);border-color:rgba(192,132,252,.6);animation:blink 1s ease-in-out infinite}
  .drop{width:8px;height:8px;border-radius:50%;flex:none;background:var(--mint)}
  .drop.purge{background:var(--ambre)} .drop.fuite{background:var(--rouge)} .drop.vide{background:transparent;border:1px dashed var(--gris)}
  .row.ia .nm{color:var(--mauve)}

  .pump-col{position:relative}
  .pump{position:sticky;top:70px;border:1px solid var(--line-2);border-radius:8px;background:var(--panel);padding:14px 14px 12px;text-align:left;width:100%}
  .pump .t{font-size:15px;font-weight:650;margin-bottom:2px}
  .pump .d{color:var(--muted);font-size:12px}
  .pump .st{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);font-size:12px}
  .pump .st.ambre{color:var(--ambre)} .pump .st.mint{color:var(--mint)} .pump .st.rouge{color:var(--rouge)}
  .pump .h{margin-top:6px;font-size:11px;color:var(--faint)}
  .pump.lit{border-color:var(--mint);box-shadow:0 0 0 1px var(--mint),0 0 22px rgba(74,222,128,.25)}
  .pump.running{border-color:var(--mint);animation:pulse 1s ease-in-out infinite}
  @keyframes pulse{50%{box-shadow:0 0 0 3px var(--mint),0 0 30px rgba(74,222,128,.5)}}
  .rel{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px}
  .run{padding:2px 8px;border:1px solid var(--line-2);border-radius:4px;font-family:var(--mono);font-size:11.5px}
  .run.servi{border-color:var(--mint);color:var(--mint)} .run.cand{border-color:var(--ambre);color:var(--ambre)} .run.old{color:var(--muted)}

  path.pipe{stroke:rgba(255,255,255,.14);stroke-width:1.5;fill:none}
  path.bar{stroke:rgba(255,255,255,.22);stroke-width:2;fill:none}
  path.flow{stroke:var(--mint);stroke-width:2.5;fill:none;stroke-dasharray:6 7;animation:flow .9s linear infinite}
  path.fuite{stroke:var(--rouge);stroke-width:2;fill:none;stroke-dasharray:5 6;opacity:.75}
  path.fuite.flow{animation:flow .9s linear infinite;stroke:var(--rouge);opacity:1}
  @keyframes flow{to{stroke-dashoffset:-13}}
  @media (prefers-reduced-motion:reduce){path.flow,.water.nouvelle::after,.pump.running,.chk.run{animation:none}}

  .sheet{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line-2);padding:14px 20px 16px;transform:translateY(110%);transition:transform .18s;z-index:20;max-height:48vh;overflow:auto}
  .sheet.open{transform:none}
  .sheet .in{max-width:1560px;margin:0 auto;display:grid;grid-template-columns:1.2fr 1.1fr 1fr;gap:20px}
  .sheet h4{margin:0 0 2px;font-size:15px;font-weight:650}
  .sheet .k{color:var(--muted);font-size:12px;margin-top:8px}
  .sheet .close{position:absolute;top:10px;right:16px;color:var(--muted);font-size:18px} .sheet .close:hover{color:var(--mint)}
  .chip{display:inline-block;padding:1px 7px;border-radius:4px;background:var(--panel-2);border:1px solid var(--line);margin:2px 3px 0 0;font-size:11.5px;white-space:nowrap;cursor:pointer}
  .chip:hover{border-color:var(--mint);color:var(--mint)}
  .chip.rouge{color:var(--rouge);border-color:var(--rouge)} .chip.ambre{color:var(--ambre);border-color:var(--ambre)} .chip.ia{color:var(--mauve);border-color:rgba(192,132,252,.5)} .chip.gris{color:var(--muted)}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
  .two .v{font-size:22px;font-weight:650;letter-spacing:-.02em}
  .two .ok .v{color:var(--mint)} .two .ko .v{color:var(--rouge)}
  .actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .dates{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin-top:6px}
  .dates div:nth-child(odd){color:var(--muted)}
  .rep{border:1px solid var(--line);border-radius:6px;padding:10px 12px;background:var(--panel-2);margin-top:6px}
  .rep .v{font-weight:650} .rep .v.mint{color:var(--mint)} .rep .v.ambre{color:var(--ambre)} .rep .v.gris{color:var(--gris)}
  .rep ul{margin:4px 0 0;padding-left:16px;color:var(--muted)} .rep li{margin:2px 0}
  .rep .proof{margin-top:8px;padding:6px 9px;border-left:2px solid var(--mint);color:var(--text)}
  .rep .proof.ambre{border-left-color:var(--ambre)} .rep .proof.gris{border-left-color:var(--gris)}
  ul.list{margin:4px 0 0;padding:0;list-style:none} ul.list li{padding:3px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px} ul.list li:first-child{border-top:0}
  .tag{font-size:10.5px;padding:0 5px;border:1px solid var(--line-2);border-radius:3px;color:var(--muted);white-space:nowrap}
  .tag.rouge{color:var(--rouge);border-color:var(--rouge)} .tag.ambre{color:var(--ambre);border-color:var(--ambre)} .tag.mint{color:var(--mint);border-color:var(--mint)} .tag.mauve{color:var(--mauve);border-color:var(--mauve)}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--mint);padding:10px 14px;border-radius:6px;display:none;z-index:30;max-width:90vw}
  .toast.on{display:block} .sheet.open ~ .toast{bottom:calc(48vh + 20px)}
  *:focus-visible{outline:2px solid var(--jaune);outline-offset:2px}
  @media (max-width:1000px){ .circuit{grid-template-columns:1fr;column-gap:0} .circuit svg{display:none} .pump{position:static;margin:14px 0} .sheet .in{grid-template-columns:1fr} .legend input{margin-left:0;width:100%} }
</style>
</head>

function chk(t){
  if(t.run) return `<span class="chk run">agent en route</span>`;

  if(t.id==='dpe_ademe') return `<span class="chk bad">horloge qui ment</span>`;
  if(v.par==='interne') return `<span class="chk">interne</span>`;
  if(v.par==='jamais') return `<span class="chk warn">jamais vérifié</span>`;
  if(v.par==='rappel') return `<span class="chk">rappel ${v.jours} j</span>`;
  if(v.par==='sonde_jamais') return `<span class="chk warn">sonde jamais passée</span>`;
  if(v.par==='agent') return `<span class="chk ok">agent ${v.quand}</span>`;
  if(v.statut==='injoignable') return `<span class="chk bad">sonde ${v.quand}, injoignable</span>`;
  if(v.statut==='nouvelle_version') return `<span class="chk warn">sonde ${v.quand}, nouvelle version</span>`;
  return `<span class="chk ok">sonde ${v.quand}</span>`;
}

/* ---------- tuyaux ---------- */
function rect(el){const c=document.getElementById('circuit').getBoundingClientRect(), r=el.getBoundingClientRect(); return {l:r.left-c.left,r:r.right-c.left,t:r.top-c.top,b:r.bottom-c.top,y:r.top-c.top+r.height/2};}
const vis = el=>el.offsetParent!==null;
function geo(){
  const tanks=[...document.querySelectorAll('.row[data-type=tank]')].filter(vis), taps=[...document.querySelectorAll('.row[data-type=tap]')].filter(vis);
  const pump=rect(document.getElementById('pump')), tcol=rect(document.getElementById('tanks')), rcol=rect(document.getElementById('taps'));
  const cx=tcol.r+28, dx=rcol.l-28, py=pump.t+(pump.b-pump.t)/2;
  const ty={}; tanks.forEach(el=>ty[el.dataset.id]=rect(el)); const ay={}; taps.forEach(el=>ay[el.dataset.id]=rect(el));
  return {cx,dx,py,pump,ty,ay};
}
function drawBase(){
  if(window.innerWidth<=1000) return;
  const g=geo(); let out='';
  const tys=Object.values(g.ty).map(r=>r.y), ays=Object.values(g.ay).map(r=>r.y);
  Object.values(g.ty).forEach(r=>{out+=`<path class="pipe" d="M${r.r},${r.y} L${g.cx},${r.y}"/>`;});
  Object.values(g.ay).forEach(r=>{out+=`<path class="pipe" d="M${g.dx},${r.y} L${r.l},${r.y}"/>`;});
  if(tys.length) out+=`<path class="bar" d="M${g.cx},${Math.min(...tys)} L${g.cx},${Math.max(...tys)}"/>`;
  if(ays.length) out+=`<path class="bar" d="M${g.dx},${Math.min(...ays)} L${g.dx},${Math.max(...ays)}"/>`;
  FUITES.forEach((f,i)=>{ if(g.ty[f.tank]&&g.ay[f.tap]) out+=`<path class="fuite" data-fuite="${f.tap}" data-tank="${f.tank}" d="${fuitePath(g,f,i)}"/>`; });
  document.getElementById('base').innerHTML=out; drawPumpLink(g);
}
function drawPumpLink(g){ g=g||geo(); document.getElementById('plink').innerHTML=`<path class="bar" d="M${g.cx},${g.py} L${g.pump.l},${g.py}"/><path class="bar" d="M${g.pump.r},${g.py} L${g.dx},${g.py}"/>`; }
function fuitePath(g,f,i){ const t=g.ty[f.tank], a=g.ay[f.tap], bx=g.cx+14+i*6, dx=g.dx-14-i*6, lane=-12-i*8; return `M${t.r},${t.y+5} L${bx},${t.y+5} L${bx},${lane} L${dx},${lane} L${dx},${a.y} L${a.l},${a.y}`; }
function litPaths(type,id){
  const g=geo(); let out='';
  const toPump=r=>{const x=g.ty[r]; return x?`<path class="flow" d="M${x.r},${x.y} L${g.cx},${x.y} L${g.cx},${g.py} L${g.pump.l},${g.py}"/>`:'';};
  const fromPump=t=>{const x=g.ay[t]; return x?`<path class="flow" d="M${g.pump.r},${g.py} L${g.dx},${g.py} L${g.dx},${x.y} L${x.l},${x.y}"/>`:'';};
  if(type==='tank'){ out+=toPump(id); tapsOfTank(id).forEach(t=>out+=fromPump(t)); }
  if(type==='tap'){ tanksOfTap(id).forEach(r=>out+=toPump(r)); out+=fromPump(id); }
  if(type==='pump'){ Object.keys(g.ty).forEach(r=>out+=toPump(r)); Object.keys(g.ay).forEach(t=>out+=fromPump(t)); }
  return out;
}
function drawLit(){ if(window.innerWidth<=1000) return; document.getElementById('lit').innerHTML=(sel&&(sel.type==='tank'||sel.type==='tap'||sel.type==='pump'))?litPaths(sel.type,sel.id):''; }

/* ---------- sélection ---------- */
let sel=null;
function reach(type,id){
  const s=new Set();
  if(type==='tank'){ s.add('tank:'+id); tapsOfTank(id).forEach(t=>s.add('tap:'+t)); FUITES.filter(f=>f.tank===id).forEach(f=>s.add('tap:'+f.tap)); }
  if(type==='tap'){ s.add('tap:'+id); tanksOfTap(id).forEach(r=>s.add('tank:'+r)); FUITES.filter(f=>f.tap===id).forEach(f=>s.add('tank:'+f.tank)); }
  if(type==='pump'){ Object.keys(TANK).forEach(r=>s.add('tank:'+r)); Object.keys(TAP).forEach(t=>s.add('tap:'+t)); }
  return s;
}
function applySel(set){
  document.querySelectorAll('.row[data-type]').forEach(r=>{
    const key=r.dataset.type+':'+r.dataset.id;
    r.classList.toggle('dim', !!set && !set.has(key)); r.classList.toggle('lit', !!set && set.has(key));
    const isSel = !!sel && (sel.type==='tank'||sel.type==='tap') && key===sel.type+':'+sel.id;
    r.classList.toggle('sel', isSel); r.classList.toggle('active', isSel);
  });
  document.getElementById('pump').classList.toggle('lit', !!sel && sel.type!=='group');
  document.getElementById('pump').classList.toggle('active', !!sel && sel.type==='pump');
  document.querySelectorAll('path.fuite').forEach(p=>p.classList.toggle('flow', !!sel && ((sel.type==='tap'&&p.dataset.fuite===sel.id)||(sel.type==='tank'&&p.dataset.tank===sel.id)||(sel.type==='group'&&sel.kind==='tap'&&sel.ids.includes(p.dataset.fuite)))));
}
function select(type,id){
  if(sel && sel.type===type && sel.id===id){ sel=null; } else sel={type,id};
  applySel(sel?reach(sel.type,sel.id):null); drawLit(); renderSheet();
}
function selectGroup(kind,ids,titre){
  sel={type:'group',kind,ids,titre};
  const set=new Set(ids.map(i=>kind+':'+i)); applySel(set); drawLit(); renderSheet();
}
document.getElementById('circuit').addEventListener('click',e=>{

function chips(ids,kind){ return ids.map(i=>{const o=kind==='tank'?TANK[i]:TAP[i]; if(!o) return ''; const cls=o.ia?'ia':o.etat==='fuite'?'rouge':(o.etat==='purge'||o.etat==='nouvelle')?'ambre':''; return `<span class="chip ${cls}" onclick="select('${kind}','${i}')">${esc(o.nom)}</span>`;}).join(''); }

function renderSheet(){

  if(sel.type==='group'){
    html=`<div><h4>${esc(sel.titre)}</h4><div class="k">${sel.ids.length} ${sel.kind==='tank'?'réservoirs':'robinets'}. Clique une pastille pour ouvrir.</div>
      ${sel.kind==='tank'?`<div class="actions"><button class="btn mauve" onclick="envoyerTous(${JSON.stringify(sel.ids)})">Envoyer les agents sur ces ${sel.ids.length}</button></div>`:''}</div>
      <div style="grid-column:span 2"><div>${chips(sel.ids,sel.kind)}</div></div>`;
  }
  if(sel.type==='tank'){
    const t=TANK[sel.id], v=t.verif||{par:'jamais'}, rap=RAPPORTS[t.id], taps=tapsOfTank(t.id), chs=[...(T2C[t.id]||[])], fu=FUITES.filter(f=>f.tank===t.id), ag=DATA.agents[t.id];
    const chez = t.etat==='nouvelle' ? `<span style="color:var(--ambre)">nouvelle version</span> ${rap?'trouvée par l\'agent':'vue par la sonde'} ${v.vu?'('+esc(v.vu)+')':''}`
      : v.par==='sonde' ? (v.statut==='injoignable'?`<span style="color:var(--rouge)">injoignable</span> à la dernière sonde`:`inchangée, sonde ${v.methode} : ${esc(v.vu||'—')}`)
      : v.par==='agent' ? `${esc(rap?rap.trouve:'')}`
      : v.par==='rappel' ? `pas de sonde, rappel tous les ${v.jours} jours`
      : `<span style="color:var(--ambre)">inconnue</span>, personne n'est allé voir`;
    const dernier = t.run?'<span style="color:var(--mauve)">agent en route</span>':v.par==='sonde'?`sonde le ${v.quand}`:v.par==='agent'?`agent le ${v.quand}`:v.par==='rappel'?'rappel, pas de contrôle':v.par==='interne'?'sans objet':'<span style="color:var(--ambre)">jamais</span>';
    html=`<div><h4>${esc(t.nom)}</h4><div class="muted">${esc(t.producteur||'')} · ${esc(t.mode)}${t.cadence&&t.cadence!=='aucune'?' · cadence '+esc(t.cadence):' · <span style="color:var(--ambre)">aucune cadence déclarée</span>'}</div>
      <div class="dates">
        <div>Dans le réservoir</div><div>${esc(t.serviFull)}${t.injection?`, injectée le ${esc(t.injection)}`:''}</div>
        <div>Chez le producteur</div><div>${chez}</div>
        <div>Dernier contrôle</div><div>${dernier}</div>
        ${t.clock?`<div>Horloge</div><div class="${t.clock.type==='attendu'?'':''}" style="color:${t.clock.type==='attendu'?'var(--ambre)':'var(--text)'}">${esc(t.clock.txt)}</div>`:''}
      </div>
      ${t.note?`<div class="k" style="color:var(--rouge)">${esc(t.note)}</div>`:''}
      ${t.raison&&!t.sentinelle?`<div class="k">Pas de sonde : ${esc(t.raison)}</div>`:''}
      <div class="actions">
        ${t.mode!=='interne'?`<button class="btn mauve" onclick="envoyerAgent('${t.id}')" ${t.run?'disabled':''}>Envoyer un agent</button>`:''}
        ${t.etat==='nouvelle'?`<button class="btn ambre" onclick="ouvrirVanne('${t.id}')">Ouvrir la vanne, injecter</button>`:''}
      </div>
      ${t.etat==='nouvelle'?`<div class="k">La vanne lance le job d'ingestion existant. L'eau attend ensuite dans la pompe : les robinets ne changent qu'après Calculer puis Basculer.</div>`:''}
    </div>
    <div>${rap?rapportHtml(rap):`<div class="k" style="margin-top:0">Rapport de l'agent</div><div class="muted">${ag?`Pas encore d'agent envoyé. Brief connu : ${esc(ag.piste)}${ag.url?' · '+esc(ag.url):''}${ag.js==='oui'?' · page en JavaScript, navigateur nécessaire':''}`:'Pas encore d\'agent envoyé.'}</div>${t.url?`<div class="k">URL connue du code</div><div><code>${esc(t.url)}</code></div>`:''}`}</div>
    <div><div class="k" style="margin-top:0">Alimente ${chs.length} chiffres dans ${taps.length} robinets, par le moteur</div><div>${chips(taps,'tap')||'<span class="muted">aucun chiffre du registre ne lit ce réservoir</span>'}</div>
      ${fu.length?`<div class="k" style="color:var(--rouge)">Branché en direct, hors moteur</div><div>${chips([...new Set(fu.map(f=>f.tap))],'tap')}</div><div class="k">${fu.map(f=>esc(DATA.chiffres[f.chiffre]?DATA.chiffres[f.chiffre].libelle:f.chiffre)+' — '+esc(f.ou)).join('<br>')}</div>`:''}</div>`;
  }
  if(sel.type==='tap'){
    const t=TAP[sel.id], tanks=tanksOfTap(t.id);
    const fuitesHtml=t.fuites.map(f=>{const m=DATA.mesures[f.chiffre]; const lab=DATA.chiffres[f.chiffre]?DATA.chiffres[f.chiffre].libelle:f.chiffre; return `<div class="k" style="color:var(--rouge)">Fuite : ${esc(lab)}${m?', '+esc(m.cle):''}</div>${m?`<div class="two"><div class="ok"><div class="v">${esc(m.a)}</div><div class="muted">${esc(m.ra)}</div></div><div class="ko"><div class="v">${esc(m.b)}</div><div class="muted">${esc(m.rb)}</div></div></div><div class="k">Cause : ${esc(m.cause)} · écart ${esc(m.ecart)}</div>`:''}<div><code>${esc(f.ou)}</code></div>`;}).join('');
    html=`<div><h4>${esc(t.nom)}</h4><div class="muted">${esc(t.rendu)}${t.parent?' · dans '+esc(TAP[t.parent]?TAP[t.parent].nom:t.parent):''} · <code>${esc(t.route)}</code></div>
      ${fuitesHtml}
      ${t.etat==='purge'?`<div class="k" style="color:var(--ambre)">${esc(t.info)}</div>`:''}
      ${!t.nb?`<div class="k">Ce robinet n'affiche aucun chiffre : tuiles ou géométries seulement, hors registre.</div>`:t.etat==='ok'&&!t.hm?`<div class="k" style="color:var(--mint)">Tout ce qu'il affiche passe par le moteur.</div>`:''}
      ${t.hm?`<div class="k" style="color:var(--ambre)">${t.hm} chiffre${t.hm>1?'s':''} calculé${t.hm>1?'s':''} hors moteur, à rebrancher.</div>`:''}
      ${t.ia?`<div class="k" style="color:var(--mauve)">Surface IA : le Copilote ne doit rien calculer, ses outils SQL appellent le moteur.</div>`:''}
    </div>
    <div><div class="k" style="margin-top:0">Ce qu'il affiche, ${t.nb} chiffre${t.nb>1?'s':''}</div><ul class="list">${t.chiffres.map(c=>{const k=c.calcul.split(':')[0]; const cls=k==='moteur'?'mint':(k==='sql_propre'||k==='front')?'ambre':''; return `<li><span title="${esc(c.def)}">${esc(c.libelle)}</span><span><span class="tag ${cls}">${esc(CALC_LABEL[k]||k)}${k==='moteur'?' '+esc(c.calcul.split(':')[1]||''):''}</span> <span class="tag ${c.tampon==='rien'?'':'mint'}">${c.tampon==='rien'?'sans tampon':'tampon '+esc(c.tampon)}</span></span></li>`;}).join('')||'<li class="muted">aucun</li>'}</ul></div>
    <div><div class="k" style="margin-top:0">Alimenté par ${tanks.length} réservoirs</div><div>${chips(tanks,'tank')||'<span class="muted">aucun, par le registre</span>'}</div>
      ${t.fuites.length?`<div class="k" style="color:var(--rouge)">Et en direct par</div><div>${chips([...new Set(t.fuites.map(f=>f.tank))],'tank')}</div>`:''}</div>`;
  }
  if(sel.type==='pump'){
    const c=PUMP.candidat;
    const mot = DATA.moteurs.map(m=>{const r=m.run.toLowerCase(); const cls=r.startsWith('en retard')?'rouge':r.startsWith('pointeur_propre')?'ambre':r.startsWith('constante')?'mint':''; return `<li><span>${esc(m.nom)}</span><span class="tag ${cls}">${esc(m.run.length>28?m.run.slice(0,28)+'…':m.run)}</span></li>`;}).join('');
    const jobs = DATA.jobs.filter(j=>j.eau).map(j=>`<li><span>${esc(j.id)}${j.legacy?' <span class="tag ambre">legacy</span>':''}</span><span class="muted">${esc(j.h)}</span></li>`).join('');
    html=`<div><h4>Le moteur</h4>
      <div class="dates">
        <div>Run servi</div><div><span class="run servi">${PUMP.servi}</span></div>
        <div>Eau nouvelle en attente</div><div>${PUMP.attente.length?PUMP.attente.map(a=>`${esc(a.version)}, vue le ${a.quand}`).join('<br>'):'<span class="muted">aucune</span>'}</div>
        <div>Candidat</div><div>${PUMP.running?'<span style="color:var(--mint)">en cours de calcul</span>':c?`<span class="run cand">${c.id}</span> prêt, calculé le ${c.quand}`:'<span class="muted">aucun</span>'}</div>
        ${PUMP.precedent?`<div>Précédent</div><div><span class="run old">${PUMP.precedent}</span>, retour possible</div>`:''}
        <div>Pointeurs</div><div style="color:var(--rouge)">${PUMP.pointeurs} au lieu d'un : served_run.txt, précédent et mvt_meta alignés ; résiduel sur son propre pointeur ; ${esc(PUMP.retard)}</div>
      </div>
      <div class="actions">
        <button class="btn" onclick="calculer()" ${PUMP.running||(!PUMP.attente.length&&!c)?'disabled':''}>Faire tourner la pompe, calculer</button>
        ${c?`<button class="btn ambre" onclick="basculer()">Basculer sur ${c.id}</button>`:''}
        ${PUMP.precedent?`<button class="btn ghost" onclick="retour()">Revenir à ${PUMP.precedent}</button>`:''}
      </div>
      <div class="k">Calculer produit un candidat, jamais servi tout seul. Basculer doit déplacer les ${PUMP.pointeurs} pointeurs d'un seul geste, sinon la bascule ment. Le contrôle repart seul après.</div>
    </div>
    <div>${c?`<div class="k" style="margin-top:0">Note de version de ${c.id}</div><div class="rep"><div class="v ambre">Ce qui change</div><ul>${c.note.map(n=>`<li>${esc(n)}</li>`).join('')}</ul><div class="k">Écart avec ${PUMP.servi}</div><div>${CPT.chiffres} chiffres recalculés · ${c.sorties} parcelles sortent de Priorité, ${c.entrees} y entrent, chacune expliquée</div><div class="proof ambre">À lire avant de basculer : les ${c.sorties} sorties, une par une.</div></div>`
      :`<div class="k" style="margin-top:0">${CPT.moteurs} moteurs et leur pointeur de run</div><ul class="list">${mot}</ul>`}</div>
    <div><div class="k" style="margin-top:0">Horloges qui touchent l'eau, ${DATA.jobs.filter(j=>j.eau).length} dont ${DATA.jobs.filter(j=>j.eau&&j.legacy).length} legacy</div><ul class="list">${jobs}</ul><div class="k" style="color:var(--ambre)">Deux jeux de crons coexistent dans le dépôt ; lequel est posé sur le VPS est le premier DOUTE à lever.</div></div>`;
  }
  sh.innerHTML=`<button class="close" onclick="sel=null;applySel(null);drawLit();renderSheet()" aria-label="Fermer">✕</button><div class="in">${html}</div>`;
  sh.classList.add('open'); sh.setAttribute('aria-hidden','false');
}

/* ---------- vanne, pompe (simulation) ---------- */
function setTapEtat(id, etat, info){ const x=TAP[id]; if(!x||x.etat==='fuite') return; x.etat=etat; x.info=info||''; refreshTapRow(id); }
function ouvrirVanne(id){
  const t=TANK[id]; if(t.etat!=='nouvelle') return;
  const taps=tapsOfTank(id);
  toast(`Vanne ouverte : l'eau descend dans le réservoir. Les robinets ne bougent pas encore.`);
  const g=geo(); if(g.ty[id]) document.getElementById('lit').innerHTML=`<path class="flow" d="M${g.ty[id].r},${g.ty[id].y} L${g.cx},${g.ty[id].y} L${g.cx},${g.py} L${g.pump.l},${g.py}"/>`;
  setTimeout(()=>{
    const anc=t.servi; t.etat='ok'; t.servi='nouvelle version'; t.serviFull='nouvelle version injectée le 05/09 (simulation)'; t.injection='05/09'; t.verif={par:'sonde',quand:'05/09',statut:'ok',vu:'la même',methode:t.methode};
    PUMP.attente.push({id, version:`${t.nom}`, quand:'05/09'});
    taps.forEach(x=>setTapEtat(x,'purge',`Eau ancienne : ce robinet sert encore l'eau ${anc} de ${t.nom}. Fais tourner la pompe.`));
    refreshTankRow(id); document.getElementById('lit').innerHTML=''; drawBase(); renderPump(); renderStatus(); renderSheet();
    toast(`${esc(t.nom)} : eau nouvelle dans le réservoir. ${taps.length} robinets servent encore l'ancienne : fais tourner la pompe.`);
  },1500);
}
function calculer(){
  if(PUMP.running) return; PUMP.running=true; renderPump(); renderSheet();
  const g=geo(); document.getElementById('lit').innerHTML=PUMP.attente.map(a=>{const r=g.ty[a.id]; return r?`<path class="flow" d="M${r.r},${r.y} L${g.cx},${r.y} L${g.cx},${g.py} L${g.pump.l},${g.py}"/>`:'';}).join('');
  toast('La pompe tourne : run candidat en cours, rien de servi ne change.');
  setTimeout(()=>{
    const n=parseInt((PUMP.servi.match(/q_v(\d+)/)||[0,11])[1])+1;
    const note=PUMP.attente.map(a=>`${a.version}, vue le ${a.quand}`); if(!note.length) note.push('recalcul mensuel de contrôle');
    PUMP.candidat={id:`q_v${n}`,quand:'05/09',note,sorties:50,entrees:12}; PUMP.running=false; document.getElementById('lit').innerHTML='';
    renderPump(); renderStatus(); renderSheet(); toast(`Candidat ${PUMP.candidat.id} prêt. Lis la note de version, puis bascule.`);
  },2600);
}
function basculer(){
  const c=PUMP.candidat; if(!c) return;
  PUMP.precedent=PUMP.servi; PUMP.servi=c.id; PUMP.candidat=null; PUMP.attente=[]; PUMP.retard=null; PUMP.pointeurs=1;
  const purges=Object.values(TAP).filter(x=>x.etat==='purge').map(x=>x.id);
  document.getElementById('lit').innerHTML=litPaths('pump','pump');
  purges.forEach((id,k)=>setTimeout(()=>{ setTapEtat(id,'ok'); const r=document.querySelector(`.row[data-id="${id}"]`); r.classList.add('flash'); setTimeout(()=>r.classList.remove('flash'),600); },200+k*60));
  renderPump(); renderStatus(); renderSheet();
  toast(`Bascule faite d'un seul geste : les robinets servent ${PUMP.servi}. Contrôle après bascule en cours…`);
  setTimeout(()=>{ document.getElementById('lit').innerHTML=''; drawBase(); renderStatus(); toast(`Contrôle après bascule : ${FUITES.length} fuites inchangées (elles ne passent pas par la pompe), 0 robinet à purger. Retour à ${PUMP.precedent} possible d'un clic.`); },2400);
}
function retour(){
  if(!PUMP.precedent) return; const cand=PUMP.servi; PUMP.servi=PUMP.precedent; PUMP.precedent=null;
  PUMP.candidat={id:cand,quand:'05/09',note:['candidat conservé, non servi'],sorties:50,entrees:12};
  renderPump(); renderStatus(); renderSheet(); toast(`Retour à ${PUMP.servi}. Le candidat ${cand} reste prêt.`);
}

/* ---------- agents (simulation) ---------- */
const RAPPORTS={};
const RAP_SPEC={
  sitadel:{cherche:['data.gouv.fr, jeu Sitadel3','statistiques.developpement-durable.gouv.fr','recherche web « Sitadel3 mise à jour 2026 »'],trouve:'Sitadel3 mis à jour le 28/08/2026, permis jusqu\'à juillet 2026 ; le réservoir dit 2026-07, l\'injection lancée le 03/09 n\'a pas laissé de trace de fin',preuve:'« Dernière mise à jour : 28 août 2026 » sur la page du jeu data.gouv.fr',verdict:'nouvelle',sonde:'endpoint de métadonnées data.gouv.fr, déjà lu par la sonde'},
  deal_wms_wfs:{cherche:['reunion.developpement-durable.gouv.fr, cartographie','GetCapabilities du WMS/WFS','recherche web « DEAL Réunion WFS 2026 »'],trouve:'le service WFS a changé d\'URL, l\'ancienne répond 404 : d\'où « injoignable » à la sonde',preuve:'GetCapabilities daté 2026-08-12 sur la nouvelle URL',verdict:'a_jour',sonde:'nouvelle URL à inscrire dans la sonde, méthode api'},
  deal_ppr:{cherche:['reunion.developpement-durable.gouv.fr, PPR par commune','Lizmap DEAL','recherche web « PPR approuvé Réunion 2026 »'],trouve:'PPR inondation de Saint-Paul révisé, approuvé par arrêté du 28/08/2026',preuve:'« Arrêté préfectoral du 28 août 2026 portant approbation… » sur le site de la DEAL',verdict:'nouvelle',sonde:'page en JavaScript, témoin Lizmap conservé, agent mensuel conseillé'},
  office_eau_chroniques:{cherche:['eaureunion.fr, publications','data.gouv.fr','recherche web « Office de l\'eau Réunion chronique 2026 »'],trouve:'rien de plus récent que la chronique n°149 (données 2023) ; la n°150 est annoncée « à paraître »',preuve:'« Chronique n°150 : à paraître » sur la page publications',verdict:'introuvable',sonde:'aucun endpoint ; garder le rappel annuel'},
  fichiers_fonciers_cerema:{cherche:['datafoncier.cerema.fr','recherche web « fichiers fonciers 2025 convention »'],trouve:'millésime 2025 disponible pour les ayants droit, formulaire de convention en ligne',preuve:'« Millésime 2025 disponible » et formulaire sur datafoncier.cerema.fr',verdict:'vide',sonde:'sans objet tant qu\'il n\'y a pas de convention'},
  gpu_plu_api_carto:{cherche:['Géoportail de l\'urbanisme, 24 communes','sites des mairies de Saint-André et Saint-Leu'],trouve:'aucun nouveau millésime au GPU ; Saint-Leu en révision, PLU en vigueur inchangé',preuve:'dates de publication GPU identiques à celles du réservoir',verdict:'a_jour',sonde:'témoin par géométrie commune par commune, à inscrire'},
  zfang:{cherche:['Légifrance, décret n° 2026-421','recherche web « ZFANG Réunion 2026 »'],trouve:'décret inchangé depuis le 29/05/2026',preuve:'« Version en vigueur au 05/09/2026 » sur Légifrance',verdict:'a_jour',sonde:'page en JavaScript : agent seulement'},
};
function rapportAgent(t){
  const sp=RAP_SPEC[t.id]; if(sp) return Object.assign({id:t.id,quand:'05/09'},sp);
  const ag=DATA.agents[t.id]||{};
  return {id:t.id,quand:'05/09',cherche:[ag.url?ag.url:'page du producteur','catalogue data.gouv.fr','recherche web « '+t.nom+' 2026 »'],trouve:`dernière version publiée : ${t.serviFull.slice(0,60)}, la même que le réservoir`,preuve:'date de publication lue sur la page du producteur',verdict:t.etat==='vide'?'vide':'a_jour',sonde:t.sentinelle?'déjà lue par la sonde de nuit':(ag.piste||'endpoint stable trouvé, à inscrire dans la sonde')};
}
function rapportHtml(r){
  const L={a_jour:['À jour','mint'],nouvelle:['Nouvelle version trouvée','ambre'],introuvable:['Introuvable, dit honnêtement','gris'],vide:['Réservoir vide, chemin trouvé','gris']}[r.verdict];
  return `<div class="k" style="margin-top:0">Rapport de l'agent, ${r.quand}</div><div class="rep"><div class="v ${L[1]}">${L[0]}</div><div class="k">Où il a cherché</div><ul>${r.cherche.map(c=>`<li>${esc(c)}</li>`).join('')}</ul><div class="k">Ce qu'il a trouvé</div><div>${esc(r.trouve)}</div><div class="proof ${L[1]}">Preuve : ${esc(r.preuve)}</div><div class="k">Pour la sonde de nuit</div><div class="muted">${esc(r.sonde)}</div></div>`;
}
function envoyerAgent(id,done){
  const t=TANK[id]; if(!t||t.run||t.mode==='interne') return;
  t.run=true; refreshTankRow(id); if(sel&&sel.type==='tank'&&sel.id===id) renderSheet();
  setTimeout(()=>{
    const r=rapportAgent(t); RAPPORTS[id]=r; t.run=false; t.verif={par:'agent',quand:r.quand,statut:r.verdict==='nouvelle'?'nouvelle_version':'ok',vu:r.trouve.slice(0,40)};
    if(r.verdict==='nouvelle'){ t.etat='nouvelle'; }
    refreshTankRow(id); drawBase(); renderStatus(); if(sel&&sel.type==='tank'&&sel.id===id) renderSheet();
    if(done) done(r);
  },1200+Math.random()*1500);
}
function envoyerTous(ids){
  const res={a_jour:0,nouvelle:0,introuvable:0,vide:0}; let left=ids.length;
  toast(`${ids.length} agents partis. Chacun revient avec une preuve, ou dit qu'il n'a rien trouvé.`);
  if(sel&&sel.type==='group'){ sel=null; applySel(null); renderSheet(); }
  ids.forEach((id,k)=>setTimeout(()=>envoyerAgent(id,r=>{res[r.verdict]++; if(--left===0) toast(`${ids.length} agents revenus : ${res.a_jour} à jour, ${res.nouvelle} nouvelles versions (à injecter par la vanne), ${res.introuvable} introuvable, ${res.vide} vides. Chaque verdict a sa preuve dans le réservoir.`);}),k*120));
}

/* ---------- vérifier que tout coule ---------- */
function verifier(){
  sel=null; applySel(null); renderSheet();
  document.getElementById('pump').classList.add('lit'); document.getElementById('lit').innerHTML=litPaths('pump','pump');
  document.querySelectorAll('path.fuite').forEach(p=>p.classList.add('flow'));
  toast('Contrôle en cours : chaque robinet est ouvert sur les 24 communes et les 50 parcelles témoins, et comparé au moteur.');
  setTimeout(()=>{
    document.getElementById('lit').innerHTML=''; document.getElementById('pump').classList.remove('lit'); document.querySelectorAll('path.fuite').forEach(p=>p.classList.remove('flow'));
    const nP=Object.values(TAP).filter(t=>t.etat==='purge').length;
    toast(`Contrôle terminé : ${FUITES.length} fuites mesurées (zonage A et N, nombre de sources, prix du neuf), ${nP} robinets à purger, ${CPT.hors_moteur} affichages hors moteur non mesurés. Le reste coule.`);
    selectGroup('tap',[...new Set(FUITES.map(f=>f.tap))],'Robinets avec une fuite mesurée');
  },2200);
}

/* ---------- divers ---------- */
let toastT=null;
function toast(msg){const t=document.getElementById('toast'); t.innerHTML=msg; t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),6000);}
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&sel){ sel=null; applySel(null); drawLit(); renderSheet(); } });
window.addEventListener('resize',()=>{drawBase();drawLit();});
window.addEventListener('scroll',()=>{ if(window.innerWidth>1000){ drawPumpLink(); drawLit(); } },{passive:true});
renderPump(); renderStatus(); requestAnimationFrame(()=>drawBase());
</script>
