<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LABUSE — Circuit v8</title>
<style>
  :root{
    --bg:#0f1512; --panel:#141b17; --panel-2:#1a221d; --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.16);
    --text:#e7ece8; --muted:#94a099; --faint:#66716a;
    --mint:#4ADE80; --ink:#0b1a10; --mint-soft:rgba(74,222,128,.10);
    --mauve:#c084fc; --jaune:#facc15; --ambre:#f5b942; --rouge:#f87171; --gris:#6f7a73;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font:13.5px/1.45 var(--sans);font-variant-numeric:tabular-nums}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;text-align:left}
  code{font-family:var(--mono);font-size:12px}
  .muted{color:var(--muted)} .faint{color:var(--faint)}

  /* ---- bandeau + onglets ---- */
  .app-bar{display:flex;align-items:center;gap:22px;height:46px;padding:0 24px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:20}
  .wordmark{font-weight:800;letter-spacing:.06em;font-size:15px} .wordmark b{color:var(--mint);font-weight:800}
  .crumb{color:var(--muted)} .crumb span{color:var(--text)}
  .spacer{flex:1}
  .tabs{display:flex;align-items:center;gap:2px;padding:0 24px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:46px;z-index:19}
  .tabs button{padding:12px 16px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:500;font-size:13.5px}
  .tabs button.on{color:var(--text);border-bottom-color:var(--mint)}
  .tabs button:not(.on):hover{color:var(--text)}
  .tabs .n{color:var(--faint);font-weight:400;margin-left:6px}
  .tabs .on .n{color:var(--ambre)}
  .tabs .actions{margin-left:auto;display:flex;gap:8px;padding:7px 0}
  .btn{padding:7px 13px;border:1px solid var(--line-2);color:var(--text);border-radius:6px;font-weight:600;font-size:12.5px;white-space:nowrap}
  .btn:hover{background:var(--mint);border-color:var(--mint);color:var(--ink)}
  .btn.mint{border-color:var(--mint);color:var(--mint)} .btn.mint:hover{background:var(--mint);color:var(--ink)}
  .btn.mauve{border-color:var(--mauve);color:var(--mauve)} .btn.mauve:hover{background:var(--mauve);color:var(--ink)}
  .btn.ambre{border-color:var(--ambre);color:var(--ambre)} .btn.ambre:hover{background:var(--ambre);color:var(--ink)}
  .btn[disabled]{opacity:.35;pointer-events:none}
  main{padding:22px 24px 120px;max-width:1500px;margin:0 auto}
  .tab{display:none} .tab.on{display:block}

  /* ---- résumé ---- */
  .res{max-width:1000px}
  .res h1{font-size:28px;font-weight:650;letter-spacing:-.02em;margin:4px 0 4px} .res h1 b{color:var(--ambre);font-weight:650}
  .res .sub{color:var(--muted);margin-bottom:18px;font-size:14px}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:0 0 26px}
  .kpi{padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
  .kpi .v{font-size:20px;font-weight:650;letter-spacing:-.02em} .kpi .v small{font-size:13px;color:var(--muted);font-weight:500;margin-left:4px}
  .kpi .l{color:var(--muted);font-size:12px;margin-top:2px}
  .sect{display:flex;align-items:baseline;gap:10px;margin:24px 0 8px}
  .sect h2{margin:0;font-size:13px;font-weight:600;color:var(--text)} .sect span{color:var(--faint);font-size:12px}
  .item{display:grid;grid-template-columns:44px 1fr auto;gap:0 14px;align-items:center;padding:12px 14px 12px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);margin-bottom:6px;width:100%}
  .item:hover{border-color:var(--line-2);background:var(--panel-2)}
  .item .num{font-size:18px;font-weight:650;letter-spacing:-.02em;text-align:center;padding:4px 0;border-radius:6px;background:var(--panel-2)}
  .item.rouge .num{color:var(--rouge)} .item.ambre .num{color:var(--ambre)} .item.gris .num{color:var(--muted)} .item.mint .num{color:var(--mint)}
  .item .t{font-weight:600;font-size:14px;display:block} .item .d{color:var(--muted);font-size:12.5px;display:block;margin-top:2px}
  .item .go{color:var(--mint);font-size:12.5px;font-weight:600;white-space:nowrap}
  .item:hover .go{text-decoration:underline;text-underline-offset:3px}
  .okline{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:8px;color:var(--muted);margin-top:6px}
  .okline i{width:8px;height:8px;border-radius:50%;background:var(--mint);flex:none} .okline b{color:var(--text);font-weight:600}

  /* ---- circuit ---- */
  .cbar{display:flex;align-items:center;gap:14px;margin-bottom:16px;flex-wrap:wrap}
  .cbar input{background:var(--panel);border:1px solid var(--line);color:var(--text);padding:7px 11px;border-radius:6px;font:inherit;min-width:300px}
  .cbar input::placeholder{color:var(--faint)}
  .sw{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-size:12.5px;cursor:pointer;user-select:none}
  .sw .tr{width:32px;height:18px;border-radius:9px;border:1px solid var(--line-2);position:relative;background:var(--panel-2)}
  .sw .tr i{position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:var(--muted);transition:transform .15s}
  .sw.on .tr{border-color:var(--mint);background:var(--mint-soft)} .sw.on .tr i{transform:translateX(14px);background:var(--mint)} .sw.on{color:var(--text)}
  .legend{color:var(--faint);font-size:12px;margin-left:auto;display:flex;gap:14px}
  .legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}
  .diagram{position:relative;display:grid;grid-template-columns:400px 200px 400px;column-gap:90px;justify-content:center;align-items:start}
  .diagram svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
  .colh{display:flex;align-items:baseline;gap:8px;margin:0 0 10px 2px} .colh b{font-weight:600} .colh span{color:var(--faint);font-size:12px}
  .node{border:1px solid var(--line);border-radius:8px;background:var(--panel);margin-bottom:8px;position:relative}
  .node .hd{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:11px 14px;cursor:pointer;width:100%;align-items:center}
  .node .hd:hover{background:var(--panel-2)}
  .node .hd .t{font-weight:600;font-size:13.5px} .node .hd .c{color:var(--faint);font-size:12px;text-align:right}
  .dots{display:flex;gap:3px;flex-wrap:wrap;margin-top:6px} .dots i{width:7px;height:7px;border-radius:50%;display:block;background:var(--mint);opacity:.85}
  .dots i.ambre{background:var(--ambre)} .dots i.rouge{background:var(--rouge)} .dots i.gris{background:var(--gris);opacity:.5} .dots i.mauve{background:var(--mauve)}
  .node .hd .av{color:var(--ambre);font-size:12px;text-align:right} .node .hd .av.rouge{color:var(--rouge)} .node .hd .av.ok{color:var(--faint)}
  .node .rows{display:none;border-top:1px solid var(--line);padding:4px 6px 6px}
  .node.open .rows{display:block}
  .node.open{border-color:var(--line-2)}
  .row{display:grid;grid-template-columns:10px 1fr auto;gap:0 10px;align-items:center;padding:7px 8px;border-radius:6px;width:100%}
  .row:hover{background:var(--mint);color:var(--ink)} .row:hover *{color:var(--ink) !important}
  .row i{width:8px;height:8px;border-radius:50%;background:var(--mint);display:block} .row i.ambre{background:var(--ambre)} .row i.rouge{background:var(--rouge)} .row i.gris{background:var(--gris)} .row i.mauve{background:var(--mauve)}
  .row .nm{font-size:13px;font-weight:500;line-height:1.25} .row .mt{color:var(--muted);font-size:11.5px;margin-top:2px;grid-column:2}
  .row .st{font-size:11.5px;color:var(--muted);white-space:nowrap;grid-row:span 2;align-self:center} .row .st.ambre{color:var(--ambre)} .row .st.rouge{color:var(--rouge)} .row .st.mauve{color:var(--mauve)}
  .row.hide{display:none}
  .node.dim{opacity:.25} .node.lit{border-color:var(--mint)} .node.sel{box-shadow:0 0 0 1px var(--mint),0 0 18px rgba(74,222,128,.22);border-color:var(--mint)}
  .pump{border:1px solid var(--line-2);border-radius:10px;background:var(--panel);padding:16px 16px 14px;position:sticky;top:110px;cursor:pointer}
  .pump:hover{border-color:var(--mint)}
  .pump .t{font-size:16px;font-weight:650} .pump .d{color:var(--muted);font-size:12.5px;margin-top:2px}
  .pump .run{display:inline-block;margin-top:10px;padding:3px 9px;border:1px solid var(--mint);color:var(--mint);border-radius:5px;font-family:var(--mono);font-size:12px}
  .pump .st{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:12.5px} .pump .st.ambre{color:var(--ambre)} .pump .st.rouge{color:var(--rouge)} .pump .st.mint{color:var(--mint)}
  .pump.lit{border-color:var(--mint);box-shadow:0 0 0 1px var(--mint),0 0 22px rgba(74,222,128,.25)}
  path.pipe{stroke:rgba(255,255,255,.16);stroke-width:2;fill:none}
  path.flow{stroke:var(--mint);stroke-width:2.5;fill:none;stroke-dasharray:6 7;animation:flow .9s linear infinite}
  path.fuite{stroke:var(--rouge);stroke-width:2;fill:none;stroke-dasharray:5 6;opacity:.8}
  @keyframes flow{to{stroke-dashoffset:-13}}
  @media (prefers-reduced-motion:reduce){path.flow{animation:none}}

  /* ---- détail (P2) ---- */
  .detail{display:none} .detail.on{display:block} .diagram.off,.cbar.off{display:none}
  .back{display:inline-flex;align-items:center;gap:8px;color:var(--muted);margin-bottom:14px;font-size:13px} .back:hover{color:var(--mint)}
  .dh{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:18px}
  .dh h1{font-size:24px;font-weight:650;letter-spacing:-.02em;margin:0 0 2px} .dh .m{color:var(--muted)}
  .dh .state{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .pill{display:inline-flex;align-items:center;gap:7px;padding:4px 11px;border-radius:14px;border:1px solid;font-size:12px;font-weight:600}
  .pill i{width:7px;height:7px;border-radius:50%} .pill.mint{color:var(--mint);border-color:var(--mint)} .pill.mint i{background:var(--mint)}
  .pill.ambre{color:var(--ambre);border-color:var(--ambre)} .pill.ambre i{background:var(--ambre)} .pill.rouge{color:var(--rouge);border-color:var(--rouge)} .pill.rouge i{background:var(--rouge)}
  .pill.gris{color:var(--muted);border-color:var(--line-2)} .pill.gris i{background:var(--gris)} .pill.mauve{color:var(--mauve);border-color:var(--mauve)} .pill.mauve i{background:var(--mauve)}
  .dg{display:grid;grid-template-columns:1.1fr 1fr;gap:14px;align-items:start}
  .card{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:14px 16px;margin-bottom:14px}
  .card h3{margin:0 0 10px;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.03em;text-transform:uppercase}
  .kv{display:grid;grid-template-columns:150px 1fr;gap:7px 12px} .kv div:nth-child(odd){color:var(--muted)}
  .actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
  .ctrl{display:grid;grid-template-columns:1fr auto 70px;gap:5px 12px;font-size:12.5px} .ctrl .n{color:var(--muted)} .ctrl .v{text-align:right}
  .ctrl .verdict{text-align:right;font-weight:600} .ctrl .verdict.ok{color:var(--mint)} .ctrl .verdict.ko{color:var(--ambre)} .ctrl .verdict.bloq{color:var(--rouge)}
  .chip{display:inline-block;padding:2px 8px;border-radius:5px;background:var(--panel-2);border:1px solid var(--line);margin:2px 4px 2px 0;font-size:12px;white-space:nowrap;cursor:pointer}
  .chip:hover{border-color:var(--mint);color:var(--mint)} .chip.rouge{color:var(--rouge);border-color:var(--rouge)} .chip.ambre{color:var(--ambre);border-color:var(--ambre)} .chip.mauve{color:var(--mauve);border-color:rgba(192,132,252,.5)}
  ul.list{list-style:none;margin:0;padding:0} ul.list li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line);align-items:center} ul.list li:first-child{border-top:0}
  .tag{font-size:11px;padding:1px 6px;border:1px solid var(--line-2);border-radius:4px;color:var(--muted);white-space:nowrap;margin-left:4px}
  .tag.mint{color:var(--mint);border-color:var(--mint)} .tag.ambre{color:var(--ambre);border-color:var(--ambre)} .tag.rouge{color:var(--rouge);border-color:var(--rouge)} .tag.mauve{color:var(--mauve);border-color:var(--mauve)}
  .ref{margin-top:8px;padding:9px 12px;border-left:2px solid var(--mint);background:var(--panel-2);border-radius:0 6px 6px 0;font-size:12.5px}
  .ref.ecart{border-left-color:var(--rouge)} .ref.choix{border-left-color:var(--gris)} .ref.modele{border-left-color:var(--mauve)} .ref.introuvable{border-left-color:var(--ambre)}
  .ref .t{font-weight:600;margin-bottom:2px} .ref .x{color:var(--muted);font-style:italic;margin-top:2px}
  .rep .v{font-weight:600} .rep .v.mint{color:var(--mint)} .rep .v.ambre{color:var(--ambre)} .rep .v.gris{color:var(--muted)}
  .rep ul{margin:4px 0 0;padding-left:16px;color:var(--muted)} .rep .proof{margin-top:8px;padding:7px 10px;border-left:2px solid var(--mint);background:var(--panel-2)}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0} .two .v{font-size:24px;font-weight:650;letter-spacing:-.02em} .two .ok .v{color:var(--mint)} .two .ko .v{color:var(--rouge)} .two .l{color:var(--muted);font-size:12px}

  /* ---- journal ---- */
  .jf{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
  .jf button{padding:6px 11px;border:1px solid var(--line);border-radius:6px;color:var(--muted);font-size:12.5px} .jf button.on{border-color:var(--mint);color:var(--text);background:var(--mint-soft)}
  .jl{display:grid;grid-template-columns:140px 110px 1fr 110px 160px;gap:0 14px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);font-size:13px}
  .jl.h{color:var(--faint);font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;border-bottom:1px solid var(--line-2)}
  .jl .g{display:inline-flex;align-items:center;gap:7px} .jl .g i{width:7px;height:7px;border-radius:50%;background:var(--mint)} .jl .g i.ambre{background:var(--ambre)} .jl .g i.rouge{background:var(--rouge)} .jl .g i.mauve{background:var(--mauve)} .jl .g i.gris{background:var(--gris)}
  .jl .r{color:var(--muted)} .jl .r.rouge{color:var(--rouge)} .jl .r.ambre{color:var(--ambre)}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--mint);padding:10px 14px;border-radius:6px;display:none;z-index:30;max-width:90vw}
  .toast.on{display:block}
  *:focus-visible{outline:2px solid var(--jaune);outline-offset:2px}
  @media (max-width:1100px){ .diagram{grid-template-columns:1fr;column-gap:0} .diagram svg{display:none} .pump{position:static;margin:12px 0} .dg{grid-template-columns:1fr} .kpis{grid-template-columns:1fr 1fr} .jl{grid-template-columns:1fr 1fr} }
</style>
</head>
<body>
<div class="app-bar"><div class="wordmark">LA <b>BUSE</b></div><div class="crumb">Dashboard admin › <span>Données</span></div><div class="spacer"></div><span class="muted" id="sub"></span></div>
<div class="tabs">
  <button class="on" data-tab="resume">Résumé<span class="n" id="nRes"></span></button>
  <button data-tab="circuit">Circuit</button>
  <button data-tab="journal">Journal<span class="n">aujourd'hui</span></button>
  <div class="actions"><button class="btn mauve" id="btnAgents">Envoyer les agents sur tout</button><button class="btn mint" id="btnVerif">Vérifier que tout coule</button></div>
</div>
<main>
  <section class="tab on" id="tab-resume"><div class="res" id="resume"></div></section>
  <section class="tab" id="tab-circuit">
    <div class="cbar" id="cbar">
      <input id="q" placeholder="Chercher un réservoir, un robinet, un chiffre…">

      <svg id="pipes"><g id="base"></g><g id="lit"></g></svg>

    <div class="detail" id="detail"></div>
  </section>
  <section class="tab" id="tab-journal"><div class="jf" id="jf"></div><div id="journal"></div></section>
</main>
<div class="toast" id="toast"></div>

function tankEtat(t){ // couleur + libellé court
  const f=FILTRES[t.id], v=t.verif||{par:'jamais'};
  if(f&&f.verdict==='quarantaine') return ['rouge','en quarantaine'];
  if(t.id==='dpe_ademe') return ['rouge','horloge qui ment'];
  if(t.etat==='vide') return ['gris','vide'];
  if(t.etat==='nouvelle') return ['ambre','nouvelle version à injecter'];
  if(t.run) return ['mauve','agent en route'];
  if(f&&f.verdict==='warn') return ['ambre','filtre avec des KO'];
  if(v.par==='jamais'||v.par==='sonde_jamais') return ['ambre','jamais vérifié'];
  if(v.statut==='injoignable') return ['ambre','producteur injoignable'];
  if(t.etat==='manuel') return ['gris','dépôt manuel'];
  return ['mint','à jour'];
}
function tapEtat(t){
  if(t.etat==='fuite') return ['rouge','fuite mesurée'];
  if(t.etat==='purge') return ['ambre','eau ancienne'];
  const ecart=(t.chiffres||[]).some(c=>REGLES[c.id]&&REGLES[c.id].c==='ecart'); if(ecart) return ['rouge','écart à la règle'];
  if(t.hm) return ['ambre',`${t.hm} hors moteur`];
  const choix=(t.chiffres||[]).some(c=>REGLES[c.id]&&['choix','introuvable'].includes(REGLES[c.id].c)); if(choix) return ['gris','choix à confirmer'];
  if(!t.nb) return ['gris','aucun chiffre'];
  return ['mint','cohérent'];
}
const koTank=t=>!['mint','gris'].includes(tankEtat(t)[0]), koTap=t=>!['mint','gris'].includes(tapEtat(t)[0])||tapEtat(t)[1]==='choix à confirmer';

let KOonly=true, sel=null, hover=null;
function dots(list,fn){ return `<div class="dots">${list.map(x=>`<i class="${fn(x)[0]}"></i>`).join('')}</div>`; }
function tankRow(t){ const [c,l]=tankEtat(t); return `<button class="row ${KOonly&&!koTank(t)?'hide':''}" data-type="tank" data-id="${t.id}" data-q="${esc((t.nom+' '+(t.producteur||'')).toLowerCase())}"><i class="${c}"></i><span class="nm">${esc(t.nom)}</span><span class="st ${c==='mint'?'':c}">${esc(l)}</span><span class="mt">${esc(t.servi)}${t.verif&&t.verif.quand?' · contrôlé le '+esc(t.verif.quand):''}${t.cadence&&t.cadence!=='aucune'?' · '+esc(t.cadence):''}</span></button>`; }
function tapRow(t){ const [c,l]=tapEtat(t); const chs=(t.chiffres||[]).map(x=>x.libelle).join(' '); return `<button class="row ${KOonly&&!koTap(t)?'hide':''}" data-type="tap" data-id="${t.id}" data-q="${esc((t.nom+' '+chs).toLowerCase())}"><i class="${c}"></i><span class="nm">${esc(t.nom)}</span><span class="st ${c==='mint'?'':c}">${esc(l)}</span><span class="mt">${t.nb?t.nb+' chiffre'+(t.nb>1?'s':''):'tuiles ou géométries'}${t.parent&&TAP[t.parent]?' · dans '+esc(TAP[t.parent].nom):''}</span></button>`; }
function famNode(f,i){ const ko=f.tanks.filter(koTank).length; return `<div class="node" data-fam="${i}" id="fam-${i}"><button class="hd"><span><span class="t">${esc(f.nom)}</span>${dots(f.tanks,tankEtat)}</span><span><span class="c">${f.tanks.length} réservoir${f.tanks.length>1?'s':''}</span><br><span class="av ${ko?'':'ok'}">${ko?ko+' à regarder':'tout va bien'}</span></span></button><div class="rows">${f.tanks.map(tankRow).join('')}</div></div>`; }
function catNode(c,i){ const ko=c.taps.filter(koTap).length; return `<div class="node" data-cat="${i}" id="cat-${i}"><button class="hd"><span><span class="t">${esc(c.nom)}</span>${dots(c.taps,tapEtat)}</span><span><span class="c">${c.taps.length} robinet${c.taps.length>1?'s':''}</span><br><span class="av ${ko?'':'ok'}">${ko?ko+' à regarder':'tout va bien'}</span></span></button><div class="rows">${c.taps.map(tapRow).join('')}</div></div>`; }
function renderCircuit(){
  document.getElementById('tanks').innerHTML=DATA.familles.map(famNode).join('');

document.getElementById('diagram').addEventListener('click',e=>{
  const hd=e.target.closest('.hd'); if(hd){ const n=hd.parentElement; const open=n.classList.contains('open'); n.parentElement.querySelectorAll('.node.open').forEach(x=>x.classList.remove('open')); if(!open) n.classList.add('open'); drawPipes(); return; }

/* ---------- tuyaux (niveau famille / catégorie) ---------- */
function rect(el){const c=document.getElementById('diagram').getBoundingClientRect(), r=el.getBoundingClientRect(); return {l:r.left-c.left,r:r.right-c.left,t:r.top-c.top,b:r.bottom-c.top,y:r.top-c.top+Math.min(r.height,52)/2};}
function geo(){
  const fams=[...document.querySelectorAll('#tanks .node')], cats=[...document.querySelectorAll('#taps .node')];
  const pump=rect(document.getElementById('pump')), tc=rect(document.getElementById('tanks')), rc=rect(document.getElementById('taps'));
  const g={cx:tc.r+36,dx:rc.l-36,py:pump.t+(pump.b-pump.t)/2,pump,fy:{},cy:{}};
  fams.forEach(n=>g.fy[n.dataset.fam]=rect(n.querySelector('.hd'))); cats.forEach(n=>g.cy[n.dataset.cat]=rect(n.querySelector('.hd')));
  return g;
}
function drawPipes(){
  if(window.innerWidth<=1100||document.getElementById('detail').classList.contains('on')) return;
  const g=geo(); let out='';
  const fys=Object.values(g.fy).map(r=>r.y), cys=Object.values(g.cy).map(r=>r.y);
  Object.values(g.fy).forEach(r=>out+=`<path class="pipe" d="M${r.r},${r.y} L${g.cx},${r.y}"/>`);
  Object.values(g.cy).forEach(r=>out+=`<path class="pipe" d="M${g.dx},${r.y} L${r.l},${r.y}"/>`);
  if(fys.length) out+=`<path class="pipe" d="M${g.cx},${Math.min(...fys,g.py)} L${g.cx},${Math.max(...fys,g.py)}"/>`;
  if(cys.length) out+=`<path class="pipe" d="M${g.dx},${Math.min(...cys,g.py)} L${g.dx},${Math.max(...cys,g.py)}"/>`;
  out+=`<path class="pipe" d="M${g.cx},${g.py} L${g.pump.l},${g.py}"/><path class="pipe" d="M${g.pump.r},${g.py} L${g.dx},${g.py}"/>`;
  const seen=new Set();
  FUITES.forEach((f,i)=>{ const fi=DATA.familles.findIndex(x=>x.tanks.some(t=>t.id===f.tank)), ci=DATA.categories.findIndex(x=>x.taps.some(t=>t.id===f.tap)); const k=fi+'-'+ci; if(seen.has(k)||!g.fy[fi]||!g.cy[ci]) return; seen.add(k); const a=g.fy[fi], b=g.cy[ci], bx=g.cx+14+seen.size*5, dx=g.dx-14-seen.size*5, lane=-10-seen.size*7; out+=`<path class="fuite" d="M${a.r},${a.y+8} L${bx},${a.y+8} L${bx},${lane} L${dx},${lane} L${dx},${b.y} L${b.l},${b.y}"/>`; });
  document.getElementById('base').innerHTML=out;
}
function light(type,id){
  document.querySelectorAll('.node').forEach(n=>n.classList.remove('dim','lit'));
  document.getElementById('pump').classList.toggle('lit',!!type); const litg=document.getElementById('lit');
  if(!type){ litg.innerHTML=''; return; }
  const g=geo(); let out='';
  const famOf=r=>DATA.familles.findIndex(x=>x.tanks.some(t=>t.id===r)), catOf=t=>DATA.categories.findIndex(x=>x.taps.some(y=>y.id===t));
  const fams=new Set(), cats=new Set();
  if(type==='tank'){ fams.add(famOf(id)); tapsOfTank(id).forEach(t=>cats.add(catOf(t))); }
  else { cats.add(catOf(id)); tanksOfTap(id).forEach(r=>fams.add(famOf(r))); }
  fams.forEach(i=>{const r=g.fy[i]; if(r) out+=`<path class="flow" d="M${r.r},${r.y} L${g.cx},${r.y} L${g.cx},${g.py} L${g.pump.l},${g.py}"/>`;});
  cats.forEach(i=>{const r=g.cy[i]; if(r) out+=`<path class="flow" d="M${g.pump.r},${g.py} L${g.dx},${g.py} L${g.dx},${r.y} L${r.l},${r.y}"/>`;});
  litg.innerHTML=out;
  document.querySelectorAll('#tanks .node').forEach(n=>n.classList.toggle('dim',!fams.has(+n.dataset.fam))); document.querySelectorAll('#taps .node').forEach(n=>n.classList.toggle('dim',!cats.has(+n.dataset.cat)));
  document.querySelectorAll('#tanks .node').forEach(n=>n.classList.toggle('lit',fams.has(+n.dataset.fam))); document.querySelectorAll('#taps .node').forEach(n=>n.classList.toggle('lit',cats.has(+n.dataset.cat)));
}
window.addEventListener('resize',drawPipes); window.addEventListener('scroll',()=>{ if(document.getElementById('tab-circuit').classList.contains('on')) drawPipes(); },{passive:true});

  if(type==='pump'){
    const c=PUMP.candidat;
    h=`<div class="dh"><div><h1>Le moteur</h1><div class="m">${CPT.moteurs} moteurs, ${CPT.chiffres} chiffres, une définition chacun. Un robinet ne calcule pas, il demande ici.</div></div><div class="state"><span class="pill mint"><i></i>run servi ${PUMP.servi}</span>${c?`<span class="pill ambre"><i></i>candidat ${c.id} prêt</span>`:''}</div></div>
    <div class="dg"><div>
      <div class="card"><h3>Ce qui attend</h3><div class="kv"><div>Eau nouvelle</div><div>${PUMP.attente.length?PUMP.attente.map(a=>`${esc(a.version)}, vue le ${a.quand}`).join('<br>'):'<span class="muted">aucune</span>'}</div><div>Candidat</div><div>${c?`<b>${c.id}</b>, calculé le ${c.quand}`:'<span class="muted">aucun</span>'}</div>${PUMP.precedent?`<div>Précédent</div><div>${PUMP.precedent}, retour possible</div>`:''}<div>Pointeurs</div><div style="color:var(--rouge)">${PUMP.retard?'4 au lieu d\'un, '+esc(PUMP.retard):'un seul, le manifeste'}</div></div>
        <div class="actions"><button class="btn mint" onclick="calculer()" ${(!PUMP.attente.length&&!c)?'disabled':''}>Faire tourner la pompe</button>${c?`<button class="btn ambre" onclick="basculer()">Basculer sur ${c.id}</button>`:''}${PUMP.precedent?`<button class="btn" onclick="retour()">Revenir à ${PUMP.precedent}</button>`:''}</div>
        <div class="muted" style="margin-top:10px">Calculer produit un candidat, jamais servi tout seul. Basculer déplace tous les pointeurs d'un geste. Le contrôle repart seul après.</div></div>
      ${c?`<div class="card" style="border-color:var(--ambre)"><h3 style="color:var(--ambre)">Note de version de ${c.id}</h3><ul style="margin:0 0 8px;padding-left:16px">${c.note.map(n=>`<li>${esc(n)}</li>`).join('')}</ul><div>${CPT.chiffres} chiffres recalculés · 50 parcelles sortent de Priorité, 12 y entrent, chacune expliquée · classement stable à 99,95 %.</div></div>`:''}
    </div><div>
      <div class="card"><h3>Les ${CPT.moteurs} moteurs et leur pointeur</h3><ul class="list">${DATA.moteurs.map(m=>{const r=m.run.toLowerCase(); const cls=r.startsWith('en retard')?'rouge':r.startsWith('pointeur_propre')?'ambre':r.startsWith('constante')?'mint':''; return `<li><span>${esc(m.nom)}</span><span class="tag ${cls}">${esc(m.run.length>26?m.run.slice(0,26)+'…':m.run)}</span></li>`;}).join('')}</ul></div>
      <div class="card"><h3>Horloges qui touchent l'eau</h3><ul class="list">${DATA.jobs.filter(j=>j.eau&&!j.legacy).map(j=>`<li><span>${esc(j.id)}</span><span class="muted">${esc(j.h)}</span></li>`).join('')}</ul></div>
    </div></div>`;
  }
  d.innerHTML=`<button class="back" onclick="closeDetail()">← Retour au circuit</button>${h}`; window.scrollTo({top:0});
}
function closeDetail(){ document.getElementById('detail').classList.remove('on'); document.getElementById('diagram').classList.remove('off'); document.getElementById('cbar').classList.remove('off'); requestAnimationFrame(drawPipes); }

/* ---------- gestes (simulation) ---------- */
const JOURNAL=[
 ['06/09 07:15','contrôle','mint','sonde de cohérence','système','4 fuites, 3 eau ancienne, 0 nouvel écart'],
 ['06/09 07:05','filtre','ambre','DEAL — PPR / aléas','système','2 contrôles KO dont 1 bloquant → quarantaine'],
 ['06/09 07:00','sonde','mint','49 réservoirs','système','1 nouvelle version (Sitadel), 1 injoignable (DEAL WMS)'],
 ['06/09 03:14','filtre','ambre','Sitadel','système','passé, 2 avertissants'],
 ['05/09 19:48','vanne','ambre','Sitadel 2026-08','Vic','injection lancée, fin non tracée'],
 ['05/09 18:30','bascule','mint','q_v11_m137','Vic','manifeste posé, retour possible'],
 ['05/09 18:02','calcul','mint','candidat q_v11_m137','Vic','312 chiffres, note de version lue'],
 ['04/09 04:00','cron','mint','ingest-dpe','système','0 commune traitée, tampon posé quand même'],
];
function addJ(g,c,cible,par,res){ JOURNAL.unshift([new Date().toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'})+' '+new Date().toTimeString().slice(0,5),g,c,cible,par,res]); renderJournal(); }
let JF='tous';
function renderJournal(){
  const cats=['tous','vanne','calcul','bascule','agent','contrôle','filtre','sonde','cron'];
  document.getElementById('jf').innerHTML=cats.map(k=>`<button class="${JF===k?'on':''}" data-jf="${k}">${k}</button>`).join('');
  const rows=JOURNAL.filter(j=>JF==='tous'||j[1]===JF);
  document.getElementById('journal').innerHTML=`<div class="jl h"><span>quand</span><span>geste</span><span>cible</span><span>par</span><span>résultat</span></div>`+rows.map(j=>`<div class="jl"><span class="muted">${j[0]}</span><span class="g"><i class="${j[2]}"></i>${j[1]}</span><span>${esc(j[3])}</span><span class="muted">${j[4]}</span><span class="r ${j[2]==='rouge'?'rouge':j[2]==='ambre'?'ambre':''}">${esc(j[5])}</span></div>`).join('');
}
document.getElementById('jf').addEventListener('click',e=>{const b=e.target.closest('[data-jf]'); if(b){JF=b.dataset.jf; renderJournal();}});
const RAP_SPEC={
  sitadel:{cherche:['data.gouv.fr, jeu Sitadel3','statistiques.developpement-durable.gouv.fr','recherche web « Sitadel3 mise à jour 2026 »'],trouve:'Sitadel3 mis à jour le 28/08/2026, permis jusqu\'à juillet 2026',preuve:'« Dernière mise à jour : 28 août 2026 » sur la page du jeu',verdict:'nouvelle',sonde:'déjà lu par la sonde'},
  deal_ppr:{cherche:['reunion.developpement-durable.gouv.fr, PPR par commune','Lizmap DEAL','recherche web « PPR approuvé Réunion 2026 »'],trouve:'PPR inondation de Saint-Paul révisé, approuvé par arrêté du 28/08/2026',preuve:'« Arrêté préfectoral du 28 août 2026 portant approbation… » sur le site de la DEAL',verdict:'nouvelle',sonde:'page en JavaScript, agent mensuel conseillé'},
  office_eau_chroniques:{cherche:['eaureunion.fr, publications','data.gouv.fr','recherche web'],trouve:'rien de plus récent que la chronique n°149 ; la n°150 est annoncée « à paraître »',preuve:'« Chronique n°150 : à paraître » sur la page publications',verdict:'introuvable',sonde:'aucun endpoint ; garder le rappel annuel'},
};
function rapportAgent(t){ const sp=RAP_SPEC[t.id]; if(sp) return Object.assign({quand:'06/09'},sp); const ag=DATA.agents[t.id]||{}; return {quand:'06/09',cherche:[ag.url||'page du producteur','catalogue data.gouv.fr','recherche web « '+t.nom+' 2026 »'],trouve:`dernière version publiée identique au réservoir (${t.serviFull.slice(0,50)})`,preuve:'date de publication lue sur la page du producteur',verdict:t.etat==='vide'?'vide':'a_jour',sonde:t.sentinelle?'déjà lue par la sonde':(ag.piste||'endpoint stable trouvé, à inscrire dans la sonde')}; }
function rapportHtml(r){ const L={a_jour:['À jour','mint'],nouvelle:['Nouvelle version trouvée','ambre'],introuvable:['Introuvable, dit honnêtement','gris'],vide:['Réservoir vide, chemin trouvé','gris']}[r.verdict]; return `<div class="v ${L[1]}">${L[0]} · le ${r.quand}</div><div class="muted" style="margin-top:6px">Où il a cherché</div><ul>${r.cherche.map(c=>`<li>${esc(c)}</li>`).join('')}</ul><div class="muted" style="margin-top:6px">Ce qu'il a trouvé</div><div>${esc(r.trouve)}</div><div class="proof">Preuve : ${esc(r.preuve)}</div><div class="muted" style="margin-top:6px">Pour la sonde : ${esc(r.sonde)}</div>`; }
function envoyerAgent(id,done){ const t=TANK[id]; if(!t||t.run) return; t.run=true; if(document.getElementById('detail').classList.contains('on')) openDetail('tank',id); setTimeout(()=>{ const r=rapportAgent(t); RAPPORTS[id]=r; t.run=false; t.verif={par:'agent',quand:r.quand,statut:r.verdict==='nouvelle'?'nouvelle_version':'ok',vu:r.trouve}; if(r.verdict==='nouvelle') t.etat='nouvelle'; addJ('agent','mauve',t.nom,'Vic',{a_jour:'à jour, preuve datée',nouvelle:'nouvelle version trouvée, vanne ouverte',introuvable:'introuvable, rien d\'inventé',vide:'vide, chemin trouvé'}[r.verdict]); renderResume(); renderCircuit(); if(document.getElementById('detail').classList.contains('on')) openDetail('tank',id); if(done) done(r); },1200+Math.random()*1500); }
function envoyerTous(ids){ toast(`${ids.length} agents partis. Chacun revient avec une preuve, ou dit qu'il n'a rien trouvé.`); ids.forEach((id,k)=>setTimeout(()=>envoyerAgent(id),k*120)); }
function ouvrirVanne(id){ const t=TANK[id]; if(t.etat!=='nouvelle') return; const anc=t.servi; t.etat='ok'; t.servi='nouvelle version'; t.serviFull='nouvelle version injectée le 06/09'; t.injection='06/09'; t.verif={par:'sonde',quand:'06/09',statut:'ok'}; PUMP.attente.push({id,version:t.nom,quand:'06/09'}); tapsOfTank(id).forEach(x=>{const tp=TAP[x]; if(tp.etat==='ok'){tp.etat='purge'; tp.info=`Ce robinet sert encore l'eau ${anc} de ${t.nom}. Fais tourner la pompe.`;}}); addJ('vanne','ambre',t.nom,'Vic','injectée, eau en attente dans la pompe'); toast(`${t.nom} : eau nouvelle dans le réservoir. Les robinets ne bougent qu'après Calculer puis Basculer.`); renderResume(); renderCircuit(); openDetail('tank',id); }
function calculer(){ const n=parseInt((PUMP.servi.match(/q_v(\d+)/)||[0,11])[1])+1; toast('La pompe tourne : run candidat en cours, rien de servi ne change.'); setTimeout(()=>{ PUMP.candidat={id:`q_v${n}`,quand:'06/09',note:PUMP.attente.map(a=>`${a.version}, vue le ${a.quand}`)}; addJ('calcul','mint',`candidat q_v${n}`,'Vic','note de version produite'); renderResume(); renderCircuit(); openDetail('pump'); },1800); }
function basculer(){ const c=PUMP.candidat; if(!c) return; PUMP.precedent=PUMP.servi; PUMP.servi=c.id; PUMP.candidat=null; PUMP.attente=[]; PUMP.retard=null; Object.values(TAP).filter(x=>x.etat==='purge').forEach(x=>x.etat='ok'); addJ('bascule','mint',PUMP.servi,'Vic','manifeste posé d\'un geste, contrôle lancé'); toast(`Bascule faite : les robinets servent ${PUMP.servi}. Contrôle après bascule en cours…`); renderResume(); renderCircuit(); openDetail('pump'); }
function retour(){ if(!PUMP.precedent) return; const cand=PUMP.servi; PUMP.servi=PUMP.precedent; PUMP.precedent=null; PUMP.candidat={id:cand,quand:'06/09',note:['candidat conservé, non servi']}; addJ('bascule','ambre',PUMP.servi,'Vic','retour arrière, candidat conservé'); renderResume(); renderCircuit(); openDetail('pump'); }
function verifier(){ showTab('circuit'); closeDetail(); document.getElementById('pump').classList.add('lit'); toast('Contrôle en cours : chaque robinet est ouvert sur les témoins et comparé au moteur.'); setTimeout(()=>{ document.getElementById('pump').classList.remove('lit'); addJ('contrôle','mint','sonde de cohérence','Vic',`${FUITES.length} fuites, ${Object.values(TAP).filter(t=>t.etat==='purge').length} eau ancienne`); toast(`Contrôle terminé : ${FUITES.length} fuites mesurées, ${Object.values(TAP).filter(t=>t.etat==='purge').length} robinets en eau ancienne. Le reste coule.`); renderResume(); },2000); }
let toastT=null; function toast(m){const t=document.getElementById('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),5500);}
document.getElementById('btnVerif').addEventListener('click',verifier);
document.getElementById('btnAgents').addEventListener('click',()=>{showTab('circuit'); envoyerTous(Object.keys(TANK).filter(id=>TANK[id].mode!=='interne'));});
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&document.getElementById('detail').classList.contains('on')) closeDetail(); });

renderResume(); renderCircuit(); renderJournal();
</script>
