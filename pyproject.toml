[build-system]
requires = ["setuptools>=78.1.1", "wheel"]   # REVUE · R4 — plancher setuptools sûr (outil de build,
#                                              non embarqué dans le runtime servi ; cf. rapport)
build-backend = "setuptools.build_meta"

[project]
name = "labuse"
version = "0.1.0"
description = "LA BUSE — radar foncier intelligent de La Réunion (moteur de pré-qualification parcellaire)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

# SOURCE DE VÉRITÉ des dépendances (requirements.txt = `-e .`, requirements-ml.txt = `-e .[ml]`).
# TOUT import tiers direct du code DOIT figurer ici (cœur) ou dans un groupe optionnel ci-dessous —
# `tests/test_deps_declared.py` échoue sinon (garde anti « dépendance implicite » : argon2/certifi/anyio
# ont mordu faute d'être déclarées → le serveur importait grâce à une présence transitive fragile).
dependencies = [
  "opencv-python-headless>=4.10",   # détection ortho (module Ortho) — dépendance implicite déclarée (M7 J+2)
  "SQLAlchemy>=2.0",
  "GeoAlchemy2>=0.14",
  "psycopg[binary]>=3.1",
  "pydantic>=2.5",
  "pydantic-settings>=2.14.2",     # REVUE · R4 — patch GHSA-4xgf-cpjx-pc3j (pip-audit)
  "python-dotenv>=1.0",             # config.py — chargé au démarrage
  "PyYAML>=6.0",
  "fastapi>=0.110",
  "starlette>=0.36",                # importé directement par api/app.py (pas seulement via fastapi)
  "uvicorn[standard]>=0.27",
  "anyio>=4.0",                     # api/protection.py — run_sync direct
  "httpx>=0.26",
  "certifi>=2024.2",                # bundle CA des connecteurs (appels sortants) — importé en dur
  "numpy>=1.26",                    # scoring + api/ortho (chaîne d'import du serveur)
  "shapely>=2.0",
  "pyproj>=3.6",
  "pyshp>=2.3",
  "typer>=0.9",
  "jsonschema>=4.21",
  "fpdf2>=2.8",
  "weasyprint>=61",
  "jinja2>=3.1",
  "MarkupSafe>=2.1",                # flash/report.py — échappement direct
  "argon2-cffi>=23.1",              # comptes.py — hachage argon2id (auth/cloison) : JAMAIS optionnel
  "stripe>=8",
  "pypdf>=6.15.0",                 # REVUE · R4 — patch PYSEC-2026-3655/3656 (pip-audit)
  "pymupdf>=1.24",                  # fitz — plan de situation ortho du PDF premium (api/plan_situation, M73-F)
  "pillow>=10",                     # PIL — composition d'image du plan de situation + ingestion PLU
  "requests>=2.31",                 # tuiles IGN (plan de situation) + ingestion PLU (plu_ingest/plu_corpus)
  "urllib3>=2.0",                   # importé en dur (retries HTTP) dans la chaîne d'ingestion PLU
  "qrcode>=7.4",                    # 2FA admin (VPS · AC-025) — QR d'enrôlement TOTP en SVG pur (jamais PIL)
  "duckdb>=1.0",                    # ZONE-DONNÉES — ingestion SIRENE : jointure parquet distant (géo INSEE × Stock), filtre 974
  # RETOURS-15 U5 — promues de l'extra [lidar] (que RIEN n'installait) en dépendances de SÉRIE :
  # la nature du toit est servie par la fiche soleil standard ; l'optionnel a produit exactement
  # le bug vécu (env .venv sans rasterio → ModuleNotFoundError avalé → « — » muet sur 7 fiches).
  "rasterio>=1.3",
  "scipy>=1.11",
]

[project.optional-dependencies]
# Provider IA réel (sinon provider "stub" hors-ligne par défaut).
# HYGIÈNE H1 (27/08) — version FIGÉE : le VPS a porté anthropic==1.1.0 (refuse le paramètre
# `temperature` → Copilote en mode dégradé SILENCIEUX, 1 h de debug). Le code exige la lignée
# 0.116.0. Pin EXACT : `pip install -e .[ai]` (deploy_vps.sh) installe toujours cette version, jamais
# une au hasard. Garde-fou : tests/test_anthropic_pin.py + vérification post-install dans deploy_vps.sh.
ai = ["anthropic==0.116.0"]
# ML / hors-ligne (entraînement P-model, détection ortho, backtests d'arène) — JAMAIS sur le serveur
# de prod (il sert des scores pré-calculés). Sur le Mac/GPU : `pip install -e .[ml]`.
ml = [
  "torch>=2.2",
  "scikit-learn>=1.4",
  "joblib>=1.3",
  "segmentation-models-pytorch>=0.3",
  "pandas>=2.0",
  "openpyxl>=3.1",
  "py7zr>=0.21",   # ingestion cadastre historique (archives .7z DGFiP) — hors-ligne, jamais servi en prod
]
# RETOURS-15 U5 — l'extra `lidar` (R31) est SUPPRIMÉ : rasterio/scipy sont des dépendances de
# série (voir dependencies) — l'optionnel, que rien n'installait, rendait la toiture muette.
# Outils de dev / CI (tests + lint).
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
labuse = "labuse.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
# F = pyflakes (vraies erreurs : imports inutilisés, noms indéfinis) ; I = tri des imports ; E/W = style.
select = ["F", "I", "E", "W"]
ignore = ["E501"]  # longueur de ligne gérée par le formateur, pas bloquante

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = [
  "db: tests nécessitant une base PostGIS accessible (voir conftest)",
  "network: tests nécessitant un accès réseau sortant (souvent bloqué en CI sandbox)",
  "local: tests joués sur la BASE RÉELLE locale (labuse), hors CI — `pytest -m local` (CIRCUIT-P3 3.2)",
  "verrous: les verrous CIRCUIT-5 (tests/verrous/) — aussi joués par `labuse circuit verrous`",
]
