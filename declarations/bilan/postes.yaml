# ============================================================================
# BILAN-1 — Catalogue des postes du bilan promoteur
# ----------------------------------------------------------------------------
# Source : le modèle Excel de la promotrice (feuille « BILAN », zone A1:G147).
#   Le xlsx n'est jamais commité (docs/audit-2026-10/bilan-1/modele-promotrice.xlsx,
#   gitignoré). Seuls les libellés, l'ordre, les assiettes et les formules en sont
#   tirés — ici.
#
# Chaque poste porte `ligne_modele` = sa ligne dans le xlsx. Le test
# test_bilan_catalogue.py recharge le xlsx et vérifie, SANS rien coder en dur :
#   - `libelle_modele` == la cellule A{ligne_modele} du xlsx (société neutralisée) ;
#   - les lignes sont strictement croissantes (ordre = modèle) ;
#   - l'ensemble des 45 postes == les 45 lignes-postes détectées par un balayage
#     indépendant du xlsx (aucun poste retiré ni ajouté).
#
# Doctrine (gravée, BILAN-1) : on ne pré-remplit QUE le Sourcé (public). Tout le
# reste est vide ; un `repere` cliquable (public ou ratio de place) propose une
# valeur mais N'ENTRE JAMAIS dans le calcul tant que le client ne l'adopte pas.
# Un repère dont la source ne se résout pas à l'exécution ne s'affiche pas.
#
# Le nom de la société du modèle (« océanis », lignes 122/128 du xlsx, + chemin
# SharePoint en métadonnée) n'apparaît nulle part : « Cash flow océanis » est
# rendu « Cash flow ».
# ============================================================================

version: 1

# --- Taux de TVA légaux (DOM / La Réunion) — « Sourcé », jamais inventés -------
tva_legales:
  dom_standard: 0.085    # taux normal DOM
  logement_social: 0.021 # taux réduit logement social / LLI éligible
  exonere: 0.0           # taxes, assurances, frais financiers, garanties

# --- Assiettes reconnues par le moteur ---------------------------------------
# (documentaire ; le moteur résout chaque assiette dans bilan/moteur.py)
assiettes:
  terrain:             "Surface du terrain (m²) — cadastre, ou union des géométries d'un assemblage"
  surface_taxable:     "Surface taxable (m²)"
  suv:                 "Surface utile vendable (m²) — somme des produits"
  lots:                "Nombre de lots — somme des produits"
  prix_terrain:        "Prix d'achat du terrain HT (poste « achat »)"
  pret:                "Montant du prêt (saisie)"
  valeur_ajoutee:      "Valeur ajoutée (saisie) — assiette CVAE"
  ca_ttc:              "Chiffre d'affaires TTC total"
  ca_produit_1:        "CA TTC du produit 1"
  ca_produit_2:        "CA TTC du produit 2"
  construction:        "Coût de construction HT (poste « constr »)"
  demi_construction_ttc: "½ du coût de construction TTC"
  total2_ttc:          "Total du bloc Construction & honoraires, TTC"
  total2_ht:           "Total du bloc Construction & honoraires, HT"
  total2_ttc_sol_imprevus: "Total (2) TTC + étude de sol TTC − imprévus TTC (assiette assurance D.O, modèle promotrice)"
  total2_ht_sol_imprevus:  "Total (2) HT + étude de sol HT − imprévus HT (assiette assurance TRC, modèle promotrice)"
  loyers_annuels:      "Loyer €/m² × SUV"
  forfait:             "Montant forfaitaire (pas d'assiette)"

# --- Programme : une ligne par produit (libre · PLS · LLI) -------------------
# Repris de la fiche comme repère grisé, jamais comme valeur (mandat Lot 2.2).
produit_modele:
  lignes_modele: [112, 113]   # CA logements, deux produits dans le xlsx témoin
  champs:
    - {id: lots,    libelle: "Lots",                      unite: "lots"}
    - {id: suv,     libelle: "SUV",                       unite: "m²"}
    - {id: prix_ttc_m2_suv, libelle: "Prix TTC /m² SUV yc pkg", unite: "€"}
    - {id: tva,     libelle: "TVA de vente",              unite: "%", tva: selon_produit}
  repere: dvf_neuf   # DVF neuf au m² · n (échantillon) ; sinon rien

# --- Entrées du programme (assiettes) — pré-remplies si Sourcé ---------------
programme:
  - {id: terrain, libelle: "Terrain",              unite: "m²",   sourcee: cadastre,     repere: null}
  - {id: zonage,  libelle: "Zonage au PLU",        type: texte,   sourcee: plu,          repere: null}
  - {id: shob,    libelle: "SHOB",                 unite: "m²",   facultatif: true,      repere: null}
  - {id: sdp,     libelle: "Surface de plancher",  unite: "m²",   repere: faisabilite}
  - {id: stax,    libelle: "Surface taxable",      unite: "m²",   repere: faisabilite}
  - {id: pkg_aer, libelle: "Parkings aériens",     unite: "pl.",  facultatif: true,      repere: null}
  - {id: pkg_cou, libelle: "Parkings couverts",    unite: "pl.",  repere: faisabilite}
  - {id: loyer,   libelle: "Loyer au m² de SUV yc pkg", unite: "€/m²", facultatif: true,  repere: null}

