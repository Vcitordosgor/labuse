      - {id: apport, libelle: "Commission apport",          libelle_modele: "Commission apport",             ligne_modele: 44, mode: pct, base: ttc, assiette: prix_terrain, tva: 0.085, tva_sourcee: true, repere: {type: ratio_place, valeur: 3.0}, note: "Commission toutes taxes (3 % du prix), ramenée HT"}
