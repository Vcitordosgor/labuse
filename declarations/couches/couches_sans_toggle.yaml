---
surface:   couche_tri_zone
nom:       "TRI — zones inondables"
categorie: couche
parent:    null
route:     "/map/layers.geojson?kind=tri_zone"
rendu:     carte
donnees:
  - quoi:  tri_zone_couche
    ou:    { rang: 10, etat: en_tete, section: "Inondation" }
    comment: { libelle: "TRI (inondation)", format: liste, i: "Territoires à risque important d'inondation (Géorisques)." }
    # COUCHES-AFFICHAGE-1 lot 1 — GRADES PAR LA COULEUR : les 3 scénarios TRI (nichés) affichés en même
    # temps, un SOUS-CALQUE par grade, EMBOÎTÉS (extrême = le plus étendu, dessous, teinte claire ;
    # fréquent = le plus petit, dessus, teinte foncée). Plus de sélecteur.
    # COUCHES-RECETTE-1 A3 : 3 scénarios en teintes DISTINCTES (plus le camaïeu de bleus). Emboîtement
    # gardé : extrême (le plus rare/étendu) dessous, fréquent (le plus probable) dessus. Fréquent =
    # rouge (le scénario qui revient le plus = celui qui compte), moyen = orange, extrême = jaune.
    carte: { kind: tri_zone, agregat: false, famille: risques, geometrie: polygone, zoom_min: 0, rang_carte: 30, style: { opacite: 0.5, trait: "#6b1414" }, niveaux: [ { id: extreme, propriete: subtype, valeur: extreme, couleur: "#F2E06B", legende: "Extrême (rare — le plus étendu)" }, { id: moyen, propriete: subtype, valeur: moyen, couleur: "#F0913D", legende: "Moyen" }, { id: frequent, propriete: subtype, valeur: frequent, couleur: "#C82333", legende: "Fréquent (le plus probable)" } ], legende: "TRI inondable — extrême (jaune) / moyen (orange) / fréquent (rouge), emboîté" }
    absence: "TRI : parcelle hors territoire à risque important d'inondation."
    absence_type: absente_ici
    statut_juridique: informatif
    pourquoi: "Aléa inondation par scénario ; légende par fréquence."
