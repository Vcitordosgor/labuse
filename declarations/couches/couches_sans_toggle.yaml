  - quoi:  tri_zone_couche
    ou:    { rang: 10, etat: en_tete, section: "Inondation" }
    comment: { libelle: "TRI (inondation)", format: liste, i: "Territoires à risque important d'inondation (Géorisques)." }
    # COUCHES-AFFICHAGE-1 lot 1 — GRADES PAR LA COULEUR : les 3 scénarios TRI (nichés) affichés en même
    # temps, un SOUS-CALQUE par grade, EMBOÎTÉS (extrême = le plus étendu, dessous, teinte claire ;
    # fréquent = le plus petit, dessus, teinte foncée). Plus de sélecteur.
    # COUCHES-RECETTE-1 A3 : 3 scénarios en teintes DISTINCTES (plus le camaïeu de bleus). Emboîtement
    # gardé : extrême (le plus rare/étendu) dessous, fréquent (le plus probable) dessus. Fréquent =
    # rouge (le scénario qui revient le plus = celui qui compte), moyen = orange, extrême = jaune.
