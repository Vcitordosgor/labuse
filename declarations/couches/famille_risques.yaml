---
surface:   couche_endiguement
nom:       "Systèmes d'endiguement"
categorie: couche
parent:    null
route:     "/map/layers.geojson?kind=endiguement"
rendu:     carte
donnees:
  - quoi:  endiguement_couche
    ou:    { rang: 10, etat: en_tete, section: "Ouvrages de protection" }
    comment: { libelle: "Systèmes d'endiguement", format: liste, i: "Digues et zones protégées (DEAL). ⚠ Ni classe ni niveau de protection fournis — une digue ne garantit aucun niveau de sécurité." }
    # COUCHES-RECETTE-1 (Lot B « rien de visible ») : la donnée est à géométrie MIXTE — 42 polygones
    # (zones protégées) MAIS 69 lignes (digues) + 6 collections. Déclarée `polygone`, le front ne
    # dessinait QUE les polygones (à 0,18, à peine perceptibles) → les digues (le gros) n'apparaissaient
    # jamais. Corrigé : geometrie `mixte` (fond + contour + ligne), opacité 0,32, trait épais (digue = trait).
    carte: { kind: endiguement, agregat: false, famille: risques, geometrie: mixte, zoom_min: 0, rang_carte: 52, style: { couleur: "#F0509E", opacite: 0.40, trait: "#F0509E", epaisseur: 3.4 }, popup: [ { champ: classe, libelle: "Classe d'ouvrage" }, { champ: n_protect, libelle: "Niveau de protection (années)" }, { champ: population, libelle: "Population protégée" }, { champ: gestion, libelle: "Gestionnaire" }, { champ: statut, libelle: "Statut" }, { champ: source, libelle: "Source" } ], legende: "Digue (trait) / zone protégée (aplat) — niveau inconnu" }
    absence: "Endiguement : aucune digue ni zone protégée dans l'emprise visible."
    absence_type: absente_ici
    statut_juridique: informatif
    pourquoi: "Lot B : géométrie mixte (69 digues-lignes + 42 zones) désormais rendue ; digues invisibles avant (geometrie=polygone)."
