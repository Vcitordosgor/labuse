# ── PRODUCTION (lot 3, les 37) : FAMILLE RISQUES — couches legacy migrées, RENDU REPRODUIT À
# L'IDENTIQUE (couleurs exactes de mapTheme.ts). Les kinds virtuels (georisque_alea→inondation/mvt,
# sol_pollue→sis/casias) portent un `filtre` subtype ; les data-driven (PEB, bruit, aléas) portent
