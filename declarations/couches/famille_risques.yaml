surface:   couche_ppr
nom:       "PPR multirisque"
categorie: couche
parent:    null
route:     "/map/layers.geojson?kind=ppr"
rendu:     carte
donnees:
  - quoi:  ppr_couche
    ou:    { rang: 10, etat: en_tete, section: "PPR" }
    comment: { libelle: "PPR multirisque", format: liste, i: "Plan de Prévention des Risques (document multirisque, opposable)." }
    # COUCHES-RECETTE-1 A3 : Information / Prescription / Interdiction en 3 teintes distinctes ordonnées
    # (jaune → orange → rouge) — plus le camaïeu de rouges qui ne se lisait pas. Emboîtement conservé.
    carte: { kind: ppr, agregat: false, famille: risques, geometrie: polygone, zoom_min: 0, rang_carte: 65, style: { opacite: 0.45, trait: "#7a1414" }, niveaux: [ { id: i, propriete: subtype, valeur: i, couleur: "#F2D06B", legende: "Information" }, { id: prescription, propriete: subtype, valeur: PRESCRIPTION, couleur: "#E8843D", legende: "Prescription" }, { id: interdiction, propriete: subtype, valeur: INTERDICTION, couleur: "#C0142A", legende: "Interdiction" } ], popup: [ { champ: risque, libelle: "Risque" }, { champ: document, libelle: "Document" }, { champ: approbation, libelle: "Approuvé le" }, { champ: statut, libelle: "Statut" } ], legende: "PPR multirisque — information (jaune) → prescription (orange) → interdiction (rouge)" }
    absence: "PPR : parcelle hors périmètre PPR sur l'emprise visible."
    absence_type: absente_ici
    statut_juridique: opposable
    pourquoi: "Le risque opposable de référence ; rendu identique au legacy (#E8695A)."
