# ── PRODUCTION (lot 3, les 37) : FAMILLE ÉQUIPEMENTS — aménités OSM + équipements INSEE BPE.
# 2 semis de POINTS colorés par catégorie (data-driven subtype), visibles au zoom quartier (12).
# La SOURCE se lit au CONTOUR : OSM = anneau BLANC, BPE = anneau SOMBRE (même taille/forme).
# NB masquage serveur (display-only, invariant test_display_seul) : amenite subtype tcsp/sport
# est filtré côté endpoint (doublon de la couche Transport / bruit) — jamais rendu, jamais supprimé.
#
# CAS STRUCTURELS tranchés (Vic) : le BÂTI 3D est déclaré ICI (le format gagne l'EXTRUSION + le
# chargement BBOX — il deviendra une couche majeure avec les hauteurs LiDAR mesurées). RESTENT hors
# panneau : `densifier` (overlay dérivé getRenouvGeojson = résultat d'outil, traité au lot des 18 outils) ;
# `vefa_neuf` est traité en famille MARCHÉ (aplat grisé « moins de 10 ventes », pas de trame).

surface:   couche_amenite
nom:       "Équipements et services (OSM)"
categorie: couche
parent:    null
route:     "/map/layers.geojson?kind=amenite"
rendu:     carte
donnees:
  - quoi:  equip_osm_couche
    ou:    { rang: 10, etat: replie, section: "Équipements" }
    comment: { libelle: "Équipements et services (OSM)", format: liste, i: "Aménités OpenStreetMap : mairie, école, santé, commerce, police, marché, crèche, collège/lycée. Icône par type, clic → nom." }
    # COUCHES-RECETTE-1 (Lot B) : ICÔNE PAR TYPE (comme l'ancienne couche, EQUIP_META.emoji) — le front
    # génère une image (canvas emoji, robuste ≠ text-field) par sous-type et pose un calque symbole
    # au-dessus du rond coloré. Clic → nom de l'équipement.
    # COUCHES-RECETTE-2 (retour) : PLUS d'icône/emoji — uniquement des RONDS colorés par catégorie,
    # avec la légende en libellés clairs (niveaux). tcsp/sport exclus à la source (_RESOLUTION_OVERRIDE).
    carte: { kind: amenite, agregat: false, limite: 20000, famille: equipements, geometrie: point, zoom_min: 12, rang_carte: 90, style: { couleur_propriete: subtype, couleurs: { mairie: "#B497F0", ecole: "#5CE6A1", sante: "#E8695A", commerce: "#F0A868", police: "#8FB4F0", marche: "#E59BC4", creche: "#F2B08A", college_lycee: "#79C9A0" }, couleur: "#9AA0A6", zoom_rayon: [12, 4.2, 16, 6.5, 20, 9.5], opacite: 0.92, halo: 1.4, trait: "#FFFFFF" }, niveaux: [ { id: mairie, propriete: subtype, valeur: mairie, couleur: "#B497F0", legende: "Mairie" }, { id: ecole, propriete: subtype, valeur: ecole, couleur: "#5CE6A1", legende: "École" }, { id: sante, propriete: subtype, valeur: sante, couleur: "#E8695A", legende: "Santé" }, { id: commerce, propriete: subtype, valeur: commerce, couleur: "#F0A868", legende: "Commerce" }, { id: police, propriete: subtype, valeur: police, couleur: "#8FB4F0", legende: "Police / gendarmerie" }, { id: marche, propriete: subtype, valeur: marche, couleur: "#E59BC4", legende: "Marché" }, { id: creche, propriete: subtype, valeur: creche, couleur: "#F2B08A", legende: "Crèche" }, { id: college_lycee, propriete: subtype, valeur: college_lycee, couleur: "#79C9A0", legende: "Collège / lycée" } ], popup: [ { champ: name, libelle: "Équipement" }, { champ: subtype, libelle: "Catégorie" } ], legende: "Équipement OSM — rond coloré par catégorie" }
    absence: "Équipements OSM : aucun équipement dans l'emprise visible (zoom ≥ 12)."
    absence_type: absente_ici
    pourquoi: "Rendu identique (EQUIP_META, anneau blanc OSM, rayon rampé 12→20)."
---
surface:   couche_amenite_bpe
nom:       "Équipements INSEE (BPE)"
categorie: couche
parent:    null
route:     "/map/layers.geojson?kind=amenite_bpe"
rendu:     carte
donnees:
  - quoi:  bpe_couche
    ou:    { rang: 10, etat: replie, section: "Équipements" }
    comment: { libelle: "Équipements INSEE (BPE)", format: liste, i: "Base Permanente des Équipements (INSEE) par domaine A–G : services aux particuliers, commerces, enseignement, santé, transports, sport/loisirs, tourisme. Anneau sombre = source INSEE." }
    # COUCHES-RECETTE-2 Lot D : légende A→G en CLAIR (les lettres seules étaient illisibles) + points
    # plus gros (rayon relevé). Couleur par catégorie conservée. Les niveaux portent les libellés INSEE.
    carte: { kind: amenite_bpe, agregat: false, limite: 40000, famille: equipements, geometrie: point, zoom_min: 12, rang_carte: 88, style: { couleur_propriete: subtype, couleurs: { A: "#7C8AA0", B: "#E0A23C", C: "#4C8DD6", D: "#D9534F", E: "#3CB6A8", F: "#6FBF52", G: "#B06FD6" }, couleur: "#7C8AA0", zoom_rayon: [12, 4.6, 16, 7.5, 20, 11], opacite: 0.92, halo: 1.6, trait: "#0d1420" }, niveaux: [ { id: A, propriete: subtype, valeur: A, couleur: "#7C8AA0", legende: "A — services aux particuliers" }, { id: B, propriete: subtype, valeur: B, couleur: "#E0A23C", legende: "B — commerces" }, { id: C, propriete: subtype, valeur: C, couleur: "#4C8DD6", legende: "C — enseignement" }, { id: D, propriete: subtype, valeur: D, couleur: "#D9534F", legende: "D — santé" }, { id: E, propriete: subtype, valeur: E, couleur: "#3CB6A8", legende: "E — transports" }, { id: F, propriete: subtype, valeur: F, couleur: "#6FBF52", legende: "F — sports, loisirs, culture" }, { id: G, propriete: subtype, valeur: G, couleur: "#B06FD6", legende: "G — tourisme" } ], popup: [ { champ: name, libelle: "Équipement" }, { champ: subtype, libelle: "Domaine INSEE" } ], legende: "Équipement INSEE BPE — par domaine (anneau sombre)" }
    absence: "Équipements INSEE : aucun équipement BPE dans l'emprise visible (zoom ≥ 12)."
    absence_type: absente_ici
    pourquoi: "Rendu identique (BPE_DOM A–G, anneau sombre INSEE)."
---
surface:   couche_batiments_3d
nom:       "Bâti 3D (extrusion)"
categorie: couche
parent:    null
route:     "/map/batiments.geojson"
rendu:     carte
donnees:
  - quoi:  batiments_3d_couche
    ou:    { rang: 10, etat: replie, section: "Bâti" }
    comment: { libelle: "Bâti 3D (extrusion)", format: liste, i: "Volumes bâtis extrudés (empreinte BD TOPO + hauteur) — faîtage LiDAR MESURÉ préféré quand la parcelle est ingérée, sinon hauteur BD TOPO estimée. Sans hauteur : jamais d'extrusion inventée. Visible de près (zoom ≥ 15), chargé sur la vue." }
    # geometrie: extrusion + bbox: true — le format porte désormais l'EXTRUSION 3D et le chargement
    # borné à la vue (jamais l'île). hauteur_propriete = la propriété qui porte la hauteur (m).
    carte: { kind: batiment, agregat: false, bbox: true, hauteur_propriete: h, famille: fond_de_plan, geometrie: extrusion, zoom_min: 15, rang_carte: 95, style: { couleur: "#9FB3A8", opacite: 0.88 }, legende: "Bâti 3D — hauteur LiDAR mesurée / BD TOPO estimée" }
    absence: "Bâti 3D : aucun bâtiment avec hauteur dans la vue (zoom ≥ 15)."
    absence_type: absente_ici
    pourquoi: "Rendu identique (fill-extrusion #9FB3A8) ; format étendu (extrusion + bbox) pour le LiDAR à venir."
