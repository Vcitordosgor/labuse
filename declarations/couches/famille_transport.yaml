surface:   couche_tcsp
nom:       "TCSP / stationnement allégé"
categorie: couche
parent:    null
route:     "/map/tiles/tcsp/{z}/{x}/{y}.pbf"
rendu:     carte
donnees:
  - quoi:  tcsp_couche
    ou:    { rang: 10, etat: en_tete, section: "Transport public" }
    comment: { libelle: "TCSP / stationnement allégé", format: liste, i: "Transport en commun en site propre : voies en site propre (OSM) + stations + zone des 800 m (L151-36, parcelles couvertes teintées où le stationnement peut être allégé). UNE couche, 3 kinds unis." }
    # kind VIRTUEL tcsp (zone + tronçons + stations unis serveur). Niveaux à géométrie MIXTE : zone
    # (aplat + rayon ligne) sous les tronçons (site propre, ligne rampée) sous les stations (anneau).
    # COUCHES-RECETTE-1 A3 : les 4 éléments en teintes FRANCHEMENT distinctes (tout était turquoise).
    # Zone 800 m = turquoise aplat ; rayon (contour) = bleu tireté ; tronçon en site propre (le TCSP
    # lui-même) = vert vif ; station = ambre (anneau). geometrie: mixte → le front dessine les 4 (avant :
    # geometrie=polygone ne rendait QUE la zone, tronçon/rayon/station invisibles).
    carte: { kind: tcsp, agregat: false, famille: transport, geometrie: mixte, zoom_min: 0, rang_carte: 68, style: { couleur: "#33C6B0" }, niveaux: [ { id: "parcelles", propriete: subtype, valeur: parcelles, geometrie: polygone, couleur: "#33C6B0", opacite: 0.22, legende: "Zone 800 m — parcelles couvertes" }, { id: "rayon", propriete: subtype, valeur: rayon, geometrie: ligne, couleur: "#4FA8E0", epaisseur: 1.6, tirets: [3, 2], opacite: 0.9, legende: "Rayon 800 m (contour)" }, { id: "site_propre", propriete: subtype, valeur: site_propre, geometrie: ligne, couleur: "#33C95E", zoom_largeur: [9, 2.5, 13, 4, 16, 6], opacite: 0.95, legende: "Tronçon en site propre" }, { id: "en_service", propriete: subtype, valeur: en_service, geometrie: point, anneau: true, couleur: "#F2A83A", zoom_rayon: [10, 5, 14, 8.5, 17, 12], epaisseur: 2.2, opacite: 0.95, legende: "Station" } ], legende: "TCSP — zone (turquoise) / rayon (bleu) / tronçon (vert) / station (ambre)" }
    absence: "TCSP : aucun transport en site propre dans l'emprise visible."
    absence_type: absente_ici
    pourquoi: "A3 : 4 éléments en teintes distinctes ; geometrie mixte pour rendre tronçon/rayon/station (avant : zone seule)."
