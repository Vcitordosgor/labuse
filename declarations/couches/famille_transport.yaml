surface:   couche_telepherique
nom:       "Téléphérique"
categorie: couche
parent:    null
route:     "/map/tiles/telepherique/{z}/{x}/{y}.pbf"
rendu:     carte
donnees:
  - quoi:  transport_couche
    ou:    { rang: 10, etat: replie, section: "Transport public" }
    # COUCHES-RECETTE-1 (Lot B) : renommée « Téléphérique ». La LIGNE (2 objets subtype=ligne en base)
    # est désormais dessinée (le front ignorait le niveau `ligne` d'une couche geometrie=point — corrigé
    # lot front, géométrie mixte). 2e téléphérique en projet « Payanké » (CINOR, Bellepierre ↔ La Montagne,
    # mise en service annoncée ~2029) : NOM CONFIRMÉ mais AUCUN tracé GIS officiel publié → non dessiné
    # (rien inventé, cf. rapport). geometrie: mixte pour que ligne + stations coexistent.
    comment: { libelle: "Téléphérique", format: liste, i: "Téléphérique urbain de Saint-Denis. En service : le Papang (CINOR, réseau Citalis) — ligne (tireté) + stations. En projet : le Payanké (Bellepierre ↔ La Montagne, ~2029) — tracé officiel non publié, non représenté." }
    # COUCHES-RECETTE-2 Lot D : 2e téléphérique en PROJET « Payanké » (CINOR) ajouté — segment INDICATIF
    # entre les deux stations annoncées (tracé du câble non publié en GIS), pointillé, source citée.
    carte: { kind: telepherique, agregat: false, famille: transport, geometrie: mixte, zoom_min: 0, rang_carte: 78, style: { couleur: "#E87BB0" }, niveaux: [ { id: "ligne", propriete: subtype, valeur: "ligne", geometrie: ligne, couleur: "#E87BB0", epaisseur: 2.6, tirets: [1.6, 1.2], opacite: 0.95, legende: "Ligne en service (Papang)" }, { id: "ligne_projet", propriete: subtype, valeur: "ligne_projet", geometrie: ligne, couleur: "#F4B740", epaisseur: 2.4, tirets: [1.2, 1.6], opacite: 0.9, legende: "Ligne en projet (Payanké — tracé indicatif)" }, { id: "station", propriete: subtype, valeur: "station", geometrie: point, couleur: "#E87BB0", rayon: 5, epaisseur: 1.4, trait: "#060A08", legende: "Station" } ], popup: [ { champ: name, libelle: "Ligne" }, { champ: statut, libelle: "Statut" }, { champ: source, libelle: "Source" } ], legende: "Téléphérique — service (Papang) / projet (Payanké) / stations" }
    absence: "Téléphérique : hors emprise du réseau câblé."
    absence_type: absente_ici
    pourquoi: "Lot B : renommée « Téléphérique », ligne Papang rendue (géométrie mixte), Payanké projet documenté (tracé non publié)."
