# ── PRODUCTION (lot 3, les 37) : FAMILLE DISPOSITIFS ET PÉRIMÈTRES — QPV, TVA primo, ANRU, ZFANG, FRR.
# 5 aplats commune (dispositifs_couche, robinet kind=qpv,tva_primo,anru,zfang,frr).
#
# DÉCISION TRAME (Vic : « un rendu qui exige une trame est réexaminé, pas encodé »). Le legacy
# distinguait l'état « moindre » (zfang standard, frr partie) par une HACHURE posée sur un aplat à
# 0,10 d'opacité. La mesure ΔE montre POURQUOI la trame existait : à 0,10 les aplats sont sous le seuil
# de perception, et surtout le SABLE zfang-standard #C6B08A est à ΔE 0,6 du fond Ortho-sol (invisible).
# Réexamen (pas d'encodage de trame) :
#   · on DROPPE les trames ; l'état est porté par la COULEUR du sous-type (déjà le cas) ;
#   · l'opacité est fixée par la MESURE, pas par une hachure : 0,22-0,30 → ΔE ≥ 3 sur les 4 fonds ;
#   · le sable zfang-standard #C6B08A (invisible sur sable) → OCRE #B8862E (ΔE 9 sur le pire fond,
#     séparation 30 du bleu renforcé). Seul écart de teinte, tranché par la mesure.

surface:   couche_zfang
nom:       "ZFANG (zone franche activités)"
categorie: couche
parent:    null
route:     "/map/tiles/zfang/{z}/{x}/{y}.pbf"
rendu:     carte
donnees:
  - quoi:  dispositifs_couche
    ou:    { rang: 10, etat: replie, section: "Dispositifs fiscaux" }
    comment: { libelle: "ZFANG (renforcée / standard)", format: liste, i: "Zone Franche d'Activité Nouvelle Génération — exonérations fiscales pour les entreprises. Deux régimes : renforcée (avantage majoré) et standard." }
    carte: { kind: zfang, agregat: false, famille: dispositifs, geometrie: polygone, zoom_min: 0, rang_carte: 2, style: { couleur_propriete: subtype, couleurs: { renforce: "#3E74F0", standard: "#B8862E" }, couleur: "#3E74F0", opacite: 0.22, trait: "#3E74F0" }, legende: "ZFANG — renforcée (bleu) / standard (ocre)" }
    absence: "ZFANG : commune hors zone franche d'activité dans l'emprise visible."
    absence_type: absente_ici
    pourquoi: "Trame réexaminée → couleur par régime (sable invisible remplacé par ocre #B8862E, ΔE 9)."
