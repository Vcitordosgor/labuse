# ── PRODUCTION (lot 3, les 37) : FAMILLE URBANISME — zonage PLU, ER, EBC, SUP, DPU, artificialisation,
# 50 pas. Rendu reproduit à l'identique (mapTheme T_SOMBRE). ER/EBC = kinds VIRTUELS (plu_gpu_prescription
# filtré 05/01). ⚠ ZONAGE : teintes CONVENTIONNELLES, JAMAIS changées sans accord Vic (couche la plus
# regardée). La couche zonage actuelle est BINAIRE (U vs autre), pas une palette par type — dit au rapport.

surface:   couche_zonage
nom:       "Zonage PLU"
categorie: couche
parent:    null
route:     "/map/layers.geojson?kind=plu_gpu_zone"
rendu:     carte
donnees:
  - quoi:  zonage_plu_couche
    ou:    { rang: 10, etat: en_tete, section: "Zonage réglementaire" }
    comment: { libelle: "Zonage PLU", format: liste, i: "Zonage du PLU (GPU) — familles U (urbaine), AU (à urbaniser), A (agricole), N (naturelle). Rendu actuel : U distinguée (mint), tout le reste en brun (2 teintes, pas une par type)." }
    # RENDU À L'IDENTIQUE (zonageFillExpr) : subtype commençant par U → mint, sinon brun. Opacité 0,10
    # (aplat de base très léger, parcellaire lisible dessous). Teintes conventionnelles — inchangées.
    carte: { kind: plu_gpu_zone, agregat: false, famille: urbanisme, geometrie: polygone, zoom_min: 0, rang_carte: 1, style: { couleur_propriete: subtype, couleurs: { U: "#5CE6A1" }, couleur: "#8a6b3f", opacite: 0.10, trait: "#8a6b3f" }, legende: "Zonage PLU — U (mint) / A·N·AU (brun)" }
    absence: "Zonage PLU : parcelle hors zone GPU dans l'emprise visible (Saint-Philippe : PLU non publié au GPU)."
    absence_type: absente_ici
    statut_juridique: opposable
    pourquoi: "Rendu identique (U vs autre, 0,10) ; teintes conventionnelles verrouillées (accord Vic requis)."
