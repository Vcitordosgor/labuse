surface:   couche_zonage
nom:       "Limites officielles du PLU (GPU)"
categorie: couche
parent:    null
route:     "/map/layers.geojson?kind=plu_gpu_zone"
rendu:     carte
donnees:
  - quoi:  zonage_plu_couche
    ou:    { rang: 10, etat: en_tete, section: "Zonage réglementaire" }
    # COUCHES-RECETTE-1 (Lot B) : renommée « Limites officielles du PLU (GPU) » pour la distinguer de
    # la couche « Zonage PLU par parcelle (calibré) » qui, elle, étiquette chaque parcelle (Ncu, U1b…).
    # Ici = les zones du GPU telles que publiées, 2 teintes, légende à 2 entrées (comme l'ancienne).
    comment: { libelle: "Limites officielles du PLU (GPU)", format: liste, i: "Zones du PLU telles que publiées au Géoportail de l'Urbanisme (GPU). Deux teintes : U (urbaine, en vert) / le reste A·AU·N (brun). Pour l'étiquette de zone parcelle par parcelle, voir « Zonage PLU par parcelle (calibré) »." }
    carte: { kind: plu_gpu_zone, agregat: false, famille: urbanisme, geometrie: polygone, zoom_min: 0, rang_carte: 1, style: { couleur_propriete: subtype, couleurs: { U: "#5CE6A1" }, couleur: "#8a6b3f", opacite: 0.10, trait: "#8a6b3f" }, legende: "Limites PLU (GPU) — U (vert) / A·AU·N (brun)" }
    absence: "Zonage PLU : parcelle hors zone GPU dans l'emprise visible (Saint-Philippe : PLU non publié au GPU)."
    absence_type: absente_ici
    statut_juridique: opposable
    pourquoi: "Rendu identique (U vs autre, 0,10) ; teintes conventionnelles verrouillées (accord Vic requis)."
