surface:   couche_sup
nom:       "Servitudes d'utilité publique (SUP)"
categorie: couche
parent:    null
route:     "/map/layers.geojson?kind=sup"
rendu:     carte
donnees:
  - quoi:  sup_couche
    ou:    { rang: 10, etat: replie, section: "Servitudes" }
    comment: { libelle: "Servitudes d'utilité publique (SUP)", format: liste, i: "Servitudes d'utilité publique, opposables au PLU. Colorées PAR FAMILLE : AC monuments/sites/réserves/SPR, PM plans de prévention des risques, EL littoral/domaine public. Le code et le libellé exact au clic." }
    # COUCHES-RECETTE-1 (Lot B) : une seule teinte magenta rendait la couche illisible → légende PAR
    # FAMILLE de servitude, couleurs distinctes (le code `subtype` porte la famille : ac1-4, pm1-3, el10).
    # AC (patrimoine) = or→indigo ; PM (risques, PPR) = rouge→ambre ; EL (littoral/DP) = bleu. Le clic
    # donne le code + le libellé exact (subtype + typeass + nomass). ⚠ Assiettes PM1 dupliquées ~4× en
    # base (311 lignes) : signalé au rapport, dédoublonnage = tâche donnée (non fait ici, additif).
    carte: { kind: sup, agregat: false, famille: urbanisme, geometrie: polygone, zoom_min: 0, rang_carte: 26, style: { couleur_propriete: subtype, couleur: "#C05884", opacite: 0.24, trait: "#5a2540" }, niveaux: [ { id: pm1, propriete: subtype, valeur: pm1, couleur: "#D0342A", legende: "PM1 — PPR naturels (inondation, mouvement de terrain…)" }, { id: pm2, propriete: subtype, valeur: pm2, couleur: "#E8721F", legende: "PM2 — PPR miniers" }, { id: pm3, propriete: subtype, valeur: pm3, couleur: "#F2A83A", legende: "PM3 — PPR technologiques" }, { id: ac1, propriete: subtype, valeur: ac1, couleur: "#C9A227", legende: "AC1 — abords de monuments historiques" }, { id: ac2, propriete: subtype, valeur: ac2, couleur: "#8FA64B", legende: "AC2 — sites inscrits / classés" }, { id: ac3, propriete: subtype, valeur: ac3, couleur: "#3FA6A0", legende: "AC3 — réserves naturelles" }, { id: ac4, propriete: subtype, valeur: ac4, couleur: "#6A4CC2", legende: "AC4 — sites patrimoniaux remarquables (SPR)" }, { id: el10, propriete: subtype, valeur: el10, couleur: "#4FA8E0", legende: "EL10 — servitude littorale / domaine public" } ], popup: [ { champ: subtype, libelle: "Code servitude" }, { champ: nomsuplitt, libelle: "Type" }, { champ: typeass, libelle: "Catégorie d'assiette" }, { champ: nomass, libelle: "Assiette" }, { champ: urlreg, libelle: "Acte / règlement", lien: true } ], legende: "SUP — par famille (AC patrimoine / PM risques / EL littoral)" }
    absence: "SUP : parcelle hors servitude d'utilité publique dans l'emprise visible."
    absence_type: absente_ici
    statut_juridique: opposable
    pourquoi: "Lot B : légende par famille de servitude (couleurs distinctes) + code au clic ; PM1 dupliqués signalés."
