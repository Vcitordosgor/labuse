---
surface:   couche_znieff
nom:       "ZNIEFF (type I & II)"
categorie: couche
parent:    null
route:     "/map/layers.geojson?kind=znieff"
rendu:     carte
donnees:
  - quoi:  znieff_couche
    ou:    { rang: 10, etat: en_tete, section: "Nature et eau" }
    comment: { libelle: "ZNIEFF (I / II)", format: liste, i: "Inventaire du patrimoine naturel (INPN/MNHN PatriNat, maj 2025). Type I : secteur de fort intérêt biologique, plus restreint et sensible ; type II : grand ensemble naturel peu modifié. PAS une interdiction — un signal fort (étude d'impact renforcée, recours plus probable). ZNIEFF marines non affichées." }
    # niveaux : type I dense (0,20), type II léger. Le legacy mettait type II à 0,06 → ΔE 1,7 sur
    # l'Ortho = INVISIBLE (mesuré). Relevé à 0,13 (ΔE ≥ 3,6 sur les 4 fonds) en gardant I > II — seul
    # écart au rendu legacy, tranché par la mesure (Vic « go »).
    carte: { kind: znieff, agregat: false, famille: environnement, geometrie: polygone, zoom_min: 0, rang_carte: 12, style: { couleur: "#8F9E4B", trait: "#8F9E4B", epaisseur: 0.8 }, niveaux: [ { id: "type I", propriete: subtype, valeur: "type I", couleur: "#8F9E4B", opacite: 0.20, legende: "Type I — secteur sensible (fort intérêt)" }, { id: "type II", propriete: subtype, valeur: "type II", couleur: "#8F9E4B", opacite: 0.13, legende: "Type II — grand ensemble naturel" } ], popup: [ { champ: id_mnhn, libelle: "Numéro national" }, { champ: type, libelle: "Type" }, { champ: gestionnaire, libelle: "Gestionnaire" }, { champ: url_fiche, libelle: "Fiche INPN", lien: true } ], legende: "ZNIEFF — type I (dense) / type II (léger)" }
    absence: "ZNIEFF : parcelle hors zone d'inventaire dans l'emprise visible."
    absence_type: absente_ici
    pourquoi: "Rendu identique (olive #8F9E4B ; type II 0,06 vs type I 0,20) ; signal, pas interdiction."
