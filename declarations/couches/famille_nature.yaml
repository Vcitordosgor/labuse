# ── PRODUCTION (lot 3, les 37) : FAMILLE NATURE — couches legacy migrées, RENDU REPRODUIT À
# L'IDENTIQUE (couleurs/opacités exactes de mapTheme.ts T_SOMBRE + MapView STYLE_BY_KIND). Deux
# couches à sous-types (parc cœur/adhésion, ZNIEFF type I/II) → `niveaux` : un aplat filtré par
# sous-type, couleur ET opacité propres. enp = kind VIRTUEL vers `ens` (tous types, pas de filtre).
# RPG N'EST PAS ICI : c'est la MÊME donnée que couche_safer (foncier) — fusionné, une seule couche.
# Empilement (rang_carte croissant = dessiné dessus) : parc ⊃ ZNIEFF ⊃ ENP ⊃ zones humides.

surface:   couche_zone_humide
nom:       "Zones humides"
categorie: couche
parent:    null
route:     "/map/tiles/zone_humide/{z}/{x}/{y}.pbf"
rendu:     carte
donnees:
  - quoi:  zone_humide_couche
    ou:    { rang: 10, etat: replie, section: "Nature et eau" }
    comment: { libelle: "Zones humides", format: liste, i: "Inventaires DEAL par secteurs (2003, 2009 + espaces fonctionnels, habitats 2011, basse altitude 2019) — couverture PARTIELLE : l'absence d'inventaire n'est pas une preuve d'absence." }
    carte: { kind: zone_humide, agregat: false, famille: environnement, geometrie: polygone, zoom_min: 0, rang_carte: 16, style: { couleur: "#2E9E8F", opacite: 0.30, trait: "#2E9E8F" }, popup: [ { champ: nature, libelle: "Nature" }, { champ: typename, libelle: "Inventaire" } ], legende: "Zone humide inventoriée (DEAL)" }
    absence: "Zones humides : aucun secteur inventorié dans l'emprise visible (couverture partielle)."
    absence_type: absente_ici
    pourquoi: "Rendu identique (#2E9E8F @0,30) ; contrainte environnementale, couverture dite partielle."
---
surface:   couche_enp
nom:       "Espaces naturels protégés"
categorie: couche
parent:    null
route:     "/map/tiles/enp/{z}/{x}/{y}.pbf"
rendu:     carte
donnees:
  - quoi:  enp_couche
    ou:    { rang: 10, etat: en_tete, section: "Nature et eau" }
    comment: { libelle: "Espaces naturels protégés", format: liste, i: "ENP par type (réserves naturelles dont marine, APB, conservatoire du littoral, réserves biologiques, Ramsar, sites classés/inscrits) — INPN + compléments DEAL Carmen. Protection réglementaire, souvent rédhibitoire." }
    carte: { kind: enp, agregat: false, famille: environnement, geometrie: polygone, zoom_min: 0, rang_carte: 14, style: { couleur: "#6A4CC2", opacite: 0.28, trait: "#6A4CC2" }, popup: [ { champ: type, libelle: "Type" }, { champ: surface_ha, libelle: "Surface (ha)" } ], legende: "Espace naturel protégé (réglementaire)" }
    absence: "ENP : parcelle hors espace naturel protégé sur l'emprise visible."
    absence_type: absente_ici
    statut_juridique: opposable
    pourquoi: "Rendu identique (#6A4CC2 @0,28 indigo, ≠ verts) ; kind virtuel enp→ens (tous types)."
---
surface:   couche_znieff
nom:       "ZNIEFF (type I & II)"
categorie: couche
parent:    null
route:     "/map/tiles/znieff/{z}/{x}/{y}.pbf"
rendu:     carte
donnees:
  - quoi:  znieff_couche
    ou:    { rang: 10, etat: en_tete, section: "Nature et eau" }
    comment: { libelle: "ZNIEFF (I / II)", format: liste, i: "Inventaire du patrimoine naturel (INPN/MNHN PatriNat, maj 2025). Type I : secteur de fort intérêt biologique, plus restreint et sensible ; type II : grand ensemble naturel peu modifié. PAS une interdiction — un signal fort (étude d'impact renforcée, recours plus probable). ZNIEFF marines non affichées." }
    # COUCHES-RECETTE-1 A3 : deux teintes FRANCHEMENT différentes (le camaïeu olive/olive ne
    # distinguait I et II que par l'opacité, contraire à A3). Type I = olive dense (secteur sensible),
    # type II = sarcelle (grand ensemble). Emboîtement conservé (type I plus dense, dessus).
    carte: { kind: znieff, agregat: false, famille: environnement, geometrie: polygone, zoom_min: 0, rang_carte: 12, style: { couleur: "#8F9E4B", trait: "#5f6b32", epaisseur: 0.8 }, niveaux: [ { id: "type I", propriete: subtype, valeur: "type I", couleur: "#8F9E4B", opacite: 0.34, legende: "Type I — secteur sensible (fort intérêt)" }, { id: "type II", propriete: subtype, valeur: "type II", couleur: "#3FA6A0", opacite: 0.24, legende: "Type II — grand ensemble naturel" } ], popup: [ { champ: id_mnhn, libelle: "Numéro national" }, { champ: type, libelle: "Type" }, { champ: gestionnaire, libelle: "Gestionnaire" }, { champ: url_fiche, libelle: "Fiche INPN", lien: true } ], legende: "ZNIEFF — type I (olive) / type II (sarcelle)" }
    absence: "ZNIEFF : parcelle hors zone d'inventaire dans l'emprise visible."
    absence_type: absente_ici
    pourquoi: "A3 : type I olive / type II sarcelle (teintes distinctes, plus un camaïeu d'opacité) ; signal, pas interdiction."
---
surface:   couche_parc
nom:       "Parc national"
categorie: couche
parent:    null
route:     "/map/tiles/parc_national/{z}/{x}/{y}.pbf"
rendu:     carte
donnees:
  - quoi:  parc_national_couche
    ou:    { rang: 10, etat: en_tete, section: "Nature et eau" }
    comment: { libelle: "Parc national", format: liste, i: "Périmètre du Parc national de La Réunion. Deux assiettes : le CŒUR (~40 % de l'île, inconstructible) et l'AIRE D'ADHÉSION (réglementée mais constructible). Urbanisation très restreinte." }
    # COUCHES-RECETTE-1 A3 : cœur et aire d'adhésion en deux couleurs FRANCHEMENT différentes (elles
    # étaient deux marrons ne différant que par la valeur/opacité). Cœur = vert forêt profond
    # (inconstructible), adhésion = ambre chaud (constructible réglementé) — sens porté par la teinte.
    carte: { kind: parc_national, agregat: false, famille: environnement, geometrie: polygone, zoom_min: 0, rang_carte: 8, style: { trait: "#14532d", epaisseur: 1.2 }, niveaux: [ { id: "coeur", propriete: subtype, valeur: "coeur", couleur: "#1E7A45", opacite: 0.36, legende: "Cœur — inconstructible (~40 % de l'île)" }, { id: "adhesion", propriete: subtype, valeur: "adhesion", couleur: "#D9973B", opacite: 0.20, legende: "Aire d'adhésion — réglementée, constructible" } ], legende: "Parc national — cœur (vert) / aire d'adhésion (ambre)" }
    absence: "Parc national : parcelle hors périmètre du Parc dans l'emprise visible."
    absence_type: absente_ici
    statut_juridique: opposable
    pourquoi: "A3 : cœur vert forêt #1E7A45 / adhésion ambre #D9973B (teintes franchement distinctes) ; deux assiettes."
---
surface:   couche_mesures_compensatoires
nom:       "Mesures compensatoires (ERC)"
categorie: couche
parent:    null
route:     "/map/tiles/mesures_compensatoires/{z}/{x}/{y}.pbf"
rendu:     carte
donnees:
  - quoi:  mesures_compensatoires_couche
    ou:    { rang: 10, etat: replie, section: "Nature et biodiversité" }
    comment: { libelle: "Mesures compensatoires (ERC)", format: liste, i: "Emprises des mesures de compensation écologique (GéoMCE, MTE/OFB) imposées à un maître d'ouvrage au titre de la séquence Éviter-Réduire-Compenser. Sur une parcelle : obligation écologique dormante (gestion imposée) — remonte aussi dans « Pièges et risques »." }
    # GEOPF-3 — magenta #C0508F, distinct de l'ENP violet (#6A4CC2) et de la ZNIEFF olive (#8F9E4B).
    # Pas de vert. geometrie mixte : surfaces (aplat), lignes, points (anneau).
    carte: { kind: mesures_compensatoires, agregat: false, famille: environnement, geometrie: mixte, zoom_min: 0, rang_carte: 11, style: { couleur: "#C0508F" }, niveaux: [ { id: surface, propriete: subtype, valeur: surface, geometrie: polygone, couleur: "#C0508F", opacite: 0.30, trait: "#7A2E5A", legende: "Emprise surfacique (compensation)" }, { id: ligne, propriete: subtype, valeur: ligne, geometrie: ligne, couleur: "#C0508F", epaisseur: 1.8, opacite: 0.9, legende: "Emprise linéaire" }, { id: point, propriete: subtype, valeur: point, geometrie: point, anneau: true, couleur: "#C0508F", zoom_rayon: [9, 3, 14, 6, 17, 9], epaisseur: 2, opacite: 0.95, legende: "Emprise ponctuelle" } ], popup: [ { champ: name, libelle: "Projet" }, { champ: type_mesure, libelle: "Type de mesure" }, { champ: type_procedure, libelle: "Procédure" } ], legende: "Mesure compensatoire ERC (surface / ligne / point)" }
    absence: "Mesures compensatoires : aucune mesure ERC dans l'emprise visible."
    absence_type: absente_ici
    pourquoi: "GEOPF-3 : magenta #C0508F (≠ ENP violet, ≠ ZNIEFF olive) ; contrainte ERC, geometrie mixte."
