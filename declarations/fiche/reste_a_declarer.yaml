# ── §10 POTENTIEL ───────────────────────────────────────────────────────────────────────
surface:   fiche_parcelle_potentiel_reste
nom:       "Potentiel — plancher, vendable, surélévation"
categorie: fiche
parent:    fiche_parcelle
route:     "/parcels/{idu}"
rendu:     sections
fiche_section: potentiel
donnees:
  - quoi:  surface_plancher_m2
    ou:    { rang: 10, etat: replie, section: "Ce qui est constructible" }
    comment:
      libelle: "Surface de plancher créée (table rase)"
      unite:   "m²"
      format:  entier_m2
      i:       "Surface de plancher CRÉÉE par le scénario table rase (moteur commun : emprise × occupation × niveaux)."
    absence: "Surface de plancher non calculable (zone non constructible ou capacité nulle)."
    absence_type: absente_ici
    pourquoi: "Le volume constructible du scénario neuf ; base du bilan."
  - quoi:  surface_vendable_m2
    ou:    { rang: 20, etat: replie, section: "Ce qui est constructible" }
    comment:
      libelle: "Surface vendable (Estimé)"
      unite:   "m²"
      format:  entier_m2
      i:       "SHAB vendable du scénario table rase (fourchette du moteur commun) — distincte de la capacité logements."
    absence: "Surface vendable non calculable pour cette parcelle."
    absence_type: absente_ici
    pourquoi: "La surface qui fait le chiffre d'affaires ; base de la charge foncière."
  - quoi:  marge_surelevation_m
    ou:    { rang: 30, etat: replie, section: "Ce qui est constructible" }
    comment:
      libelle: "Marge de surélévation (au faîtage)"
      unite:   "m"
      format:  metre
      i:       "Hauteur restante sous la règle de faîtage de la zone, comparée au faîtage bâti mesuré (BD TOPO)."
    absence: "Marge de surélévation non calculable (hauteur de règle ou bâti non déterminés)."
    absence_type: absente_ici
    pourquoi: "Le potentiel d'un étage en plus sur l'existant ; lecture de densification."

