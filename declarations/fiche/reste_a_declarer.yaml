# ── FICHE-RANGEMENT-2 Lot 2 — « tout par déclaration » ──
# Les dernières données à MAILLE PARCELLE servies sur la fiche par un robinet mais pas encore
# DÉCLARÉES (l'audit FICHE-AUDIT-1 en comptait 60 ; les lots précédents en ont résorbé la plupart,
# il en restait 17). Chacune est câblée ici avec sa SECTION, pour que le verrou V5d tienne :
# « toute donnée maille parcelle servie sur la fiche est déclarée avec une section ». Regroupées par
# nature (les 11 sections de la fiche), une surface par groupe.

# ── §1 IDENTITÉ ─────────────────────────────────────────────────────────────────────────
surface:   fiche_parcelle_identite_reste
nom:       "Identité — adresse, géométrie, permis"
categorie: fiche
parent:    fiche_parcelle
route:     "/parcels/{idu}"
rendu:     sections
fiche_section: identite
donnees:
  - quoi:  adresse_ban
    ou:    { rang: 10, etat: en_tete, section: "Identité" }
    comment:
      libelle: "Adresse"
      format:  texte
      i:       "Meilleure adresse BAN rattachée à la parcelle (IGN)."
    absence: "Adresse non disponible — parcelle non rattachée à une voie (BAN)."
    absence_type: absente_ici
    pourquoi: "L'adresse identifie le bien ; en tête de la fiche."
  # EXPORTS-REBRANCHEMENT-1 lot 1 — l'écran (① Identité) montre la dernière vente DVF de la
  # parcelle ; elle était servie au PDF hors déclaration (id des blocs). Déclarée ici.
  - quoi:  prix_achat_historique_eur
    ou:    { rang: 15, etat: replie, section: "Sur la parcelle" }
    comment: { libelle: "Dernière vente (DVF)", format: euro, i: "Dernière mutation DVF observée sur la parcelle (valeur actée, ventes publiées avec un à trois ans de délai)." }
    absence: "Dernière vente : aucune mutation DVF publiée sur cette parcelle (fenêtre 2014-2025)."
    absence_type: absente_ici
    pourquoi: "Le prix déjà payé ancre toute négociation ; replié sous l'identité."

  - quoi:  parcelle_geometrie
    ou:    { rang: 20, etat: replie, section: "Identifiants et références" }
    comment:
      libelle: "Géométrie de la parcelle"
      i:       "Polygone cadastral de la parcelle (contour carte/fiche/PDF, même table partout)."
    absence: "Géométrie de la parcelle non disponible pour cette référence."
    absence_type: absente_ici
    pourquoi: "Le contour cadastral situe le bien ; base de tous les croisements."
  - quoi:  historique_permis_liste
    ou:    { rang: 30, etat: replie, section: "Sur la parcelle" }
    comment:
      libelle: "Sur cette parcelle (permis)"
      format:  liste
      i:       "Permis déposés/autorisés sur la parcelle (Sitadel) + caducité, chaque ligne datée."
    absence: "Aucun permis recensé sur cette parcelle (Sitadel)."
    absence_type: absente_ici
    pourquoi: "L'historique de construction du bien ; fait d'identité de la parcelle."

---
# ── §4 URBANISME — droit des sols ───────────────────────────────────────────────────────
surface:   fiche_parcelle_urbanisme_reste
nom:       "Urbanisme — dispositifs et contraintes du droit des sols"
categorie: fiche
parent:    fiche_parcelle
route:     "/parcels/{idu}"
rendu:     sections
fiche_section: urbanisme
donnees:
  - quoi:  er_emplacement_reserve
    ou:    { rang: 10, etat: replie, section: "Droit des sols (ER · EBC · DPU · PEB)" }
    comment:
      libelle: "Emplacement réservé (ER)"
      format:  classe
      i:       "La parcelle est-elle grevée d'un emplacement réservé du PLU (destination, part de la parcelle)."
    absence: "Hors emplacement réservé du PLU."
    absence_type: absente_ici
    statut_juridique: opposable
    pourquoi: "Un ER déduit de l'emprise constructible ; contrainte du droit des sols."
  - quoi:  ebc_classe
    ou:    { rang: 20, etat: replie, section: "Droit des sols (ER · EBC · DPU · PEB)" }
    comment:
      libelle: "Espace boisé classé (EBC)"
      format:  classe
      i:       "La parcelle intersecte-t-elle un espace boisé classé du PLU (part soustraite de l'assiette)."
    absence: "Hors espace boisé classé du PLU."
    absence_type: absente_ici
    statut_juridique: opposable
    pourquoi: "L'EBC interdit la construction sur l'emprise boisée ; contrainte du droit des sols."
  - quoi:  dpu_perimetre
    ou:    { rang: 30, etat: replie, section: "Droit des sols (ER · EBC · DPU · PEB)" }
    comment:
      libelle: "Droit de préemption urbain (DPU)"
      format:  classe
      i:       "La parcelle est-elle dans un périmètre de préemption publié (DPU simple/renforcé)."
    absence: "Hors périmètre de préemption urbaine publié."
    absence_type: non_publiee
    statut_juridique: opposable
    pourquoi: "Le DPU commande la transaction (DIA) ; à connaître avant d'acheter."
  - quoi:  peb_zone
    ou:    { rang: 40, etat: replie, section: "Droit des sols (ER · EBC · DPU · PEB)" }
    comment:
      libelle: "Plan d'exposition au bruit (PEB)"
      format:  classe
      i:       "Zone PEB de l'aérodrome (A/B/C/D) si la parcelle y est (annexes GPU)."
    absence: "Hors zones du plan d'exposition au bruit."
    absence_type: non_publiee
    statut_juridique: opposable
    pourquoi: "Le PEB limite ou interdit l'habitation ; contrainte réglementaire majeure."
  - quoi:  mixite_clause
    ou:    { rang: 50, etat: replie, section: "Mixité sociale" }
    comment:
      libelle: "Mixité sociale (clause)"
      format:  verdict
      i:       "Déclenchement de la clause de mixité (SDP/logements/terrain ≥ seuil de la zone)."
    absence: "Mixité sociale : seuils de la zone non renseignés à ce jour."
    absence_type: non_ingeree
    statut_juridique: opposable
    pourquoi: "La clause de mixité impose un quota de logements sociaux ; change le programme."
  - quoi:  sar_divergence
    ou:    { rang: 60, etat: replie, section: "Ce qui contraint" }
    comment:
      libelle: "Divergence SAR (indication)"
      format:  verdict
      i:       "Zone PLU U/AU croisant une vocation naturelle/agricole du proxy Région — indication non opposable."
    absence: "Aucune divergence SAR indiquée."
    absence_type: absente_ici
    statut_juridique: informatif
    pourquoi: "Un signal de vigilance sur la vocation du sol ; à confirmer, jamais opposable."

