# ── §6 RÉSEAUX ET DESSERTE ──────────────────────────────────────────────────────────────
surface:   fiche_parcelle_reseaux_reste
nom:       "Réseaux et desserte — égout, stationnement allégé"
categorie: fiche
parent:    fiche_parcelle
route:     "/parcels/{idu}"
rendu:     sections
fiche_section: reseaux
donnees:
  - quoi:  part_logements_egout_pct
    ou:    { rang: 10, etat: replie, section: "Viabilisation" }
    comment:
      libelle: "Logements raccordés à l'égout"
      unite:   "%"
      format:  pourcent
      i:       "Part des logements raccordés au tout-à-l'égout (INSEE RP2022 EGOUL, maille IRIS, repli commune)."
    absence: "Taux de raccordement à l'égout non disponible pour ce secteur."
    absence_type: absente_ici
