surface:   fiche_parcelle_dispositifs
nom:       "Dispositifs et périmètres"
categorie: fiche
parent:    fiche_parcelle
route:     "/parcels/{idu}"
rendu:     sections
fiche_section: fiscalite
# FUSION (Vic) : « Dispositifs et périmètres » ABSORBE « Dispositifs et périmètres (droit des sols) » —
# même sujet, un lecteur ne doit pas hésiter entre deux sections. dispositifs_parcelle (ER/EBC/DPU/PEB)
# rejoint ici (le droit des sols), sous les dispositifs fiscaux/urbains.
donnees:
  # EXPORTS-REBRANCHEMENT-2 lot 1 — la taxe foncière (TFPB) prend sa place au §7 Fiscalité (maquette
  # v4). Elle quitte le bandeau de garde du Dossier (remplacé par « Risques ») ; la tuile d'en-tête
  # de l'ÉCRAN reste déclarée dans entete_tuiles.yaml.
  - quoi:  tfpb_taux_pct
    ou:    { rang: 5, etat: en_tete, section: "Taxes" }
    comment: { libelle: "Taxe foncière (bâti)", format: texte, i: "Part communale du taux de taxe foncière sur le bâti (E12, fichier REI DGFiP) — hors part départementale, TEOM et taxes spéciales." }
    absence: "Taxe foncière : taux non disponible pour cette commune."
    absence_type: non_ingeree
    pourquoi: "La charge annuelle du bien pendant le portage ; en tête de la fiscalité."
  - quoi:  perimetres_dispositifs_liste
    ou:    { rang: 10, etat: en_tete, section: "Dispositifs fiscaux et urbains" }
    comment: { libelle: "Dispositifs (QPV, ANRU, ZFANG, FRR…)", format: liste, i: "Dispositifs territoriaux (fiscaux/urbains) intersectant la parcelle." }
    absence: "Dispositifs : la parcelle n'est dans aucun dispositif territorial repéré."
    absence_type: absente_ici
    pourquoi: "Dispositifs fiscaux/urbains ; en tête."
  - quoi:  dispositifs_parcelle
    ou:    { rang: 20, etat: replie, section: "Droit des sols (ER · EBC · DPU · PEB)" , fiche_section: urbanisme }
    comment: { libelle: "Prescriptions du droit des sols", format: liste, i: "Emplacements réservés, espaces boisés classés, droit de préemption, plan d'exposition au bruit intersectant la parcelle." }
    absence: "Droit des sols : aucune prescription (ER/EBC/DPU/PEB) sur la parcelle."
    absence_type: absente_ici
    statut_juridique: opposable
    pourquoi: "Prescriptions opposables du droit des sols ; replié, dans la même section que les dispositifs."
  # SOURCES-FIX-1 A3 — le SCOT (document supra-communal opposable au PLU), même couche que la carte.
  - quoi:  scot_parcelle
    ou:    { rang: 30, etat: replie, section: "Droit des sols (ER · EBC · DPU · PEB)" , fiche_section: urbanisme }
    comment: { libelle: "SCOT", format: texte, i: "Schéma de cohérence territoriale couvrant la parcelle (nom, date d'approbation) — document supra-communal opposable au PLU. Source : Géoportail de l'urbanisme (GPU)." }
    absence: "SCOT : la parcelle n'est couverte par aucun schéma de cohérence territoriale."
    absence_type: absente_ici
    statut_juridique: opposable
    pourquoi: "Cadre supra-communal opposable au PLU ; replié, dans la section droit des sols."
