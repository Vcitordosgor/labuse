    absence: "Population du secteur : non disponible."
    absence_type: absente_ici
    pourquoi: "Le voisinage humain ; replié (sous le quartier)."
  - quoi:  voisinage_100m_liste
    ou:    { rang: 20, etat: replie, section: "Le secteur" }
