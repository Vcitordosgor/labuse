  - quoi:  population_zone
    ou:    { rang: 10, etat: replie, section: "Le secteur" }
    comment: { libelle: "Population du secteur", format: entier, i: "Population du quartier/secteur autour de la parcelle." }
    absence: "Population du secteur : non disponible."
    absence_type: absente_ici
    pourquoi: "Le voisinage humain ; replié (sous le quartier)."
  - quoi:  voisinage_100m_liste
    ou:    { rang: 20, etat: replie, section: "Le secteur" }
    comment: { libelle: "Ventes voisines (100 m)", format: liste }
    absence: "Ventes voisines : aucune vente à moins de 100 m."
    absence_type: absente_ici
