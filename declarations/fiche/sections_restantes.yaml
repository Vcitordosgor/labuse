surface:   fiche_parcelle_dispositifs
nom:       "Dispositifs et périmètres"
categorie: fiche
parent:    fiche_parcelle
route:     "/parcels/{idu}"
rendu:     sections
# FUSION (Vic) : « Dispositifs et périmètres » ABSORBE « Dispositifs et périmètres (droit des sols) » —
# même sujet, un lecteur ne doit pas hésiter entre deux sections. dispositifs_parcelle (ER/EBC/DPU/PEB)
# rejoint ici (le droit des sols), sous les dispositifs fiscaux/urbains.
donnees:
  - quoi:  perimetres_dispositifs_liste
    ou:    { rang: 10, etat: en_tete, section: "Dispositifs fiscaux et urbains" }
    comment: { libelle: "Dispositifs (QPV, ANRU, ZFANG, FRR…)", format: liste, i: "Dispositifs territoriaux (fiscaux/urbains) intersectant la parcelle." }
    absence: "Dispositifs : la parcelle n'est dans aucun dispositif territorial repéré."
    absence_type: absente_ici
    pourquoi: "Dispositifs fiscaux/urbains ; en tête."
  - quoi:  dispositifs_parcelle
    ou:    { rang: 20, etat: replie, section: "Droit des sols (ER · EBC · DPU · PEB)" }
    comment: { libelle: "Prescriptions du droit des sols", format: liste, i: "Emplacements réservés, espaces boisés classés, droit de préemption, plan d'exposition au bruit intersectant la parcelle." }
    absence: "Droit des sols : aucune prescription (ER/EBC/DPU/PEB) sur la parcelle."
    absence_type: absente_ici
    statut_juridique: opposable
    pourquoi: "Prescriptions opposables du droit des sols ; replié, dans la même section que les dispositifs."
