# ── PRODUCTION (lot 2) : sections restantes de la fiche (docs YAML séparés par `---`, 1 par surface) ──
# Ordre du regard, repli par défaut. Certaines données restent `non_branchee` (producteur à câbler) —
# déclarées ici pour être VUES et comptées dans la dette (Vic veut voir la liste).
surface:   fiche_parcelle_constructibilite
nom:       "Constructibilité"
categorie: fiche
parent:    fiche_parcelle
route:     "/parcels/{idu}"
rendu:     sections
fiche_section: potentiel
donnees:
  - quoi:  potentiel_verdict
    ou:    { rang: 10, etat: en_tete, section: "Ce qui est constructible" }
    comment: { libelle: "Potentiel (verdict)", format: verdict, i: "Phrase du bloc « au sol / en hauteur / table rase » (moteur potentiel, run servi)." }
    absence: "Potentiel : rien d'évaluable (zone non constructible ou données manquantes)."
    absence_type: absente_ici
    pourquoi: "Le verdict de constructibilité ; en tête."
  - quoi:  capacite_logements
    ou:    { rang: 20, etat: en_tete, section: "Ce qui est constructible" }
    comment: { libelle: "Capacité (logements)", format: entier, i: "Logements estimés du scénario table rase (après plafond de densité et stationnement)." }
    absence: "Capacité (logements) : non estimable sur cette parcelle."
    absence_type: absente_ici
    pourquoi: "L'ordre de grandeur du programme ; en tête."
  - quoi:  charge_fonciere_eur
    ou:    { rang: 30, etat: replie, section: "Bilan indicatif" , fiche_section: simulation }
    comment: { libelle: "Charge foncière (indicative)", unite: "€", format: euro, i: "Bilan à rebours INDICATIF sur hypothèses PAR DÉFAUT du secteur (aucun projet saisi) — à valider. Une charge négative se dit en français, jamais en euros négatifs." }
    absence: "Charge foncière : bilan non calculable (prix de sortie ou SDP manquants)."
    absence_type: absente_ici
    pourquoi: "Ordre de grandeur indicatif, ses hypothèses dites ; replié (pas un chiffre à défaut affiché comme ferme)."
  - quoi:  taxe_amenagement_estimee_eur
    ou:    { rang: 40, etat: replie, section: "Bilan indicatif" , fiche_section: fiscalite }
    comment: { libelle: "Taxe d'aménagement — taux communal", unite: "%", format: pourcent, i: "Taux communal de la taxe d'aménagement. Sans projet, SEUL le taux est servi : le montant en euros se calcule sur la surface de plancher CRÉÉE par un projet (art. L331 c. urb.), chiffré au Financier." }
    absence: "Taxe d'aménagement : taux communal non renseigné pour cette commune."
    absence_type: non_ingeree
    pourquoi: "Le taux (référence), avec la phrase disant sur quoi le montant se calcule ; replié."
  # FICHE-RANGEMENT-1 Lot 2 — rtaa_exigences était RENDU dans ce tiroir (RtaaBlock du bilan) mais
  # déclaré seulement à l'outil Faisabilité. On le CÂBLE ici, à son tiroir réel (donnée existante,
  # passe-plat config/rtaa_dom.yaml — pas de chantier requis).
  - quoi:  rtaa_exigences
    ou:    { rang: 50, etat: replie, section: "Bilan indicatif" , fiche_section: urbanisme }
    comment: { libelle: "Rappel RTAA DOM", format: liste, i: "Exigences réglementaires de conception DOM (aération, protection solaire, eau chaude solaire) — rappel au stade faisabilité, hors scoring. Règles versionnées config/rtaa_dom.yaml, vérifiées sur Légifrance." }
    absence: "RTAA DOM : aucune exigence de conception à rappeler ici."
    absence_type: absente_ici
    pourquoi: "Rappel réglementaire de conception utile au promoteur ; replié derrière « N exigences » (information, jamais un filtre)."
