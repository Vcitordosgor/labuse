# GROUPE CAPACITÉ LOGEMENT ZÉRO (constructible_neuf=False — capacité logement ZÉRO exacte,
# précédents UF/AUF Petite-Île, Ue/Up/Uv Le Port : zone à habitat impossible SANS hauteur
# chiffrée => jamais d'entrée `zones:` qui retomberait en estimation générique 9 m).
# 1) GEL AUes : « En attendant la réalisation d'études préalables devant déterminer un
#    programme d'aménagement et l'ouverture à l'urbanisation de la zone conditionnée à
#    une modification du PLU, sont admises … » réseaux/voirie/énergie, ouvrages techniques
#    SP, reconstruction après sinistre, extension mineure 20 m² SDP pour mise aux normes
#    (Art. AUes 2, p.42) ; tout le reste interdit (Art. AUes 1.2, p.42) ; hauteur « Sans
#    objet » (Art. AUes 10, p.43). Zone stricte dédiée à l'activité économique de
#    production (caractère de zone, p.5 — décrite au chapitre des caractères sous
#    l'intitulé « AUs … Répondant aux mêmes logiques, la zone AUes est une zone stricte
#    dédiée à l'activité économique de production » ; seul AUes figure au zonage).
# 2) Ub5 NON AEDIFICANDI (ravines et talweg) : « En secteur Ub5, toutes les
#    constructions, ouvrages et travaux à l'exception de ceux mentionnés à l'article U 2 »
#    sont interdits (Art. U 1.2.8, p.7) ; « En secteur Ub5, seules sont autorisés les
#    chemins piétons et les voies d'accès permettant aux services d'entretenir les lits
#    et remparts des ravines » (Art. U 2.2, p.8). Aucune hauteur au chapitre pour Ub5.
zones_au_st:
  liste: ["AUes", "Ub5"]
  portee: "Construction neuve de logement impossible : AUes gelée (ouverture à l'urbanisation conditionnée à une modification du PLU après études préalables ; seuls réseaux, ouvrages techniques, reconstruction après sinistre et extension de mise aux normes 20 m² SDP admis) ; Ub5 non aedificandi (chemins piétons et voies d'entretien des ravines uniquement)."
  source: "Art. AUes 1.2 et AUes 2, p.42 ; Art. AUes 10, p.43 ; Art. U 1.2, p.7 et Art. U 2.2, p.8 (secteur Ub5)."

# Zones NON constructibles (urbanisation) — hors périmètre faisabilité U/AU.
# A : tout interdit sauf conditions (Art. A 1.2, p.44) ; habitat limité à l'exploitation
# agricole : extension des habitations existantes +30 % dans la limite de 60 m² et
# 150 m² SDP au total, construction d'habitation liée et nécessaire à l'exploitation
# 150 m² SDP max, agritourisme (Art. A 2.2, p.44-45) ; hauteur A 10.2 p.47 (habitat 4 m
# égout / R+0 …) — pas de logement hors exploitation => non constructible (urbanisation).
# N + secteurs Nli/Npnr/Nr/Nto : tout interdit sauf conditions (Art. N 1.2, p.50) ;
# aucune habitation neuve — seulement extension de l'existant +30 %/60 m²/150 m² SDP hors
# Npnr et Nr (Art. N 2.2.4, p.51) ; Npnr coeur du Parc national (autorisation spéciale),
# Nli espaces remarquables du littoral (aménagements légers R.121-5), Nr réservoirs de
# biodiversité (équipements AEP uniquement), Nto tourisme/loisirs Tévelave 60 m² SDP par
# nouveau bâtiment sans habitat (Art. N 2.2.6, p.51). Les graver ferait calculer une
# capacité logement fictive => repli générique non constructible, verdict produit correct.
zones_non_constructibles: ["A (chap. p.44-49)",
                           "N, Nli, Npnr, Nr, Nto (chap. p.50-56)"]
