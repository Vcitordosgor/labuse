# =============================================================================
# PLU LES AVIRONS (97401) — règles chiffrées par zone constructible (U / AU)
# =============================================================================
# Source unique : règlement écrit du PLU des Avirons (59 p.).
#   document : 97401_reglement.pdf (cache session, md5 conforme pré-vol).
#   PLU prescrit le 24/06/2011, arrêté le 01/03/2024, APPROUVÉ le 06/12/2024
#   (page de garde, p.1). Document GPU servi au calibrage : idurba 97401_PLU_20241206.
#
# FIABILITÉ (n'inventer AUCUNE valeur) :
#   - page_pdf = page_imprimee (offset 0). Le vote de pied de page d'extract.py a rendu
#     0 voix : les numéros imprimés sont EN EN-TÊTE (sous le bandeau « PLU DES AVIRONS —
#     REGLEMENT »), pas en pied. Confirmé manuellement : n° imprimé = n° de page PDF sur
#     les pages 3, 10, 19, 26, 44, 50 et 59, et les 8 entrées du sommaire (p.2) tombent
#     toutes sur la page PDF de même numéro (II-U p.7, UE p.19, III-AU p.26, AUEC p.29,
#     AUT p.35, AUES p.42, IV-A p.44, V-N p.50).
#   - ANCIEN FORMAT à articles 1-15 : 1/2 = destinations, 6 = recul voirie, 7 = recul
#     limites, 9 = emprise, 10 = hauteur, 12 = stationnement, 13 = espaces libres.
#   - CHAPITRE U MUTUALISÉ « ZONES UA, UB, UC et UD » (p.7-18) : articles U 1 à U 15
#     communs, valeurs déclinées par zone/secteur DANS chaque article (« en zone Ua : … »,
#     « en secteur Uc3 : … »). Chaque secteur du manifeste = une entrée, valeur vérifiée
#     ligne à ligne dans l'article ; quand l'article ne distingue pas le secteur, la
#     valeur « en zone X » du même article s'applique (rattachement écrit, pas d'héritage
#     supposé — noté zone par zone).
#   - null         = règle explicitement « Non réglementé » / « sans objet » (sourcé).
#   - HAUTEURS : « X mètres à l'égout du toit ou au sommet de l'acrotère ; Y mètres au
#     faitage » => he_m = X, hf_m = Y. Ub4 : « 8 mètres en hauteur absolue » => he_m = 8
#     ET hf_m = 8 (plafond absolu unique).
#   - PLEINE TERRE : les Art. U 13.1 / UE 13.1 / AUec 13.1 / AUt 13.1 imposent un % en
#     « espace libre et perméable » (ou « espace vert et perméable ») SANS AUCUN
#     sous-minimum de pleine terre => pleine_terre_pct null PARTOUT + % perméable en note
#     (précédents Saint-Louis, Le Port : le % perméable n'est jamais gravé en pleine
#     terre).
#   - COS : ZÉRO occurrence dans les 59 pages (grep « COS » et « coefficient
#     d'occupation ») — doc 2024 post-ALUR sain, rien à consigner de plus.
#   - ZONES AU indicées (chapitre « ZONES AUindicée », p.26-28) : renvoi explicite « il
#     convient de se reporter en fonction de l'indice de la zone AU considérée au
#     règlement des zones urbaines correspondantes (zones U) » (p.26, répété à chaque
#     article) => entrées EXPLICITES AUa/AUc/AUd : le renvoi moteur (regex AU+chiffre) ne
#     couvre pas les codes AU+lettre. Graphies confirmées dans le corps : « en zones AUa
#     et AUc, 30 logements par hectare ; en zones AUd, 20 logements par hectare »
#     (Art. AUindicée 2.2.4, p.26).
#   - HABITAT INTERDIT (confirmé au texte, candidates O12 Ue/AUec/AUes toutes tranchées) :
#     Ue (Art. UE 1.2.2, p.19 : habitation interdite « y compris celles liées au
#     gardiennage »), AUec (Art. AUec 1.2.2, p.29 : formule identique), AUt (Art. AUt
#     2.2.4, p.35 : habitation UNIQUEMENT gardiennage/surveillance, 50 m² d'emprise max
#     — logement de fonction => interdit pour le moteur), Ub4 (Art. U 1.2.7, p.7 : tout
#     sauf équipements collectifs d'intérêt général), Ud2 (Art. U 2.2, p.8 : « seules les
#     constructions destinées à la pratique du tourisme … ainsi que l'extension limitée
#     des constructions existantes », SDP 60 m²/bâtiment et 120 m²/unité foncière — pas
#     de logement neuf). Ces cinq zones ont une hauteur chiffrée => entrées `zones:`.
#   - GROUPE CAPACITÉ ZÉRO via zones_au_st (précédents UF/AUF Petite-Île, Ue/Up/Uv
#     Le Port : habitat impossible SANS hauteur chiffrée => jamais d'entrée `zones:` qui
#     retomberait en estimation générique 9 m) :
#       Ub5  = zone non aedificandi (ravines/talweg) : tout interdit sauf chemins piétons
#              et voies d'entretien des ravines (Art. U 1.2.8, p.7 ; Art. U 2.2, p.8) ;
#              aucune hauteur au chapitre.
#       AUes = zone STRICTE dédiée à l'activité économique de production (caractère,
#              p.5) : tout interdit sauf réseaux/ouvrages techniques/reconstruction après
#              sinistre/extension 20 m² SDP pour mise aux normes ; « l'ouverture à
#              l'urbanisation de la zone conditionnée à une modification du PLU »
#              (Art. AUes 1.2 et AUes 2, p.42) ; hauteur « Sans objet » (Art. AUes 10,
#              p.43). GEL => zones_au_st, condition d'ouverture explicite.
#   - A, N, Nli, Npnr, Nr, Nto : non constructibles (urbanisation) — cf.
#     zones_non_constructibles (pas de logement neuf : A 2.2 p.44-45 limite l'habitat à
#     l'exploitation agricole ; N 2.2 p.50-51 n'admet que l'extension de l'existant hors
#     Npnr/Nr et des équipements sans hébergement).
# =============================================================================

