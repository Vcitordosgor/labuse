# Zones AU « génériques » : à Saint-Pierre, chaque zone AU jumelle est régie par le
# chapitre de sa zone U (« Dispositions applicables à la zone Ux et AUx ») : entrées
# PROPRES ci-dessus, pas de renvoi mécanique (le renvoi code ne couvre que AU+chiffre).
zones_au_renvoi: {}

# Zones à CONSTRUCTION NEUVE NON AUTORISÉE — portées par le mécanisme zones_au_st
# (seul chemin du schéma produisant constructible_neuf=False ; l'étiquette moteur
# « secteur de transition (AU*st), H max 4 m » est INEXACTE pour ces zones — friction
# de schéma consignée au rapport, la CAPACITÉ (zéro construction neuve) est exacte) :
#   - Us  : zone gelée PROVISOIREMENT — préambule p.129 : « Provisoirement, elle
#     n'accepte aucune nouvelle construction dans l'attente de l'approbation de la
#     modification du SCoT » ; Art. Us1 (tableau p.130) : Logement/Hébergement V*
#     « Uniquement les extensions limitées à 25 % de la surface de plancher des
#     constructions existantes », tout commerce X. (Le chapitre 2 fixe pourtant
#     hé 6/hf 11, emprise 40 % >150 m², CBS 60 %/50 % pleine terre — règles gravables
#     le jour où la zone rouvre.)
#   - AU01/AU02/AU03/AU0c-1 : Art. AU01 p.200 : « Sont interdites, dans l'ensemble des
#     zones AU0, toute construction quelle qu'elle soit » (seuls services publics et
#     extensions <=20 % SDP) ; ouverture UNIQUEMENT par modification du PLU, avec
#     échéancier : AU0-1/AU0c-1 : 2-6 ans ; AU0-2 : 6-12 ans ; AU0-3 : >12 ans à
#     compter de l'approbation (25/06/2024). AU0c (Pierrefonds) : carrières autorisées
#     avant ouverture.
zones_au_st:
  liste: ["Us", "AU01", "AU02", "AU03", "AU0c-1"]
  portee: "Construction neuve NON autorisée : Us gelée provisoirement (extensions <=25 % SDP uniquement, dans l'attente de la modification du SCoT — préambule p.129 + Art. Us1 p.130) ; zones AU0 fermées (toute construction interdite, extensions <=20 % SDP, ouverture par modification du PLU selon échéancier 2-6/6-12/>12 ans — Art. AU01 p.200)."
  source: "Préambule Us p.129 + Art. Us1 (tableau) p.130 ; Art. AU01, p.200."

# Zones NON constructibles (urbanisation) — hors périmètre faisabilité U/AU.
# DÉCISION (cadrage GO n°1) : A et N restent NON CALIBRÉES — constructibilité
# d'EXCEPTION uniquement (A : logement de l'exploitant agricole limité à 1/exploitation
# et 150 m² SDP, extensions <=25 %, STECAL At — Art. A1 p.202-204 ; N : extensions
# <=25 %, carrières Nc, parcs Np/Nge — Art. N1 p.212-214). Les hauteurs du chapitre
# (A : 4/7 m ; N : 6/9 m) encadrent ces exceptions, PAS une constructibilité logement
# ordinaire : les graver ferait calculer une capacité logement fictive. Le repli
# générique classe A*/N* non constructibles => verdict produit correct.
zones_non_constructibles: ["A, Ac, Ac1, Acu, Acu1, At (chap. p.202-211)",
                           "N, Nr, Nc, Ncu, Nci, Np, Npnr, Nge (chap. p.212-221)"]
