# =============================================================================
# PLU SAINT-PIERRE (97416) — règles chiffrées par zone constructible (U / AU)
# =============================================================================
# Source unique : règlement écrit du PLU de Saint-Pierre (Eco-PLU).
#   document : 97416_reglement_20240625.pdf (extrait de l'archive GPU 97416_PLU_20240625)
#   url      : https://www.geoportail-urbanisme.gouv.fr/document/by-id/6c6320c68195297390a319acb951dc4b
#   PLU approuvé le 25/06/2024 (délibération CM), publié GPU le 16/07/2024. EN VIGUEUR,
#   aucune procédure en cours au 27/07/2026. Millésime = zonage servi (idurba 97416_PLU_20240625).
#
# FIABILITÉ (n'inventer AUCUNE valeur) :
#   - page_pdf = page_imprimee (offset 0 — vérifié : imprimée 98 = PDF 98).
#   - chaque valeur cite ZONE + ARTICLE + page : champ _src = "Art. UgN.M, p.PP".
#   - null         = règle explicitement "non réglementée" dans le texte.
#   - "a_verifier" = présent mais ambigu / conditionnel / non attribuable sûrement.
#   - hauteurs : le règlement donne « X m à l'égout du toit ou au sommet de l'acrotère »
#     et « Y m au faîtage » => he_m <- X, hf_m <- Y (mapping direct, aucune conversion).
#   - RÈGLEMENT AU FORMAT MODERNE (décret 2015) : Chapitres 1/2/3, articles préfixés
#     par zone (Ug1..Ug8). Correspondance consommée par le moteur :
#       implantation voies = Art. <Z>3.1 · limites séparatives = Art. <Z>3.2 ·
#       emprise au sol = Art. <Z>3.4 · hauteur = Art. <Z>3.5 ·
#       pleine terre/CBS = Art. <Z>5.1 · stationnement = Art. <Z>6.
#   - RÈGLES À TIROIRS (spécificité du format moderne, cf. § Frictions du rapport) :
#     emprise et pleine terre sont fixées PAR TRANCHE DE SURFACE de l'unité foncière.
#     Le schéma ne porte qu'un nombre => on grave la tranche > 250 m² (dominante :
#     81 % du pool servi Ug, médiane 458 m²) et la note cite toutes les tranches.
#     Sens de l'écart : pour les parcelles <= 250 m² la valeur gravée SOUS-estime
#     l'emprise autorisée (prudent, jamais optimiste).
#   - Chaque chapitre couvre zone U + zone AU jumelle (« zone Ug et AUg ») : une entrée
#     par libellé GPU, mêmes articles cités, condition d'urbanisation AU en note.
# =============================================================================

source:
