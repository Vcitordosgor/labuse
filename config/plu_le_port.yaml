# GROUPE CAPACITÉ LOGEMENT ZÉRO (constructible_neuf=False — étiquette moteur « secteur de
# transition » inexacte pour les zones U de ce groupe, capacité logement ZÉRO exacte ;
# friction F2, précédents 2AU* Tampon et UF/AUF Petite-Île). TROIS familles :
# 1) GEL 2AU (2AUem, 2AUmut, 2AUp) : « A l'exception de ceux visés à l'article 2AU 2, sont
#    interdits toutes les constructions, ouvrages et travaux » (Art. 2AU 1, p.157) ;
#    admis : réseaux, ouvrages techniques SP, extension mesurée bureaux existants,
#    maintien industrie/entrepôts existants (Art. 2AU 2, p.157-158). « L'ouverture à
#    l'urbanisation de la zone est conditionnée à une modification du PLU » (caractère de
#    zone, p.157) — condition d'ouverture EXPLICITE, pas d'échéancier chiffré.
# 2) GEL 1AUmut : « Soumis à un échéancier d'ouverture à l'urbanisation prévu dans l'OAP
#    « Centrale EDF », ce secteur sera ouvert à l'urbanisation à moyen et long terme.
#    Dans l'attente, les terrains pourront être occupés par des constructions légères et
#    facilement démontables » (caractère de zone, p.142 ; Art. 1AU 1, p.143 : tout ce qui
#    n'est pas visé à l'Art. 1AU 2 est interdit ; Art. 1AU 2, p.144-145 : maintien/mise
#    aux normes, extension mesurée bureaux, constructions légères démontables).
# 3) HABITAT INTERDIT SANS HAUTEUR CHIFFRÉE : Ue (Art. Ue 8, p.82 : seule la hauteur du
#    secteur Uem est fixée — AUCUNE hauteur pour Ue général ; habitat interdit Art. Ue 2,
#    p.80), Up et Uppp (Art. Up 5/6/7/8, p.110 : « Non réglementé » ; habitat interdit
#    Art. Up 2, p.109 — logement de surveillance seulement), Uv (Art. Uv 5/6/7/8, p.133 :
#    « Non réglementé » ; Art. Uv 2, p.132 : liste limitative équipements/services publics
#    et locaux liés dont gardiennage), et par renvoi du chapitre 1AU (p.142) : 1AUe → Ue
#    (graphie confirmée Art. 1AU 14.3, p.155 « zone 1AUe (Haut du Triangle Agricole) »),
#    1AUv → Uv. Une entrée `zones:` sans hauteur exploitable retomberait en estimation
#    générique 9 m avec capacité logement fictive => capacité zéro exacte ici.
zones_au_st:
  liste: ["2AUem", "2AUmut", "2AUp", "1AUmut", "Ue", "Up", "Uppp", "Uv", "1AUe", "1AUv"]
  portee: "Construction neuve de logement impossible : gels 2AU* (ouverture conditionnée à une modification du PLU) et 1AUmut (échéancier OAP Centrale EDF — constructions légères démontables uniquement dans l'attente) ; zones Ue/Up/Uppp/Uv et renvois 1AUe/1AUv : habitat interdit (logement de surveillance/gardiennage uniquement) SANS hauteur chiffrée."
  source: "Art. 2AU 1 et 2AU 2, p.157-158 ; ZONE 1AU (1AUmut), p.142-144 ; Art. Ue 2, p.80 et Ue 8, p.82 ; Art. Up 2, p.109 et Up 8, p.110 ; Art. Uv 2, p.132 et Uv 8, p.133."

