# =============================================================================
# PLU LE PORT (97407) — règles chiffrées par zone constructible (U / AU)
# =============================================================================
# Source unique : règlement écrit du PLU du Port (pièce écrite n°3, 319 p.).
#   document : 97407_reglement.pdf (cache session, md5 conforme pré-vol).
#   PLU révisé approuvé le 02/10/2018 (délibération n°2018-143), modification n°1 du
#   17/12/2019, modification n°2 du 30/01/2024 (tableau de suivi des versions, p.2).
#   Document GPU servi au calibrage : idurba 97407_PLU_20241209.
#
# FIABILITÉ (n'inventer AUCUNE valeur) :
#   - page_pdf = page_imprimee (offset 0 — vote extract.py 0 à 264 voix, confirmé sur le
#     sommaire p.3 ET 7 ancres du corps : Ua p.21, Ud p.65, Up p.107, 1AU p.142, 2AU p.157,
#     A p.162, N p.170 ; en-tête imprimé = n° de page PDF partout ; AUCUN bloc concaténé à
#     double numérotation : document unique, partie I p.4-176 = règlement par zone,
#     partie II p.177-319 = dispositions complémentaires patrimoine/OAP Fil Vert/clôtures/
#     façades commerciales, même numérotation continue).
#   - FORMAT MODERNE par zone : Article <Z> 1 = destinations interdites (tableau à cases
#     cochées ☒ = interdit), 2 = soumis à conditions, 4 = voies, 5 = limites séparatives,
#     7 = emprise, 8 = hauteur, 11.1 = surfaces éco-aménageables/pleine terre,
#     12.1 = stationnement.
#   - null         = règle explicitement « Non réglementé » dans le texte (sourcé).
#   - "a_verifier" = présent mais non attribuable sûrement (motivé en note).
#   - HAUTEURS : formule locale « X mètres au faitage ou au sommet de l'acrotère »
#     (plafond UNIQUE, valable toiture en pente comme toiture-terrasse) => he_m = X
#     (acrotère = sommet de façade) ET hf_m = X (faîtage). Uem/Us/1AUm : « la hauteur
#     maximale des constructions est fixée 18 mètres » SANS point de référence => hf_m: 18
#     seulement (lecture la plus conservatrice), he_m null.
#   - PLEINE TERRE : Art. <Z> 11.1 donne « au minimum P % de la superficie totale de
#     l'unité foncière … non imperméabilisées ou éco-aménageables dont au moins 50 % de
#     pleine terre plantées avec 3 strates » => pleine_terre_pct = P × 50 % (part MINIMALE
#     de pleine terre de l'unité foncière, arithmétique directe du texte, notée par zone).
#     Zones SANS sous-minimum de pleine terre (Ub 10 %, Ud/Ue/Umi 20 % éco-aménageables
#     seulement) => null + note (le % perméable n'est jamais gravé en pleine terre).
#   - COS : ZÉRO occurrence dans les 319 pages (grep « COS » et « coefficient
#     d'occupation ») — consigné, rien à appliquer.
#   - Indice « m » : Uem = SECTEUR de la zone Ue « zone tampon » en continuité des
#     quartiers résidentiels, dans lequel les activités industrielles sont interdites
#     (caractère de zone, p.79) — ce n'est PAS une servitude type Tampon : Uem porte des
#     règles propres (hauteur 18 m, Art. Ue 8, p.82) ; le reste = règles du chapitre Ue.
#   - ZONES 1AU indicées (chapitre unique « La zone 1AU », p.142-156) : renvoi explicite
#     « se reporter en fonction de l'indice de la zone AU considérée au règlement des
#     zones urbaines correspondantes » (p.142, répété à chaque article) => entrées
#     EXPLICITES 1AUa/1AUc/1AUem/1AUs (le renvoi moteur ne couvre pas les préfixes
#     chiffrés) ; 1AUm et 1AUmut ont leurs règles PROPRES dans le chapitre ; 1AUe et 1AUv
#     héritent de zones sans hauteur chiffrée => groupe capacité zéro (cf. zones_au_st).
#   - HABITAT INTERDIT (moteur ; logement de fonction/surveillance = interdit) :
#     Ue/Uem (Art. Ue 2, p.80 : logement limité à « être utiles au fonctionnement ou à la
#     surveillance », 1/unité foncière ; Hébergement coché interdit Art. Ue 1, p.79),
#     Up/Uppp (Art. Up 2, p.109 : idem surveillance ; Hébergement interdit Art. Up 1,
#     p.107), Us (Art. Us 2, p.120-121 : idem, 1/UF), Umi (Art. Umi 2, p.93 : habitation
#     réservée au gardiennage/personnel en caserne), Uv (Art. Uv 2, p.132 : liste
#     LIMITATIVE — équipements/services publics et locaux liés dont gardiennage ; l'Art.
#     Uv 2 n'admet PAS « toutes les occupations non cochées », à la différence de toutes
#     les autres zones).
#   - GROUPE CAPACITÉ ZÉRO via zones_au_st (précédents UF/AUF Petite-Île, 2AU Tampon) :
#     zones à habitat interdit SANS hauteur chiffrée (Ue, Up, Uppp, Uv + renvois 1AUe,
#     1AUv) — une entrée `zones:` sans hauteur retomberait en estimation générique 9 m
#     avec capacité logement FICTIVE ; capacité logement ZÉRO exacte, étiquette moteur
#     « secteur de transition » inexacte (friction F2 connue). + gels 2AUem/2AUmut/2AUp
#     (Art. 2AU 1, p.157 : tout est interdit sauf réseaux/ouvrages techniques ; ouverture
#     conditionnée à une modification du PLU) et 1AUmut (échéancier OAP « Centrale EDF »,
#     p.142 ; Art. 1AU 1-2, p.143-144 : dans l'attente, constructions légères et
#     facilement démontables uniquement).
#   - Uoap : non calibrée — les 14 articles renvoient TOUS à l'OAP « Portes de l'océan »
#     (pièce écrite n°4, hors règlement) ; graver quoi que ce soit = deviner.
#   - A, N, Nerl : non constructibles (urbanisation) — cf. zones_non_constructibles.
# =============================================================================

