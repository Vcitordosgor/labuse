# SEGMENT RENOUVELLEMENT (mandat M-RENOUV) — convention VERSIONNÉE.
#
# Ce segment rend visible un gisement que le pipeline servi ÉCARTE volontairement :
# les parcelles exclues à l'étage 0 pour occupation bâtie (BatiLayer, codes francs
# deja_bati / deja_bati_probable / ensemble_bati) mais situées en zone U/AU avec un
# signal de capacité réel. Densification, division, démolition-reconstruction.
#
# ═══ DOCTRINE (ne pas reformuler sans décision Vic) ═══
# - Ces parcelles sont OCCUPÉES. On parle de « potentiel de renouvellement urbain »,
#   JAMAIS d'« opportunité ». Jamais mélangées aux Chaudes/Brûlantes.
# - Le pipeline servi est INTOUCHÉ : ce segment est une couche additive en lecture
#   (table parcel_renouvellement), le tier reste « écartée ».
# - Le score est une HEURISTIQUE DÉTERMINISTE TRANSPARENTE — aucun modèle appris.
#   Le futur modèle P dédié (walk-forward + arène) est un mandat séparé.

# ── Définition du segment (A1) — les 5 conditions, toutes requises ──────────────
seuils:
  sdp_min_m2: 100        # capacité : SDP résiduelle STRICTEMENT > 100 m² …
  surface_min_m2: 600    # … OU surface ≥ 600 m² (plancher d'une division en R+1 locale,
                         #    aligné sur le plancher C du scoring servi — cf. SCORING_SPEC §5.2)
# Les autres conditions sont structurelles (pas des réglages) :
#   exclusion BatiLayer franche · zone_plu ∈ {U, AU} · non copro · non foncier public.

# ── Le score de renouvellement (A2) — somme pondérée LISIBLE, total = 100 ────────
# Chaque composante est stockée séparément (affichage « pourquoi » sur la fiche).
# Les composantes continues sont normalisées par RANG (percent_rank) AU SEIN du
# segment : pas d'échelle absolue à calibrer, robuste aux valeurs extrêmes, et le
# classement est invariant par transformation monotone des entrées.
# M129-C (Vic 19/08/2026) : la composante `divisibilite` (15 pts) est RETIRÉE — division_or
# sort du produit (jamais demandé, ~40 résultats/285 781, seuils non arbitrés). Impact du
# retrait MESURÉ avant : 2 lignes/67 258 portaient le +15, 0 sortie du top 100 — non
# significatif. Les 15 pts sont redistribués PRO-RATA (40/25/20 → 47/29/24, Σ=100 gardée).
# À reprendre si un client le demande.
poids:
  potentiel_residuel: 47   # sdp_residuelle_m2 (droits à bâtir non consommés) — le cœur du
                           # renouvellement : ce qu'on peut ENCORE construire malgré le bâti.
  assiette: 29             # surface_m2 — une grande assiette donne des options (division,
                           # curetage, phasage) même à SDP modeste.
  contexte_marche: 24      # rot_bati_brute du secteur (p_model_ext_dataset, année de scoring) :
                           # un secteur où le bâti TOURNE favorise le renouvellement. On prend
                           # la rotation brute (le shrinkage gamma-Poisson vit dans le modèle P,
                           # hors de portée d'une heuristique lisible — assumé, cf. rapport).

# ── Capacité NETTE des contraintes (RETOURS-11F M9) ──────────────────────────────
# Vic : « une maison de 100 m² sur 1 000 m² dont 900 sont en falaise ne densifie rien ».
# La SDP résiduelle BRUTE (droits à bâtir non consommés) est corrigée par un facteur de
# constructibilité MULTIPLICATIF, borné [0,1], qui déduit ce qui n'est physiquement pas
# constructible sur la parcelle. Le score de renouvellement (comp_potentiel) est calculé
# sur la SDP NETTE, plus sur la brute — une parcelle contrainte descend dans le classement.
#
# Chaque facteur est SOURCÉ sur une donnée servie du run (jamais inventé) :
#   - PPR zone rouge : fraction RÉELLE de la surface (le motif cascade porte « N % de la
#     surface ») → on retire EXACTEMENT cette fraction (facteur = 1 − pct/100).
#   - pente > 30 % : terrain non aisément constructible (RGE ALTI 5 m, parcel_terrain,
#     pente de la part NON bâtie). Facteur forfaitaire (l'assiette constructible se réduit
#     fortement — terrassement lourd, reculs de talus).
#   - ravine (au contact de la berge, seuil 10 m) / mouvement de terrain : bande non
#     constructible sur l'assiette. Facteur forfaitaire.
# Les RECULS voie/séparatifs et l'emprise de falaise fine ne sont PAS cartographiés en
# donnée ouverte par parcelle (dit au rapport) : ils ne sont pas déduits ici, seule
# l'emprise réglementaire max (parcel_residuel_bati) les porte déjà pour la surélévation.
capacite_nette:
  pente_seuil_pct: 30       # au-delà : facteur pente appliqué
  facteur_pente_forte: 0.5  # pente > 30 % → moitié de l'assiette résiduelle réputée constructible
  facteur_ravine: 0.85      # contact ravine → −15 % (bande de berge)
  facteur_mvt: 0.90         # mouvement de terrain à proximité → −10 %

# ── Plafond de la LISTE servie (outil « Densifier l'existant ») ──────────────────
# Le tri se fait côté serveur ; l'écran DIT « les N premières sur M » (jamais un LIMIT muet).
liste_max: 400
