zones_au_renvoi: {}

# AUst — GEL (1 polygone, 2,4 ha) : réseaux et accès insuffisants, « l'ouverture à
# l'urbanisation de la zone est conditionnée à une modification du PLU » (caractère de
# zone, p.53) ; Art. AUst 1.2 (p.53) : toutes les occupations interdites sauf Art. AUst 2.2
# (p.54 : réseaux, ouvrages techniques, reconstruction après sinistre, extensions mineures
# <= 20 m² de SHON). Hauteur des rares travaux admis : 6 m (Art. AUst 10, p.56).
zones_au_st:
  liste: ["AUst"]
  hauteur_max_m: 6
  portee: "Construction neuve non autorisée en l'état : ouverture à l'urbanisation conditionnée à une MODIFICATION du PLU ; seuls réseaux, ouvrages techniques, reconstruction après sinistre et extensions mineures <= 20 m² de SHON sont admis, hauteur max 6 m."
  source: "ZONE AUst (caractère de zone, p.53) ; Art. AUst 1.2, p.53 ; Art. AUst 2.2, p.54 ; Art. AUst 10, p.56."

# Zones NON constructibles (urbanisation) — hors périmètre faisabilité U/AU.
# DÉCISION (principe mandat-cadre, modèle Tampon) : constructibilité d'EXCEPTION uniquement,
# aucune règle consommable pour du logement neuf ordinaire => repli générique honnête
# (non constructibles), pas de calibrage :
#   - Zone A + secteur Anc (chap. p.63-71) : Art. A 1.2 (p.63) interdit tout ce qui n'est
#     pas lié et nécessaire à une exploitation agricole ; un seul logement par exploitation,
#     <= 170 m² de SHOB (Art. A 2.2.3, p.64). Anc = « zone NC du POS de 2001 » (caractère de
#     zone, p.63), occupations limitées sous avis CDPENAF (Art. A 2.2, p.65). Hauteur zone
#     A : 4 m égout / 7 m faîtage (Art. A 10.2, p.69).
#   - Zone N + secteurs Ndé, Nto (chap. p.73-80) : Art. N 1.2 (p.73) : interdits sauf N 2 ;
#     N 2.2 (p.74) : extensions <= 150 m² SHOB total, abris/kiosques 30 m² par bâtiment et
#     90 m² par unité foncière ; secteur Nto (tourisme/loisirs, hébergement possible) :
#     SHOB <= 60 m² par bâtiment et 180 m² par unité foncière ; secteur Ndé : déchetterie,
#     hélistation, station d'épuration. Hauteur zone N : 6 m au faîtage (Art. N 10.2, p.78).
#   - NtoPOS (12,9 ha) : graphie JAMAIS écrite dans le règlement (secteurs N nommés : Ndé,
#     Nto — caractère de zone, p.73) => rattachement à Nto NON gravé (hypothèse interdite),
#     repli générique non constructible (famille N), à faire trancher par Vic.
zones_non_constructibles: ["A, Anc (chap. p.63-71)",
                           "N, Ndé, Nto (chap. p.73-80)",
                           "NtoPOS (libellé absent du règlement — repli générique, famille N)"]
