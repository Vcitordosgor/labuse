  limites_separatives: "Retrait minimal 3 m dans toutes les zones U (Art. <Z> 7.2/7.3). Implantation en limite : Ua sur les deux limites (profondeur <= 15 m habitat, 20 m RDC commerces/bureaux) ; Ub une seule limite (ou deux si façade sur voie < 20 m) ; Uc une seule limite (profondeur <= 15 m). Fond de parcelle : Ua en limite possible, Ub/Uc retrait 3 m obligatoire (dépendances en limite admises, regroupées)."
  destinations_interdites_u: "Ua/Ub (Art. <Z> 1.2) : interdits = industriel, entrepôt exclusif, agricole, camping/caravanes, carrières — l'habitat y est admis. Uc (Art. Uc 1.2) : interdits = industriel, entrepôt exclusif, camping, carrières + TOUTE occupation sur les « espaces cultivés » du document graphique (sauf extensions <= 170 m² SHOB, Art. Uc 2.2.1, p.42)."

