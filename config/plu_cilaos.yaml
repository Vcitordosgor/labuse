# =============================================================================
# PLU CILAOS (97424) — règles chiffrées par zone constructible (U / AU)
# =============================================================================
# Source unique : règlement écrit du PLU de Cilaos (cache session nuit B).
#   document : 97424_reglement.pdf (« Commune de Cilaos — PLU — Règlement », 90 p.)
#   PLU approuvé le 6 février 2008 ; « Mise à jour du 5 mars 2018 » (page de garde,
#   PDF p.1). Document GPU en vigueur au calibrage : 97424_plu_20240213.
#
# FIABILITÉ (n'inventer AUCUNE valeur) :
#   - page_pdf = page_imprimee + 1 (vérifié : sommaire ZONE Ua imprimée 17 = PDF 18,
#     Uc 41 = PDF 42, AUst 53 = PDF 54, N 73 = PDF 74 ; numéros IMPRIMÉS lus en
#     EN-TÊTE de page : « 17 » sur PDF 18, « 41 » sur PDF 42, « 53 » sur PDF 54,
#     « 73 » sur PDF 74). Les _src citent la page IMPRIMÉE.
#   - LETTRES DOUBLÉES (vigilance mandat) : l'extraction pypdf du pré-vol doublait les
#     lettres des titres (« AARRTTIICCLLEE ») ; l'extraction PyMuPDF utilisée ici est
#     PROPRE. Par précaution, CHAQUE valeur chiffrée gravée ci-dessous a été relue
#     VISUELLEMENT sur le rendu image du PDF (pages 18, 22, 23, 25, 28, 29, 30, 34,
#     35, 37, 40, 41, 42, 46-49, 51, 52, 54-58, 60, 61, 64, 70, 72, 74, 75, 79) :
#     aucune divergence texte/visuel, aucun doublement de chiffres constaté.
#   - null         = règle explicitement absente / « Non réglementée » / sans plafond
#     chiffré dans le texte (sourcé au champ _src).
#   - ANCIEN FORMAT à articles préfixés (Ua 1..Ua 14) : 6=recul voirie, 7=recul limites,
#     9=emprise, 10=hauteur, 12=stationnement, 13=espaces libres.
#   - COS (invariant 5, ALUR 2014) : règlement rédigé en 2008/2018 (pré-ALUR) mais
#     document GPU en vigueur du 13/02/2024 (post-ALUR) => les articles 14 sont
#     CONSIGNÉS, JAMAIS APPLIQUÉS :
#       Art. Ua 14, p.28 / Art. Ub 14, p.40 / Art. Uc 14, p.51 : « Il n'est pas fixé
#       de coefficient d'occupation du sol. » ;
#       Art. AUst 14, p.56 : « Le coefficient d'occupation des sols est nul à
#       l'exception des travaux d'aménagement et d'extension mineure pour mise aux
#       normes sanitaires et d'habitabilité limités à 20 m2 de SHON réalisés sur des
#       constructions existantes. » (le gel AUst est porté par le caractère de zone
#       et Art. AUst 1.2/2.2, indépendants du COS) ;
#       Art. AUindicée 14, p.61 : « Se reporter au règlement de la zone U indiquée en
#       indice. » ; Art. A 14, p.71 et Art. N 14, p.80 : « Sans objet. »
#     Aucun COS n'est gravé ni consommé.
#   - ESPACES LIBRES : Art. 13.1 impose un % « espace vert » où « les aires de
#     stationnement peuvent être traitées en espaces verts si nécessaire » => ce n'est
#     PAS de la pleine terre — ARBITRAGE VIC 28/07 : le % « espace vert paysager » est
#     GRAVÉ malgré tout (contrainte d'emprise réelle, stationnements compris), libellé en src.
#   - RECULS VOIRIE Ua/Ub : « soit à l'alignement, soit en retrait [...] minimum 3 m »
#     => gravé 3 avec note (alignement 0 possible). Uc : retrait obligatoire 4 m.
#   - ZONES AU : chapitre « ZONE AUindicée » (p.57-61) : « il convient de se reporter
#     en fonction de l'indice de la zone AU considérée au règlement des zones urbaines
#     correspondantes à savoir Ub pour AUb, etc. sauf spécification contraire » (p.57).
#     Le renvoi mécanique du moteur ne couvre pas AUb/AUb1/AUb2 (pas de préfixe
#     chiffré mais résolution explicite exigée) => entrées EXPLICITES. Secteurs AUb1
#     et AUb2 (ZAC Roland Garros, p.57) : spécifications propres (emprise/hauteur/
#     espaces verts, Art. AUindicée 9/10/13, p.59-60), le reste via règles Ub.
#   - AUst (p.53-56) : GEL — « l'ouverture à l'urbanisation de la zone est conditionnée
#     à une modification du PLU » (caractère de zone, p.53) ; Art. AUst 1.2 : tout est
#     interdit sauf Art. AUst 2.2 (réseaux, ouvrages techniques, reconstruction après
#     sinistre, extensions <= 20 m² de SHON) => zones_au_st.
#   - Ub1 (1 polygone, 0,9 ha) : le libellé n'apparaît NULLE PART dans le règlement
#     (aucun secteur au chapitre Ub, caractère de zone p.29 sans secteur). Sigle « U »
#     => zone urbaine (Titre I, p.4-6) ; le seul chapitre possible est Ub et il ne
#     contient AUCUNE disposition particulière de secteur => règle générale Ub
#     (Titre I : « la règle générale de la zone s'applique à chacun [des secteurs]
#     sauf lorsqu'une disposition particulière est prévue », p.5) — même décision que
#     le précédent Saint-Louis (1AUb1/1AUb2 sans secteur UB1/UB2 => règles UB, note).
#   - Uah : le texte écrit « UAh » (caractère de zone Ua, p.17 : « Elle comporte un
#     secteur UAh où les constructions sont limitées à R+1+combles » ; Art. Ua 10.2,
#     p.24) — équivalence de casse manifeste « Uah » = texte « UAh » confirmée.
#   - NtoPOS (1 polygone, 12,9 ha) : la graphie « NtoPOS » n'apparaît JAMAIS dans le
#     règlement (chapitre N, p.73-80 : seuls secteurs nommés Ndé et Nto ; « POS »
#     n'apparaît que pour Anc « zone NC du POS de 2001 », p.63). Le rattachement à la
#     famille Nto serait une HYPOTHÈSE => non calibré, repli générique non
#     constructible (sans conséquence de capacité : famille N, cf. bloc
#     zones_non_constructibles).
# =============================================================================

# DOCTRINE HARMONISÉE A/B/C (28/07/2026) revue : AUCUNE gravure — les Art. 13
# n'imposent qu'un « espace vert paysager » (stationnements parfois comptables),
# jamais un % perméable => gravé néanmoins sur arbitrage Vic 28/07 (30-40 % de la
# parcelle sans bâti = contrainte d'emprise, quel que soit le traitement de surface).

