# =============================================================================
# PLU LA POSSESSION (97408) — règles chiffrées par zone constructible (U / AU)
# =============================================================================
# Source unique : règlement écrit du PLU de La Possession (archive GPU 97408_PLU_20251217).
#   document : 97408_reglement.pdf (cache pré-vol nuit), 164 p. Concordance manifeste/GPU
#   re-vérifiée au pré-vol du 27/07/2026.
#
# FIABILITÉ :
#   - page_pdf = page_imprimee (offset 0 — vote pré-vol : 228 concordances).
#   - Ancien format à articles préfixés (UA 1..UA 14). Aucun COS (pré-vol 0 occurrence).
#   - Beaucoup de hauteurs données AU FAÎTAGE SEUL ou « sans précision » => hf_m gravé,
#     he_m null (« En l'absence d'indication » : convention non écrite ici — noté par zone).
#   - EMPRISE « Sans objet » dans UA/UB/UE/UT => null sourcé ; UEm 70 %, AUBm 60 %.
#   - RETRAIT LIMITES : règle H/2 avec minimum 3 m partout => minimum gravé, H/2 en note.
#   - PLEINE TERRE = « % espace perméable » (Art. 13) — tranches par secteur gravées à la
#     valeur de la zone/secteur concerné ; réduction <=300 m² (UB) en note.
#   - indices « psfr2 »/« fr2 » = périmètre de protection rapprochée du Puits (forage) —
#     servitude ; variations chiffrées seulement où le texte en donne (hauteur UApsfr2 12 m,
#     perméable UTfr2 40 %).
#   - AUindicée = renvoi à la zone U d'indice ; AUBm = chapitre PROPRE ; AUst = GEL
#     (ouverture par modification du PLU) ; AUCUNE mention 2AU.
#   - FRICTIONS consignées : hauteur AUBm exprimée « R+3 » (niveaux, pas de mètres) et
#     hauteur UAv définie PAR ÎLOT opérationnel (tableau) => a_verifier motivés, repli
#     générique honnête (R+2 estimé < R+3 réel : sens prudent).
# =============================================================================

