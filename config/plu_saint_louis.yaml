# Gels AU — deux mécanismes distincts, tous portés par zones_au_st (constructible_neuf=False) :
# 1) AUst (chapitre p.110-114) : réseaux/accès insuffisants, « l'ouverture à l'urbanisation de
#    la zone est conditionnée à une modification du PLU » (caractère de zone, p.110) ; tout est
#    interdit sauf réseaux/ouvrages techniques/reconstruction après sinistre/extension <= 20 m²
#    (Art. AUst 1.2 et 2.2, p.111). Hauteur des rares travaux admis : 4 m égout / 8 m faîtage
#    (Art. AUst 10, p.114). Concerne 1AUst, « 1AUst oap1 », 1AUste, 2AUst, 2AUste (les graphies
#    « ste » n'ont aucun secteur propre au chapitre AUst : règles de la zone AUst entière).
# 2) 2AUindicée (Art. AUindicée 2.2, p.106) : « leur ouverture à l'urbanisation ne pourra
#    intervenir qu'une fois l'aménagement de l'ensemble des zones 1AUindicée et 1AUst
#    entrepris » => gel conditionnel : 2AUb1, 2AUb2, 2AUd, 2AUd1, 2AUe.
# Le regex moteur (AU\w*st) ne matche AUCUN de ces codes (préfixes chiffrés, suffixe « e ») :
# liste EXPLICITE obligatoire. Art. AUst 14 (COS nul, p.114) consigné en tête, non appliqué.
zones_au_st:
  liste: ["1AUst", "1AUst oap1", "1AUste", "2AUst", "2AUste",
          "2AUb1", "2AUb2", "2AUd", "2AUd1", "2AUe"]
  hauteur_max_m: 4
  portee: "Construction neuve non autorisée en l'état. AUst (1AUst/1AUste/2AUst/2AUste et OAP associées) : ouverture conditionnée à une MODIFICATION du PLU, seuls réseaux, ouvrages techniques, reconstruction après sinistre et extensions <= 20 m² SDP sont admis. 2AUindicée (2AUb1/2AUb2/2AUd/2AUd1/2AUe) : ouverture conditionnée à l'aménagement préalable de l'ensemble des 1AUindicée et 1AUst de la polarité SAR. 2AUe : indice e => habitat au surplus interdit par renvoi UE."
  source: "ZONE AUst (caractère de zone, p.110) ; Art. AUst 1.2 et 2.2, p.111 ; Art. AUst 10, p.114 ; Art. AUindicée 2.2, p.106."

# Zones NON constructibles (urbanisation) — hors périmètre faisabilité U/AU.
# DÉCISION (principe mandat-cadre, modèle Tampon) : constructibilité d'EXCEPTION uniquement,
# aucune règle consommable pour du logement neuf ordinaire => repli générique honnête
# (non constructibles), pas de calibrage :
#   - Zone A (chap. p.116-124) : Art. A1.2 (p.117) interdit tout sauf A2.2 — bâtiments
#     agricoles, extensions d'habitations existantes <= 150 m² cumulés ; secteurs Aco
#     (corridors), Acu (coupures d'urbanisation), Ama (carrières), Arh (STECAL habitat
#     rural : 50 m² SDP par tranche de 600 m² de terrain, Art. A2.2.6, p.118), Ato
#     (agrotourisme : extension <= 200 m², Art. A2.2.7, p.118). Hauteur zone A : 6 m
#     (Art. A10, p.121).
#   - Zone N (chap. p.126-133) : Art. N1.2 (p.127) : « sont interdits toutes les
#     constructions, ouvrages et travaux » sauf N2.2 ; secteurs Nco, Nli (littoral étang
#     du Gol), Nma (carrières), Npnr (cœur du Parc national), Nr (réservoirs biodiversité),
#     Nstep (station d'épuration), Nto/Nto1/Nto2/Nto3 (STECAL touristiques : SDP plafonnée
#     250 m²/unité foncière, Art. N2.2.11, p.128).
#   - Graphie manifeste « Nto 1 » (avec espace) : traitée comme les autres libellés A/N —
#     non calibrée, repli générique non constructible (le règlement écrit « Nto1 », p.128 ;
#     l'équivalence n'emporte aucune règle consommable de toute façon).
zones_non_constructibles: ["A, Aco, Acu, Ama, Arh, Ato (chap. p.116-124)",
                           "N, Nco, Nli, Nma, Npnr, Nr, Nstep, Nto, Nto 1, Nto2, Nto3 (chap. p.126-133)"]
