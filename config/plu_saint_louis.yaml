# =============================================================================
# PLU SAINT-LOUIS (97414) — règles chiffrées par zone constructible (U / AU)
# =============================================================================
# Source unique : règlement écrit du PLU de Saint-Louis (cache session nuit B).
#   document : 97414_reglement.pdf (« PLU de Saint-Louis — Règlement 2025 », 139 p.)
#   PLU approuvé le 11 mars 2014 ; modifications approuvées le 27 février 2020 et
#   le 9 juillet 2025 (page de garde, PDF p.1). Document GPU : 97414_plu_20251218.
#
# FIABILITÉ (n'inventer AUCUNE valeur) :
#   - page_pdf = page_imprimee + 2 (vérifié : sommaire imprimé 1 = PDF 3, ZONE UA
#     imprimée 10 = PDF 12, ZONE AUindicée imprimée 105 = PDF 107). Les _src citent
#     la page IMPRIMÉE.
#   - null         = règle explicitement absente/« non réglementée » dans le texte (sourcé).
#   - ANCIEN FORMAT à articles préfixés (UA 1..UA 15) : 6=recul voirie, 7=recul limites,
#     9=emprise, 10=hauteur, 12=stationnement, 13=espaces perméables.
#   - COS (invariant 5, ALUR 2014) : le document (modifié 09/07/2025, post-ALUR) contient
#     encore un article 14 « COEFFICIENT D'OCCUPATION DU SOL » dans CHAQUE zone :
#     « Il n'est pas fixé de coefficient d'occupation du sol » (UA p.23, UB p.37, UC p.52,
#     UD p.66, UE p.78, US p.90, UZ p.103), « Sans objet » (A p.124, N p.133), renvoi
#     (AUindicée p.109) — et Art. AUst 14, p.114 : « Le coefficient d'occupation des sols
#     est nul à l'exception des travaux d'aménagement et d'extension mineure … ».
#     CONSIGNÉ, JAMAIS APPLIQUÉ : aucun COS n'est gravé ; le gel AUst est porté par
#     Art. AUst 1.2/2.2 (indépendant du COS).
#   - ESPACES VERTS : Art. 13.1 impose un % « espace vert et perméable » SANS sous-minimum
#     de pleine terre => % perméable GRAVÉ dans pleine_terre_pct, libellé verbatim en _src
#     (doctrine harmonisée A/B/C 28/07/2026 — remplace le « null partout » de la nuit).
#   - STATIONNEMENT habitat (tableau 12.2, identique UA/UB/UC/UD) : LLS 1 place/logt,
#     autres logements 2 places/logt, opérations >10 logts +0,5 place publique/logt =>
#     gravé « 2 places / logement » (tranche la plus exigeante hors LLS).
#   - RÈGLES À TIROIRS : tranche LA PLUS CONSERVATRICE gravée + note (UC/UC1 : bonus de
#     hauteur limité à 40 % des constructions pour terrains >= 4 000 m² NON gravé ;
#     UZ : hauteurs par affectation du schéma annexe 9/12/17 m => 9 m gravé).
#   - Reculs en « moitié de la hauteur avec minimum » (UE, US, UC1) : valeur gravée =
#     H/2 À LA HAUTEUR MAXIMALE de la zone (jamais inférieure au plancher du texte), note.
#   - ZONES AU (Titre III) : chapitre « ZONE AUindicée » (p.105-109) : « il convient de se
#     reporter en fonction de l'indice de la zone AU considérée au règlement des zones
#     urbaines correspondantes » (p.105, répété à chaque article). Le renvoi moteur ne
#     couvre pas les codes à préfixe chiffré (1AUx) => entrées EXPLICITES, une par libellé
#     du manifeste (y compris suffixes « oapN » : mêmes règles que la zone d'indice + OAP).
#     Les libellés 1AUb1/1AUb2 (et 2AUb1/2AUb2) n'apparaissent nulle part dans le
#     règlement et AUCUN secteur UB1/UB2 n'existe (caractère de zone UB p.24 ; liste des
#     zones urbaines p.5-6) : l'indice « b » ne peut renvoyer qu'à UB, la sous-numérotation
#     est cartographique et sans règle propre dans le règlement => règles UB, note.
#     1AUc1/1AUc2/1AUd1 : l'indice correspond exactement aux secteurs UC1/UC2/UD1 définis
#     au règlement => règles du secteur homonyme, note.
#   - 2AUindicée : gel conditionnel (Art. AUindicée 2.2.3, p.106 : ouverture qu'une fois
#     l'aménagement de l'ensemble des 1AUindicée et 1AUst entrepris) => zones_au_st.
#   - AUst (p.110-114) : « st » N'EST PAS un simple secteur de transition nommé — le
#     caractère de zone dit : réseaux/accès insuffisants, « l'ouverture à l'urbanisation
#     de la zone est conditionnée à une modification du PLU » (p.110) ; Art. AUst 1.2 :
#     tout est interdit sauf Art. AUst 2.2 (réseaux, ouvrages techniques, reconstruction
#     après sinistre, extension <= 20 m² SDP) => gel, TOUTES graphies en liste explicite
#     (le regex moteur AU\w*st ne matche ni 1AUst/2AUst ni 1AUste/2AUste).
# =============================================================================

# DOCTRINE HARMONISÉE A/B/C (28/07/2026, arbitrage Vic) : le % « espace vert et
# perméable » est GRAVÉ dans pleine_terre_pct, libellé verbatim conservé en _src —
# ce n'est PAS un minimum de pleine terre stricto sensu. Retraits en H/2 :
# valeur gravée = max(H/2 à la hauteur maximale gravée, plancher du texte).

