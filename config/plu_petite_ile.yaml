# DEUX groupes portés par zones_au_st (constructible_neuf=False, capacité logement zéro) :
# 1) 2AU / 2AUe — GEL EXPLICITE : « Dans cette attente les possibilités de construire
#    sont nulles » (chapeau ZONE 2AU, p.140) ; ouverture conditionnée à l'urbanisation
#    (au moins engagée) de l'ensemble des zones 1AU et 1AUa ET à la création d'un système
#    d'assainissement collectif sur la zone préférentielle d'urbanisation de la Ville
#    Relais du SAR (sauf 2AU du centre bourg de Piton des Goyaves), après modification ou
#    révision du PLU. Art. 2 AU.1 (p.140) : TOUT est interdit (habitat, commerce, bureaux,
#    équipements publics compris) ; Art. 2 AU.2 à 2AU.13 : « Sans objet ».
# 2) UF / UFcim / AUF — REVENUES en st-liste (session B, 28/07, sur MESURE — révision
#    permise par le commit de reclassement). Le reclassement en zones calibrées
#    habitat-interdit reposait sur une lecture erronée du code : plu_rules.py:210 ne
#    concerne que les zones ABSENTES du YAML, mais le gate réel est plu_rules.py:148-152
#    (resolve_zone, mode progressif) — une entrée PRÉSENTE sans hauteur exploitable
#    (a_verifier n'est pas exploitable) est substituée par l'estimation générique AVANT
#    que engine.py:157 ne teste habitat. Mesure sur l'état reclassé : UF/UFcim/AUF →
#    calibree=False, habitat=None, he=9.0, constructible_neuf=True — capacité logement
#    FICTIVE dans un cimetière. Cf. exception à la règle 10 du §4 du mandat-cadre
#    (exigence v2 : type gel distinct + habitat prioritaire sur le gate hauteur).
#    Les entrées de la contre-extraction C (citations vérifiées) sont CONSERVÉES sous
#    la clé documentaire inerte zones_habitat_interdit_sans_hauteur ci-dessous.
zones_au_st:
  liste: ["2AU", "2AUe", "UF", "UFcim", "AUF"]
  portee: "Capacité logement nulle. 2AU/2AUe : zones gelées (« les possibilités de construire sont nulles », p.140), ouverture après urbanisation de l'ensemble des 1AU/1AUa + assainissement collectif Ville Relais SAR + modification/révision du PLU."
  source: "Chapeau ZONE 2AU + Art. 2 AU.1, p.140."

# Zones NON constructibles (urbanisation) — hors périmètre faisabilité U/AU.
# DÉCISION (principe du mandat-cadre §9) : constructibilité d'EXCEPTION uniquement —
# A (chap. p.143-152) : constructions nouvelles d'habitation interdites (A.1 1°, p.143)
#   sauf nécessité agricole regroupée au siège d'exploitation (A.2 1°, p.144) ; extensions
#   d'habitations existantes <= 80 m² SDP dans la limite de 250 m² au total, annexes
#   <= 30 m² (A.2 5°/6°, p.145 ; emprises identiques A.9, p.149) ; hauteur 4 m égout /
#   7 m faîtage (A.10, p.149). Ac : uniquement établissements de formation/insertion
#   agricole + UN logement de gardiennage (A.2 « Pour Ac », p.145). Acu (coupure
#   d'urbanisation), Ad (SMVM Grand Anse), Ae (couloir haute tension) : « toute
#   construction est interdite » (caractère de zone p.19 ; A.2, p.144-145).
# N (chap. p.153-162) : habitat interdit (N.1 1°, p.153) ; extensions d'habitations
#   existantes <= 80 m² SDP dans la limite de 200 m² au total, annexes <= 30 m²
#   (N.2 4°/5°, p.154) ; hauteur 6 m au faîtage (N.10, p.159). Na : amélioration/
#   réfection/reconstruction de l'existant dans la limite du bâti existant (N.2, p.155).
#   Nb : aménagement/extension de l'existant <= 500 m² SDP au total (N.2, p.155).
#   Nce/Ncu/Ne/Np : « toute construction est interdite » (N.2 2°/4°/5°/6°, p.154).
#   Ntl/Ntla : STECAL touristiques — entretien/gardiennage, aménagements légers,
#   extension de bâtiments publics <= 300 m² SDP ; Ntla en plus : hébergement touristique
#   type aire naturelle de camping / gîte <= 150 m² SDP par unité foncière, hauteur d'un
#   gîte 4 m (N.2 p.155 ; N.9/N.10 p.159). Les graver ferait calculer une capacité
#   logement fictive => repli générique (non constructibles), verdict produit correct.
zones_non_constructibles: ["A, Ac, Acu, Ad, Ae (chap. p.143-152)",
                           "N, Na, Nb, Nce, Ncu, Ne, Np, Ntl, Ntla (chap. p.153-162)"]

