# PLU PETITE-ÎLE (97405) — règles chiffrées par zone constructible (U / AU)
# =============================================================================
# Source unique : règlement écrit du PLU de Petite-Île (cache session nuit B).
#   document : 97405_reglement.pdf (« 4 — Règlement », 169 p.)
#   PLU approuvé le 23/02/2017, modifié le 01/09/2017 ; « PLU approuvé le 09 Juin 2023
#   après modification simplifiée, révision avec examen conjoint et mise en compatibilité
#   par déclaration de projet » (page de garde, PDF p.1). Document GPU : 97405_PLU_20230609.
#
# FIABILITÉ (n'inventer AUCUNE valeur) :
#   - page_pdf = page_imprimee (OFFSET 0, vérifié : sommaire imprimé 2 = PDF 2 ; ZONE UB
#     imprimée 23 = PDF 23 ; ZONE UE imprimée 52 = PDF 52 ; ZONE 1AU imprimée 88 = PDF 88 ;
#     ZONE AUS imprimée 130 = PDF 130). ⚠ Le SOMMAIRE (p.2) est PÉRIMÉ pour la fin du
#     document (AUS→122 exact mais 2AU « 117 », TITRE 4 « 119 », N « 130 » faux) : les
#     positions réelles sont 2AU p.140, A p.143-152, N p.153-162, annexes p.163+.
#   - null         = règle explicitement « Non réglementé » dans le texte (sourcé).
#   - ANCIEN FORMAT à articles préfixés (UB.1..UB.13) : 6=recul voirie, 7=recul limites,
#     9=emprise, 10=hauteur, 12=stationnement, 13=espaces libres. Aucun article 14/COS :
#     ZÉRO occurrence de « COS »/« coefficient d'occupation » dans le document (doc 2023,
#     piège ALUR non rencontré).
#   - PLEINE TERRE : Art. <Z>.13 impose partout un % « espaces de pleine terre » de
#     l'unité foncière => gravé tel quel (c'est bien un % PLEINE TERRE, pas un % perméable).
#   - HAUTEURS : « X mètres à l'égout du toit et Y mètres au faîtage » => he_m X, hf_m Y.
#     Tolérance pente > 10 % (+1,50 m à l'égout) et exemptions bâtiments publics/techniques
#     NON gravées (notes). UZ.10 ne donne qu'une « hauteur totale » de 12 m => hf_m 12,
#     he_m null + note. UE.10 ne donne que l'égout (10 m) => hf null.
#   - Sous-secteurs « e » (couloir réservé au doublement de la ligne haute tension
#     Langevin — Bras de la Plaine) : UCe/UDe = hauteur propre 6 m au faîtage, autres
#     règles de la zone support ; 2AUe = gelée avec la zone 2AU.
#   - GRAPHIES manifeste ≠ casse du texte : « 1AUz » (manifeste) = chapitre « ZONE 1AUZ »
#     (p.99) ; « AUs » (manifeste) = chapitre « ZONE AUS » (p.122) — une seule zone de
#     chaque famille, équivalence confirmée par le caractère de zone. Toutes les autres
#     graphies apparaissent telles quelles dans le texte.
#   - O12 (candidates habitat-interdit) CONFIRMÉES au texte : UE, UEa, AUE, UT, AUT
#     (+ UF/AUF/UFcim/AUS hors liste O12). INFIRMÉES : UZ (ZAC Cambrai « à usage
#     d'habitat et d'équipements », UZ.1 p.81 n'interdit pas l'habitation) et 1AUz
#     (ZAC habitat, 1AUZ.1 p.99 n'interdit pas l'habitation).
#   - UF / UFcim / AUF (équipements publics ; habitat interdit hors logements de
#     fonction, Art. UF.1/UF.2 p.66-67 et AUF.1/AUF.2 p.116 ; UFcim : uniquement
#     funéraire, UF.2 p.67) : les articles UF.10 (p.70) et AUF.10 (p.120) n'énoncent
#     AUCUN plafond chiffré (texte : « La hauteur autorisée des constructions sera
#     réglementée en fonction du terrain naturel avant travaux (voir schéma) » puis rien).
#     Sans hauteur exploitable, une entrée `zones:` retomberait en ESTIMATION générique
#     (he 9 m, habitat non contraint) => capacité logement FICTIVE dans des zones
#     d'équipements. DÉCISION (même friction F2 que le pilote/Tampon) : portées par
#     zones_au_st (constructible_neuf=False — étiquette moteur « secteur de transition »
#     inexacte, capacité logement ZÉRO exacte).
#   - 1AU.10 (p.94) contient un alinéa « Pour 1AUe : 6 m au faîtage » : AUCUN polygone
#     1AUe au manifeste (sous-secteur vestigial) — non gravé.
# =============================================================================

