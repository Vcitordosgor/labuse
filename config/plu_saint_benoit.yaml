# =============================================================================
# PLU SAINT-BENOÎT (97410) — règles chiffrées par zone constructible (U / AU)
# =============================================================================
# Source unique : règlement écrit du PLU de Saint-Benoît (cache session nuit B).
#   document : 97410_reglement.pdf (« PIECE 3.1 - REGLEMENT ECRIT », 162 p. PDF)
#   PLU approuvé le 06/02/2020 (idurba GPU 97410_PLU_20200206 ; la page de garde
#   PDF p.1 porte « APPROUVE LE : ………… » non rempli — millésime tenu de l'idurba).
#
# PAGINATION — DOUBLE NUMÉROTATION => TOUTES les citations en pages PDF :
#   Le PDF concatène DEUX blocs qui portent chacun leur propre numérotation imprimée :
#     - PDF 1-48   : le règlement écrit proprement dit (chapitres ZONES U p.PDF 3,
#       AU p.19, A p.32, N p.40), numéroté « Page N sur 49 » (PDF n = imprimée n) ;
#     - PDF 49-162 : le cahier d'annexes du règlement (fiches AU, fiches STECAL
#       Ns/Nta/Ntb, patrimoine, ER…), renuméroté « Page 1 sur 114 » à « Page 114
#       sur 114 » (PDF n = imprimée n - 48).
#   Deux référentiels imprimés dans un même fichier = ambiguïté ; décision imposée
#   par le mandat : pagination_citee: "pdf" — chaque « p.N » des _src est la page
#   PDF du fichier gravé, dans les DEUX blocs. Ne pas réinterpréter en pages imprimées.
#
# FIABILITÉ (n'inventer AUCUNE valeur) :
#   - null         = règle explicitement non réglementée/absente dans le texte (sourcé).
#   - FORMAT MODERNE MUTUALISÉ PAR FAMILLE : un chapitre unique par famille (articles
#     « Article U – n », « Article AU – n », « Article A – n », « Article N – n »)
#     s'applique à TOUTES les zones de la famille ; les différenciations sont des
#     alinéas « En zone(s) X ». Les _src citent « Art. U 4 » pour « Article U – 4 »
#     (tiret cadratin du titre non repris). Pas d'articles 1-14 par zone, zéro renvoi.
#   - HAUTEURS U/AU PAR SECTEURS GRAPHIQUES (règle à tiroirs) : Art. U 4 (p.9) :
#     « selon les secteurs repérés sur le document graphique » 15/13/10/7/4 m à
#     l'égout ou l'acrotère ; Art. AU 4 (p.23) : 15/13/10/7 m. Les secteurs de
#     hauteur ne sont PAS les zones du manifeste => tranche LA PLUS CONSERVATRICE
#     gravée (U : 4 m égout + faîtage imposé 4+3,50 = 7,50 m dans les zones à 4 m,
#     Art. U 4 I 2° ; AU : 7 m égout, faîtage non réglementé au chapitre AU) + note.
#   - ESPACES LIBRES : Art. U 9 / AU 9 : 20 % de la superficie du terrain en espaces
#     libres traités en surface perméable, SANS sous-minimum de pleine terre
#     => pleine_terre_pct: null partout (le moteur ne consomme que le % PLEINE TERRE).
#   - STATIONNEMENT habitat (tableaux U 12 / AU 12, identiques) : logements
#     individuels / opérations <= 5 logements : 1 place/logement ; opérations > 5
#     logements : 1 place/logement + 1 place visiteur par tranche de 5 lots ou
#     logements ; logements aidés 1 place pour 2 logements => gravé « 1 place /
#     logement » + note.
#   - ZONES AU : 18 zones numérotées, « chacune l'objet d'une fiche » (Art. AU 1,
#     p.19 : 4 AUa + 12 AUb + 1 AUe + 1 AUp — comptes conformes au manifeste).
#     Le n° du libellé GPU = le n° de la fiche annexe (confirmations : « zone AU
#     n°1 (zone d'activités économiques de Beauvallon) » p.19 = fiche N°01 ZONE
#     AUp Beauvallon = libellé AUp1 ; AUe unique de Beaulieu = fiche N°03 = AUe3 ;
#     les 4 AUa de l'Art. AU 1 (Le Conardel, sentier des Lataniers, chemin des
#     Jonquilles, chemin Impérial) = fiches N°05/08/09/18 = AUa5/AUa8/AUa9/AUa18 ;
#     fiches N°20 à 59 = Ns20…Ntb59, Art. N 1, p.40). Les fiches (annexe 2,
#     p.54-72) complètent/se substituent au chapitre AU : essentiellement des
#     conditions d'opération d'ensemble (« les constructions ne seront acceptées
#     que dans le cadre d'une opération d'ensemble réalisant les équipements
#     internes de la zone, ou après que les équipements internes auront été
#     réalisés ») => régime 1AU classique (précédent Tampon), PAS un gel : zones
#     calibrées avec note. Seule règle chiffrée de fiche consommable : AUb2,
#     recul 10 m (fiche N°02, p.55). AUCUN gel AU (pas de 2AU ni AUst au
#     manifeste) => pas de bloc zones_au_st.
#   - COS (invariant 5, ALUR 2014) : ZÉRO occurrence de « coefficient d'occupation »
#     dans le document (vérifié sur texte brut et à lettres doublées repliées) —
#     document 2020 propre, rien à consigner d'autre, rien n'est appliqué.
#   - STECAL Ns20-46 / Nta47-54 / Ntb55-57-59 (« considérées comme des STECAL »,
#     annexe 3, p.73) : NON CALIBRÉS — voir zones_non_calibrees (caducité loi
#     ELAN au 31/12/2021, passages cités).
# =============================================================================

