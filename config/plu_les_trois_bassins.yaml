# GELS — capacité zéro exacte (étiquette moteur « secteur de transition » inexacte,
# friction F2 connue depuis le pilote) :
#   - 2AUa / 2AUb / 2AUc : « Pour les zones 2AUindicée, leur ouverture à l'urbanisation
#     ne pourra intervenir qu'une fois l'aménagement de l'ensemble des zones 1AUindicée
#     entrepris » (Art. AUINDICEE 2.2, p.65 ; idem préambule p.64 : « une fois
#     l'aménagement de l'ensemble des zones 1AUindicée du pôle urbain de référence
#     entrepris », et dispositions générales p.6).
#   - AUs / AUse : « l'ouverture à l'urbanisation de la zone est conditionnée à une
#     modification du PLU » (caractère de zone, p.70 ; idem dispositions générales
#     p.6) ; Art. AUs 1.2 (p.71) : « Toutes les occupations et utilisations du sol sont
#     interdites à l'exception de celles admises à l'article AUs 2.2 » ; Art. AUs 2.2
#     (p.71) : réseaux/voirie/stationnement/énergie, ouvrages techniques de service
#     public, reconstruction après sinistre — articles 3 à 14 « Sans objet »
#     (p.71-73). AUse (secteur réservé au développement de l'activité artisanale,
#     p.70) : AUCUNE disposition particulière dans le chapitre => même gel que AUs
#     (règle générale des secteurs, Art. 3, p.5). Candidate O12 implicite : le régime
#     réel vérifié est un GEL total, la vocation artisanale n'ouvre aucun droit avant
#     modification du PLU.
zones_au_st:
  liste: ["2AUa", "2AUb", "2AUc", "AUs", "AUse"]
  portee: "Construction neuve non autorisée en l'état : 2AUa/2AUb/2AUc = extension urbaine SAR, ouverture conditionnée à l'engagement de l'aménagement de l'ensemble des zones 1AUindicée (Art. AUINDICEE 2.2, p.65) ; AUs et son secteur AUse = urbanisation future gelée, ouverture conditionnée à une MODIFICATION du PLU (réseaux et accès insuffisants, études préalables requises — caractère de zone p.70), seuls admis réseaux/ouvrages techniques/reconstruction après sinistre (Art. AUs 1.2 et 2.2, p.71). Le manifeste ne compte AUCUN polygone 2AUe ni 2AUt."
  source: "Art. AUINDICEE 2.2, p.65 ; ZONE AUs : caractère de zone p.70, Art. AUs 1.2 et Art. AUs 2.2, p.71."

# Zone non calibrée — contradiction de destinations, on ne devine pas (invariant 2).
zones_non_calibrees:
  1AUe:
    motif: "Contradiction sur la destination habitat. Lecture 1 (chapitre AU autoportant) : l'Art. AUINDICEE 1.2 (p.65) n'interdit pour « les autres zones » (dont AUe) que industrie/entrepôt/agricole/camping/dépôts/carrières/sports motorisés/affouillements, et l'Art. AUINDICEE 2.2 (p.65) admet « toutes les occupations et utilisations du sol non citées à l'article 1.2 » => l'habitat serait ADMIS (et l'industrie INTERDITE, dans une zone pourtant indexée sur la zone d'activité Ue). Lecture 2 (renvoi d'indice, p.64 : « se reporter en fonction de l'indice […] au règlement des zones urbaines correspondantes ») : l'Art. Ue 1.2 (al. 1), p.53, INTERDIT l'habitat. Les deux lectures divergent sur une destination ; la clause densité qui exclut AUe (Art. AUINDICEE 2.2, p.66 : « à l'exception de celles des zones AUe et AUt ») et le renvoi explicite AUe -> Ue de l'Art. 7 (p.67) suggèrent l'intention « activité » sans l'écrire à l'Art. 1/2. O12 signalait 1AUe candidate habitat-interdit : NON confirmée à l'Art. 1/2 comme l'exige le mandat => non calibrée, arbitrage Vic. 1 polygone, 1,9 ha (0,04 % du manifeste), repli générique."
    source: "Art. AUINDICEE 1.2 et 2.2, p.65 ; Art. AUINDICEE 2.2 (clause densité), p.66 ; Art. AUINDICEE 7, p.67 ; Art. Ue 1.2, p.53."

# Zones NON constructibles (urbanisation) — hors périmètre faisabilité U/AU.
# DÉCISION (principe du mandat-cadre, modèle Tampon) : constructibilité d'EXCEPTION
# uniquement — les graver ferait calculer une capacité logement fictive => repli
# générique (non constructibles), verdict produit correct.
#   - A (chap. p.74-83) : Art. A1.2 (p.74) : « sont interdits les nouvelles
#     constructions à destination d'habitation, les constructions, ouvrages et travaux
#     non nécessaires à une exploitation agricole » sauf A2.2 (p.75) — bâtiments
#     techniques agricoles, logement d'exploitant 120 m² SDP max (1 par exploitation),
#     agritourisme/vente 30 m², extension de l'existant non agricole 20 m² ; hauteur
#     5,50/8,50 m (Art. A 10.2, p.79).
#   - Acu (coupure d'urbanisation SAR 2011, caractère p.74 et Art. 3 p.6) : régime
#     encore restreint — réhabilitation/mise aux normes de bâtiments agricoles
#     existants et réseaux d'eau seulement (Art. A2.2 (al. 9), p.75 ; tous les alinéas
#     constructifs commencent par « A l'exception du secteur Acu »).
#   - Arh (STECAL L.151-13, caractère p.74) : habitations nouvelles admises dans la
#     limite TOTALE de 120 m² de SDP (Art. A2.2 (al. 8), p.75) — capacité d'exception
#     plafonnée hors schéma v1, repli générique conservateur.
#   - N (chap. p.84-94) : Art. N1.2 (p.84) tout interdit sauf N2.2 (p.85-86) —
#     aménagements légers sans hébergement, extension limitée de l'existant 120 m² SDP
#     cumulés (hors Nco/Nr/Nli/Nu), agricole (hors Nco/Nr/Nli/Nu) ; hauteur zone N
#     4 m égout / 7 m faîtage (Art. N 10.2, p.91).
#   - Nr (réservoirs de biodiversité), Nco (corridors écologiques), Nli (espaces
#     remarquables du littoral, installations liées à l'usage de la mer seulement,
#     Art. N2.2 (al. 14), p.86), Nu (parcs et espaces verts urbains) : exclus de
#     l'essentiel des occupations admises (Art. N2.2 (al. 5 à 11), p.85-86).
#   - Nto et polygones numérotés Nto1 à Nto6 du manifeste (le règlement ne définit que
#     le secteur « Nto », p.84) : STECAL tourisme/loisirs dont la SDP totale ET la
#     hauteur sont fixées dans les OAP, hors règlement (Art. N2.2 (al. 12), p.86 ;
#     Art. N 10.2, p.91 : « Dans les secteurs Nto, la hauteur maximale des
#     constructions est fixée dans les Orientations d'Aménagement et de
#     Programmation ») — aucune règle chiffrée gravable sans deviner.
zones_non_constructibles: ["A, Acu, Arh (chap. p.74-83)",
                           "N, Nr, Nco, Nli, Nu, Nto, Nto1, Nto2, Nto3, Nto4, Nto5, Nto6 (chap. p.84-94)"]
