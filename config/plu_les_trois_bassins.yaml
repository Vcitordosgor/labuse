regles_transverses:
  stationnement: "Norme identique dans Ua/Ub/Uc (Art. <Z>12.2) : habitation 1,5 place/logement (arrondi à l'entier inférieur) ; collectif : 1,25 place/logement OU 1 place/35 m² SDP, norme la plus productive retenue, PLAFOND 2 places/logement ; +0,5 place sur voie par parcelle pour les lotissements > 5 lots ; logement locatif aidé : 1 place max (R.111-6). Deux-roues obligatoire (Art. <Z>12.4)."
  limites_separatives: "Latérales : implantation sur une limite autorisée (patio 3 m si habitation > 10 m de profondeur en limite ; 5 m si autre destination > 20 m) OU retrait 3 m ; fond de propriété : retrait 3 m obligatoire (Art. <Z>7.2-7.3, zones Ua/Ub/Uc et chapitre AUindicée). Ue : une seule limite possible, retrait D=H/2 >= 4 m, fond 4 m."
  reculs_particuliers: "RN1a : retrait obligatoire 17 m de l'axe ; ravines du domaine public fluvial : 10 m du bord (5 m possibles pour les autres ravines à fort dénivelé) — rappelé à chaque Art. <Z>6.2 (Ua p.14, Ub p.29, Uc p.43)."
  densite_minimale: "Ua et Ub : densité MINIMALE 30 logts/ha (Art. Ua 2.2, p.11 ; Art. Ub 2.2, p.26-27). Zones AU hors OAP : 35 logts/ha en AUa, 30 en AUb, 20 en AUc (Art. AUINDICEE 2.2, p.66 ; AUe et AUt exclues). Densité appréciée à l'échelle de la zone."
  mixite: "Projet > 1 000 m² SDP habitation : 40 % minimum de logement aidé dont 25 % de locatif social ; opérations d'aménagement > 1 200 m² SDP : 40 % global (Art. Ua 2.2 p.11, Ub 2.2 p.27, AUINDICEE 2.2 p.66 — Uc : clause logement social seule, p.40)."
  distance_entre_batiments: "Deux constructions principales non contiguës : D=H/2 >= 4 m (Art. Ua 8.2, p.16 ; idem Ub/Uc) ; Ue : 6 m (Art. Ue 8.2, p.58)."

