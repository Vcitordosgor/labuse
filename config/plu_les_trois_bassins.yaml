#   document : 97423_reglement.pdf (119 p.) — PLU prescrit le 08/12/2011, arrêté le
#   30/06/2016, approuvé le 21/02/2017, modifié le 02/06/2022 (page de garde, p.1).
#
# COS — INVARIANT 5 DU MANDAT (document post-ALUR approuvé le 21/02/2017, modifié le
# 02/06/2022 — le COS est aboli depuis la loi ALUR 2014 ; consigné, JAMAIS appliqué).
# 12 occurrences détectées (8 intitulés d'article 14 + 4 phrases), AUCUNE valeur fixée :
#   - Art. Ua 14, p.24  : « Il n'est pas fixé de coefficient d'occupation du sol. »
#   - Art. Ub 14, p.38  : « Il n'est pas fixé de coefficient d'occupation du sol. »
#   - Art. Uc 14, p.52  : « Il n'est pas fixé de coefficient d'occupation du sol. »
#   - Art. Ue 14, p.62  : « Il n'est pas fixé de coefficient d'occupation du sol. »
#   - Art. AUINDICEE 14, p.70 : « Pour la zone AUt, se reporter au règlement de la zone
#     Ub. Pour les autres zones, se reporter au règlement de la zone U indiquée en
#     indice » (renvoi vers des zones U où le COS n'est pas fixé).
#   - Art. AUs 14, p.73 : « Sans objet. »
#   - Art. A14, p.82    : « Sans objet. »
#   - Art. N14, p.94    : « Sans objet. »
# Aucune valeur de COS dans le document => rien à appliquer, tout est consigné ci-dessus.
# (Le comptage brut/dedouble 12/0 d'extract.py vient du repli des lettres doublées qui
# casse le mot « occupation » — pas d'occurrence fantôme.)
#
# FIABILITÉ (n'inventer AUCUNE valeur) :
#   - page_pdf = page_imprimee + 0 (vote extract.py 0 avec 4 voix, CONFIRMÉ : sommaire
#     « 2 » en en-tête = PDF 2 ; « ZONE Ua » sommaire p.10 = PDF 10 ; « ZONE Ub » p.25 =
#     PDF 25 ; « ZONE N » p.84 = PDF 84 — numéros imprimés en EN-TÊTE de page, piège du
#     lot vérifié). Les _src citent la page IMPRIMÉE (= page PDF ici).
#   - null = « Non réglementé » / « Sans objet » explicite (sourcé), ou absence de
#     sous-minimum de pleine terre (voir ci-dessous).
#   - ANCIEN FORMAT à articles préfixés (Ua1..Ua14) : 6=recul voirie, 7=recul limites,
#     9=emprise, 10=hauteur, 12=stationnement, 13=espaces libres.
#   - PLEINE TERRE : chaque Art. <Z>13.1 impose un % « espace vert et perméable »
#     (Ua 20 %, Ub 30 %, Uc 40 %, Ue 25 %) SANS AUCUN sous-minimum de pleine terre =>
#     pleine_terre_pct null PARTOUT, % perméable en note (précédents Saint-Louis,
#     Le Port, Les Avirons, La Plaine-des-Palmistes, Bras-Panon).
#   - RECUL VOIRIE : retrait 4 m dans toutes les zones U (Art. <Z>6.2) ; en Ua,
#     l'alignement est ouvert aux seuls bureaux/commerces/artisanat (et RDC commerce) —
#     le logement reste à 4 m => gravé 4, faculté en note. RN1a : 17 m de l'axe ;
#     ravines du domaine public fluvial : 10 m du bord (chaque Art. <Z>6.2).
#   - RECUL LIMITES : implantation en limite latérale autorisée (1 limite ; patio 3 m si
#     habitation > 10 m de profondeur en limite) OU retrait 3 m ; fond de propriété :
#     retrait 3 m obligatoire => gravé 3 (valeur du retrait), faculté en note
#     (convention Tampon). Ue : retrait D=H/2 sans être inférieur à 4 m, fond 4 m => 4.
#   - STATIONNEMENT : norme identique dans Ua/Ub/Uc (Art. <Z>12.2) : 1,5 place /
#     logement ; collectif : 1,25 place/logement OU 1 place/35 m² SDP (norme la plus
#     productive, plafond 2 places/logement) => gravé « 1,5 place / logement ».
#   - RÈGLE GÉNÉRALE DES SECTEURS (Art. 3 des dispositions générales, p.5) : « Dès lors
#     qu'une zone comprend un ou plusieurs secteurs, la règle générale de la zone
#     s'applique à chacun d'eux sauf lorsqu'une disposition particulière est prévue pour
#     l'un de ces secteurs » => Uaa (dispositions propres : Art. Ua 7.2 limites et
#     Art. Ua 10.2 hauteur) hérite du reste des règles Ua — héritage ÉCRIT, pas inféré.
#   - ZONES AU (chapitre unique « ZONE AUindicée », p.64-70) : renvoi explicite « il
#     convient de se reporter en fonction de l'indice de la zone AU considérée au
#     règlement des zones urbaines correspondantes, sauf spécification contraire »
#     (p.64), répété article par article (Art. 3 à 6 et 8 à 14 : « Pour les autres
#     zones, se reporter au règlement de la zone U indiquée en indice ») ; à chaque
#     article : « Pour la zone AUt, se reporter au règlement de la zone Ub ». Art. 7
#     (limites séparatives) : règles PROPRES au chapitre (retrait 3 m) + « Pour la zone
#     AUe, se reporter au règlement de la zone Ue ». Art. 10 : hauteur PROPRE pour AUt
#     (8/10 m) et renvoi « Pour la zone Aua, se reporter au règlement de la zone Uaa »
#     (modification du 02/06/2022 ; « Aua » = zone AUa, seule lecture possible dans le
#     chapitre AU — la hauteur de 1AUa suit donc Uaa 12/16, pas Ua 10/14).
#     Le renvoi mécanique du moteur ne couvre pas les codes 1AUx/2AUx (préfixe
#     chiffré) => entrées EXPLICITES.
#   - GRAPHIES AU : le corps du texte écrit les indices SANS préfixe chiffré (« En zone
#     AUt », « Pour la zone AUe », « en zone AUa/AUb/AUc », Art. AUINDICEE 1.2, 2.2 et
#     7, p.64-67) ; le préambule définit les « deux types de zones » 1AUindicée /
#     2AUindicée (p.64, idem dispositions générales p.6). L'équivalence
#     1AUx/2AUx <-> AUx est donc écrite (type 1/2 + indice), pas inférée. Le manifeste
#     ne compte AUCUN polygone 2AUe ni 2AUt.
#   - 24 RENVOIS du pré-vol : tous dans le chapitre AUindicée (préambule p.64 + Art. 3 à
#     6 et 8 à 14 « zone U indiquée en indice » x2 lignes chacun + AUt -> Ub à chaque
#     article + AUe -> Ue à l'Art. 7 + AUa -> Uaa à l'Art. 10) — chaîne résolue
#     explicitement dans chaque entrée 1AU* ci-dessous. Aucune chaîne non résolue.
#   - 1AUe NON CALIBRÉE (contradiction de destinations, décision motivée — voir
#     zones_non_calibrees).
# =============================================================================

# DOCTRINE HARMONISÉE A/B/C (28/07/2026, arbitrage Vic) : le % « espace vert et
# perméable » est GRAVÉ dans pleine_terre_pct, libellé verbatim conservé en _src —
# ce n'est PAS un minimum de pleine terre stricto sensu. Retraits en H/2 :
# valeur gravée = max(H/2 à la hauteur maximale gravée, plancher du texte).

