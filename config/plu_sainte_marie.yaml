# =============================================================================
# Source unique : règlement écrit du PLU de Sainte-Marie (archive GPU 97418_PLU_20251126).
#   document : 97418_reglement.pdf (cache pré-vol nuit), 66 p. PLU prescrit 03/06/2021,
#   arrêté 05/03/2025, APPROUVÉ 26/11/2025. Concordance manifeste/GPU re-vérifiée au pré-vol.
#
# FIABILITÉ :
#   - page_pdf = page_imprimee + 1 (résolu au pré-vol via la table des matières :
#     « Champ d'application » p.3 = PDF 4 — l'offset « ND » du pré-vol est TRANCHÉ).
#   - FORMAT MODERNE 2025 « MUTUALISÉ » (3e style constaté sur l'île) : articles partagés
#     PAR GROUPE de zones (III. U « résidentielles », IV. U « d'activités », V. AU) avec
#     déclinaisons par zone À L'INTÉRIEUR des articles (U4=voies, U5=limites, U7=emprise,
#     U8=hauteur, U12=espaces perméables, U13=stationnement).
#   - hauteurs : le règlement donne égout + faîtage + acrotère toiture-terrasse => he_m =
#     égout, hf_m = faîtage (acrotère en note). Zones d'activités : FAÎTAGE SEUL => he null.
#   - PLEINE TERRE = « % de la surface en espace perméable » (Art. U12).
#   - RETRAIT LIMITES : règle H/2 avec minimum (résidentielles 3 m, activités 4 m) => le
#     GRAVÉ = max(H/2 à la hauteur max de la zone, minimum) — harmonisation doctrine b (28/07/2026).
#   - AU : renvoi à la zone U d'indice (1AUb→UB, 1AUc→UC, 1AUep→UEp) ; 1AU ouvertes dès
#     l'approbation ; 2AU « ouvertes à l'urbanisation à partir de 2031 » => GEL (zones_au_st).
#   - Aucun COS (pré-vol : 0 occurrence).
# =============================================================================

