# 2AU : « ouvertes à l'urbanisation à partir de 2031, lorsque les voies et réseaux suffisants
# seront présents en périphérie de la zone » (V., p.40) => construction neuve NON autorisée
# aujourd'hui — gel via zones_au_st (friction F2 : étiquette moteur approximative, capacité
# zéro exacte).
zones_au_st:
  liste: ["2AUa", "2AUb", "2AUc"]
  portee: "Zones 2AU ouvertes à l'urbanisation à partir de 2031 seulement (et sous condition de voies/réseaux suffisants en périphérie) — construction neuve non autorisée en l'état."
  source: "V. Dispositions applicables aux zones AU, p.40."

# Zones NON constructibles — décision motivée (principe mandat-cadre) : A (dont Aenr
