# ─────────────────────────────────────────────────────────────────────────────
# Barème du Score LABUSE V1 (SL-1) — SCORING-6 lot B.
#
# VALEURS PROVISOIRES calées sur les 30 parcelles témoins (SCORING-5-RETOUR §3,
# reports/scoring-5/TEMOINS.csv). Le résiduel servi est PRÉ-calibrage : les bandes et
# les paliers sont à RE-CALER après `residuel-serve` (décision Vic §17 du mandat SCORING-5).
# Le hash sha256 de ce fichier entre dans `score_version` (labuse_v1+<hash8>) — tout
# changement de barème sans lecture de la nouvelle version fait échouer le test de versionnement.
#
# Formule (SCORING-5-RETOUR §1) : score = clip(barème_capacité × coef_faisabilité, 0, 100).
# Contexte = information fiche, HORS calcul. Absence de donnée = facteur neutre 1,0, jamais un malus.
# ─────────────────────────────────────────────────────────────────────────────
score_labuse:
  version_base: "labuse_v1"

  # Temps 2 — capacité (barème saturant en logements-équivalents sur la SDP résiduelle).
  capacite:
    # sdp (m²) STRICTEMENT inférieure au seuil → points. Ordre croissant. sdp ≤ 0 → 0 (règle dure).
    paliers:
      - [80, 15]
      - [200, 35]
      - [400, 55]
      - [1000, 75]
      - [2000, 90]
    au_dela_points: 100          # sdp ≥ 2000
    au_fermee_mult: 0.5          # zone AU fermée / statut inconnu → capacité DIFFÉRÉE (pas exclue)

  # Temps 3 — coefficient de faisabilité (produit de facteurs gradués, plancher global).
  faisabilite:
    plancher: 0.4
    # pente % ≤ seuil → facteur (ordre croissant) ; au-delà = pente forte.
    pente_pct:
      - [15, 1.0]
      - [30, 0.85]
    pente_au_dela: 0.6
    forme:                        # parcelle en lame (approximation emprise_lineaire)
      largeur_max_m: 8            # largeur w = 2·aire/périmètre
      allongement_min: 8          # allongement = aire / w²
      facteur: 0.8
    acces_non_identifie: 0.85     # cascade `acces` = PASS (voie desservante ≤10 m non identifiée)
    bati:
      faitage_r2_m: 9             # faîtage ≥ 9 m ≈ R+2 → cran de démolition supplémentaire
      # emprise bâtie % ≤ seuil → [facteur sans R+2, facteur avec faîtage ≥ R+2]. emp ≤ 0 → nu.
      emprise_pct:
        - [0, [1.0, 1.0]]         # nu
        - [20, [0.9, 0.8]]        # démolition légère
        - [50, [0.8, 0.65]]
      au_dela: [0.65, 0.65]       # emprise > 50 % → démolition-reconstruction

  # Lot E / SCORING-7 §1 — bandes ABSOLUES (décisions Vic, gravées). Seuils inchangés ;
  # le 0 est une bande À PART (jamais D), NC n'est jamais 0 (garanti par _cause_nc / score None).
  bandes:
    seuils:                       # score ≥ seuil → libellé (ordre décroissant)
      - [80, "A"]                 # A : 80-100
      - [50, "B"]                 # B : 50-79
      - [30, "C"]                 # C : 30-49
    au_dessous: "D"               # D : 1-29 (score > 0 sous 30)
    zero: "0"                     # 0 : score == 0 exactement → bande à part « sans potentiel »
    # Vocabulaire CLIENT par bande (décisions Vic, présentation seule — aucun calcul). NC porte
    # en plus sa cause lisible (_cause_nc : « zone non résolue » / « donnée critique absente »…).
    vocabulaire_client:
      A: "Excellente"
      B: "Bonne"
      C: "À étudier"
      D: "Faible"
      "0": "Sans potentiel constructible"
      NC: "Analyse incomplète"
