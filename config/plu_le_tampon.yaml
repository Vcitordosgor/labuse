zones_au_renvoi: {}

# Zones 2AU* : ouverture à l'urbanisation SOUMISE à l'engagement de l'aménagement de
# TOUTES les zones 1AU du pôle urbain de référence fixé par le SAR (Art. AUindicée 2.2.3,
# p.84 : « leur ouverture à l'urbanisation ne peut intervenir dès lors que l'aménagement de
# l'ensemble des zones 1AUindicée du pôle urbain de référence … soit entrepris »).
# Gel CONDITIONNEL porté par zones_au_st (constructible_neuf=False — étiquette moteur
# « secteur de transition » inexacte, capacité zéro exacte : même friction F2 que le pilote).
zones_au_st:
  liste: ["2AUa", "2AUb", "2AUc", "2AUd", "2AUe"]
  portee: "Construction neuve non autorisée en l'état : zones 2AU d'extension urbaine, ouverture conditionnée à l'engagement de l'aménagement de l'ensemble des 1AU du pôle SAR de référence (Art. AUindicée 2.2.3, p.84). Le manifeste ne compte AUCUN polygone 1AUd ni 2AUto."
  source: "ZONE AUindicée, Art. 2.2.3, p.84."

# Zones NON constructibles (urbanisation) — hors périmètre faisabilité U/AU.
# DÉCISION (principe du mandat-cadre §9) : constructibilité d'EXCEPTION uniquement —
# A (agricole ; secteur Aba = STECAL L.151-13, p.89), N (naturelle ; Nco corridors
# écologiques, Npnr cœur du Parc national, Nto1-5 = STECAL touristiques à SDP plafonnée
# par secteur et hauteurs 4-7 m, Art. N p.101+). Les graver ferait calculer une capacité
# logement fictive => repli générique (non constructibles), verdict produit correct.
zones_non_constructibles: ["A, Aba (chap. p.89-100)",
                           "N, Nco, Npnr, Nto1, Nto2, Nto3, Nto4, Nto5 (chap. p.101+)"]
