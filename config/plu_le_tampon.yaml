# =============================================================================
# PLU LE TAMPON (97422) — règles chiffrées par zone constructible (U / AU)
# =============================================================================
# Source unique : règlement écrit du PLU du Tampon (archive GPU 97422_PLU_20230811).
#   document : 97422_reglement_20230811.pdf (« PLU du Tampon — Règlement 2018 », 137 p.)
#   url      : https://www.geoportail-urbanisme.gouv.fr/document/by-id/3bd1b9d43addd334e64405c82343c405
#   PLU révisé approuvé 2018, modifications jusqu'au 11/08/2023 (idurba). EN VIGUEUR,
#   concordance manifeste/GPU vérifiée le 27/07/2026 (audit fraîcheur 24 communes).
#
# FIABILITÉ (n'inventer AUCUNE valeur) :
#   - page_pdf = page_imprimee + 2 (vérifié : sommaire imprimé 1 = PDF 3, zone Ua imprimée 9 = PDF 11).
#     Les _src citent la page IMPRIMÉE.
#   - null         = règle explicitement « Non réglementée » dans le texte.
#   - "a_verifier" = présent mais ambigu / conditionnel / non attribuable sûrement.
#   - hauteurs : « X mètres à l'égout du toit ou au sommet de l'acrotère et Y mètres au
#     faîtage » => he_m <- X, hf_m <- Y. Ue ne donne que l'égout (12 m) => hf null.
#   - ANCIEN FORMAT à articles préfixés (Ua1..Ua14) : 6=recul voirie, 7=recul limites,
#     9=emprise, 10=hauteur, 12=stationnement, 13=espaces libres. AUCUN COS résiduel
#     (zéro occurrence dans le document — piège ALUR non rencontré).
#   - EMPRISE : « Non réglementée » dans TOUTES les zones U (Ua9/Ub9/Uc9/Ud9/Ue9) —
#     même situation que Saint-Paul, la capacité est bornée par reculs+hauteur+pleine terre.
#   - PLEINE TERRE : Art. 13.2 donne « X % perméable dont Y % pleine terre » => gravé Y
#     (le moteur consomme le % pleine terre). Ue : 15 % perméable SANS sous-minimum de
#     pleine terre => null + note.
#   - indice « m » (Ucm, UCtom) : terrains dans le polygone de protection du dépôt de
#     munitions de la Plaine des Cafres — mêmes règles chiffrées que la zone support,
#     servitude en note (caractère de zone Uc, p.39).
#   - ZONES AU (chapitre unique « AUindicée », p.83-87) : renvoi explicite au règlement
#     de la zone U d'indice (« il convient de se reporter au règlement des zones urbaines
#     correspondantes ») ; AUto/AUcto => règlement de la zone Ucto (renvoi répété à chaque
#     article). Le renvoi mécanique du moteur ne couvre pas les codes 1AUx/2AUx (préfixe
#     chiffré) => entrées EXPLICITES. 2AU* : ouverture soumise à l'engagement de
#     l'aménagement de toutes les 1AU du pôle SAR => zones_au_st (gel conditionnel).
# =============================================================================

