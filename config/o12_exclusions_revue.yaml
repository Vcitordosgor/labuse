# O12 — EXCLUSIONS DE REVUE (mécanisme traçable, mandat O12-PARTIEL-2 revue 2).
# Un candidat géométriquement valide peut être écarté par la REVUE VISUELLE (« la revue
# tranche ») : jamais de retrait silencieux — chaque exclusion porte idu, motif, date, NATURE.
# Appliqué aux DEUX familles par les détecteurs (division_or). Retirer une entrée = la
# parcelle redevient éligible au prochain run.
#
# NATURE (revue 2, arbitrage Vic) — deux comportements distincts au re-run :
#   permanente     : exclusion par IDU, INDÉPENDANTE de la géométrie. Quelle que soit l'ancre,
#                    la parcelle reste écartée (ex. bâti douteux non blanchi par la source).
#   liee_geometrie : exclusion liée au TRACÉ du lot revu, pas à la parcelle. Le re-run compare
#                    le lot re-calculé au lot revu (snapshot division_or_revue_snapshot) :
#                    tracé identique → reste écarté ; tracé DIFFÉRENT → revient au dossier avec
#                    la mention « déjà écarté en revue précédente — géométrie modifiée ».
# Règle générale : toute parcelle dont le lot change au re-run est « à revoir », même validée —
#                  la validation portait sur un tracé, pas sur un IDU (statut porté par la fiche).

