# O12 — EXCLUSIONS DE REVUE (mécanisme traçable, mandat O12-PARTIEL-2 revue 2 & 3).
# Un candidat géométriquement valide peut être écarté par la REVUE VISUELLE (« la revue
# tranche ») : jamais de retrait silencieux — chaque exclusion porte idu, commune, nature,
# motif, date. Appliqué aux DEUX familles par les détecteurs (division_or).
#
# `commune` est OBLIGATOIRE et VÉRIFIÉ : les 5 premiers chiffres de l'idu doivent être l'INSEE
# de la commune nommée (test_exclusions_revue_idu_coherents). Ce garde-fou verrouille la
# défaillance de la revue 3 : `97416000AV0203` (préfixe 97416 = Saint-Pierre) avait été saisi
# pour le U de Saint-Denis `97411000AV0203` — IDU FANTÔME (aucune parcelle), l'exclusion n'a
# jamais mordu et le faux positif a reparu. Le préfixe croisé avec la commune l'interdit.
#
# NATURE = permanente : exclusion par IDU, INDÉPENDANTE de la géométrie. C'est la SEULE nature
# retenue (revue 3, 2e correctif). La nature `liee_geometrie` (comparer le tracé re-calculé au
# tracé revu via un snapshot) a été ABANDONNÉE : elle s'auto-annulait après un tour — une fois
# la parcelle exclue, elle disparaît du pool, donc du snapshot reconstruit au run suivant, donc
# la comparaison perd sa référence et la parcelle REPARAÎT (constaté sur AT0650). Le détecteur
# étant DÉTERMINISTE (le tracé d'une parcelle est identique à chaque run tant que le code ne
# change pas), l'exclusion par IDU est robuste et suffit ; la nuance « re-revoir si l'algorithme
# produit un autre tracé » est déjà couverte par la RÈGLE de revue exhaustive à chaque
# changement d'algorithme. Le snapshot ne sert plus qu'à l'ANNOTATION « tracé modifié » (info).

