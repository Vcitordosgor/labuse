    ouverture_src: "AU 1.2 §1, p.75"
    ouverture_verbatim: "les constructions à usage d'habitation, à condition qu'elles s'insèrent dans des opérations d'ensemble comportant un minimum de 10 logements […] avec une densité minimale de 50 log/ha (secteur AUa) […] sauf dispositions particulières définies dans les Orientations d'Aménagement"
    operation_ensemble_requise: true
    logements_min: 10
    logements_min_src: "AU 1.2 §1, p.75"
    densite_min_log_ha: {reglement: 50, oap: 50, prevalente: oap, prevalence_src: "AU 1.2 p.75 « sauf dispositions […] dans les OAP » ; OAP Le Stade p.7", en_conflit: false}
    logement_aide_pct: {reglement: 20, oap: 50, prevalente: oap, prevalence_src: "AU 1.3 p.76 « ne s'applique pas dans les zones AU faisant l'objet d'une OAP » ; OAP Le Stade p.7", en_conflit: true}
