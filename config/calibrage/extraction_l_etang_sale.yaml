# EXTRACTION EXHAUSTIVE — PLU de L'Étang-Salé (97404) — MANDAT GPU-PILOTE Phase 2 (v2)
# =============================================================================
# v2 (arbitrage Vic) : l'unité d'extraction devient (ZONE × SITE_OAP). Une zone n'a pas UNE règle
# mais autant que de sites OAP qui la recouvrent (AUc Ravine Sheunon impose 30 log/ha là où le
# règlement dit 15). Toute valeur divergente règlement/OAP montre LES DEUX + laquelle prévaut + la
# source de la prévalence.
#
# Fichier NEUF, à côté du calibrage existant (config/plu_l_etang_sale.yaml) — non modifié.
# Règles tenues : source (article + page IMPRIMÉE) sur chaque champ ; jamais de null muet
# (non_extrait ≠ sans_objet) ; verbatim exact ; ouverture AU lue, jamais déduite.
# Offset : page_pdf = page_imprimée − 1. Sources : règlement 97404_reglement_20250917.pdf (106 p.)
# + OAP 97404_orientations_amenagement_20250917.pdf (25 p.).

meta:
  commune: "L'Étang-Salé"
  insee: "97404"
  document_gpu: "97404_PLU_20250917"
  reglement_fichier: "97404_reglement_20250917.pdf"
  oap_fichier: "97404_orientations_amenagement_20250917.pdf"
  # DEUX dates distinctes (arbitrage Vic) — une extraction sur doc périmé doit être DÉTECTABLE :
  date_archive_locale: "2025-09-17"            # millésime du nom d'archive (fichier lu)
  date_en_vigueur_gpu: "2025-12-08"            # effectiveStatus=EN_VIGUEUR, publicationDate GPU
  reglement_modifie_le: "2024-12-04"           # cf. version antérieure originalName 97404_PLU_20241204
  version_en_vigueur_verifiee: "OUI — règlement du pack EN_VIGUEUR identique à l'archive locale (sha256 comparé, cf. rapport Phase 2)"
  extraction_perimee_si: "un nouveau document GPU (effectiveStatus EN_VIGUEUR) porte un originalName ou un sha de règlement différent de celui extrait ici"
  offset_pdf_vs_imprimee: -1
  procedure: "non_extrait (0_Procedure non lu)"
  prevalence_documents: "PPR (26/01/2016) et PPRL (03/2017) PRÉVALENT (AU 1.1.1, p.75)"
  sha256_reglement: "0b05392e5e88009026bbfc112a9d189a51094c59e4099a97d5006f135487c7ca"
  cabinet_redacteur: "DUTEILH-PERRAU URBANISME ET ENVIRONNEMENT (détecté au texte)"
  famille_trame: "DUTEILH-PERRAU — MÊME trame que Saint-Leu (97413) : verbatim AUs identique, planchers 10 log + densité, VRD internes/externes, prévalence OAP. Une anomalie ici se cherche là-bas, et réciproquement."
  planchers_localisation: "RÈGLEMENT (AU 1.2, densité 50/30/15) — cf. taxonomie : règlement / OAP (Saint-Pierre) / PLH externe (Saint-Paul)"

annuaire_lien:
  resolveur: "https://www.geoportail-urbanisme.gouv.fr/api/document?grid=97404"
  filtre: "effectiveStatus == 'EN_VIGUEUR'  → champ id"
  telechargement_verifie: "https://www.geoportail-urbanisme.gouv.fr/api/document/7058f72863540b49692dd4e3c37085f8/download"
  resultat_test: "HTTP 200, redirige vers data.geopf.fr/.../97404_PLU_20250917.zip (document EN VIGUEUR)"
  granularite: "document DU entier (pas le PDF règlement à la page) — l'article+page s'affiche à côté du lien"
  avertissement: "id NON stable — résoudre via grid=97404 à chaque requête, jamais coder l'id en dur"

