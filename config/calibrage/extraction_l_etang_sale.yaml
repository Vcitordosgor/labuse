# =============================================================================
# DÉCOMPTE (arbitrage Vic : combien d'enregistrements avant vs après granularité)
#   AVANT (v1, 1 record/zone AU)         : 6 enregistrements AU.
#   APRÈS (v2, 1 record/(zone,site_OAP)) : 15 enregistrements AU (× 2,5).
#     Détail : AUa 2 (Le Stade + aucun) · AUb 4 (Amont ZAC, RHI aval, RHI amont, aucun) ·
#     AUc 3 (Ravine Sheunon, Le Lambert, aucun) · AUe 1 (Les Sables) · AUt 2 (Le Golf,
#     Étang-Salé-les-Bains) · AUs 3 (Étang-Salé-les-Bains, Les Sables, aucun) = 15.
#     (AUe/AUt n'ont pas de record « aucun » : toute leur emprise est sous OAP dans cette commune.)
#   + 7 zones U + 11 zones A/N (sans OAP, 1 record chacune).
#
# CONTRÔLE 3/3 (inchangé, granularité n'y touche pas) :
#   1. AUs fermée (tous records AUs, ouverture=fermee, verbatim p.75/p.76).
#   2. 10 log min + 50/30/15 (records AUa/AUb/AUc, logements_min + densite_min_log_ha.reglement).
#   3. VRD internes+externes (reglement_zone.AU*.vrd_charge_operateur, verbatim p.75).
# =============================================================================
