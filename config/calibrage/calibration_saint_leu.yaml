# --- Zones à urbaniser (le cœur mission-1) ---
zones_au:
  # secteurs OUVRABLES (opération d'ensemble)
  ouverture: conditionnelle_operation
  ouverture_src: "« son ouverture à l'urbanisation peut être subordonnée à une modification ou une révision du PLU » (p.8)"
  secteurs_ouvrables: [AUa, "AUa-rc", AUb, "AUb-rc", AUc, AUe, AUd, AUt]
  operation_ensemble_requise: true
  planchers:
    logements_min: 10
    densite_min_log_ha: {AUa: 30, "AUa-rc": 30, AUb: 30, "AUb-rc": 30, AUc: 15}
    src: "« opérations d'ensemble comportant un minimum de 10 logements ou lots à usage d'habitation avec une densité minimale de 30 log/ha (secteurs AUa, AUa-rc, AUb, AUb-rc) et 15 log/ha [secteur AUc], sauf dispositions particulières définies dans les Orientations d'Aménagement » (p.82)"
    prevalence: "oap prévaut (renvoi explicite « sauf OAP »)"
  vrd_charge_operateur: interne_et_externe
  vrd_src: "« qu'ils soient internes ou externes à celle-ci, sont à la charge exclusive de l'opérateur » (p.82)"
  # secteur FERMÉ (long terme)
  AUs:
    ouverture: fermee
    ouverture_src: "p.81"
    ouverture_verbatim: "Le secteur AUs couvre des espaces naturels réservés à l'urbanisation future. Ces espaces non équipés sont inconstructibles. Ils ne pourront être ouverts à l'urbanisation qu'à l'occasion d'une procédure de modification ou de révision"

