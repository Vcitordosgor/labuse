# M39 — SIGNAL « PISCINE DÉTECTÉE » (solde dette #13). Règle PRODUIT en config, jamais en dur
# (même philosophie que au_ouverture_planchers.yaml). Lue par src/labuse/faisabilite/piscine_signal.py
# (fiche + geste de bascule). AUCUN poids de modèle : la doctrine gravée (AUDIT4 train 5, la feature
# piscine portait +0,41 dans P) veut « une RÈGLE produit, pas un poids » — ce fichier EST cette règle.
#
# PRINCIPE MÉTIER : une piscine sur une parcelle classée chaude = usage investi → probabilité de
# vente en baisse. L'écarter épargne au client une visite pour rien (la boussole — réduire les faux
# positifs — appliquée au terrain). Le doute ne profite jamais au classement, DANS LES DEUX SENS :
# on ne déclasse pas non plus sur un signal douteux (V0 colorimétrique seul, hors bande, non
# matérialisé). Voir qa/m39/M39_P0_CONSTAT.md.
#
# HONNÊTETÉ MILLÉSIME (arbitrage Vic A1) : un SEUL millésime ortho en base (2025). La datation
# « récente » (absente N-1 / présente N) est INFABRICABLE → le motif dit « détectée sur imagerie
# 2025 », JAMAIS « récente ». Le signal servi est « présente 2025 » (non daté), assumé.

millesime: "2025"                 # BD ORTHO 974 IGN (source datée : data_sources « BD ORTHO 20 cm (IGN) »)
precision_pct: 90.7               # précision mesurée de la couche matérialisée (échantillon interne)
                                  # → libellé « détectée », JAMAIS « présente certifiée ».

# ── SEUIL SURFACIQUE (arbitrage Vic B : bande [15 ; 60] m²) ──
# Bornes = décisions MESURÉES sur les détections humain-validées (ok vs faux_positif), P0 §3.
seuil:
  surface_min_m2: 15   # PLANCHER absolu. Sous 15 m² : 355 faux_positif pour 190 ok validés (FP-majoritaire
                       #   — bassins, bâches, trampolines, artefacts cyan). En-dessous, pas une piscine
                       #   « investissement d'usage » assez sûre pour déclasser.
  surface_max_m2: 60   # PLAFOND absolu. Au-dessus de 60 m² : 19 faux_positif pour 14 ok validés (FP-prone —
                       #   terrains de sport, plans d'eau, grands bassins collectifs). GARDE-FOU : n'a
                       #   écarté AUCUN cas sur aucune mesure M39 (0 hot-piscine > 60 m²) — conservé
                       #   contre un futur FP de grande surface, à réévaluer s'il ne sert toujours à rien.
  pct_pool_parcelle_min: 15.0  # PART DE PARCELLE (seuil figé Vic). Un signal négatif SURFACIQUE se juge en
                       #   PART de parcelle, pas en surface absolue : la surface mesure l'objet, la part
                       #   mesure le BLOCAGE. Sous 15 %, la piscine = maison occupée (domaine du filtre
                       #   bâti), résiduel encore mobilisable → NE PAS déclasser. À 15 %+, petite parcelle
                       #   saturée = usage installé. Sweep mesuré : ≥5 %→12, ≥10 %→8, ≥15 %→4, ≥20 %→1.

# ── PÉRIMÈTRE DU DÉCLASSEMENT (arbitrage Vic C1 : couche MATÉRIALISÉE seule) ──
# La règle ne s'applique QU'À la couche matérialisée (juge FLAIR≥0,30 ET probe≥0,50, ∪ validation
# humaine 'ok' — précision 90,7 %). Le V0 colorimétrique seul (probe-raté) est EXCLU (C3 enterré :
# le doute profiterait au déclassement). Les seeds AK1442/AL1154 vivent dans cette bande probe-ratée
# et restent au REGISTRE (geste manuel, œil de Vic) — deux mécanismes, deux niveaux de preuve, zéro
# recouvrement (vérifié P0 §4). Ce n'est pas un pis-aller : c'est le système qui marche.
declassement:
  tiers_source: [brulante, chaude]   # seuls les tiers hauts sont déclassés (ailleurs le signal est moot)
  tier_cible: a_creuser              # comme le registre M32 (fausse chaude → à creuser, jamais écartée)
  exige_materialisee: true           # parcel_equipements.piscine = true (couche produit, pas V0 seul)

# ── CONTENANCE (seuil figé Vic) : la piscine est-elle DANS la parcelle servie, pas celle du voisin ?
# ACTIVE. Sans elle, une piscine mitoyenne (moitié chez le voisin) déclasserait un terrain nu.
contenance:
  centroide_dans_parcelle: true          # le centre de la piscine doit tomber dans la parcelle servie
  ratio_pool_dans_parcelle_min: 0.7      # ≥ 70 % de la piscine dans la parcelle (0,7 et non 0,5 : à 0,55
                                         #   CY0985 est visiblement mitoyenne — on ne déclasse pas sur une
                                         #   piscine à moitié chez le voisin). Écarte CY0985 (0,55) + BE1329 (0,44).

# ── MOTIF CLIENT (famille M35 — identique au registre AL1154, « motif client conservé ») ──
# Étiquette Sourcé + précision assumée. Interdits M35 (mandat/prénom/modèle/dette/IDU tiers) absents.
motif_client: "Piscine détectée sur imagerie aérienne 2025 — usage du terrain à vérifier."
