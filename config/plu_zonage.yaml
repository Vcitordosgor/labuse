        dès réouverture de la zone.'
      - Zone urbaine peu dense GELÉE provisoirement (construction neuve non autorisée, extensions <=25
        % SDP — préambule p.129, Art. Us1 p.130). Hauteur servie ; capacité = aucune (gel).
    Ut:
      bassin: Saint-Pierre
      habitat: interdit
      notes:
      - 'Sans objet (habitat limité à la présence permanente nécessaire). Tableau Art. Ut6 : 1 place/logement
