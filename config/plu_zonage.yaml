        (caractère de zone UB p.24 ; liste des zones urbaines p.5-6) La clause générale des secteurs EXISTE
        (p.4 imprimée : « Dès lors que la zone comprend un ou plusieurs secteurs, la règle générale de
        la zone s''applique à chacun d''eux sauf lorsqu''une disposition particulière est prévue ») mais
        elle vise les secteurs DÉCLARÉS d''une zone — or aucun secteur UB1/UB2 n''est déclaré nulle part
        : la clause ne peut fonder le rattachement d''un libellé que le règlement ne reconnaît pas ; il
        reposait sur une déduction par élimination (indice « b » => UB), refusée (leçon §9 : une clause
