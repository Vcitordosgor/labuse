        motorisés/affouillements, et l''Art. AUINDICEE 2.2 (p.65) admet « toutes les occupations et utilisations
        du sol non citées à l''article 1.2 » => l''habitat serait ADMIS (et l''industrie INTERDITE, dans
        une zone pourtant indexée sur la zone d''activité Ue). Lecture 2 (renvoi d''indice, p.64 : « se
        reporter en fonction de l''indice […] au règlement des zones urbaines correspondantes ») : l''Art.
        Ue 1.2 (al. 1), p.53, INTERDIT l''habitat. Les deux lectures divergent sur une destination ; la
        clause densité qui exclut AUe (Art. AUINDICEE 2.2, p.66 : « à l''exception de celles des zones
        AUe et AUt ») et le renvoi explicite AUe -> Ue de l''Art. 7 (p.67) suggèrent l''intention « activité
        » sans l''écrire à l''Art. 1/2. O12 signalait 1AUe candidate habitat-interdit : NON confirmée
        à l''Art. 1/2 comme l''exige le mandat => non calibrée. ARBITRAGE VIC 28/07/2026 : reste non calibrée
        — trancher depuis un bureau serait deviner, écart maximal entre les deux lectures (constructible
        résidentiel vs interdit), enjeu 1 polygone/1,9 ha ; à poser à la commune si l''occasion se présente.
        Repli générique.'
      source: Art. AUINDICEE 1.2 et 2.2, p.65 ; Art. AUINDICEE 2.2 (clause densité), p.66 ; Art. AUINDICEE
