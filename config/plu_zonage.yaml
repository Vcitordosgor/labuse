      - 'PAR TRANCHE : UF>250 m² : CBS 40 % min dont >=30 % pleine terre plantée ; UF<=250 m² : CBS 30
        % dont >=25 % pleine terre. Gravé : tranche >250 m² (dominante).'
    Up:
