      - Implantation obligatoire sur AU MOINS une limite séparative (une limite reste libre), max 80 %
        du linéaire ; sinon retrait 3 m. Règles de mitoyenneté selon le bâti contigu (premier rideau).
      - Norme AU M² DE SDP, pas par logement (non consommée par le moteur, cf. § Frictions). 1 place /
        logement locatif social.
      - CBS 30 % (UF>250 m²) ou 15 % (UF<=250 m²), avec pleine terre 20 % dans LES DEUX tranches — pas
