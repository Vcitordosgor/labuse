      source: Art. A 2, p.34 ; Art. A 3 (zones Acu et Acor), p.36
    Acu:
      motif: 'Coupures d''urbanisation (loi Littoral) : « toutes les constructions, même agricoles, sont
        interdites » (caractère de zone) ; seules extensions de mise aux normes, changements de destination
        et carrières du Schéma départemental.'
      source: Art. A 1, p.32 ; Art. A 2, p.34 ; Art. A 3, p.36
    Ai:
      motif: 'Espace agricole inconstructible de Le Conardel (future zone d''activités) : tous travaux/constructions
        interdits sauf aménagement et extension mineure de mise aux normes <= 20 m² de SDP sur constructions
        existantes.'
      source: Art. A 1, p.32 ; Art. A 2, p.34 ; Art. A 3 (zone Ai), p.37
    N:
      motif: 'Zone naturelle : toute construction nouvelle interdite sauf exploitation agricole/forestière
        ; habitat existant limité à 160 m² SDP total (annexes/extensions). Hauteur consignée : 12 m agricole,
        4 m égout / 8 m faîtage autres.'
      source: Art. N 2, p.42 ; Art. N 3 (4°), p.44 ; Art. N 4, p.46
    Nci:
      motif: 'Cimetières : toute construction nouvelle interdite sauf ouvrages liés à la gestion des cimetières
        dans la limite de 300 m² de SDP.'
      source: Art. N 2, p.42
    Nerl:
      motif: 'Espaces remarquables du littoral (SAR) : tous travaux/constructions interdits sauf aménagements
        légers de gestion/mise en valeur.'
      source: Art. N 2, p.42 ; Art. N 3 (zone Nerl), p.45
    Np:
      motif: 'Sites naturels à forte valeur écologique protégés de manière stricte : « toute construction
        nouvelle » interdite, sans exception consommable.'
      source: Art. N 2, p.42
    Npnr:
      motif: 'Cœur du Parc national de La Réunion : tous travaux, constructions et installations interdits
        sauf autorisation spéciale de l''établissement public du Parc.'
      source: Art. N 2, p.42
    'Ns20 à Ns46 (27 libellés du manifeste, graphie texte « Ns 20 »… : fiches N°20 à 46)':
      motif: 'STECAL « hameaux nouveaux » loi Littoral (anciennes zones Nba 2006). L''habitat en hameau
        intégré y est admis dans le principe (Art. N 2) MAIS l''annexe 3 rend le droit à construire caduc
        : en espace proche du rivage (Ns 20, 21, 41 à 46) « les constructions seront interdites à partir
        du 31/12/2021 » ; hors espace proche du rivage, partie non bâtie (rouge) interdite depuis le 31/12/2021
        et partie déjà bâtie (bleue) constructible seulement « si le STECAL est pris en compte avant cette
        date par le Préfet ou par le SCOT de la CIREST » — fait extérieur au règlement, invérifiable ici
        ; découpage rouge/bleu par schémas de fiche non parcellisable. Graver une capacité serait deviner
        => non calibrées. Chiffres consignés : hauteur 4 m égout / 8 m faîtage, emprise 70 % (Art. N 4
        et N 5, p.46).'
      source: 'Art. N 1, p.40 ; Art. N 2, p.42 ; annexe 3, p.73 : « les constructions seront interdites
        à partir du 31/12/2021 » ; Art. N 4, p.46'
    Nta47 à Nta54 (8 libellés, fiches N°47 à 54):
      motif: 'STECAL touristiques (anciennes zones Nto/Ntc 2006) : en zone Nt toute construction nouvelle
        est interdite « à l''exception des équipements et hébergements touristiques, ainsi que des constructions
        affectées au logement du personnel » — pas de logement neuf ordinaire ; même caducité loi ELAN
        que les Ns (annexe 3, p.73). Nta n°53 (Kanopea Forest Lodge) : cabanes arboricoles démontables,
        350 m² de SDP max par unité foncière, emprise 10 %, hauteurs 5/8 m (10 m max au sol) — fiche N°53,
        p.86.'
      source: 'Art. N 2, p.42-43 ; Art. N 1, p.40 ; annexe 4, fiche N°53, p.86 : « dans la limite de 350
        m² de surface de plancher par unité foncière »'
    Ntb55, Ntb57, Ntb59 (3 libellés, fiches N°55, 57, 59):
      motif: 'STECAL « hameaux touristiques nouveaux » à projet unique, vocation exclusivement touristique
        (zone Nt, Art. N 2) + caducité loi ELAN (annexe 3, p.73). Plafonds de fiche consignés : Ntb55
        Domaine Anamoutou — emprise totale 1700 m², 10 m au faîtage (p.88) ; Ntb57 Diana Dea Lodge — SPA
        1075 m² d''emprise, hameau 500 m² de SDP, hauteurs 4,5/6 m (p.91-92) ; Ntb59 Le Verger — 30 bungalows
        max, emprise totale 1050 m², 6 m égout / 8 m faîtage (p.94, zone en espace proche du rivage :
        constructions interdites depuis le 31/12/2021).'
      source: 'Art. N 2, p.42-43 ; annexe 5, fiche N°55, p.88 : « L''emprise au sol totale des constructions
        ne pourra excéder 1700 m² » ; fiche N°59, p.94'
    Ua, Uap, Ub (zones U à habitat admis):
      motif: 'ARBITRAGE VIC 28/07/2026 — hauteur définie par secteur graphique, non portable par le schéma
        v1 : Art. U 4 (p.9) fixe 15/13/10/7/4 m à l''égout/acrotère « selon les secteurs repérés sur le
        document graphique » ; l''écart 4-15 m n''est pas une tranche à choisir, graver 4 m sous-estimait
        d''un facteur 4 (faux négatifs en série). Valeurs textuelles saines consignées pour un futur v2
        : emprise 80 % (Art. U 5, p.10) ; limites séparatives 1 m ou implantation en limite (Art. U 7,
        p.11) ; recul voirie non réglementé sauf exceptions Pompidou/Montfleury/Brunet et RN 75 m hors
        agglomération (Art. U 6, p.10-11) ; stationnement 1 place/logement + visiteurs (Art. U 12, p.16-17)
        ; 20 % perméable (Art. U 9, p.13). Uap : secteur patrimonial (toitures >= 35°, Art. U 8 2°, p.12).
        Ub : corridor écologique la Sourdine, constructions interdites dans les hachures vertes (Art.
        U 2 7°, p.7).'
      source: 'Art. U 4, p.9 : « selon les secteurs repérés sur le document graphique » ; Art. U 5, p.10
        ; Art. U 7, p.11'
  zones_non_constructibles:
