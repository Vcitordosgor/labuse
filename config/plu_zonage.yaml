        : 4 m max dans la bande de 1,90 m. Équipements publics 10 m égout.'
      - 'PAR TRANCHE : 80 % si UF<150 m² ; 60 % si UF>150 m². Gravé : 60 % (tranche dominante : 87 % du
        pool servi Up est >=150 m², médiane 261 m² — pour les 26 parcelles <150 m² le 60 % SOUS-estime,
        prudent).'
      - 'Implantation libre (alignement ou retrait) ; voies piétonnes : 1 m de l''axe.'
      - '1 place / logement locatif social. Parcelles <150 m² à façade <8 m ou accessibles à pied : exemptées
        (transverse).'
    Us:
      bassin: Saint-Pierre
      constructible_neuf: false
      notes:
      - 'Règle générale LOGEMENT : 6 m égout/acrotère, 11 m faîtage (Art. Us3 §5, p.134). Équipements
