        détente — Art. AUt 2.2, p.35).
    Ua:
      bassin: Les Avirons
      notes:
      - '« en zones Ua et Ub : 12 mètres à l''égout du toit ou au sommet de l''acrotère ; 15 mètres au
        faitage ». Bonus +3 m (LLS >= 50 % SDP, hébergement hôtelier) cf. regles_transverses.'
