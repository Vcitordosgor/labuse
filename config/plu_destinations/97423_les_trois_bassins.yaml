        citation: « Les constructions à destination d'hébergement touristique et les services liés, sous réserve
          de présenter un parti architectural et environnemental permettant une intégration au site et à ses alentours.
          »
    note: 'Sont aussi admis (hors nomenclature destinations) : « Les aires de stationnement, les affouillements
      et exhaussements du sol, dès lors qu''ils sont nécessaires aux constructions et installations autorisées.
      » (AU 2.2, En zone AUt, 2., p. 65). « Les services liés » à l''hébergement touristique sont admis sans être
      nommés par destination → non mappés au-delà de la citation. Le code servi est « 1AUt » ; le règlement n''écrit
      que « AUt » (p. 64-70) ; pour les articles 3-14, le texte dit : « Pour la zone AUt, se reporter au règlement
      de la zone Ub » (p. 66-70), et la hauteur AUt est fixée à 8 m égout / 10 m faîtage (AU 10.2, p. 69). Densité
      : la clause densité exclut la zone AUt (p. 66).'
  2AUa:
    silence: autorise
    silence_src: 'Art. AU indicée 2.2, p. 65 : « Pour les autres zones : Sont admises toutes les occupations et
      utilisations du sol non citées à l''article 1.2 … » — liste fermée d''interdictions (art. AU indicée 1.2 «
      Pour les autres zones », p. 65), sous la condition d''ouverture propre aux zones 2AU (ci-dessous).'
    sous_destinations:
      industrie:
        statut: interdit
        article: AU indicée 1.2 (1.)
        page_pdf: 65
        citation: « Les constructions, ouvrages et travaux à destination industrielle et à destination exclusive
          d'entrepôt. »
      entrepot:
        statut: interdit
        article: AU indicée 1.2 (1.)
        page_pdf: 65
        citation: « … à destination exclusive d'entrepôt »
        note: L'interdiction vise la destination EXCLUSIVE d'entrepôt (mot du texte).
      exploitation_agricole:
        statut: interdit
        article: AU indicée 1.2 (2.)
        page_pdf: 65
        citation: « Les constructions, ouvrages et travaux à destination agricole. »
      artisanat_commerce_detail:
        statut: sous_condition
        condition: n'entraîner pour le voisinage aucune incommodité et aucune aggravation des risques (que la construction
          soit soumise ou non au régime ICPE)
        article: AU indicée 2.2 (1.)
        page_pdf: 65
        citation: « Les constructions à destination de commerce et d'artisanat […] à condition qu'elles n'entraînent
          pour le voisinage aucune incommodité et aucune aggravation des risques. »
      commerce_gros:
        statut: sous_condition
        condition: n'entraîner pour le voisinage aucune incommodité et aucune aggravation des risques (que la construction
          soit soumise ou non au régime ICPE)
        article: AU indicée 2.2 (1.)
        page_pdf: 65
        citation: « Les constructions à destination de commerce et d'artisanat […] » (« commerce » ancien format
