zones:
  Ua:
    silence: autorise
    silence_src: 'Art. Ua 2.2, p. 11 : « Sont admises toutes les occupations et utilisations du sol non citées à
      l''article Ua 1.2, ainsi, que celles ci-après dès lors qu''elles respectent les conditions suivantes » — liste
      fermée d''interdictions (art. Ua 1.2, p. 10), le reste est admis.'
    sous_destinations:
      industrie:
        statut: interdit
        article: Ua 1.2 (1.)
        page_pdf: 10
        citation: « Les constructions, ouvrages et travaux à destination industrielle et à destination exclusive
          d'entrepôt. »
      entrepot:
        statut: interdit
        article: Ua 1.2 (1.)
        page_pdf: 10
        citation: « … à destination exclusive d'entrepôt »
        note: L'interdiction vise la destination EXCLUSIVE d'entrepôt (mot du texte ; cf. définition Entrepôt, glossaire
          p. 114).
      exploitation_agricole:
        statut: interdit
        article: Ua 1.2 (2.)
        page_pdf: 10
        citation: « Les constructions, ouvrages et travaux à destination agricole. »
        note: Le texte n'écrit que « agricole » ; l'exploitation forestière n'est pas citée → non mentionnée.
      artisanat_commerce_detail:
        statut: sous_condition
        condition: n'entraîner pour le voisinage aucune incommodité et aucune aggravation des risques (que la construction
          soit soumise ou non au régime ICPE)
        article: Ua 2.2 (1.)
        page_pdf: 11
        citation: « Les constructions à destination de commerce et d'artisanat, ainsi que les travaux d'amélioration
          ou d'extension de ces constructions, qu'elles soient soumises ou non au régime des installations classées
          pour la protection de l'environnement, à condition qu'elles n'entraînent pour le voisinage aucune incommodité
          et aucune aggravation des risques. »
      commerce_gros:
        statut: sous_condition
        condition: n'entraîner pour le voisinage aucune incommodité et aucune aggravation des risques (que la construction
          soit soumise ou non au régime ICPE)
        article: Ua 2.2 (1.)
        page_pdf: 11
        citation: « Les constructions à destination de commerce et d'artisanat […] à condition qu'elles n'entraînent
          pour le voisinage aucune incommodité et aucune aggravation des risques. » (« commerce » ancien format
          → artisanat_commerce_detail + commerce_gros)
    note: 'Ua 1.2 interdit aussi, hors nomenclature destinations (p. 10) : création/agrandissement de terrains de
      camping et de caravaning (3.), dépôts de véhicules/ferrailles/décharges et containers non affectés à un usage
      professionnel (4.), création/extension de carrières (5.), terrains de sports ou de loisirs motorisés (6.),
      affouillements- exhaussements > 2,50 m (7.), démolition du bâti L.151-19 d''intérêt majeur (8.). Clause densité
      : 30 logements ou équivalents-logements/ha (Ua 2.2, p. 11) ; clause logement social : > 1000 m² de surface
      de plancher d''habitation → 40 % logement aidé dont 25 % LLS ; opérations d''aménagement > 1200 m² SDP → 40
      % global (Ua 2.2, p. 11).'
  Uaa:
    renvoi: Ua
    renvoi_src: 'Caractère de zone, p. 10 : « Il existe un secteur Uaa, couvrant l''hypercentre de Trois-Bassins
      » ; Dispositions générales, art. 3 (p. 5) : « Dès lors qu''une zone comprend un ou plusieurs secteurs, la
      règle générale de la zone s''applique à chacun d''eux sauf lorsqu''une disposition particulière est prévue
      pour l''un de ces secteurs. » Les articles Ua 1 et Ua 2 (p. 10-11) ne comportent aucune disposition propre
      au secteur Uaa (les seules règles Uaa écrites portent sur les articles Ua 7 p. 15 et Ua 10 p. 18, hors destinations).'
  Ub:
    silence: autorise
    silence_src: 'Art. Ub 2.2, p. 26 : « Sont admises toutes les occupations et utilisations du sol non citées à
      l''article Ub 1.2, ainsi, que celles ci-après dès lors qu''elles respectent les conditions suivantes » — liste
      fermée d''interdictions (art. Ub 1.2, p. 25, identique mot pour mot à Ua 1.2), le reste est admis.'
    sous_destinations:
      industrie:
        statut: interdit
        article: Ub 1.2 (1.)
        page_pdf: 25
        citation: « Les constructions, ouvrages et travaux à destination industrielle et à destination exclusive
          d'entrepôt. »
      entrepot:
        statut: interdit
        article: Ub 1.2 (1.)
        page_pdf: 25
        citation: « … à destination exclusive d'entrepôt »
        note: L'interdiction vise la destination EXCLUSIVE d'entrepôt (mot du texte).
      exploitation_agricole:
        statut: interdit
        article: Ub 1.2 (2.)
        page_pdf: 25
        citation: « Les constructions, ouvrages et travaux à destination agricole. »
      artisanat_commerce_detail:
        statut: sous_condition
        condition: n'entraîner pour le voisinage aucune incommodité et aucune aggravation des risques (que la construction
          soit soumise ou non au régime ICPE)
        article: Ub 2.2 (2.)
        page_pdf: 26
        citation: « Les constructions à destination de commerce et d'artisanat […] à condition qu'elles n'entraînent
          pour le voisinage aucune incommodité et aucune aggravation des risques. »
      commerce_gros:
        statut: sous_condition
        condition: n'entraîner pour le voisinage aucune incommodité et aucune aggravation des risques (que la construction
          soit soumise ou non au régime ICPE)
        article: Ub 2.2 (2.)
        page_pdf: 26
        citation: « Les constructions à destination de commerce et d'artisanat […] » (« commerce » ancien format
          → artisanat_commerce_detail + commerce_gros)
    note: 'Régime spatial particulier des cinquante pas géométriques (Ub 2.2 (1.), p. 26) : « Pour les terrains
      situés à l''intérieur des cinquante pas géométriques délimités au document graphique, seules sont autorisées
      les services publics, les équipements collectifs, les opérations de réaménagement de quartier, de logement
      à caractère social et de résorption de l''habitat insalubre, les commerces, les structures artisanales, les
      équipements touristiques et hôteliers ainsi que toute autre activité économique dont la localisation à proximité
      de la mer est justifiée par son usage ou par une nécessité économique de desserte par voie maritime. […] Dans
      ces secteurs, sont autorisés l''adaptation, le changement de destination, la réfection, la reconstruction
      et l''extension limitée des constructions existantes. » — liste fermée locale (le silence y vaut interdit),
      applicable au périmètre graphique seulement. Clause densité 30 log/ha et clause logement social (1000 m² /
      1200 m² SDP) : Ub 2.2, p. 26-27. Autres interdictions hors nomenclature : identiques à Ua 1.2 (p. 25).'
  Uc:
    silence: autorise
    silence_src: 'Art. Uc 2.2, p. 40 : « Sont admises toutes les occupations et utilisations du sol non citées à
      l''article Uc 1.2, ainsi, que celles ci-après dès lors qu''elles respectent les conditions suivantes » — liste
      fermée d''interdictions (art. Uc 1.2, p. 39, identique mot pour mot à Ua 1.2), le reste est admis.'
    sous_destinations:
