          pour personnes handicapées ».
      artisanat_commerce_detail:
        statut: sous_condition
        condition: surface de vente, d'exposition ou de bureaux inférieure à la surface de production, de transformation,
          de conditionnement ou de réparation ; l'extension des constructions préexistantes est admise
        article: Ue 1.2 (2.) et Ue 2.2 (1.-2.)
        page_pdf: 53
        citation: 'Ue 1.2 (2.), p. 53 : « Les constructions, ouvrages et travaux à destination de commerces et de
          bureaux (sauf exceptions mentionnées à l''article Ue2.2). » ; Ue 2.2 (1.), p. 54 : « … dès lors que la
          surface de vente, d''exposition ou de bureaux reste inférieure à la surface de production, de transformation,
          de conditionnement ou de réparation (…) » ; Ue 2.2 (2.) : « L''extension des constructions à destination
          de commerces ou de bureaux préexistantes. »'
      commerce_gros:
        statut: sous_condition
        condition: surface de vente, d'exposition ou de bureaux inférieure à la surface de production, de transformation,
          de conditionnement ou de réparation ; l'extension des constructions préexistantes est admise
        article: Ue 1.2 (2.) et Ue 2.2 (1.-2.)
        page_pdf: 53
        citation: « … à destination de commerces et de bureaux (sauf exceptions mentionnées à l'article Ue2.2) »
          (« commerce » ancien format → artisanat_commerce_detail + commerce_gros) ; conditions à Ue 2.2 (1.-2.),
          p. 54.
      bureau:
        statut: sous_condition
        condition: surface de vente, d'exposition ou de bureaux inférieure à la surface de production, de transformation,
          de conditionnement ou de réparation ; l'extension des constructions préexistantes est admise
        article: Ue 1.2 (2.) et Ue 2.2 (1.-2.)
        page_pdf: 53
        citation: « … à destination de commerces et de bureaux (sauf exceptions mentionnées à l'article Ue2.2) »
          ; conditions à Ue 2.2 (1.-2.), p. 54 (« bureaux » ancien format → bureau).
      hotels:
        statut: interdit
        article: Ue 1.2 (3.)
        page_pdf: 53
        citation: « Les constructions, ouvrages et travaux à destination d'hôtellerie, de restauration ou d'hébergement
          touristique rural. »
      autres_hebergements_touristiques:
        statut: interdit
        article: Ue 1.2 (3.)
        page_pdf: 53
        citation: « … à destination d'hôtellerie, de restauration ou d'hébergement touristique rural. » (« hôtellerie
          » + « hébergement touristique rural » → hotels + autres_hebergements_touristiques)
      restauration:
        statut: interdit
        article: Ue 1.2 (3.)
        page_pdf: 53
        citation: « … à destination d'hôtellerie, de restauration ou d'hébergement touristique rural. »
      exploitation_agricole:
        statut: interdit
        article: Ue 1.2 (4.)
        page_pdf: 53
        citation: « Les constructions, ouvrages et travaux à destination agricole. »
    note: 'Industrie et entrepôt ne sont PAS cités à Ue 1.2 → autorisés par le silence (le caractère de zone p.
      53 — « activités industrielles ou artisanales à vocation de production, de transformation, de conditionnement,
      de distribution » — est indicatif, jamais une règle). Autres interdictions hors nomenclature (p. 53) : camping-caravaning
