  AUs:
    silence: interdit
    silence_src: 'Art. AUs 1.2, p. 71 : « Toutes les occupations et utilisations du sol sont interdites à l''exception
      de celles admises à l''article AUs 2.2 du présent règlement. » — liste fermée d''autorisations.'
    sous_destinations:
      locaux_techniques_administrations:
        statut: sous_condition
        condition: implantation dans la zone rendue nécessaire pour des raisons techniques ou économiques ; limiter
          la gêne et assurer une bonne intégration dans le site
        article: AUs 2.2 (2.)
        page_pdf: 71
        citation: « Les ouvrages techniques nécessaires au fonctionnement d'un service public ou d'intérêt collectif
          dont l'implantation dans la zone est rendue nécessaire pour des raisons techniques ou économiques, sous
          réserve de prendre les dispositions utiles pour limiter la gêne qui pourrait en découler et assurer une
          bonne intégration dans le site. »
    note: 'Aucune autre sous-destination R151-28 n''est admise : AUs 2.2 (p. 71) n''autorise par ailleurs que les
      constructions/ouvrages liés aux réseaux, à la voirie, au stationnement, à la production-distribution d''énergie
      « répondant aux besoins de l''urbanisation future » (1.), les travaux-installations liés aux ouvrages autorisés,
      aux besoins hydrauliques ou à une DUP (3.) et la reconstruction à l''identique après sinistre (4.). « L''ouverture
      à l''urbanisation de la zone est conditionnée à une modification du PLU » (caractère de zone, p. 70). Articles
      3 à 14 : « Sans objet » (p. 71-73).'
  AUse:
    renvoi: AUs
    renvoi_src: 'Caractère de zone, p. 70 : « Il existe un secteur AUse réservé au développement de l''activité
      artisanale. » ; Dispositions générales, art. 3 (p. 6) : « Dès lors qu''une zone comprend un ou plusieurs secteurs,
      la règle générale de la zone s''applique à chacun d''eux sauf lorsqu''une disposition particulière est prévue
      pour l''un de ces secteurs. » Les articles AUs 1 et AUs 2 (p. 71) ne comportent aucune disposition propre
      au secteur AUse.'
    note: 'La vocation artisanale d''AUse n''est écrite qu''au caractère de zone (indicatif, jamais une règle) :
      aucune règle du chapitre AUs n''autorise l''artisanat dans le secteur — le régime écrit reste celui d''AUs
      (tout interdit sauf AUs 2.2).'
  A:
    silence: interdit
    silence_src: 'Art. A 1.2, p. 74 : « A l''exception de ceux visés à l''article A2.2., sont interdits les nouvelles
      constructions à destination d''habitation, les constructions, ouvrages et travaux non nécessaires à une exploitation
      agricole. » — tout ce qui n''est pas nécessaire à une exploitation agricole (et toute habitation nouvelle)
      est interdit, sauf les exceptions listées à A 2.2.'
    sous_destinations:
      exploitation_agricole:
        statut: sous_condition
        condition: bâtiments techniques agricoles, annexes, ouvrages et travaux nécessaires aux besoins d'une exploitation
          agricole, justifiés (superficie de l'exploitation, nature de l'activité, matériel, bâtiments existants),
          implantation adaptée au site, implantations en crête interdites ; exclu du secteur Acu
        article: A 2.2 (1.)
        page_pdf: 75
        citation: « A l'exception du secteur Acu, les bâtiments techniques agricoles et leurs annexes ainsi que
          les ouvrages et travaux nécessaires aux besoins d'une exploitation agricole. Ils doivent être justifiés
          au regard de la superficie de l'exploitation, de la nature de l'activité, du matériel utilisé et des bâtiments
          existants sur l'exploitation. […] A ce titre les implantations en crête sont interdites. »
      logement:
        statut: sous_condition
        condition: habitation principale strictement nécessaire aux besoins d'une exploitation agricole (travaux
          d'amélioration/extension compris), un seul logement par exploitation, justifiée par la nature de l'activité,
          implantation adaptée au site ; exclu du secteur Acu
        seuil_m2: 120
        seuil_type: surface_plancher
        article: A 2.2 (2.)
        page_pdf: 75
        citation: « A l'exception du secteur Acu, les constructions à usage d'habitation principale strictement
          nécessaires aux besoins d'une exploitation agricole ainsi que les travaux d'amélioration ou d'extension
          de ces constructions dans la limite totale de 120 m² de surface de plancher et d'un seul logement par
          exploitation. »
      hebergement:
        statut: interdit
        article: A 1.2
        page_pdf: 74
        citation: « … sont interdits les nouvelles constructions à destination d'habitation … » — la destination
          Habitation du glossaire (p. 113) inclut les résidences pour étudiants, personnes âgées ou dépendantes,
          personnes handicapées ; la seule exception (A 2.2 (2.)) vise l'« habitation principale » de l'exploitant.
      artisanat_commerce_detail:
        statut: sous_condition
        condition: uniquement les locaux destinés à la vente des produits de l'exploitation ; exclu du secteur Acu
        seuil_m2: 30
        seuil_type: surface_plancher
        article: A 2.2 (5.)
        page_pdf: 75
        citation: « A l'exception du secteur Acu, les locaux destinés à la vente des produits de l'exploitation.
          Ces constructions sont admises dans la limite totale de 30 m² de surface de plancher. » — tout autre commerce
          de détail reste interdit par A 1.2 (non nécessaire à une exploitation agricole).
      locaux_techniques_administrations:
        statut: sous_condition
        condition: implantation rendue nécessaire pour des raisons techniques, économiques ou de sécurité ; éviter/réduire/compenser
          les conséquences sur l'environnement et l'économie agricole ; implantation limitée à la nécessité technique
        article: A 2.2 (7.)
        page_pdf: 75
        citation: « Les ouvrages techniques nécessaires au fonctionnement d'un service public ou d'intérêt collectif
          dont l'implantation dans la zone est rendue nécessaire pour des raisons techniques, économiques ou de
          sécurité […] L'implantation de ces ouvrages doit être limitée à leur nécessité technique. »
    note: 'Autres exceptions écrites à A 2.2 (p. 75), non mappées faute de couvrir pleinement une sous-destination
      R151-28 : ICPE et activités soumises au règlement sanitaire départemental (3., hors Acu) ; « constructions
      à usage agritouristique » sur le terrain d''assiette d''une exploitation existante, locaux dans l''enveloppe
      des bâtiments existants ou accolés, limite 30 m² de surface de plancher (4., hors Acu) ; adaptation-réfection-extension
      limitée des constructions existantes non nécessaires à une exploitation agricole, limite totale 20 m² de surface
      de plancher (6.). L''exploitation forestière n''est écrite nulle part dans les articles A 1-A 2 (hors secteur
      Acu) → non mentionnée, le silence (interdit) s''applique.'
  Acu:
    silence: interdit
    silence_src: 'Art. A 1.2, p. 74 (la règle générale de la zone s''applique au secteur — Dispositions générales,
      art. 3, p. 6) : « A l''exception de ceux visés à l''article A2.2., sont interdits les nouvelles constructions
      à destination d''habitation, les constructions, ouvrages et travaux non nécessaires à une exploitation agricole.
      » Les exceptions 1 à 5 d''A 2.2 s''ouvrent toutes par « A l''exception du secteur Acu » (p. 75) : le régime
      d''Acu est réduit aux items 6, 7 et 9.'
    sous_destinations:
      exploitation_agricole:
        statut: sous_condition
        condition: réhabilitation des bâtiments agricoles existants ; extension seulement si nécessaire à leur mise
          aux normes avec impact environnemental et paysager réduit ; aménagements nécessaires à la mise en culture
          et à l'exploitation agricole des terrains, sous réserve d'intégration paysagère — pas de bâtiment agricole
          neuf écrit (A 2.2 (1.) exclut Acu)
        article: A 2.2 (9.)
        page_pdf: 75
        citation: « Dans le secteur Acu, est autorisée la réhabilitation des bâtiments agricoles existants et leur
          extension dans le cas où celle-ci est nécessaire à leur mise aux normes et que leur impact environnemental
          et paysager est réduit. Sont autorisés les aménagements nécessaires à la mise en culture et à l'exploitation
          agricole des terrains concernés, à l'aquaculture et à l'exploitation forestière, sous réserve de faire
          l'objet d'une intégration paysagère. »
      exploitation_forestiere:
        statut: sous_condition
        condition: uniquement les « aménagements » nécessaires à l'exploitation forestière, sous réserve d'intégration
          paysagère (aucune construction neuve n'est écrite)
        article: A 2.2 (9.)
        page_pdf: 75
        citation: « Sont autorisés les aménagements nécessaires à la mise en culture et à l'exploitation agricole
          des terrains concernés, à l'aquaculture et à l'exploitation forestière, sous réserve de faire l'objet
          d'une intégration paysagère. »
      logement:
        statut: interdit
        article: A 1.2 et A 2.2 (2.)
        page_pdf: 74
        citation: 'A 1.2, p. 74 : « … sont interdits les nouvelles constructions à destination d''habitation … »
          ; l''exception logement d''exploitation (A 2.2 (2.), p. 75) s''ouvre par « A l''exception du secteur Acu
          ».'
      hebergement:
        statut: interdit
        article: A 1.2
        page_pdf: 74
        citation: « … sont interdits les nouvelles constructions à destination d'habitation … » (destination Habitation
          du glossaire p. 113, incluant les résidences) — aucune exception applicable en Acu.
      artisanat_commerce_detail:
        statut: interdit
        article: A 1.2 et A 2.2 (5.)
        page_pdf: 75
        citation: L'exception « locaux destinés à la vente des produits de l'exploitation » (A 2.2 (5.)) s'ouvre
          par « A l'exception du secteur Acu » ; l'interdiction générale A 1.2 (p. 74) s'applique.
      locaux_techniques_administrations:
        statut: sous_condition
        condition: implantation rendue nécessaire pour des raisons techniques, économiques ou de sécurité ; éviter/réduire/compenser
          ; implantation limitée à la nécessité technique (A 2.2 (7.) ne comporte pas d'exclusion Acu)
        article: A 2.2 (7.)
        page_pdf: 75
        citation: « Les ouvrages techniques nécessaires au fonctionnement d'un service public ou d'intérêt collectif
          dont l'implantation dans la zone est rendue nécessaire pour des raisons techniques, économiques ou de
          sécurité … »
    note: Secteur « correspondant aux espaces de coupure d'urbanisation identifiés par le SAR » (caractère de zone,
      p. 74 — indicatif). A 2.2 (9.), p. 75, autorise aussi « les installations de distribution, de traitement ou
      de stockage de l'eau » et l'aquaculture (termes hors nomenclature R151-28 → non mappés). L'extension limitée
      des constructions existantes non agricoles (A 2.2 (6.), 20 m² SDP) ne comporte pas d'exclusion Acu.
  Arh:
    silence: interdit
    silence_src: 'Art. A 1.2, p. 74 (la règle générale de la zone s''applique au secteur — Dispositions générales,
      art. 3, p. 6) : « A l''exception de ceux visés à l''article A2.2., sont interdits les nouvelles constructions
      à destination d''habitation, les constructions, ouvrages et travaux non nécessaires à une exploitation agricole.
      »'
    sous_destinations:
      logement:
        statut: sous_condition
        condition: constructions nouvelles à usage d'habitation intégrées dans leur environnement sans le dénaturer,
          ne portant pas atteinte à la préservation des sols naturels, agricoles et forestiers
        seuil_m2: 120
        seuil_type: surface_plancher
        article: A 2.2 (8.)
        page_pdf: 75
        citation: « Dans le secteur Arh, les constructions nouvelles à usage d'habitation dès lors qu'elles s'intègrent
          dans leur environnement sans le dénaturer et qu'elles ne portent pas atteinte à la préservation des sols
          naturels, agricoles et forestiers. Ces constructions sont admises dans la limite totale de 120 m² de surface
          de plancher. »
      hebergement:
        statut: sous_condition
        condition: 'même règle que le logement : « usage d''habitation » (la destination Habitation du glossaire
          p. 113 inclut les résidences pour étudiants, personnes âgées, personnes handicapées), limite totale 120
          m² de surface de plancher, intégration à l''environnement'
        seuil_m2: 120
        seuil_type: surface_plancher
        article: A 2.2 (8.)
        page_pdf: 75
        citation: « Dans le secteur Arh, les constructions nouvelles à usage d'habitation … dans la limite totale
          de 120 m² de surface de plancher. » — mappage via la définition Habitation du glossaire (p. 113).
      exploitation_agricole:
        statut: sous_condition
        condition: bâtiments techniques agricoles et annexes nécessaires aux besoins d'une exploitation agricole,
          justifiés, implantation adaptée au site, crêtes interdites (A 2.2 (1.) n'exclut que le secteur Acu)
        article: A 2.2 (1.)
        page_pdf: 75
        citation: « A l'exception du secteur Acu, les bâtiments techniques agricoles et leurs annexes ainsi que
          les ouvrages et travaux nécessaires aux besoins d'une exploitation agricole … »
      artisanat_commerce_detail:
        statut: sous_condition
        condition: uniquement les locaux destinés à la vente des produits de l'exploitation (A 2.2 (5.) n'exclut
          que le secteur Acu)
        seuil_m2: 30
        seuil_type: surface_plancher
        article: A 2.2 (5.)
        page_pdf: 75
        citation: « A l'exception du secteur Acu, les locaux destinés à la vente des produits de l'exploitation.
          Ces constructions sont admises dans la limite totale de 30 m² de surface de plancher. »
      locaux_techniques_administrations:
        statut: sous_condition
        condition: implantation rendue nécessaire pour des raisons techniques, économiques ou de sécurité ; implantation
          limitée à la nécessité technique
        article: A 2.2 (7.)
        page_pdf: 75
        citation: « Les ouvrages techniques nécessaires au fonctionnement d'un service public ou d'intérêt collectif
          … »
    note: 'Secteur L.151-13 (STECAL) : « des constructions peuvent être autorisées dans des secteurs de taille et
      de capacité d''accueil limitées, à la condition qu''elles ne portent atteinte à la préservation des sols agricoles
      » (caractère de zone, p. 74 — indicatif). Les autres exceptions d''A 2.2 (agritourisme 30 m², ICPE, extension
      20 m² de l''existant non agricole) s''appliquent aussi en Arh (aucune exclusion écrite).'
  N:
    silence: interdit
    silence_src: 'Art. N 1.2, p. 84 : « Sont interdits les constructions, ouvrages et travaux non prévus à l''article
      N2.2., ainsi que ceux de nature à porter atteinte à la protection de la zone. » — liste fermée d''autorisations
      : tout ce qui n''est pas prévu à N 2.2 est interdit.'
    sous_destinations:
      exploitation_agricole:
        statut: sous_condition
        condition: s'insérer dans le milieu environnant et ne pas compromettre le caractère naturel et le paysage
          de la zone (admis en zone N stricte ; exclu des secteurs Nco, Nr, Nli et Nu)
        article: N 2.2 (8.)
        page_pdf: 85
        citation: « A l'exception des secteurs Nco, Nr, Nli et Nu, les activités et constructions à destination
          agricole dès lors qu'elles s'insèrent dans le milieu environnant et qu'elles ne compromettent pas le caractère
          naturel et la paysage de la zone. »
      locaux_techniques_administrations:
        statut: sous_condition
        condition: installations et ouvrages techniques d'infrastructure nécessaires au fonctionnement des services
          publics, s'insérant dans le milieu environnant sans compromettre le caractère naturel de la zone (exclu
          des secteurs Nr et Nli)
        article: N 2.2 (7.)
        page_pdf: 85
        citation: « A l'exception des secteurs Nr et Nli, les constructions, ouvrages et travaux liés aux différents
          réseaux, à la voirie, à la production et à la distribution d'énergie, notamment les énergies renouvelables
          ainsi que les installations et ouvrages techniques d'infrastructure nécessaires au fonctionnement des
          services publics, dès lors qu'ils s'insèrent dans le milieu environnant et qu'ils ne compromettent pas
          le caractère naturel de la zone. »
    note: 'Autres autorisations écrites à N 2.2 (p. 85-86), hors nomenclature destinations : aménagements légers
      à vocation touristique et de loisirs ouverts au public, SANS hébergement (1.) ; travaux liés aux ouvrages
      autorisés (2.) ; gestion des risques PPR (3.) ; travaux sur bâti protégé L.151-19 (4.) ; travaux d''aménagement
