          les ouvrages et travaux nécessaires aux besoins d'une exploitation agricole. Ils doivent être justifiés
          au regard de la superficie de l'exploitation, de la nature de l'activité, du matériel utilisé et des bâtiments
          existants sur l'exploitation. »
      logement:
        statut: sous_condition
        condition: uniquement l'habitation principale d'un exploitant agricole strictement nécessaire aux besoins
          de l'exploitation, dans la limite totale de 120 m² de surface de plancher, avec justification de la présence
          permanente et du choix d'implantation (A2.2-4) ; pour les habitations existantes, amélioration/extension/reconstruction
          limitées à +30 % de la surface de plancher, dans la limite de 20 m² et sans excéder 120 m² au total (A2.2-5)
          ; avis CDPENAF (A2.1)
        seuil_m2: 120
        seuil_type: surface_plancher
        article: A2.2-4 / A2.2-5
        page_pdf: 33
        citation: « A l'exception du secteur Acu et Aenr, les constructions à usage d'habitation principale d'un
          exploitant agricole strictement nécessaires aux besoins d'une exploitation agricole dans la limite totale
          de 120 m² de surface de plancher. » ; « …ne pas augmenter la surface de plancher existante … de plus de
          30%, dans la limite de 20m² et sans que les constructions existantes et leur extension n'excèdent une
          surface totale finale de 120m². »
      industrie:
