  UAc:
    silence: interdit
    silence_src: 'Art. U1.2-5, p. 10 : « Dans le secteur UAc, les constructions, ouvrages et travaux autres que
      ceux visées à l''article U2. » [sont interdits] + Art. U2-5, p. 11 : « Dans le secteur UAc, seules sont autorisées
      les constructions, ouvrages et travaux à destination de commerce et activités de service. »'
    sous_destinations:
      artisanat_commerce_detail:
        statut: autorise
        article: U2-5
        page_pdf: 11
        citation: « Dans le secteur UAc, seules sont autorisées les constructions, ouvrages et travaux à destination
          de commerce et activités de service. » (la destination « commerce et activité de service » comprend les
          six sous-destinations listées p. 8 du règlement — citation commune aux six)
      restauration:
        statut: autorise
        article: U2-5
        page_pdf: 11
        citation: « …seules sont autorisées les constructions, ouvrages et travaux à destination de commerce et
          activités de service. » (destination définie p. 8 — citation commune)
      commerce_gros:
        statut: autorise
        article: U2-5
        page_pdf: 11
        citation: « …seules sont autorisées les constructions, ouvrages et travaux à destination de commerce et
          activités de service. » (destination définie p. 8 — citation commune)
      activites_services_clientele:
        statut: autorise
        article: U2-5
        page_pdf: 11
        citation: « …seules sont autorisées les constructions, ouvrages et travaux à destination de commerce et
          activités de service. » (destination définie p. 8 — citation commune)
      hotels:
        statut: autorise
        article: U2-5
        page_pdf: 11
        citation: « …seules sont autorisées les constructions, ouvrages et travaux à destination de commerce et
          activités de service. » — la destination inclut la ligne « hébergement hôtelier et touristique » (p. 8),
          citation commune avec autres_hebergements_touristiques
      autres_hebergements_touristiques:
        statut: autorise
        article: U2-5
        page_pdf: 11
        citation: « …seules sont autorisées les constructions, ouvrages et travaux à destination de commerce et
          activités de service. » — ligne « hébergement hôtelier et touristique » (p. 8), citation commune avec
          hotels
      cinema:
        statut: autorise
        article: U2-5
        page_pdf: 11
        citation: « …seules sont autorisées les constructions, ouvrages et travaux à destination de commerce et
          activités de service. » (destination définie p. 8 — citation commune)
    notes:
    - 'Le « seules » de l''U2-5 exclut tout le reste (habitation comprise) ; les autres items de l''U2 (1 à 4) sont
      eux aussi « visés à l''article U2 » au sens de l''U1.2-5 — tension de rédaction non tranchée ici : lecture
      stricte retenue = commerce et activités de service seulement.'
