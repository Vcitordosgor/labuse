  UC1:
    silence: interdit
    silence_src: 'Art. U2-6, p. 11 : « Dans le secteur UC1, seules sont autorisées les constructions et installations
      peuvent être autorisées à des fins exclusives d''amélioration de l''offre de logement ou d''hébergement et
      d''implantation de services publics… » (« seules sont autorisées » → tout le reste est interdit)'
    sous_destinations:
      logement:
        statut: sous_condition
        condition: fins exclusives d'amélioration de l'offre de logement ; ne pas étendre le périmètre bâti existant
          ni modifier de manière significative les caractéristiques de ce bâti ; avis de la commission départementale
          de la nature, des paysages et des sites (L.121-8) ; refus si atteinte à l'environnement ou aux paysages
        article: U2-6
        page_pdf: 11
        citation: « …seules sont autorisées les constructions et installations … à des fins exclusives d'amélioration
          de l'offre de logement ou d'hébergement et d'implantation de services publics, lorsque ces constructions
          et installations n'ont pas pour effet d'étendre le périmètre bâti existant ni de modifier de manière significative
          les caractéristiques de ce bâti. »
      hebergement:
        statut: sous_condition
        condition: fins exclusives d'amélioration de l'offre d'hébergement ; mêmes conditions que logement (pas
          d'extension du périmètre bâti, avis CDNPS L.121-8)
        article: U2-6
        page_pdf: 11
        citation: « …à des fins exclusives d'amélioration de l'offre de logement ou d'hébergement… » (citation commune
          avec logement)
    notes:
    - '« …et d''implantation de services publics » (U2-6, p. 11) également admise — terme non mappé : « services
      publics » ne recouvre pleinement aucune des six sous-destinations d''équipements (douteux → non écrit).'
    - Phrase de l'U2-6 grammaticalement défectueuse dans la source (« seules sont autorisées les constructions et
      installations peuvent être autorisées ») — relayée telle quelle.
  UE:
    silence: autorise
    silence_src: 'Art. UE2, p. 20 : « Sont admises toutes les occupations et utilisations du sol non citées à l''article
      UE 1.2, ainsi, que celles ci-après dès lors qu''elles respectent les conditions suivantes »'
    sous_destinations:
      exploitation_agricole:
        statut: interdit
        article: UE1.2-1
        page_pdf: 20
        citation: « Les constructions, ouvrages et travaux à destination agricole et forestière. » (citation commune
          avec exploitation_forestiere)
      exploitation_forestiere:
        statut: interdit
        article: UE1.2-1
        page_pdf: 20
        citation: « Les constructions, ouvrages et travaux à destination agricole et forestière. » (citation commune
          avec exploitation_agricole)
      logement:
        statut: interdit
        article: UE1.2-2
        page_pdf: 20
        citation: '« Les constructions, ouvrages et travaux à usage d''habitation à l''exception de ceux visés à
          l''article UE2. » (habitation = logement + hébergement, p. 8 — citation commune avec hebergement ; seule
          exception lue à l''UE2 : « Les travaux d''extension limitée des constructions existantes, même si elles
          ne sont pas autorisées dans la zone » UE2-4, p. 20)'
      hebergement:
        statut: interdit
        article: UE1.2-2
        page_pdf: 20
        citation: « Les constructions, ouvrages et travaux à usage d'habitation à l'exception de ceux visés à l'article
          UE2. » (citation commune avec logement ; exception UE2-4 = extension limitée de l'existant)
      artisanat_commerce_detail:
        statut: sous_condition
        condition: emprise foncière totale cumulée de l'ensemble des constructions de commerce, bureaux et équipements
          d'intérêt collectif n'excédant pas 5 % de la superficie de la zone d'implantation (pourcentage d'emprise,
          pas de seuil en m²)
        article: UE1.2-3 / UE2-1
        page_pdf: 20
        citation: « Les constructions, ouvrages et travaux à destination de commerce, de bureaux et d'équipements
          d'intérêt collectif sont admis, dès lors que l'emprise foncière totale cumulée de l'ensemble de ces constructions
          n'excède pas 5% de la superficie de la zone d'implantation. » (« commerce » → artisanat_commerce_detail
          + commerce_gros, citation commune)
      commerce_gros:
        statut: sous_condition
        condition: emprise foncière totale cumulée (commerce + bureaux + équipements d'intérêt collectif) ≤ 5 %
          de la superficie de la zone d'implantation
        article: UE1.2-3 / UE2-1
        page_pdf: 20
        citation: « …destination de commerce, de bureaux et d'équipements d'intérêt collectif … n'excède pas 5%
          de la superficie de la zone d'implantation. » (citation commune avec artisanat_commerce_detail)
      bureau:
        statut: sous_condition
        condition: emprise foncière totale cumulée (commerce + bureaux + équipements d'intérêt collectif) ≤ 5 %
          de la superficie de la zone d'implantation
        article: UE1.2-3 / UE2-1
        page_pdf: 20
        citation: « …destination de commerce, de bureaux et d'équipements d'intérêt collectif… » (« bureaux » →
          bureau)
      locaux_bureaux_administrations:
        statut: sous_condition
        condition: emprise foncière cumulée ≤ 5 % de la superficie de la zone d'implantation (UE2-1) ; les constructions
          et installations nécessaires aux services publics ou d'intérêt collectif sont par ailleurs admises « dès
          lors qu'ils s'insèrent dans le milieu environnant » (UE2-2)
        article: UE1.2-3 / UE2-1 / UE2-2
        page_pdf: 20
        citation: « …et d'équipements d'intérêt collectif … n'excède pas 5% de la superficie de la zone d'implantation.
          » (la destination « équipements d'intérêt collectif et services publics » comprend les six sous-destinations
          listées p. 9 — citation commune aux six)
      locaux_techniques_administrations:
        statut: sous_condition
        condition: emprise foncière cumulée ≤ 5 % de la superficie de la zone d'implantation (UE2-1) ; UE2-2 admet
          en outre les services publics/intérêt collectif s'insérant dans le milieu environnant
        article: UE1.2-3 / UE2-1 / UE2-2
        page_pdf: 20
        citation: « …et d'équipements d'intérêt collectif… » (destination définie p. 9 — citation commune)
      enseignement_sante_action_sociale:
        statut: sous_condition
        condition: emprise foncière cumulée ≤ 5 % de la superficie de la zone d'implantation (UE2-1)
        article: UE1.2-3 / UE2-1
        page_pdf: 20
        citation: « …et d'équipements d'intérêt collectif… » (destination définie p. 9 — citation commune)
      salles_art_spectacles:
        statut: sous_condition
        condition: emprise foncière cumulée ≤ 5 % de la superficie de la zone d'implantation (UE2-1)
        article: UE1.2-3 / UE2-1
        page_pdf: 20
        citation: « …et d'équipements d'intérêt collectif… » (destination définie p. 9 — citation commune)
      equipements_sportifs:
        statut: sous_condition
        condition: emprise foncière cumulée ≤ 5 % de la superficie de la zone d'implantation (UE2-1)
        article: UE1.2-3 / UE2-1
        page_pdf: 20
        citation: « …et d'équipements d'intérêt collectif… » (destination définie p. 9 — citation commune)
      autres_equipements_public:
        statut: sous_condition
        condition: emprise foncière cumulée ≤ 5 % de la superficie de la zone d'implantation (UE2-1)
        article: UE1.2-3 / UE2-1
        page_pdf: 20
        citation: « …et d'équipements d'intérêt collectif… » (destination définie p. 9 — citation commune, « autres
          équipements recevant du public » recouvre notamment les lieux de culte, p. 9)
      lieux_culte:
        statut: sous_condition
        condition: emprise foncière cumulée ≤ 5 % de la superficie de la zone d'implantation (UE2-1) — la nomenclature
          du règlement (p. 9) range les lieux de culte dans « autres équipements recevant du public »
        article: UE1.2-3 / UE2-1
        page_pdf: 20
        citation: '« …et d''équipements d''intérêt collectif… » ; p. 9 : « Cette sous-destination recouvre notamment
          les lieux de culte » (sous « Autres équipements recevant du public »)'
    notes:
    - 'Industrie et entrepôt : non cités à l''UE1.2 → admis par le silence (UE2, p. 20) — cohérent avec le caractère
      de la zone (indicatif seulement).'
    - 'Restauration, activités de services avec accueil d''une clientèle, hébergement hôtelier et touristique, cinéma
      : non cités à l''UE1.2 (le texte interdit « commerce », mappé strictement sur détail + gros) → relèvent du
      silence (autorisé). Ambiguïté possible si « commerce » visait toute la destination « commerce et activités
      de service » — douteux → non écrit.'
    - 'Anomalie de renvoi : l''UE1.2-3 (p. 20) dit « sauf ceux visées à l''article UE 2.2 » alors que la condition
      des 5 % figure à l''UE2-1 (l''UE2-2 porte sur les services publics/réseaux). Les deux items sont cités.'
    - Tableau de synthèse p. 21 illisible à l'extraction texte (symboles perdus) — relayé depuis les articles UE1
      à UE3.
    - 'UE3 (mixité sociale) : « Sans objet » (p. 21).'
  1AUa:
    renvoi: UA
    renvoi_src: 'Art. AUindicée 1.2, p. 29 : « Se reporter au règlement de la zone U indiquée en indice ainsi qu''aux
      Orientations d''Aménagement et de Programmation. » ; Titre III, p. 29 : « il convient de se reporter en fonction
      de l''indice de la zone AU considérée au règlement des zones urbaines correspondantes » (idem DG 3.2, p. 6)'
    notes:
    - 'Conditions propres AU (AUindicée 2, p. 29-30) : infrastructures suffisantes (2-1), compatibilité OAP (2-2),
      densité minimale brute « en zones AUa, 30 logements par hectare » (2-5, p. 30 ; équivalent logement = 80 m²
      de surface de plancher).'
  1AUac:
    renvoi: UAc
    renvoi_src: 'Art. AUindicée 1.2, p. 29 : « Se reporter au règlement de la zone U indiquée en indice » — l''indice
      « Ac » désigne le secteur UAc (zone de développement commercial, p. 5 et 10). Le règlement ne liste pas nommément
      les zones AU indicées : rattachement par lecture de l''indice, signalé.'
    notes:
    - 'Conditions propres AU (AUindicée 2, p. 29-30) : infrastructures, OAP ; densité 2-5 : la zone porte l''indice
      a (« en zones AUa, 30 logements par hectare », p. 30) — application à 1AUac non explicitée par le texte.'
  1AUb:
    renvoi: UB
    renvoi_src: 'Art. AUindicée 1.2, p. 29 : « Se reporter au règlement de la zone U indiquée en indice ainsi qu''aux
      Orientations d''Aménagement et de Programmation. »'
    notes:
    - 'Densité minimale brute : « en zones AUb, 20 logements par hectare » (AUindicée 2-5, p. 30).'
  1AUc:
    renvoi: UC
    renvoi_src: 'Art. AUindicée 1.2, p. 29 : « Se reporter au règlement de la zone U indiquée en indice ainsi qu''aux
      Orientations d''Aménagement et de Programmation. »'
    notes:
    - 'Densité minimale brute : « en zone AUc, 10 logements par hectare » (AUindicée 2-5, p. 30).'
  1AUe:
    renvoi: UE
    renvoi_src: 'Art. AUindicée 1.2, p. 29 : « Se reporter au règlement de la zone U indiquée en indice ainsi qu''aux
      Orientations d''Aménagement et de Programmation. » (l''AUindicée 2-3, p. 29, cite expressément des « zones
      1AUe »)'
  2AUa:
    renvoi: UA
    renvoi_src: 'Art. AUindicée 1.2, p. 29 : « Se reporter au règlement de la zone U indiquée en indice » ; Titre
      III p. 29 et DG 3.2 p. 6.'
    notes:
    - 'Ouverture différée : « Pour les zones 2AUindicée, leur ouverture à l''urbanisation ne pourra intervenir qu''une
      fois l''aménagement de l''ensemble des zones 1AUindicée entrepris dans le pôle urbain concerné. » (AUindicée
      2-3, p. 29 ; horizon 2031, p. 6 et 29).'
