          services publics… » (citation commune)
      enseignement_sante_action_sociale:
        statut: sous_condition
        condition: mêmes conditions A2.2-7
        article: A2.2-7
        page_pdf: 33
        citation: « Les constructions et installations nécessaires à des équipements d'intérêt collectif ou à des
