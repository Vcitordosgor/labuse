zones:
  UA:
    silence: autorise
    silence_src: 'Art. U2, p. 10 : « Sont admises toutes les occupations et utilisations du sol non citées à l''article
      U 1.2, ainsi, que celles ci-après dès lors qu''elles respectent les conditions suivantes »'
    sous_destinations:
      industrie:
        statut: interdit
        article: U1.2-1
        page_pdf: 10
        citation: « Les constructions, ouvrages et travaux à destination industrielle et à destination exclusive
          d'entrepôt. »
      entrepot:
        statut: sous_condition
        condition: seule la destination EXCLUSIVE d'entrepôt est interdite (U1.2-1) ; un entrepôt non exclusif (lié
          à une autre destination admise) n'est pas cité à l'U1.2 → admis par le silence (U2)
        article: U1.2-1
        page_pdf: 10
        citation: « …et à destination exclusive d'entrepôt. »
      exploitation_agricole:
        statut: interdit
        article: U1.2-2
        page_pdf: 10
        citation: « Les constructions, ouvrages et travaux à destination agricole et forestière. » (citation commune
          avec exploitation_forestiere ; l'U1.2-3 interdit en outre « les constructions, ouvrages et travaux à destination
          d'élevage »)
      exploitation_forestiere:
        statut: interdit
        article: U1.2-2
        page_pdf: 10
        citation: « Les constructions, ouvrages et travaux à destination agricole et forestière. » (citation commune
          avec exploitation_agricole)
      logement:
        statut: sous_condition
        condition: admis (silence U2) ; en cas de programme de logements de plus de 4 000 m² de surface de plancher,
          au minimum 40 % du programme doit être affecté à des logements aidés
        seuil_m2: 4000
        seuil_type: surface_plancher
        article: U3
        page_pdf: 11
        citation: « En cas de réalisation d'un programme de logements représentant une surface de plancher supérieure
          à 4 000 m², au minimum 40% de ce programme doit être affecté à des logements aidés (logements locatifs
          sociaux, logements intermédiaires…). »
    notes:
    - 'Usages interdits non mappés en sous-destinations : « dépôts de ferrailles et les décharges » (U1.2-4, p.
      10).'
    - 'Condition générale U2-2 (p. 11) : les constructions à destination d''activités (ICPE ou non) sont admises
      « à condition qu''elles n''entraînent pour le voisinage aucune incommodité et aucune aggravation des risques
      » — terme « activités » trop large pour être mappé sur des sous-destinations.'
    - 'U2-1 (p. 10-11) : dans la bande des cinquante pas géométriques délimitée au document graphique, régime spécial
      (« seules sont autorisées les services publics, les équipements collectifs, … les commerces, les structures
      artisanales, les équipements touristiques et hôteliers… »).'
    - Tableau de synthèse « Sont interdits, admis ou soumis à conditions » p. 11-12 illisible à l'extraction texte
      (symboles autorisé/interdit perdus) — relayé depuis le texte des articles U1 à U3.
