        condition: uniquement l'ouverture et l'exploitation de carrières (activité extractive, rangée dans la sous-destination
          industrie par la définition p. 8 du règlement) et leurs constructions/équipements annexes, dans les seuls
          secteurs protégés au titre de l'article R.151-34 délimités aux documents graphiques ; remise en état du
          site après extraction permettant la continuité de l'activité agricole
        article: A2.2-10
        page_pdf: 33
        citation: '« Dans les secteurs protégés en raison de la richesse du sol ou du sous-sol au titre de l''article
          R.151-34 … l''ouverture, l''exploitation de carrières ainsi que les constructions et installations nécessaires
          à leur exploitation ainsi que leurs équipements annexes … sont autorisés. » (p. 8 : la sous-destination
          industrie recouvre « l''activité extractive »)'
      locaux_bureaux_administrations:
        statut: sous_condition
        condition: constructions et installations nécessaires à des équipements d'intérêt collectif ou services
          publics, non incompatibles avec l'activité agricole/pastorale/forestière de l'unité foncière, sans atteinte
          aux espaces naturels et paysages, avec mesures éviter/réduire/compenser
        article: A2.2-7
        page_pdf: 33
        citation: « Les constructions et installations nécessaires à des équipements d'intérêt collectif ou à des
