  structure: 'Ancien format : zones U avec clause « sont admises toutes les occupations non citées à l''article
    1.2 » (silence = autorisé) sauf UBpszc et UT/UTfr2 fermées (silence = interdit) ; AU indicée = renvoi ÉCRIT
    (DG art. 3 2°, p. 7) vers la zone urbaine d''indice ; AUst fermée ; A/N/Npnr/Nr/Nli fermées ; Ni1/Ni2 (Mafate)
    plafonds par destination en EMPRISE AU SOL par concession (N9). AUEm : chapitre annoncé par les DG mais absent
    de la pièce écrite → non_lu (dit tel quel).'
zones:
  UA:
    silence: autorise
    silence_src: 'Art. UA 2, 2.2, p. 11 : « Sont admises toutes les occupations et utilisations du sol non citées
      à l''article UA 1.2, ainsi, que celles ci-après dès lors qu''elles respectent les conditions suivantes »'
    notes: 'Art. UA 2.2 3° (p. 11) admet « les constructions à destination d''activités, exceptées celles visées
      à l''article 1-2 » sous réserve de n''entraîner « pour le voisinage ni incommodité et ni aggravation des risques
      » — terme générique « activités » non mappable à des sous-destinations précises (douteux → non écrit) ; ICPE
      autorisées sauf secteur UApsfr2. Art. UA 1.2 4° et 5° (p. 10) interdisent les terrains de camping et de caravaning,
      les dépôts de ferrailles et les décharges (hors nomenclature R151-28, non mappés). Art. UA 2.2 1° (p. 11)
      : régime propre aux cinquante pas géométriques délimités au document graphique (liste fermée d''occupations
      autorisées dans ce sous-périmètre).'
    sous_destinations:
      industrie:
        statut: interdit
        article: UA 1.2 1°
        page_pdf: 10
        citation: « Les constructions, ouvrages et travaux à destination industrielle et à destination exclusive
          d'entrepôt. »
      entrepot:
        statut: sous_condition
        condition: interdit à titre exclusif (UA 1.2 1°, p. 10) ; admis si nécessaire au fonctionnement d'une activité
          commerciale, artisanale ou de bureaux, dans la limite de 20 % de la surface de plancher totale de l'activité
          (taux en %, pas de seuil en m²)
        article: UA 1.2 1° et UA 2.2 4°
        page_pdf: 11
        citation: « Les constructions à destination d'entrepôt à condition qu'elles soient nécessaires au fonctionnement
          d'une activité commerciale, artisanale ou de bureaux. Elles ne peuvent pas représenter plus de 20% de
          la surface de plancher totale de l'activité. En secteur UAm, ce taux est porté à 40%. »
      exploitation_agricole:
        statut: interdit
        article: UA 1.2 2°
        page_pdf: 10
        citation: « A l'exception du secteur UAv, les constructions, ouvrages et travaux à destination agricole
          et forestière. »
      exploitation_forestiere:
        statut: interdit
        article: UA 1.2 2°
        page_pdf: 10
        citation: « A l'exception du secteur UAv, les constructions, ouvrages et travaux à destination agricole
          et forestière. »
      logement:
        statut: sous_condition
        condition: admis (jamais interdit en UA hors secteur UAa) ; pour tout programme de logements de plus de
          1 500 m² de surface de plancher, au minimum 20 % du programme affecté à des logements locatifs aidés (LLTS/LLS
          ; PLS ou accession aidée PSLA, LES, PTZ)
        seuil_m2: 1500
        seuil_type: surface_plancher
        article: UA 2.2 7°
        page_pdf: 11
        citation: « A l'exception des secteurs UAm et UAv, en cas de réalisation d'un programme de logements représentant
          une surface de plancher supérieure à 1 500 m², au minimum 20% de ce programme doit être affecté à des
          logement locatifs financés par un prêt aidé de l'État »
  UAa:
    silence: autorise
    silence_src: 'Art. UA 2, 2.2, p. 11 : « Sont admises toutes les occupations et utilisations du sol non citées
      à l''article UA 1.2 » (secteur UAa de la zone UA, mêmes articles UA 1/UA 2, p. 10-11)'
    notes: 'Secteur UAa (« zone située le long de la RN1 », p. 10). Mêmes dispositions que la zone UA (industrie
      interdite, entrepôt exclusif interdit/annexe ≤ 20 %, agricole-forestier interdit, « activités » génériques
      sous condition de non-nuisance) PLUS interdiction des constructions à usage d''habitation (UA 1.2 3°). Anomalie
      relevée : la clause de mixité sociale UA 2.2 7° (p. 11) ne dispense que les secteurs UAm et UAv — elle vise
      donc littéralement UAa où l''habitation neuve est pourtant interdite.'
