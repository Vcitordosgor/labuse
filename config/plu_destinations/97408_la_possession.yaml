      à leur fonctionnement (accueil, sanitaires, etc.) dès lors qu''ils s''insèrent dans le milieu environnant
      » — seuls « restauration » et la pratique de sports sont mappables sans doute ; « bar, spa, thalasso… » non
      mappés (douteux → non écrit). UT 2 6° (p. 58) admet les « activités en lien avec l''abri côtier, dont la pêche
