  Aba:
    silence: interdit
    silence_src: 'Art. A1.2, p. 41 (le secteur Aba relève de la zone A ; Titre I, Article 3, p. 6 : « la règle générale
      de la zone s''applique à chacun [des secteurs] sauf lorsqu''une disposition particulière est prévue ») : «
      A l''exception de ceux visés à l''article A2.2., sont interdits toutes les constructions et tous les ouvrages
      et travaux. »'
    notes:
    - 'Disposition particulière du secteur : A2.2, 7., p. 42 — habitations NOUVELLES admises (contrairement au reste
      de la zone A où l''habitation neuve exige le lien avec une exploitation agricole).'
    - Les autres admissions sous condition de la zone A (exploitation agricole A2.2 1./3./4., vente sur exploitation
      A2.2 8., équipements collectifs A2.2 9./10., extensions d'habitations existantes A2.2 5.) s'appliquent au
      secteur, aucune exclusion d'Aba n'étant écrite à l'art. A2.2 — se reporter à l'entrée A.
    - Rappel CDPENAF (A2.2 rappel 1, p. 41) applicable.
    sous_destinations:
      logement:
        statut: sous_condition
        condition: « constructions nouvelles à usage d'habitation dès lors qu'elles s'intègrent dans leur environnement
          sans le dénaturer et qu'elles ne portent pas atteinte à la préservation des sols naturels, agricoles et
          forestiers. Ces constructions sont admises dans la limite totale de 150 m² de surface de plancher. »
        seuil_m2: 150
        seuil_type: surface_plancher
        article: A2.2, 7.
        page_pdf: 42
        citation: « Dans le secteur Aba, les constructions nouvelles à usage d'habitation dès lors qu'elles s'intègrent
          dans leur environnement sans le dénaturer et qu'elles ne portent pas atteinte à la préservation des sols
          naturels, agricoles et forestiers. Ces constructions sont admises dans la limite totale de 150 m² de surface
          de plancher. »
  N:
    silence: interdit
    silence_src: 'Art. N1.2, p. 50 : « A l''exception de ceux visés à l''article N2.2., sont interdits toutes les
      constructions, ouvrages et travaux. »'
    notes:
    - 'Art. N2.2 rappel 2, p. 50 : avis favorable CDPENAF requis (permis, DP, permis d''aménager/démolir, changements
      de destination).'
    - 'Art. N2.2, 4., p. 51 : « aménagements légers à vocation touristique et de loisirs ouverts au public, sans
      hébergement et permettant la libre circulation des piétons ou des cycles (points d''arrêts, kiosques, mobilier
      urbain, terrains de jeux, poste de secours, sanitaire publics etc.) dès lors qu''ils s''insèrent dans le milieu
      environnant » — aménagements légers explicitement « sans hébergement », termes non mappés à une sous-destination
      (douteux).'
    - 'Art. N2.2, 2., p. 51 : « A l''exception du secteur Nr, les constructions, ouvrages et travaux liés à l''entretien
      et la gestion des sites (abris pour le matériel, local technique, etc.) » admis si compatibles avec le caractère
      naturel — terme non mappé (maîtrise d''ouvrage non écrite, douteux).'
    - 'Aucune construction agricole neuve n''est visée à l''art. N2.2 → exploitation agricole relève du silence
      (interdit) ; seule exception écrite : hauteurs dérogatoires « pour les bâtiments agricoles » (N10.3, p. 54),
      sans valeur d''autorisation de destination.'
    - L'habitation admise se limite à l'EXTENSION de bâtiments existants régulièrement édifiés — aucune construction
      neuve de logement n'est écrite.
    sous_destinations:
      logement:
        statut: sous_condition
        condition: extension des bâtiments d'habitation existants régulièrement édifiés uniquement (hors secteurs
          Npnr et Nr), « sous réserve de ne pas augmenter la surface de plancher existante à la date d'approbation
          du plan local d'urbanisme de plus de 30%, dans la limite de 60m² et sans pouvoir excéder une surface totale
          finale de 150 m² de surface de plancher »
