  AUa1:
    renvoi: UA1
    renvoi_src: 'Art. AUindicée 1.2, p. 29 : « Se reporter au règlement de la zone U indiquée en indice ainsi qu''aux
      Orientations d''Aménagement et de Programmation lorsqu''elles existent » ; chapeau de zone, p. 29 : « il convient
      de se reporter en fonction de l''indice de la zone AU considérée au règlement des zones urbaines correspondantes
      » — l''indice « a1 » désigne le secteur UA1 de la zone UA'
    notes:
    - 'Art. AUindicée 2.2, p. 29 : les occupations prévues au règlement de la zone U en indice sont admises sous
      deux conditions supplémentaires : 1. « Disposer des infrastructures suffisantes pour desservir le projet »
      ; 2. clause de densité minimale (20 logements/ha « en zones AUa et AUb », 10 logements/ha « en zone AUc »,
      équivalent logement = 80 m² de surface de plancher, densité appréciée à l''échelle de la zone).'
    - 'Anomalie : la clause de densité (AUindicée 2.2, 2., p. 29) ne nomme que AUa, AUb et AUc — AUa1 n''y est pas
      citée ; aucune valeur de densité n''est écrite pour AUa1.'
    - 'OAP : « tout en étant compatibles avec les Orientations d''Aménagement et de Programmation lorsqu''elles
      existent » (p. 29) — hors document lu.'
  AUb:
    renvoi: UB
    renvoi_src: 'Art. AUindicée 1.2, p. 29 : « Se reporter au règlement de la zone U indiquée en indice ainsi qu''aux
