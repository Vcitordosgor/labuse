zones:
  UA:
    silence: autorise
    silence_src: 'Art. U 2.2, p. 11 : « Sont admises toutes les occupations et utilisations du sol non citées à
      l''article U 1.2, ainsi, que celles ci-après dès lors qu''elles respectent les conditions suivantes » — liste
      fermée d''interdictions à l''art. U 1.2 (p. 10)'
    notes:
    - 'Art. U 1.2, 3., p. 10 : « Les constructions, ouvrages et travaux à destination d''élevage » sont interdits
      — terme sans équivalent plein parmi les 23 sous-destinations (l''élevage n''épuise pas exploitation_agricole)
      → non mappé, restriction partielle à connaître.'
    - 'Art. U 2.2, 1., p. 11 : les « constructions à destination d''activités » (hors interdictions de l''art. U
      1.2) sont admises « à condition qu''elles n''entraînent pour le voisinage ni incommodité et ni aggravation
      des risques » — terme générique, non mappé à une sous-destination précise.'
    - 'Art. U 1.2, 4., p. 10 : « Les dépôts de ferrailles et les décharges » interdits (usage, pas une sous-destination
      R151-28).'
    sous_destinations:
      industrie:
        statut: interdit
        article: U 1.2, 1.
        page_pdf: 10
        citation: « Les constructions, ouvrages et travaux à destination industrielle et à destination exclusive
          d'entrepôt. »
      exploitation_forestiere:
        statut: interdit
        article: U 1.2, 2.
        page_pdf: 10
        citation: « Les constructions, ouvrages et travaux à destination forestière. »
      entrepot:
        statut: sous_condition
        condition: interdit « à destination exclusive d'entrepôt » (U 1.2, 1., p. 10) ; admis si nécessaire au fonctionnement
          d'une activité commerciale, artisanale ou de bureaux, sans représenter plus de 70 % de la surface de plancher
          totale de l'activité
        article: U 1.2, 1. et U 2.2, 2.
        page_pdf: 11
        citation: « Les constructions à destination d'entrepôt à condition qu'elles soient nécessaires au fonctionnement
          d'une activité commerciale, artisanale ou de bureaux. Elles ne peuvent pas représenter plus de 70% de
          la surface de plancher totale de l'activité. »
  UA1:
    renvoi: UA
    renvoi_src: 'Titre I, Article 3, p. 6 : « Dès lors que la zone comprend un ou plusieurs secteurs, la règle générale
      de la zone s''applique à chacun d''eux sauf lorsqu''une disposition particulière est prévue pour l''un de
      ces secteurs » — les articles U 1 et U 2 (p. 10-11) ne prévoient aucune disposition particulière pour le secteur
      UA1 (dispositions propres à UA1 uniquement aux art. U 10.2 hauteur et U 11 aspect, p. 15-17)'
