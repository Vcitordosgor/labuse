  A:
    silence: interdit
    silence_src: 'Art. A1.2, p. 41 : « A l''exception de ceux visés à l''article A2.2., sont interdits toutes les
      constructions et tous les ouvrages et travaux. »'
    notes:
    - 'Art. A2.2 rappel 1, p. 41 : permis, déclarations préalables, permis d''aménager/démolir et changements de
      destination soumis à l''avis favorable de la CDPENAF (L181-12 code rural).'
    - 'Art. A2.2, 8., p. 42 : « constructions à usage agritouristique ou destinées à la vente … sur le terrain d''assiette
      d''une exploitation existante » — seule la vente (produits de l''exploitation) est mappée (artisanat_commerce_detail)
      ; « agritouristique » sans équivalent plein parmi les 23 sous-destinations → non mappé.'
    - 'Art. A1.1, 5., p. 41 (rappel) : « Sont autorisées les activités soumises au régime d''autorisation ou de
      déclaration préalable des installations classées … nécessaires à l''activité de production agricole ainsi
      que la réalisation des travaux d''amélioration foncière agricole… ».'
    sous_destinations:
      exploitation_agricole:
        statut: sous_condition
        condition: bâtiments techniques agricoles, annexes, ouvrages et travaux nécessaires aux besoins d'une exploitation
          agricole, « justifiés au regard de la superficie de l'exploitation, de la nature de l'activité, du matériel
          utilisé et des bâtiments existants », implantation adaptée au site ; activités et constructions à destination
          agricole et d'élevages « dès lors qu'ils s'insèrent dans le milieu environnant et qu'ils n'engendrent
          pas la destruction ou une menace pour les espèces patrimoniales existantes » ; réhabilitation/extension
          de bâtiments agricoles existants si nécessaire à la mise aux normes
