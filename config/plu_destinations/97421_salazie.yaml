      de ceux visés à l''article UT 2. »'
    notes:
    - 'Anomalie de forme : l''« hébergement hôtelier » figure à l''article UT 2.2 « Sont admis sous condition »
      (item 1., p. 20) sans qu''aucune condition particulière ne soit énoncée pour lui → relayé en autorisé, citation
