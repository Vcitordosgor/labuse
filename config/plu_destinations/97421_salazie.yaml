      locaux_techniques_administrations:
        statut: sous_condition
        condition: « seules les constructions et installations nécessaires à des équipements collectifs ou à des
          services publics liées à l'exploitation ou la valorisation d'une ressource d'alimentation en eau potable
          sont autorisées » (N2.2, 6.) ; s'y ajoutent, sans exclusion écrite du secteur, les travaux liés à la gestion
          des risques naturels PPR et à la sécurisation des voies (N2.2, 5.) et les réseaux/ouvrages techniques
          d'infrastructure des services publics (N2.2, 7.)
        article: N2.2, 5., 6. et 7.
        page_pdf: 51
        citation: « Dans le secteur Nr, seules les constructions et installations nécessaires à des équipements
