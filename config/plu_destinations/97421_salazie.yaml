      infrastructures suffisantes pour desservir le projet »'
    notes:
    - « Habitation » (AUe 1.2, 2. / AUe 2.2, 3.) mappé au seul logement ; couverture de la sous-destination hebergement
      par ce terme douteuse → non écrite.
    - 'Art. AUe 2.2, 5., p. 33 : clause générale — « travaux d''extension limitée des constructions existantes,
      même si elles ne sont pas autorisées dans la zone, sous réserve de ne pas augmenter la surface de plancher
      existante à la date d''approbation du PLU de plus de 30%, dans la limite de 50m² ».'
    - Le plafond des commerces/bureaux/équipements est en % de la zone (5 % d'emprise foncière cumulée), pas un
      seuil en m² par construction → pas de seuil_m2.
    - 'Industrie, artisanat, entrepôt : non cités à l''art. AUe 1.2 → relèvent du silence (autorisé) ; cohérent
      avec le caractère de zone p. 32 (« activités économiques à vocation de production, de transformation… ») et
      le tableau de stationnement AUe 12.2, p. 36 (« Activités artisanales et industrielles », « Entrepôt sans activité
