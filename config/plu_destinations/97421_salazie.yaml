          du plan local d'urbanisme de plus de 30%, dans la limite de 60m² et sans pouvoir excéder une surface totale
          finale de 150 m² de surface de plancher. »
      locaux_bureaux_administrations:
        statut: sous_condition
        condition: « constructions et installations nécessaires à des équipements collectifs ou à des services publics
