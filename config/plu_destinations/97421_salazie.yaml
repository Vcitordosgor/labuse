  Npnr:
    silence: interdit
    silence_src: 'Art. N1.2, p. 50 : « A l''exception de ceux visés à l''article N2.2., sont interdits toutes les
      constructions, ouvrages et travaux. » ; art. N2.2, 1., p. 51 : « Dans le secteur Npnr, seuls les activités,
      travaux, aménagements, constructions et installations ayant reçus une autorisation spéciale de l''établissement
      public du Parc National de la Réunion délivrée après avis de son Conseil Scientifique, conformément à l''article
      L.331-4 du code de l''Environnement, peuvent être admis. »'
    notes:
    - 'Caractère de zone, p. 48 : « espaces situés dans le cœur du parc national de la Réunion, dans lesquels aucune
      construction n''est admise, sauf autorisation spéciale » (indicatif ; la règle est N2.2, 1.).'
    - 'Aucune sous-destination n''est nommément autorisée ou conditionnée dans le secteur : le régime écrit est
      l''autorisation spéciale du Parc (L.331-4 code de l''environnement), quel que soit l''objet.'
    - 'Exclusions écrites du secteur : extension des habitations existantes non admise (« A l''exception des secteurs
      Npnr et Nr », N2.2, 3., p. 51) ; équipements collectifs/services publics non admis (« A l''exception du secteur
      Npnr », N2.2, 6., p. 51).'
  Nr:
    silence: interdit
    silence_src: 'Art. N1.2, p. 50 : « A l''exception de ceux visés à l''article N2.2., sont interdits toutes les
      constructions, ouvrages et travaux. » — dans le secteur Nr, les seules exceptions écrites le concernant sont
      N2.2, 5., 6. (restreint à l''eau potable), 7. et 8.'
    notes:
    - 'Exclusions écrites du secteur : pas de constructions liées à l''entretien/gestion des sites (« A l''exception
      du secteur Nr », N2.2, 2., p. 51) ; pas d''extension des habitations existantes (« A l''exception des secteurs
      Npnr et Nr », N2.2, 3., p. 51).'
    - 'N2.2, 6., p. 51 : « Dans le secteur Nr, seules les constructions et installations nécessaires à des équipements
      collectifs ou à des services publics liées à l''exploitation ou la valorisation d''une ressource d''alimentation
      en eau potable sont autorisées » — mappé à locaux_techniques_administrations (ouvrages AEP) ; l''extension
      aux autres sous-destinations d''équipements n''est pas écrite.'
    - 'N2.2, 5. et 7. (p. 51), sans exclusion du secteur Nr : gestion des risques naturels PPR, sécurisation des
      voies existantes, réseaux et ouvrages techniques d''infrastructure des services publics.'
