zones:
  Ua:
    silence: autorise
    silence_src: 'Art. UA 2.2, page_pdf 13 : « Sont admises toutes les occupations et utilisations du sol non citées
      à l''article UA 1.2, ainsi, que celles ci-après dès lors qu''elles respectent les conditions suivantes » —
      liste fermée d''interdictions (UA 1.2).'
    note: 'Art. UA 2.2.1 (page_pdf 13) conditionne toute « construction à destination d''activités » (hors interdits
      de l''art. 1.2) : « sous réserve qu''elles n''entraînent pour le voisinage ni incommodité et ni aggravation
      des risques ». Art. UA 1.2.3 interdit aussi « les terrains de camping et de caravaning » (usage du sol, ne
      couvre pas pleinement une sous-destination R151-28 — non mappé).'
    sous_destinations:
      industrie:
        statut: interdit
        article: UA 1.2 (1.)
        page_pdf: 12
        citation: « Les constructions, ouvrages et travaux à destination industrielle et à destination exclusive
          d'entrepôt. »
      entrepot:
        statut: interdit
        article: UA 1.2 (1.)
        page_pdf: 12
        citation: « … et à destination exclusive d'entrepôt. » (l'interdiction vise la destination EXCLUSIVE d'entrepôt)
      exploitation_agricole:
        statut: interdit
        article: UA 1.2 (2.)
        page_pdf: 12
        citation: « Les constructions, ouvrages et travaux à destination agricole et forestière. »
      exploitation_forestiere:
        statut: interdit
        article: UA 1.2 (2.)
        page_pdf: 12
        citation: « Les constructions, ouvrages et travaux à destination agricole et forestière. »
      artisanat_commerce_detail:
        statut: sous_condition
        condition: interdits lorsque « la surface de réserve excède la surface de vente » (ratio, pas de seuil en
          m²)
        article: UA 1.2 (4.)
        page_pdf: 12
        citation: « Les commerces dont la surface de réserve excède la surface de vente. » (« commerce » mappé sur
          artisanat_commerce_detail + commerce_gros)
      commerce_gros:
        statut: sous_condition
        condition: interdits lorsque « la surface de réserve excède la surface de vente » (ratio, pas de seuil en
          m²)
        article: UA 1.2 (4.)
        page_pdf: 12
        citation: « Les commerces dont la surface de réserve excède la surface de vente. »
      logement:
        statut: sous_condition
        condition: au-delà de 4 000 m² de surface de plancher d'un programme de logements, « au minimum 25% de ce
          programme doit être affecté à des logements aidés (logements locatifs sociaux, logements intermédiaires…)
          »
        seuil_m2: 4000
        seuil_type: surface_plancher
        article: UA 2.2 (3.)
        page_pdf: 13
        citation: « En cas de réalisation d'un programme de logements représentant une surface de plancher supérieure
          à 4 000m², au minimum 25% de ce programme doit être affecté à des logements aidés »
