zones:
  Ua:
    silence: autorise
    silence_src: 'Art. Ua 2.2, p. 12 : « Sont admises toutes les occupations et utilisations du sol non citées à
      l''article Ua 1.2, ainsi, que celles ci-après dès lors qu''elles respectent les conditions suivantes » — liste
      fermée d''interdictions (Art. Ua 1.2, p. 11), le reste est admis.'
    sous_destinations:
      industrie:
        statut: interdit
        article: Ua 1.2 (1.)
        page_pdf: 11
        citation: « Les constructions, ouvrages et travaux à destination industrielle et à destination exclusive
          d'entrepôt. »
      entrepot:
        statut: interdit
        article: Ua 1.2 (1.)
        page_pdf: 11
        citation: « … à destination exclusive d'entrepôt »
        note: L'interdiction vise la destination EXCLUSIVE d'entrepôt (mot du texte).
      exploitation_agricole:
        statut: interdit
        article: Ua 1.2 (2.)
        page_pdf: 11
        citation: « Les constructions, ouvrages et travaux à destination agricole. »
      artisanat_commerce_detail:
        statut: sous_condition
        condition: n'entraîner pour le voisinage aucune incommodité et aucune aggravation des risques (que la construction
          soit soumise ou non au régime ICPE)
        article: Ua 2.2 (1.)
        page_pdf: 12
        citation: « Les constructions à destination de commerce et d'artisanat, ainsi que les travaux d'amélioration
          ou d'extension de ces constructions, qu'elles soient soumises ou non au régime des installations classées
          pour la protection de l'environnement, à condition qu'elles n'entraînent pour le voisinage aucune incommodité
          et aucune aggravation des risques. »
      commerce_gros:
        statut: sous_condition
        condition: n'entraîner pour le voisinage aucune incommodité et aucune aggravation des risques (que la construction
          soit soumise ou non au régime ICPE)
        article: Ua 2.2 (1.)
        page_pdf: 12
        citation: « Les constructions à destination de commerce et d'artisanat […] à condition qu'elles n'entraînent
          pour le voisinage aucune incommodité et aucune aggravation des risques. » (« commerce » ancien format
          → artisanat_commerce_detail + commerce_gros)
    note: 'Ua 1.2 interdit aussi (hors nomenclature destinations) : création/agrandissement de terrains de camping
      et de caravaning (3.), dépôts de véhicules, ferrailles, décharges et containers non affectés à un usage professionnel
      ou d''entreposage (4.), création/extension de carrières (5.) — p. 11. « Terrains de camping » ne couvre pas
      pleinement une sous-destination R151-28 → non mappé.'
  Ub:
    silence: autorise
    silence_src: 'Art. Ub 2.2, p. 24 : « Sont admises toutes les occupations et utilisations du sol non citées à
      l''article Ua 1.2 (sic), ainsi, que celles ci-après dès lors qu''elles respectent les conditions suivantes
      » — liste fermée d''interdictions (Art. Ub 1.2, p. 23, identique mot pour mot à Ua 1.2), le reste est admis.'
    sous_destinations:
      industrie:
        statut: interdit
        article: Ub 1.2 (1.)
        page_pdf: 23
        citation: « Les constructions, ouvrages et travaux à destination industrielle et à destination exclusive
          d'entrepôt. »
      entrepot:
        statut: interdit
        article: Ub 1.2 (1.)
        page_pdf: 23
        citation: « … à destination exclusive d'entrepôt »
        note: L'interdiction vise la destination EXCLUSIVE d'entrepôt (mot du texte).
      exploitation_agricole:
        statut: interdit
        article: Ub 1.2 (2.)
        page_pdf: 23
        citation: « Les constructions, ouvrages et travaux à destination agricole. »
      artisanat_commerce_detail:
        statut: sous_condition
        condition: n'entraîner pour le voisinage aucune incommodité et aucune aggravation des risques (que la construction
          soit soumise ou non au régime ICPE)
        article: Ub 2.2 (1.)
        page_pdf: 24
        citation: « Les constructions à destination de commerce et d'artisanat ainsi que les travaux d'amélioration
          ou d'extension, de ces constructions, qu'elles soient soumises ou non au régime des installations classées
          pour la protection de l'environnement, à condition qu'elles n'entraînent pour le voisinage aucune incommodité
          et aucune aggravation des risques. »
      commerce_gros:
        statut: sous_condition
        condition: n'entraîner pour le voisinage aucune incommodité et aucune aggravation des risques (que la construction
          soit soumise ou non au régime ICPE)
        article: Ub 2.2 (1.)
        page_pdf: 24
        citation: « Les constructions à destination de commerce et d'artisanat […] » (« commerce » ancien format
          → artisanat_commerce_detail + commerce_gros)
    note: 'Mêmes interdictions hors nomenclature qu''en Ua (camping/caravaning, dépôts, carrières — Ub 1.2, p. 23).
      Règles de FORME (pas d''autorisation) attachées au commerce ≥ 800 m² de surface de plancher : retrait 10 m
      à l''alignement (Ub 6.2, p. 27), hauteur majorée de 4 m (Ub 10.2, p. 30), pentes de toit ≥ 15 % et toits terrasses
      admis sur moitié d''emprise (Ub 11.3, p. 32), clôtures 2,50 m (Ub 11.4, p. 32) — relayées ici en note, ce
      ne sont pas des conditions d''admission.'
  Uc:
    silence: autorise
    silence_src: 'Art. Uc 2.2, p. 36 : « Sont admises toutes les occupations et utilisations du sol non citées à
      l''article Ua 1.2 (sic), ainsi, que celles ci-après dès lors qu''elles respectent les conditions suivantes
      » — liste fermée d''interdictions (Art. Uc 1.2, p. 35, identique mot pour mot à Ua 1.2), le reste est admis.'
    sous_destinations:
      industrie:
        statut: interdit
        article: Uc 1.2 (1.)
        page_pdf: 35
        citation: « Les constructions, ouvrages et travaux à destination industrielle et à destination exclusive
          d'entrepôt. »
      entrepot:
        statut: interdit
        article: Uc 1.2 (1.)
        page_pdf: 35
        citation: « … à destination exclusive d'entrepôt »
        note: L'interdiction vise la destination EXCLUSIVE d'entrepôt (mot du texte).
      exploitation_agricole:
        statut: interdit
        article: Uc 1.2 (2.)
        page_pdf: 35
        citation: « Les constructions, ouvrages et travaux à destination agricole. »
      artisanat_commerce_detail:
        statut: sous_condition
        condition: n'entraîner pour le voisinage aucune incommodité et aucune aggravation des risques (que la construction
          soit soumise ou non au régime ICPE)
        article: Uc 2.2 (1.)
        page_pdf: 36
        citation: « Les constructions à destination de commerce et d'artisanat ainsi que les travaux d'amélioration
          ou d'extension, de ces constructions […] à condition qu'elles n'entraînent pour le voisinage aucune incommodité
          et aucune aggravation des risques. »
      commerce_gros:
        statut: sous_condition
        condition: n'entraîner pour le voisinage aucune incommodité et aucune aggravation des risques (que la construction
          soit soumise ou non au régime ICPE)
        article: Uc 2.2 (1.)
        page_pdf: 36
        citation: « Les constructions à destination de commerce et d'artisanat […] » (« commerce » ancien format
          → artisanat_commerce_detail + commerce_gros)
    note: Mêmes interdictions hors nomenclature qu'en Ua (camping/caravaning, dépôts, carrières — Uc 1.2, p. 35).
  Ur:
    silence: autorise
    silence_src: 'Art. Ur 2.2, p. 48 : « Sont admises toutes les occupations et utilisations du sol non citées à
      l''article Ua 1.2 (sic), ainsi, que celles ci-après dès lors qu''elles respectent les conditions suivantes
      » — liste fermée d''interdictions, le reste est admis. ⚠ Le renvoi écrit vise « Ua 1.2 » alors que la liste
      propre de la zone est Ur 1.2 (p. 47), PLUS COURTE (Ur 1.2 n''interdit ni l''agricole ni le camping) : incohérence
      relayée telle quelle, voir anomalies.'
    sous_destinations:
      industrie:
        statut: interdit
        article: Ur 1.2 (1.)
        page_pdf: 47
        citation: « Les constructions, ouvrages et travaux à destination industrielle et à destination exclusive
          d'entrepôt. »
      entrepot:
        statut: interdit
        article: Ur 1.2 (1.)
        page_pdf: 47
        citation: « … à destination exclusive d'entrepôt »
        note: L'interdiction vise la destination EXCLUSIVE d'entrepôt (mot du texte).
      artisanat_commerce_detail:
        statut: sous_condition
        condition: n'entraîner pour le voisinage aucune incommodité et aucune aggravation des risques (que la construction
          soit soumise ou non au régime ICPE)
        article: Ur 2.2 (1.)
        page_pdf: 48
        citation: « Les constructions à destination de commerce et d'artisanat ainsi que les travaux d'amélioration
          ou d'extension, de ces constructions […] à condition qu'elles n'entraînent pour le voisinage aucune incommodité
          et aucune aggravation des risques. »
      commerce_gros:
        statut: sous_condition
        condition: n'entraîner pour le voisinage aucune incommodité et aucune aggravation des risques (que la construction
          soit soumise ou non au régime ICPE)
        article: Ur 2.2 (1.)
        page_pdf: 48
        citation: « Les constructions à destination de commerce et d'artisanat […] » (« commerce » ancien format
          → artisanat_commerce_detail + commerce_gros)
    note: 'Contrairement à Ua/Ub/Uc, Ur 1.2 (p. 47) n''interdit PAS la destination agricole ni les terrains de camping/caravaning
      : exploitation_agricole y est non mentionnée (verdict = silence), sous réserve de l''incohérence du renvoi
      « Ua 1.2 » de Ur 2.2 (voir silence_src). Interdits hors nomenclature : dépôts (2.), carrières (3.), affouillements
      > 2,50 m (4.) — p. 47.'
  Ue:
    silence: autorise
    silence_src: 'Art. Ue 2.2, p. 60 : « Sont admises toutes les occupations et utilisations du sol non citées à
      l''article Ua 1.2 (sic), ainsi, que celles ci-après dès lors qu''elles respectent les conditions suivantes
      » — structure en liste fermée d''interdictions (Art. Ue 1.2, p. 59), le reste est admis. ⚠ Le renvoi écrit
      vise « Ua 1.2 » et non « Ue 1.2 » : lu à la lettre il contredirait les interdictions propres de Ue 1.2 (habitation,
      hôtellerie…) ; incohérence relayée telle quelle, voir anomalies.'
    sous_destinations:
      logement:
        statut: interdit
        article: Ue 1.2 (1.)
        page_pdf: 59
        citation: « Les constructions, ouvrages et travaux à destination d'habitation » (« habitation » ancien format
          → logement + hebergement)
      hebergement:
        statut: interdit
        article: Ue 1.2 (1.)
        page_pdf: 59
        citation: « Les constructions, ouvrages et travaux à destination d'habitation » (« habitation » ancien format
          → logement + hebergement)
      artisanat_commerce_detail:
        statut: sous_condition
        condition: surface de vente, d'exposition ou de bureaux inférieure à la surface de production, de transformation,
          de conditionnement ou de réparation (seuil RELATIF, pas de m² fixe)
        article: Ue 1.2 (2.) + Ue 2.2 (1.)
        page_pdf: 59
        citation: 'Ue 1.2 (2.), p. 59 : « Les constructions, ouvrages et travaux à destination de commerces et de
          bureaux (sauf exceptions mentionnées à l''article Ue2.2). » ; Ue 2.2 (1.), p. 60 : « Les constructions,
          ouvrages et travaux à destination de commerces ou de bureaux dès lors que la surface de vente, d''exposition
          ou de bureaux reste inférieure à la surface de production, de transformation, de conditionnement ou de
          réparation (…). »'
      commerce_gros:
        statut: sous_condition
        condition: surface de vente, d'exposition ou de bureaux inférieure à la surface de production, de transformation,
          de conditionnement ou de réparation (seuil RELATIF, pas de m² fixe)
        article: Ue 1.2 (2.) + Ue 2.2 (1.)
        page_pdf: 59
        citation: Mêmes textes que artisanat_commerce_detail (« commerces » ancien format → artisanat_commerce_detail
          + commerce_gros).
      bureau:
        statut: sous_condition
        condition: surface de vente, d'exposition ou de bureaux inférieure à la surface de production, de transformation,
          de conditionnement ou de réparation (seuil RELATIF, pas de m² fixe)
        article: Ue 1.2 (2.) + Ue 2.2 (1.)
        page_pdf: 59
        citation: 'Ue 1.2 (2.), p. 59 : « …à destination de commerces et de bureaux (sauf exceptions mentionnées
          à l''article Ue2.2) » ; Ue 2.2 (1.), p. 60 (« bureaux » ancien format → bureau).'
      hotels:
        statut: interdit
        article: Ue 1.2 (3.)
        page_pdf: 59
        citation: « Les constructions, ouvrages et travaux à destination d'hôtellerie, de restauration ou d'hébergement
          touristique rural » (« hôtellerie » → hotels)
      restauration:
        statut: interdit
        article: Ue 1.2 (3.)
        page_pdf: 59
        citation: « … à destination d'hôtellerie, de restauration ou d'hébergement touristique rural »
      exploitation_agricole:
        statut: interdit
        article: Ue 1.2 (4.)
        page_pdf: 59
        citation: « Les constructions, ouvrages et travaux à destination agricole »
    note: '« hébergement touristique rural » (Ue 1.2 (3.), p. 59) ne couvre que partiellement autres_hebergements_touristiques
      (qualificatif « rural ») → douteux, non mappé : la sous-destination reste non mentionnée. Interdits hors nomenclature
      : camping/ caravaning (5.), dépôts de ferrailles/décharges/containers (6.), carrières (7.), affouillements
      > 2,50 m (8.) — p. 59.'
  AUs:
    silence: interdit
    silence_src: 'Art. AUs 1.2, p. 71 : « Toutes les occupations et utilisations du sol sont interdites à l''exception
      de celles admises à l''article AUs 2.2 du présent règlement. » — « seules sont admises » : le silence vaut
      interdiction.'
    sous_destinations: {}
    note: 'Aucune des 23 sous-destinations n''est nommée : AUs 2.2 (p. 72) n''admet que des occupations transversales
      — réseaux/voirie/stationnement/énergie répondant aux besoins de l''urbanisation future (1.), ouvrages techniques
      de service public ou d''intérêt collectif (2.), travaux liés aux occupations autorisées (3.), reconstruction
      à l''identique après sinistre (4.), et « travaux d''aménagement et d''extension mineure pour mise aux normes
      sanitaires et d''habitabilité dans la limite de 20 m² de surface de plancher réalisés sur des constructions
      existantes » (5., seuil 20 m² surface_plancher attaché à ces travaux, pas à une destination). Ouverture à
      l''urbanisation conditionnée à une modification du PLU (caractère de la zone, p. 71 — indicatif).'
  AUs1:
    renvoi: AUs
    renvoi_src: 'Le règlement (Titre III) ne connaît que « ZONE AUs » (p. 71) ; l''équivalence est écrite dans la
      note de présentation de la modification jointe au document, p. 191 : « le règlement du PLU ne fait pas de
      distinction entre les zones AUs1 et AUs2 […] Le règlement conditionne uniquement l''ouverture à l''urbanisation
      des zones AUs à une modification du PLU ».'
    note: Code absent du règlement lui-même ; renvoi fondé sur la pièce jointe p. 191 (voir anomalies).
  AUs2:
    renvoi: AUs
    renvoi_src: 'Le règlement (Titre III) ne connaît que « ZONE AUs » (p. 71) ; l''équivalence est écrite dans la
      note de présentation de la modification jointe au document, p. 191 : « le règlement du PLU ne fait pas de
      distinction entre les zones AUs1 et AUs2 […] Le règlement conditionne uniquement l''ouverture à l''urbanisation
      des zones AUs à une modification du PLU ».'
    note: Code absent du règlement lui-même ; renvoi fondé sur la pièce jointe p. 191 (voir anomalies).
  AUb:
    renvoi: Ub
    renvoi_src: 'ZONE AU indicée, p. 75 : « Pour appliquer le présent règlement, il convient de se reporter, en
      fonction de l''indice de la zone AU considérée, au règlement des zones urbaines correspondantes à savoir Ub
      pour AUb, etc. » ; Art. AU indicée 1 et 2, p. 75 : « Se reporter au règlement de la zone U indiquée en indice.
      »'
  AUc:
    renvoi: Uc
    renvoi_src: 'ZONE AU indicée, p. 75 : « il convient de se reporter, en fonction de l''indice de la zone AU considérée,
      au règlement des zones urbaines correspondantes à savoir Ub pour AUb, etc. » ; Art. AU indicée 1 et 2, p.
      75 : « Se reporter au règlement de la zone U indiquée en indice. »'
  AUe:
    renvoi: Ue
    renvoi_src: 'ZONE AU indicée, p. 75 : « il convient de se reporter, en fonction de l''indice de la zone AU considérée,
      au règlement des zones urbaines correspondantes à savoir Ub pour AUb, etc. » ; Art. AU indicée 1 et 2, p.
      75 : « Se reporter au règlement de la zone U indiquée en indice. »'
  AUr:
    renvoi: Ur
    renvoi_src: 'ZONE AU indicée, p. 75 : « il convient de se reporter, en fonction de l''indice de la zone AU considérée,
      au règlement des zones urbaines correspondantes à savoir Ub pour AUb, etc. » ; Art. AU indicée 1 et 2, p.
      75 : « Se reporter au règlement de la zone U indiquée en indice. »'
  A:
    silence: interdit
    silence_src: 'Art. A1.2, p. 79 : « A l''exception de ceux visés à l''article A 2.2., sont interdits les constructions,
      ouvrages et travaux non nécessaires à une exploitation agricole, ainsi que le changement de destination des
      bâtiments à usage agricole. » (interdiction générale avec liste fermée d''admissions à l''art. A2.2 : toute
      destination non mentionnée et non nécessaire à une exploitation agricole est interdite).'
    notes: 'A1.2 (p. 79) interdit aussi « le changement de destination des bâtiments à usage agricole ». Admissions
      A2.2 non rattachables à une sous-destination R151-28, relayées ici : chapeau (p. 80) « toute construction
      nécessitant un raccordement devra préférentiellement être édifiée à proximité des réseaux préexistants » ;
      1 (p. 80) reconstruction sur l''emplacement du bâti existant et amélioration sans augmentation de surface
      de plancher des constructions préexistantes non liées à une exploitation agricole ; 2 (p. 80) reconstruction/amélioration/
      extension limitée à 20 m² des constructions préexistantes liées à une exploitation agricole, « surface de
      plancher totale cumulée par logement » ≤ 170 m² (travaux sur existant) ; 3 (p. 80) « constructions et installations
      nécessaires à des équipements collectifs ou à des services publics » compatibles avec l''activité agricole
      (terme générique couvrant plusieurs sous-destinations sans les nommer : non mappé ; liste CINASPIC de l''annexe
      p. 106 limitée aux dérogations des articles 6, 7 et 10) ; 4 (p. 80) reconstruction à l''identique après sinistre
      ; 9 (p. 80) constructions liées à la production d''énergie sauf Aco (hors nomenclature R151-28, non mappé).'
    sous_destinations:
      exploitation_agricole:
        statut: sous_condition
        condition: 'constructions et installations nécessaires à l''exploitation agricole (A2.2.5) ; ICPE agricoles
          admises hors secteur Aco « sous réserve d''une bonne intégration paysagère et environnementale » (A2.2.6)
          ; chapeau A2.2 : édification préférentielle à proximité des réseaux préexistants'
        article: A2.2.5 et A2.2.6
        page_pdf: 80
        citation: « Les constructions et installations nécessaires à l'exploitation agricole. » (A2.2.5) ; « A l'exception
          du secteur Aco, les constructions et installations nécessaires à l'exploitation agricole relevant du régime
          d'autorisation ou de déclaration préalable des installations classées pour la protection de l'environnement,
          sous réserve d'une bonne intégration paysagère et environnementale » (A2.2.6)
      logement:
        statut: sous_condition
        condition: une construction à destination d'habitation par exploitation agricole, dans la limite de 170
          m² de surface de plancher par logement, implantation nécessaire aux besoins d'une exploitation agricole
          « notamment justifiée par la nécessité d'une présence permanente et rapprochée sur le site d'exploitation
          » (définition de la présence permanente en annexe p. 106)
        seuil_m2: 170
        seuil_type: surface_plancher
        article: A2.2.7
        page_pdf: 80
        citation: « A l'exception du secteur Aco, une construction à destination d'habitation par exploitation agricole,
          dans la limite de 170 m² de surface de plancher par logement, sous réserve que son implantation soit nécessaire
          aux besoins d'une exploitation agricole »
      autres_hebergements_touristiques:
        statut: sous_condition
        condition: hébergement temporaire à usage agro-touristique, en complément de revenu d'une exploitation agricole
          existante répondant aux normes du schéma directeur départemental des structures agricoles, aménagé dans
          les bâtiments à usage d'habitation existants de l'exploitation ou en extension de ceux-ci, limite totale
          cumulée de 170 m² de surface de plancher par exploitation agricole (limite commune avec la restauration)
        seuil_m2: 170
        seuil_type: surface_plancher
        article: A2.2.8
        page_pdf: 80
        citation: '« A l''exception du secteur Aco, les constructions, ouvrages et travaux à usage agro-touristique,
          pour l''hébergement temporaire et la restauration sont permises dès lors qu''ils constituent un complément
          de revenu d''une exploitation agricole existante […] dans la limite totale cumulée de 170 m² de surface
          de plancher par exploitation agricole. » (« hébergement temporaire » agro-touristique : mappé sur autres_hebergements_touristiques
          seulement ; hotels non retenu — douteux, non écrit)'
      restauration:
        statut: sous_condition
        condition: restauration à usage agro-touristique, complément de revenu d'une exploitation agricole existante,
          aménagée dans les bâtiments à usage d'habitation existants de l'exploitation ou en extension, limite totale
          cumulée de 170 m² de surface de plancher par exploitation agricole (limite commune avec l'hébergement
          temporaire)
        seuil_m2: 170
        seuil_type: surface_plancher
        article: A2.2.8
        page_pdf: 80
        citation: « les constructions, ouvrages et travaux à usage agro-touristique, pour l'hébergement temporaire
          et la restauration sont permises dès lors qu'ils constituent un complément de revenu d'une exploitation
          agricole existante […] dans la limite totale cumulée de 170 m² de surface de plancher par exploitation
          agricole »
      artisanat_commerce_detail:
        statut: sous_condition
        condition: uniquement locaux destinés à la vente de produits de l'exploitation (cadre agro-touristique A2.2.8),
          dans la limite de 25 m² de surface de plancher
        seuil_m2: 25
        seuil_type: surface_plancher
        article: A2.2.8
        page_pdf: 80
        citation: « Les locaux destinés à la vente de produits de l'exploitation ne pourront excéder une surface
          de plancher de 25 m². »
  Aco:
    silence: interdit
    silence_src: 'Art. A1.2, p. 79 (règle générale de la zone A, applicable au secteur : DG art. 3.3, p. 7 « la
      règle générale de la zone s''applique à chacun d''eux sauf lorsqu''une disposition particulière est prévue
      pour l''un de ces secteurs »).'
    notes: 'Le secteur Aco (corridors écologiques, p. 79) est expressément exclu des admissions A2.2.6 (ICPE agricoles),
      A2.2.7 (habitation d''exploitation), A2.2.8 (agro-tourisme : hébergement temporaire, restauration, vente hors
      régime Aco) et A2.2.9 (production d''énergie) — ces destinations y relèvent du silence (interdit). Restent
      applicables sans exclusion de secteur : A2.2.1, A2.2.2, A2.2.4 (travaux sur existant, reconstruction après
      sinistre) et A2.2.3 (équipements collectifs/services publics — terme générique non mappé).'
    sous_destinations:
