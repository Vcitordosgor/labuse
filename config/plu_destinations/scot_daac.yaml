      (prolongée) » est marqué ZPLC périphérique ; centre-ville/Centre Leclerc,
      Trois Mares, La Châtoire/Géant Casino, Plaine des Cafres, 12e/14e/17e km,
      Bras de Pontho, Bérive, Bourg Murat, Bois Court = centralités).
  "97412":
    commune: "Saint-Joseph"
    scot: grand_sud
