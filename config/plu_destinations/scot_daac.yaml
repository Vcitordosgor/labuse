meta:
  lu_le: "2026-09-03"
  note: >-
    Aucune géométrie ZACOM/DAAC publiée (GPU, data.gouv, AGORAH/PEIGEO — recensement 03/09).
    Extraction PDF : liste des secteurs par commune avec page. Verdict servi :
    oui (secteur nommé) / non (DAAC en vigueur, commune sans secteur) / non_localise
    (pas de DAAC en vigueur, ou secteurs non nommés par commune).
  sources_pdf:
    grand_sud:
      fichier: "data/reglements-plu/scot_grand_sud_doo_20240902.pdf"
      texte: "data/reglements-plu/scot_grand_sud_doo_20240902.txt"
      pages_cles: >-
        DAAC intégré au DOO pages PDF 45-122. Liste des 7 ZPLC : pages 77-78.
        Fiches communales « Identification des sites » (tableaux images, lues en OCR
        visuel) : Saint-Pierre 103, Saint-Louis 105, Cilaos 107, Les Avirons 109,
        L'Étang-Salé 111, Petite-Île 113, Le Tampon 115, Saint-Joseph 117,
        L'Entre-Deux 119, Saint-Philippe 121 (+ page carte suivante à chaque fois).
      limites: >-
        Les tableaux de hiérarchisation (pages 59-64), les pages de titre des 7 fiches
        ZPLC (81, 84, 87, 90, 93, 96, 99) et les cartes communales (pages paires 104-122)
        sont des images sans texte extractible ; les fiches ZPLC individuelles (79-99) ne
        sont donc pas attribuables une à une. Les tableaux communaux (103-121) ont été lus
        visuellement (rendu PNG) — colonnes emprise foncière / surfaces de plancher vides
        (« - ») partout. La délimitation précise des ZPLC est renvoyée aux PLU (page 71).
    tco:
      fichier: "data/reglements-plu/scot_tco_doo_20221003.pdf"
      texte: "data/reglements-plu/scot_tco_doo_20221003.txt"
      pages_cles: >-
        Section 4 « Les localisations préférentielles des équipements commerciaux… » :
        pages PDF 52-56 (pages imprimées 50-54). Orientation commerce = O15 C/ pages 55-56.
      limites: >-
        Le DOO TCO ne nomme AUCUN secteur commercial par commune : l'orientation commerce
        (pages 55-56) renvoie aux « espaces urbains de référence » (O6) et à l'armature
        urbaine, sans liste de sites. Les sites nommés de l'O15 (pages 53-54) concernent
        l'économie productive (ZI/PAEM/ARTIS) et touristique, pas les équipements
        commerciaux. Pas de DAAC (0 occurrence DAAC/ZACOM dans le texte).
scots:
  grand_sud:
    titre: "SCoT Grand Sud (SMEP Grand Sud, CIVIS + CASUD)"
    approuve: "2020-02-18"
    modifie: "2024-09-02"
    document: "DOO intégrant le DAAC — 7 ZPLC périphériques (ou ZACOM) + centralités urbaines, 57 sites au total (page PDF 102)"
    url: "https://data.geopf.fr/annexes/gpu/documents/scot_259741080/037177b7aa755c6c57c0d413591407d0/259741080_doo_20240902.pdf"
    daac: en_vigueur
  tco:
    titre: "SCoT Ouest (TCO)"
    approuve: "2016-12-21"
    modifie: "2022-10-03"
    document: "DOO — section 4, orientation O15 C/ « équipement commercial » (pages PDF 52-56)"
    url: "https://data.geopf.fr/annexes/gpu/documents/scot_249740101/a116a438832f3346fc7c0adb5d92cf6a/249740101_doo_20221003.pdf"
    daac: absent
    note: "localisations préférentielles DOO §4 — principes seulement, aucun secteur commercial nommé par commune"
  cinor:
    daac: en_projet
    note: "DAACL en projet (révision SCoT), non opposable — 26/09/2024"
  cirest:
    daac: aucun
    note: "SCoT 2004 abrogé, nouveau en élaboration"

communes:
  # ----- SCoT Grand Sud (DAAC en vigueur) -----
  "97416":
    commune: "Saint-Pierre"
    scot: grand_sud
    verdict: oui
    secteurs:
      - {nom: "Centre commercial Grand Large et ZI n°1", type: "ZPLC périphérique — pôle commercial majeur", page_pdf: 77}
      - {nom: "Secteur Canabady-Casabona (existant et extension)", type: "ZPLC périphérique — pôle commercial majeur", page_pdf: 77}
      - {nom: "Pôle commercial Auchan", type: "ZPLC périphérique — pôle commercial majeur", page_pdf: 77}
      - {nom: "La Concession Condé", type: "ZPLC périphérique — pôle commercial secondaire", page_pdf: 77}
    note: >-
      Liste des 7 ZPLC page PDF 77 ; fiche communale page 103 (16 sites, dont les 4 ZPLC
      ci-dessus marquées « ZPLC périphérique », le reste en centralités urbaines :
      centre-ville, Ravine des Cabris, Terre Sainte, Grand Bois, etc.).
