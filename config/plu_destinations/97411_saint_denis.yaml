  structure: 'Règlement par chapitres de zone (Uavap, Up, Ud, Uu, Ui, Uj, Um, Uh, Ua, Uv, Uma, AUj, AUm, AUh, AUa,
    AUx, A, N) ; dans chaque chapitre, article 1 = occupations et utilisations du sol interdites, article 2 = soumises
    à des conditions particulières. Zones U/AU : article 1 en liste fermée (silence = autorisé). Zones A et N :
    « constructions de toute nature sauf celles prévues à l''article 2 » (silence = interdit). Prescriptions annexées
    (captages/forages n°5, carrières n°4, PPRNP) prévalent sur le règlement (Dispositions générales IV-V, p. 10-12).'
zones:
  Uavap:
    silence: autorise
    silence_src: 'Le règlement procède par liste fermée d''interdictions : article Uavap.1 « Occupations et utilisations
      du sol interdites — Sont interdites : … » (p. 26) puis article Uavap.2 « Occupations et utilisations du sol
      soumises à des conditions particulières — Sont admis et soumis à des conditions particulières : … » (p. 27).
      Ce qui n''est ni interdit ni conditionné est admis.'
    sous_destinations:
      industrie:
        statut: interdit
        article: Uavap 1
        page_pdf: 26
        citation: « Les constructions à fonction d’industrie, d’exploitation agricole et forestière »
      exploitation_agricole:
        statut: interdit
        article: Uavap 1
        page_pdf: 26
        citation: « Les constructions à fonction d’industrie, d’exploitation agricole et forestière »
      exploitation_forestiere:
        statut: interdit
        article: Uavap 1
        page_pdf: 26
        citation: « Les constructions à fonction d’industrie, d’exploitation agricole et forestière »
      artisanat_commerce_detail:
        statut: sous_condition
        condition: 'Ne pas entraîner pour le voisinage des nuisances inacceptables (le texte vise « l''artisanat
          » seul ; le commerce de détail n''est pas visé par cette règle). Interdit hors ce cas par Uavap 1 (p.
          26 : « Les constructions destinées à l’artisanat et à la fonction d’entrepôts sauf celles mentionnées
          à l’article 2 »).'
        article: Uavap 2
        page_pdf: 27
        citation: « les constructions destinées à l’artisanat sous réserve qu’elles n’entraînent pas pour leur voisinage
          des nuisances inacceptables »
      entrepot:
        statut: sous_condition
        condition: Entrepôt lié aux occupations et utilisations des sols admises dans la zone et ne pas entraîner
          pour le voisinage des nuisances inacceptables. Interdit hors ce cas par Uavap 1 (p. 26).
        article: Uavap 2
        page_pdf: 27
        citation: « les constructions destinées à la fonction d’entrepôt liée aux occupations et utilisations des
          sols admises dans la zone et sous réserve qu’elles n’entraînent pas pour leur voisinage des nuisances
          inacceptables »
      logement:
        statut: sous_condition
        condition: 'Condition portant sur les seules opérations nouvelles d''habitat collectif de 30 logements et
          plus : comporter un minimum de 15 % de logements sociaux et/ou intermédiaires. Les autres logements ne
          sont pas visés par l''article.'
        article: Uavap 2
        page_pdf: 27
        citation: « les opérations nouvelles d'habitat collectif de 30 logements et plus sous réserve qu’elles comportent
          un minimum de 15% de logements sociaux et/ou intermédiaires dans le respect de la mixité sociale »
