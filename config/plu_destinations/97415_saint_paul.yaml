  structure: 'Règlement en 7 livrets par bassin de vie (Titre II : Saint-Paul centre U1*/AU1*, Saint-Gilles U2*/AU2*,
    Plateau Caillou U3*/AU3*, Plaine-Bois de Nèfles U4*/AU4*, La Saline U5*/AU5*, Guillaume U6*/AU6*, Mafate Ni/Ntol)
    + Titre III zones A et N (le chapitre « Zone N » clôt le Titre III, pp. 342-351 ; le Titre IV est un glossaire).
    Chapitres U/AU : article 1.2 = liste fermée d''interdictions (silence = autorisé, sauf zones fermées U2h/Usdu/AU*st
    « toutes occupations interdites sauf article 2.2 »). Zones A/N/Ni/Ntol : régime fermé (silence = interdit).
    Zone Usdu lue au livret 3 (mêmes règles constatées aux livrets 4/5/6). Plafonds Usdu/Ni par destination en EMPRISE
    AU SOL (art. 9), rendus en condition.'
zones:
  U1a:
    silence: autorise
    silence_src: Art. 1, § 1.2 "Sont interdits" = liste fermée de 3 occupations (entrepôt exclusif, agricole, campeurs/caravanes),
      p. 14 ; tout le reste n'est ni interdit ni conditionné par les articles 1 et 2.
    sous_destinations:
      entrepot:
        statut: interdit
        article: Zones U1a à U1pso, Art. 1, § 1.2 (1)
        page_pdf: 14
        citation: « Les constructions, ouvrages et travaux à destination exclusive d'entrepôt. »
      exploitation_agricole:
