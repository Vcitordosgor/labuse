        article: Zones U1a à U1pso, Art. 1, § 1.2 (2)
        page_pdf: 14
        citation: « Les constructions, ouvrages et travaux à destination agricole. »
      logement:
        statut: sous_condition
        condition: 'Programme de logements >= 1 800 m² de surface de plancher : minimum 30 % de la programmation
          en logements locatifs sociaux (LLTS, LLS, PLS) représentant au minimum 30 % de la SDP logements (p. 14).
          Programme de 20 logements ou plus (SDP < 1 800 m²) ou SDP >= 1 500 m² et < 1 800 m² : 30 % du nombre de
          logements en logements aidés ou accession sociale (PTZ, PSLA) ; terrain d''habitation > 6 000 m² : 30
          % des logements en locatif social ou accession sociale (p. 15). Ne s''applique pas aux logements de fonction
          de l''Administration publique (p. 15).'
        seuil_m2: 1800
        seuil_type: surface_plancher
        article: Zones U1a à U1pso, Art. 2, § 2.2 (3)
        page_pdf: 14
        citation: « En cas de réalisation d'un programme de logements représentant une surface de plancher supérieure
          ou égale à 1 800 m², un minimum de 30 % de la programmation logement doit être affecté à des logements
          aidés »
