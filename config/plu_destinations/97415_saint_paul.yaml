    renvoi_src: 'Chapitre ZONES AU1, p. 53 : « il convient de se reporter en fonction de l''indice de la zone AU
      considérée au règlement des zones urbaines correspondantes à savoir U1a pour AU1a, U1b pour AU1b, U1c pour
      AU1c... etc » ; Art. 1 et 2 : « Se reporter au règlement de la zone U1 ayant le même indice ». S''ajoute la
      condition générale AU1 Art. 2, § 2.2 (1), p. 53 : « Disposer des infrastructures suffisantes pour desservir
      le projet de construction (voirie, réseaux, sécurité incendie, etc.). »'
  AU1e:
    renvoi: U1e
    renvoi_src: 'Chapitre ZONE AU1e, p. 55 : « il convient de se reporter au règlement de la zone U1e et de la zone
      U1ec » ; Art. 1 et 2 : « Se reporter au règlement de la zone U1e. » S''ajoutent les conditions générales AU1e
      Art. 2, § 2.2, pp. 55-56 : disposer des infrastructures suffisantes ; prélèvements de matériaux et ouverture
      de carrières sous réserve de limiter la gêne et d''assurer une bonne intégration dans le site.'
