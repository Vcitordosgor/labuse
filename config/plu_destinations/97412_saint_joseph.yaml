        article: A2.2, point 5
        page_pdf: 115
        citation: « Dans le secteur Acu, est autorisée la réhabilitation des bâtiments agricoles existants et leur
          extension dans le cas où celle-ci est nécessaire à leur mise aux normes et que leur impact environnemental
          et paysager est réduit. Sont autorisés les aménagements nécessaires à la mise en culture et à l'exploitation
          agricole des terrains concernés, à l'aquaculture et à l'exploitation forestière, sous réserve de faire
          l'objet d'une intégration paysagère. »
      exploitation_forestiere:
        statut: sous_condition
        condition: aménagements nécessaires à l'exploitation forestière des terrains concernés, sous réserve d'intégration
          paysagère
        article: A2.2, point 5
        page_pdf: 115
        citation: « Sont autorisés les aménagements nécessaires à la mise en culture et à l'exploitation agricole
