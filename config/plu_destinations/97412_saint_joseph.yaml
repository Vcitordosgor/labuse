      exploitation_agricole:
        statut: interdit
        article: U2 1.2 (2)
        page_pdf: 29
        citation: « Les constructions, ouvrages et travaux à destination agricole. »
    notes:
    - 'Pas de plafond de surface de vente en U2 (contrairement à U1 et U4) : l''article U2 1.2, p. 29 ne comporte
      aucune interdiction de commerce.'
    - 'U2 1.2 (4), p. 29 : camping/hébergements de loisirs interdits — aucun slug pleinement couvert → non mappé.'
    - 'U2 2.2 (4), p. 30 : programme de logements > 2 000 m² de surface de plancher → 20 % minimum de logements
      locatifs sociaux (condition de programme, pas un plafond de destination → pas de seuil_m2).'
