  A:
    silence: interdit
    silence_src: 'Art. A1.2, p. 114 : « A l''exception de ceux visés à l''article A2.2., sont interdits les constructions,
      ouvrages et travaux non nécessaires à une exploitation agricole et notamment : 1. les constructions ou installations
      non nécessaires à un service public ou d''intérêt collectif, 2. les terrains de camping, de caravanage et
      les parcs résidentiels de loisirs, 3. l''implantation d''habitations légères de loisirs et les résidences
      mobiles de loisirs. »'
    note: 'Non mappés (mappage conservateur, pas de terme R151-28 univoque) : constructions à usage agrotouristique
      / diversification d''une exploitation agricole (sauf Acu), « dans la limite de 200 m² de surface de plancher,
      y compris la surface des bâtiments existants, sur la parcelle. Dans le cas où aucun bâtiment n''est existant
      sur la parcelle, la surface de plancher maximale est portée à 120 m² » (A2.2, p. 115-116) ; ouvrages de méthanisation
      d''origine agricole majoritaire (A2.2.3, p. 115) ; installations photovoltaïques sur bâtiments agricoles (A2.2.4,
      p. 115). Changement de destination des bâtiments identifiés au document graphique autorisé s''il ne compromet
      pas l''activité agricole ni la qualité paysagère, avis conforme CDPENAF (A1.1.5, p. 114 ; A2.1.4, p. 114).'
    sous_destinations:
      exploitation_agricole:
        statut: sous_condition
        condition: bâtiments techniques agricoles, annexes, ouvrages et travaux nécessaires aux besoins d'une exploitation
          agricole, justifiés (superficie de l'exploitation, nature de l'activité, matériel, bâtiments existants),
          implantation adaptée au site ; ICPE/RSD nécessaires à la production agricole ; travaux d'amélioration
          foncière
        article: A2.2, points 1 et 2
        page_pdf: 115
        citation: « A l'exception du secteur Acu, les bâtiments techniques agricoles et constructions annexes, les
          ouvrages et travaux nécessaires aux besoins d'une exploitation agricole. […] » ; « […] les activités soumises
          au régime d'autorisation et de déclaration préalable des installations classées (ICPE) […] nécessaires
          à l'activité de production agricole […] »
      logement:
        statut: sous_condition
        condition: 'constructions existantes à usage d''habitation seulement (nécessaires ou non à une exploitation
          agricole), sous réserve de la légalité du bâti : adaptation, réfection ou reconstruction, extension limitée,
          annexes — pas de logement neuf en zone A hors secteur Aba'
        article: A2.2 (Les extensions et annexes des habitations existantes et les logements)
        page_pdf: 115
        citation: « A l'exception du secteur Acu, les constructions existantes à usage d'habitation nécessaires
          ou non à une exploitation agricole, sous réserve de la légalité du bâti, peuvent faire l'objet d'une adaptation,
          d'une réfection ou de reconstruction, d'une extension limitée et d'annexes. »
      autres_hebergements_touristiques:
        statut: interdit
        article: A1.2, points 2 et 3
        page_pdf: 114
        citation: « les terrains de camping, de caravanage et les parcs résidentiels de loisirs » ; « l'implantation
          d'habitations légères de loisirs et les résidences mobiles de loisirs »
      locaux_techniques_administrations:
        statut: sous_condition
        condition: ouvrages techniques nécessaires au fonctionnement d'un service public ou d'intérêt collectif
          (implantation rendue nécessaire, mesures ERC) ; constructions/ouvrages liés aux réseaux, voirie, infrastructures
          de transport, installations de distribution/traitement/stockage de l'eau
        article: A2.2 (Les ouvrages d'intérêt général ou collectif)
        page_pdf: 116
        citation: « Les ouvrages techniques nécessaires au fonctionnement d'un service public ou d'intérêt collectif
          dont l'implantation dans la zone est rendue nécessaire pour des raisons techniques, économiques ou de
          sécurité […] »
