  structure: 'Ancien format : zones U1-U6 avec clause « sont admises toutes les occupations non citées à l''article
    1.2 » (silence = autorisé), secteurs réglés dans les articles de zone ; AUst fermée ; AU indicée = renvoi ÉCRIT
    vers la zone U d''indice (p. 106-107) avec densités d''ouverture ; AUto régime fermé propre ; A/N fermées (silence
    = interdit). 4 codes « st » (2AU5st, 3AU3st, 3AU5st, 3AU5vist) introuvables au règlement → non_lu (rattachement
    AUst probable mais non écrit). Secteur U6ch lu au règlement bien qu''absent du zonage servi.'
zones:
  U1:
    silence: autorise
    silence_src: 'Art. U1 2.2, p. 15 : « Sont admises toutes les occupations et utilisations du sol non citées à
      l''article U1 1.2, ainsi, que celles ci-après dès lors qu''elles respectent les conditions suivantes »'
    sous_destinations:
      industrie:
        statut: interdit
        article: U1 1.2 (1)
        page_pdf: 15
        citation: « Les constructions, ouvrages et travaux à destination industrielle et à usage exclusif d'entrepôt
          sans lien avec un commerce implanté sur le terrain d'assiette. »
      entrepot:
        statut: sous_condition
        condition: l'usage exclusif d'entrepôt sans lien avec un commerce implanté sur le terrain d'assiette est
          interdit ; admis en lien avec un tel commerce (lecture combinée avec la clause du silence, art. U1 2.2)
        article: U1 1.2 (1)
        page_pdf: 15
        citation: « …et à usage exclusif d'entrepôt sans lien avec un commerce implanté sur le terrain d'assiette.
          »
      exploitation_agricole:
        statut: interdit
        article: U1 1.2 (2)
        page_pdf: 15
        citation: « Les constructions, ouvrages et travaux à destination agricole. »
      artisanat_commerce_detail:
        statut: sous_condition
        condition: interdit dès que la surface de vente excède 400 m²
        seuil_m2: 400
        seuil_type: surface_vente
        article: U1 1.2 (3)
        page_pdf: 15
        citation: « Les constructions, ouvrages et travaux à destination de commerce dont la surface de vente excède
          400 m². »
      commerce_gros:
        statut: sous_condition
        condition: interdit dès que la surface de vente excède 400 m² (terme « commerce » mappé artisanat_commerce_detail
          + commerce_gros, doctrine ancien format)
        seuil_m2: 400
        seuil_type: surface_vente
        article: U1 1.2 (3)
        page_pdf: 15
        citation: « Les constructions, ouvrages et travaux à destination de commerce dont la surface de vente excède
          400 m². »
    notes:
    - 'U1 1.2 (6), p. 15 : « Les camping ou hébergements de loisirs de toute sorte (tentes, glamping, résidences
      mobiles de loisirs ou d''habitations légères de loisirs, caravanes etc.. » — interdit, mais aucun slug R151-28
      pleinement couvert (couvre partiellement autres_hebergements_touristiques) → non mappé.'
    - 'ANOMALIE — U1 1.2 (5), p. 15 interdit « Les installations classées pour la protection de l''Environnement
      » alors que U1 2.2 (1), p. 15 admet les constructions à destination d''activités « qu''elles soient soumises
      ou non au régime des installations classées » : contradiction interne ; l''ICPE est un régime, pas une destination
      → non mappé.'
    - U1 2.2 (1), p. 15 conditionne les « constructions à destination d'activités » (aucune incommodité ni aggravation
      des risques pour le voisinage) sans viser une sous-destination précise → non mappé (douteux).
