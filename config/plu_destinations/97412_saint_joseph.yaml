      secteurs de U5 = U5cv, U5ma, U5ru, U5vi ; chapitre U5, p. 72, ajoute U5cvd — pas de U5st). Le suffixe « st
      » évoque la zone AUst (p. 102 : régime fermé, ouverture conditionnée à une modification du PLU ; DG p. 7 ne
