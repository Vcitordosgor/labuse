  1AUto:
    silence: interdit
    silence_src: 'Art. AUindicée 1.2, p. 107 : « Pour les zones AUto, toutes les constructions et occupations du
      sol non prévues à l''article des AU 2.2.6 ainsi qu''aux Orientations d''Aménagement et de Programmation »
      [sont interdites] ; liste fermée à l''art. AU 2.2, point 7, p. 108 : « Sont uniquement admis : »'
    note: 'Anomalie de numérotation : l''interdiction (1.2, p. 107) vise « l''article des AU 2.2.6 » mais la liste
      AUto figure au point 7 du 2.2 (p. 108) — relayée telle quelle. Le point 8 du 2.2 (p. 108, constructions existantes
      à usage d''habitation : adaptation/réfection/extension/annexes) est écrit sans restriction de zone mais hors
      de la liste « uniquement admis » du point 7 : applicabilité en AUto non tranchée par le texte, non mappée.
      Phasage : « les zones AUto […] répondent aux mêmes règles de phasage que les zones 2AUindicée et 3AUindicée
      » (art. AU 2.2.7, p. 108). Pour les articles 3 à 14 (desserte, implantation, etc.), renvois partiels écrits
      vers U5 (p. 108-111).'
    sous_destinations:
      hotels:
        statut: sous_condition
        condition: sous réserve de présenter un parti architectural et environnemental permettant une intégration
          au site et à ses alentours
        article: AU 2.2, point 7
        page_pdf: 108
        citation: '« Les constructions à destination d''hébergement touristique et les services liés, sous réserve
          de présenter un parti architectural et environnemental permettant une intégration au site et à ses alentours.
          » (terme « hébergement touristique » : citation commune hotels / autres_hebergements_touristiques)'
      autres_hebergements_touristiques:
        statut: sous_condition
        condition: sous réserve de présenter un parti architectural et environnemental permettant une intégration
          au site et à ses alentours
        article: AU 2.2, point 7
        page_pdf: 108
        citation: « Les constructions à destination d'hébergement touristique et les services liés […] » (citation
          commune avec hotels)
      equipements_sportifs:
        statut: sous_condition
        condition: à l'exception des activités générant des nuisances incompatibles avec le caractère de la zone,
          et dans la mesure où les constructions n'altèrent pas la qualité écologique et paysagère du site
        article: AU 2.2, point 7
        page_pdf: 108
        citation: « Les aménagements, les équipements de sport et de loisirs et les activités commerciales et artisanales
          et celles indiquées dans les Orientations d'Aménagement et de Programmation à l'exception des activités
          générant des nuisances incompatibles avec le caractère de la zone […] »
      artisanat_commerce_detail:
        statut: sous_condition
        condition: 'liste fermée AUto (AU 2.2 point 7, p. 108) : commerces et services admis d''une part s''ils
          n''engendrent pas de nuisances incompatibles avec la vocation touristique et respectent la qualité écologique
          et paysagère du site ; d''autre part en lien direct avec la nature des installations de loisirs et de
          découverte pédagogique, intégrés au site et accessoires par rapport à ces activités'
        article: AU 2.2, point 7
        page_pdf: 108
        citation: '« […] les activités commerciales et artisanales […] » ; « Les constructions à usage commercial,
          artisanal, de services en lien direct avec la nature des installations de loisirs et la vocation du site,
          s''intégrant à l''environnement du site, et dans la mesure où elles constituent une activité accessoire
          par rapport aux activités de loisirs et de découverte pédagogique de l''environnement. » (terme « commercial
          » : citation commune artisanat_commerce_detail / commerce_gros)'
      commerce_gros:
        statut: sous_condition
        condition: 'liste fermée AUto (AU 2.2 point 7, p. 108) : commerces et services admis d''une part s''ils
