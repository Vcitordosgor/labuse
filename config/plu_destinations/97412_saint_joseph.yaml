        article: A1.2, points 2 et 3
        page_pdf: 114
        citation: « les terrains de camping, de caravanage et les parcs résidentiels de loisirs » ; « l'implantation
          d'habitations légères de loisirs et les résidences mobiles de loisirs »
      locaux_techniques_administrations:
        statut: sous_condition
        condition: installations de distribution, de traitement ou de stockage de l'eau (A2.2.5) ; ouvrages d'intérêt
          général ou collectif de la zone A (A2.2, p. 116 — sans exclusion écrite du secteur Acu)
        article: A2.2, point 5 et A2.2 (Les ouvrages d'intérêt général ou collectif)
        page_pdf: 115
        citation: « Sont également autorisées les installations de distribution, de traitement ou de stockage de
