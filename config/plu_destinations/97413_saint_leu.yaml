        condition: interdits si la surface de réserve excède la surface de vente
        article: UA1 (11)
        page_pdf: 18
        citation: « Les entrepôts et les commerces dont la surface de réserve excède la surface de vente »
      logement:
        statut: sous_condition
        condition: 'dans la zone de déficit en logement social délimitée aux documents graphiques (centre-ville,
          étang Saint-Leu et Piton Saint-Leu) : tout projet créant plus de 600 m² de SHON destinée à l''habitation
          doit affecter au logement social au moins 20 % de la SHON d''habitation ; pour les opérations d''aménagement
          (ZAC, lotissement) de plus de 1 200 m² de SHON, obligation appliquée globalement (le texte parle en SHON)'
        seuil_m2: 600
        seuil_type: surface_plancher
        article: UA2 (2.2, 5)
        page_pdf: 19
        citation: « tout projet visant à créer plus de 600m2 de surface hors œuvre nette (SHON) destinée à l'habitation
          doit prévoir d'affecter au logement social au moins 20% de la surface hors œuvre nette d'habitation prévue
          dans l'opération »
    note: 'Non rattachables aux 23 sous-destinations (relayés, non mappés) : installations classées (UA1-1, UA2
      2.2-1 et 2), terrains de camping et caravaning (UA1-3), aires naturelles de camping (UA1-5), dépôts de ferrailles
      et décharges (UA1-6), carrières (UA1-7), modes d''utilisation du sol R 442-2 §C (UA1-8), habitations légères
      de loisirs (UA1-9), affouillements/exhaussements (UA2 2.1), travaux sur bâtiments protégés L.123-1 7° (UA2
      2.2-4). Anomalie : la numérotation de UA1 saute de 11 à 14, et le 14 répète le 4 (agricole).'
