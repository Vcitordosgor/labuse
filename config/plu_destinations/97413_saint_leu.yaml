  structure: 'Ancien format R123 (SHON) : zones U à listes limitatives art. 1 + conditions art. 2 (silence = autorisé)
    sauf UP (« toutes les occupations non mentionnées à l''article UP2 sont interdites ») et secteur UFe (« toute
    construction est interdite ») ; secteurs régis par le chapitre de leur zone. Couverture : zones/secteurs énumérés
    PAR LE RÈGLEMENT (liste des codes du zonage servi non consultable — DB indisponible).'
