zones:
  UA:
    silence: autorise
    silence_src: UA 1.1 (p. 16) dresse une liste fermée de 7 interdictions et UA 1.2 (pp. 16-17) des conditions
      particulières ; aucune clause « seules sont admises » — ce qui ne figure ni à UA 1.1 ni à UA 1.2 n'est pas
      réglementé, donc admis
    note: 'Interdits non mappables à une sous-destination R151-28 (usages du sol) : terrains de camping/caravaning,
      aires naturelles de camping, dépôts de ferrailles/matériaux/ordures, exploitations de carrières (UA 1.1.2
      pts 2, 4, 5, 6, p. 16). Le terme « autres activités des secteurs secondaire ou tertiaire » (UA 1.2 (1)) est
      trop générique pour être mappé — non écrit.'
    sous_destinations:
      industrie:
        statut: interdit
        article: UA 1.1.2 (1)
        page_pdf: 16
        citation: « Les constructions à usage industriel et à usage exclusif d'entrepôt, sauf celles mentionnées
          à l'article UA 1.2 » — UA 1.2 ne mentionne pas l'industrie (son (1) ne vise que les activités « non concernées
          par l'article UA 1.1 »)
      entrepot:
        statut: sous_condition
        condition: interdit à usage exclusif (UA 1.1.2 (1)) et si la surface de réserve excède la surface de vente
          (UA 1.1.2 (7)) ; admis lié aux occupations et utilisations du sol admises dans la zone, sans nuisances
          inacceptables pour le voisinage (UA 1.2 (4))
        article: UA 1.1.2 (1) et (7) ; UA 1.2 (4)
        page_pdf: 17
        citation: « Les constructions destinées à la fonction d'entrepôt liée aux occupations et utilisations des
          sols admises dans la zone et sous réserve qu'elles n'entraînent pas pour leur voisinage des nuisances
          inacceptables » (UA 1.2 (4), p. 17) ; « Les entrepôts et les commerces dont la surface de réserve excède
          la surface de vente » (UA 1.1.2 (7), p. 16)
      exploitation_agricole:
        statut: interdit
        article: UA 1.1.2 (3)
        page_pdf: 16
        citation: « L'implantation et l'extension des constructions et installations à usage agricole. »
      artisanat_commerce_detail:
        statut: sous_condition
        condition: admis lorsqu'il n'est pas susceptible d'aggraver les risques de nuisances pour le voisinage ;
          interdit si la surface de réserve excède la surface de vente
        article: UA 1.2 (1) ; UA 1.1.2 (7)
        page_pdf: 16
        citation: « Les constructions liées au commerce, à l'activité de service ainsi qu'aux autres activités des
          secteurs secondaire ou tertiaire, non concernées par l'article UA 1.1, soumises ou non au régime des ICPE,
          lorsqu'elles ne sont pas susceptibles d'aggraver les risques de nuisances pour le voisinage. » ; « Les
          entrepôts et les commerces dont la surface de réserve excède la surface de vente. »
      commerce_gros:
        statut: sous_condition
        condition: 'même règle (« commerce » couvre détail et gros) : sans aggravation des nuisances ; interdit
          si la surface de réserve excède la surface de vente'
        article: UA 1.2 (1) ; UA 1.1.2 (7)
        page_pdf: 16
        citation: citation commune avec artisanat_commerce_detail (UA 1.2 (1) et UA 1.1.2 (7), p. 16)
      activites_services_clientele:
        statut: sous_condition
        condition: « l'activité de service » admise lorsqu'elle n'est pas susceptible d'aggraver les risques de
          nuisances pour le voisinage
        article: UA 1.2 (1)
        page_pdf: 16
        citation: « Les constructions liées au commerce, à l'activité de service […] lorsqu'elles ne sont pas susceptibles
          d'aggraver les risques de nuisances pour le voisinage. »
      logement:
        statut: sous_condition
        condition: 'le logement n''est ni interdit ni conditionné aux articles UA 1.1/1.2 (silence = autorisé) ;
          seule règle écrite : tout projet créant plus de 1 000 m² de surface de plancher d''habitation doit affecter
          au moins 20 % de la SP d''habitation au logement aidé'
        seuil_m2: 1000
        seuil_type: surface_plancher
        article: UA 1.3 (1)
        page_pdf: 17
        citation: « Tout projet visant à créer plus de 1 000 m² de surface de plancher destinée à l'habitation doit
          prévoir d'affecter au logement aidé au moins 20% de la surface de plancher d'habitation prévue dans l'opération.
          »
