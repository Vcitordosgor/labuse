  UE:
    silence: autorise
    silence_src: UE 1.1 (p. 55) dresse une liste fermée de 5 interdictions (habitation sauf UE 1.2, camping/caravaning,
      agricole, aires naturelles de camping, carrières) ; aucune clause « seules sont admises » — ce qui n'y figure
      pas n'est pas réglementé, donc admis
    note: UE 1.2 (5) admet en outre « Les équipements publics d'intérêt collectif ainsi que les constructions, ouvrages
      et travaux liés aux différents réseaux, à la voirie, au stationnement, à la production et à la distribution
      d'énergie, dès lors qu'ils s'insèrent dans le milieu environnant » (p. 55) — terme générique de destination,
      seul le volet technique est mappé ci-dessous. « commerces de proximité » (UE 1.2 (4)) ne couvre qu'un sous-ensemble
      du commerce de détail ; le commerce de gros n'est pas mentionné (silence).
    sous_destinations:
      logement:
        statut: sous_condition
        condition: 'interdit (UE 1.1.2 (1)) sauf : logement + annexes destinés aux personnes dont la présence est
          indispensable au fonctionnement ou au gardiennage des activités autorisées, maximum 50 m² de surface de
          plancher (UE 1.2 (1)) ; et travaux d''aménagement/extension mineure limitée à 20 m² sur habitations principales
          existantes non liées à une activité (UE 1.2 (2))'
        seuil_m2: 50
        seuil_type: surface_plancher
        article: UE 1.1.2 (1) ; UE 1.2 (1) et (2)
        page_pdf: 55
        citation: « Les constructions, ouvrages et travaux à usage d'habitation ainsi que leurs annexes, à condition
          qu'ils soient destinés aux personnes dont la présence est indispensable pour assurer le fonctionnement
          ou le gardiennage des activités autorisées (maximum 50 m² de surface de plancher). » ; « Les travaux d'aménagement
          et d'extension mineure (limitée à 20 m²) réalisés sur des constructions existantes à usage d'habitation
          principale non liée à une activité. »
      exploitation_agricole:
        statut: interdit
        article: UE 1.1.2 (3)
        page_pdf: 55
        citation: « L'implantation et l'extension des constructions et installations à usage agricole. »
      industrie:
        statut: autorise
        article: UE 1.2 (4)
        page_pdf: 55
        citation: « Les constructions et installations à usage d'activités au sens extensif du terme (industrie,
          artisanat, entrepôt, bureaux, commerces de proximité, services, etc.), soumises ou non au régime des ICPE
          pour la protection de l'environnement. » (aucune condition matérielle énoncée)
      entrepot:
        statut: autorise
        article: UE 1.2 (4)
        page_pdf: 55
        citation: « […] (industrie, artisanat, entrepôt, bureaux, commerces de proximité, services, etc.) […] »
          (citation commune UE 1.2 (4))
      bureau:
        statut: autorise
        article: UE 1.2 (4)
        page_pdf: 55
        citation: « […] (industrie, artisanat, entrepôt, bureaux, commerces de proximité, services, etc.) […] »
          (citation commune UE 1.2 (4))
      activites_services_clientele:
        statut: autorise
        article: UE 1.2 (4)
        page_pdf: 55
        citation: « […] (industrie, artisanat, entrepôt, bureaux, commerces de proximité, services, etc.) […] »
          (citation commune UE 1.2 (4))
      artisanat_commerce_detail:
        statut: sous_condition
        condition: 'le texte ne vise expressément que « l''artisanat » et les « commerces de proximité » (sous-ensemble
          du commerce de détail) — pas le commerce de détail en général (lequel n''est toutefois pas interdit :
          silence = autorisé)'
        article: UE 1.2 (4)
        page_pdf: 55
        citation: « […] (industrie, artisanat, entrepôt, bureaux, commerces de proximité, services, etc.) […] »
      locaux_techniques_administrations:
        statut: sous_condition
        condition: constructions, ouvrages et travaux liés aux réseaux, à la voirie, au stationnement, à la production
          et à la distribution d'énergie, dès lors qu'ils s'insèrent dans le milieu environnant
        article: UE 1.2 (5)
        page_pdf: 55
        citation: « Les équipements publics d'intérêt collectif ainsi que les constructions, ouvrages et travaux
          liés aux différents réseaux, à la voirie, au stationnement, à la production et à la distribution d'énergie,
          dès lors qu'ils s'insèrent dans le milieu environnant. »
  UT:
    silence: autorise
    silence_src: 'UT 1.1 (p. 63) dresse une liste fermée de 6 interdictions ; aucune clause « seules sont admises
      » — ce qui n''y figure pas n''est pas réglementé, donc admis. Réserve : l''interdiction n° 2 emploie le terme
      générique « et activités », dont le périmètre n''est pas défini par le règlement (non mappé)'
    note: 'ANOMALIES de renvoi : UT 1.1.2 renvoie aux articles « UT 2.1 » et « UT 2.2 » (qui sont, dans la numérotation
      réelle, les articles d''IMPLANTATION de la Partie 2) au lieu de l''article des conditions particulières ;
      celui-ci est lui-même intitulé par coquille « UD 1.2 » dans la section UT (p. 63). Lecture retenue : les conditions
      particulières de la p. 63 (article intitulé « UD 1.2 ») répondent aux exceptions annoncées. Non mappés : «
      Les constructions à usage d''activités touristiques ou de loisirs sous réserve d''une intégration environnementale
      poussée » (cond. (2), p. 63 — terme trop large pour un slug R151-28, non écrit) ; interdits d''usage : ouverture
      de carrières, dépôts de ferrailles et décharges, ICPE soumises à autorisation (UT 1.1.2 (4)(5)(6)).'
    sous_destinations:
      logement:
        statut: sous_condition
        condition: interdit (UT 1.1.2 (1)) sauf logement + annexes destinés aux personnes dont la présence est indispensable
          pour assurer le fonctionnement ou le gardiennage des activités autorisées (aucun plafond de surface écrit
          ici)
        article: UT 1.1.2 (1) ; conditions particulières (1) (article intitulé « UD 1.2 » par coquille)
        page_pdf: 63
        citation: « Les constructions, ouvrages et travaux à usage d'habitation ainsi que leurs annexes, à condition
          qu'ils soient destinés aux personnes dont la présence est indispensable pour assurer le fonctionnement
          ou le gardiennage des activités autorisées. »
      bureau:
        statut: sous_condition
        condition: interdit (UT 1.1.2 (2)) sauf « à condition qu'elles soient en rapport avec la fonction de la
          zone »
        article: UT 1.1.2 (2) ; conditions particulières (3)
        page_pdf: 63
        citation: « Les constructions à usage de bureaux, de commerces à condition qu'elles soient en rapport avec
          la fonction de la zone. »
      artisanat_commerce_detail:
        statut: sous_condition
        condition: interdit (UT 1.1.2 (2)) sauf commerces « en rapport avec la fonction de la zone »
        article: UT 1.1.2 (2) ; conditions particulières (3)
        page_pdf: 63
        citation: « Les constructions à usage de bureaux, de commerces à condition qu'elles soient en rapport avec
          la fonction de la zone. »
      commerce_gros:
        statut: sous_condition
        condition: 'même règle (« commerces » couvre détail et gros) : interdit sauf en rapport avec la fonction
          de la zone'
        article: UT 1.1.2 (2) ; conditions particulières (3)
        page_pdf: 63
        citation: citation commune avec artisanat_commerce_detail (p. 63)
      activites_services_clientele:
        statut: interdit
        article: UT 1.1.2 (2)
        page_pdf: 63
        citation: « Les constructions à usage de bureaux, services, commerces et activités, sauf celles visées à
          l'article UT 2.2. » — l'article des conditions particulières (p. 63) ne rouvre que les bureaux et les
          commerces, pas les services (renvoi « UT 2.2 » défectueux, cf. note de zone)
      exploitation_agricole:
        statut: interdit
        article: UT 1.1.2 (3)
        page_pdf: 63
        citation: « L'implantation et l'extension des constructions et installations à usage agricole. »
  AUa:
    silence: interdit
    silence_src: 'AU 1.1.2 (p. 75) : « Toute construction ou utilisation du sol non prévue à l''article AU 1.2 »
      est interdite — liste fermée d''autorisations, le silence vaut interdiction (structure commune à tous les
      secteurs AU)'
    note: 'Également admis par AU 1.2 sans mapping possible : « équipements publics compatibles » (pt 1) et « établissements
      publics structurants » (pt 4) — termes génériques non écrits en sous-destinations ; travaux sur bâtiments
      protégés L.151-19 (pt 6) ; ouvrages de prévention des risques (pt 7) ; extension mineure ≤ 20 m² pour mise
      aux normes sanitaires sur constructions existantes hors opération (pt 8) ; reconstruction après sinistre (pt
      9) ; installations et travaux divers R.421-23 (pt 12) — pp. 75-76.'
    sous_destinations:
      logement:
        statut: sous_condition
