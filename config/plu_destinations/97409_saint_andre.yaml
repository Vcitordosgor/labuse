  edition: Règlement OFFICIEL du site mairie (pièce n°3, « Approuvé le 28 février 2019 » en page de garde = idurba
    97409_20190228 servi par l'app). Le GPU ne sert PLUS aucun document pour 97409 (dépublication constatée sur
    pièces le 03/09 — API et WFS vides ; la note M40 « présent au GPU » du catalogue n'est plus vraie). Révision
    en cours NON approuvée → le PLU 2019 fait foi.
  structure: 'Ancien format : zones U avec clause « sont admises toutes les occupations non citées à l''article
    1.2 » (silence = autorisé) sauf UT fermée ; AU indicée = renvoi ÉCRIT vers la zone U d''indice (p. 90), 1AUcr
    chapitre propre ; A/N fermées (silence = interdit). Couverture : zones/secteurs énumérés PAR LE RÈGLEMENT (la
    liste des codes du zonage servi n''était pas consultable — DB indisponible) ; rapprochement au zonage à faire.'
zones:
  UA:
    silence: autorise
    silence_src: 'Art. UA 2.2, p.12 : « Sont admises toutes les occupations et utilisations du sol non citées à
      l''article UA 1.2, ainsi, que celles ci-après dès lors qu''elles respectent les conditions suivantes » — liste
      fermée d''interdictions à l''art. UA 1.2 (p.11).'
    sous_destinations:
      industrie:
        statut: interdit
        article: UA 1.2
        page_pdf: 11
        citation: « Les constructions, ouvrages et travaux à destination industrielle et à destination exclusive
          d'entrepôt. »
      entrepot:
        statut: interdit
        article: UA 1.2
        page_pdf: 11
        citation: « Les constructions, ouvrages et travaux à destination industrielle et à destination exclusive
          d'entrepôt. »
        note: Seul l'entrepôt à destination EXCLUSIVE est interdit (mot « exclusive » au texte) ; l'entrepôt accessoire
          d'une activité autorisée n'est pas visé.
      exploitation_agricole:
        statut: interdit
        article: UA 1.2
        page_pdf: 11
        citation: « Les constructions, ouvrages et travaux à destination agricole et forestière. »
      exploitation_forestiere:
        statut: interdit
        article: UA 1.2
        page_pdf: 11
        citation: « Les constructions, ouvrages et travaux à destination agricole et forestière. »
    notes:
    - 'Art. UA 1.2 al.3 (p.11) : règle LOCALISÉE (pas de zone) — en rez-de-chaussée le long des « linéaires de commerce
      et services » repérés aux plans de zonage, interdiction des destinations autres que « les commerces, les services
      et les constructions et installations nécessaires aux services publics ou d''intérêt collectif ».'
    - 'Art. UA 2.2 al.1 (p.12) : « constructions à destination d''activités » admises à condition de ne pas entraîner
      « ni incommodité et ni aggravation des risques » — terme « activités » générique, non mappable à des sous-destinations
      précises → non écrit par sous-destination.'
  UA1:
    silence: autorise
    silence_src: 'Secteur de la zone UA (chapeau p.11 : « Il existe un secteur UA1 couvrant le quartier ancien autour
      de l''avenue Bourbon »). Les articles UA 1.2 (p.11) et UA 2.2 (p.12) s''appliquent sans distinction de secteur
      : même structure liste fermée + « Sont admises toutes les occupations et utilisations du sol non citées à
      l''article UA 1.2 ».'
    sous_destinations:
