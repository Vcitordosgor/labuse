      toutes les constructions, ouvrages et travaux. »'
    sous_destinations:
      logement:
        statut: sous_condition
        condition: 'uniquement l''extension de l''existant : « A l''exception des secteurs Ntvb, Npnr, Nr et Nli,
          l''extension des bâtiments d''habitation existants est admise sous réserve de ne pas augmenter la surface
          de plancher existante à la date d''approbation du PLU de plus de 30%, dans la limite de 30m² et sans pouvoir
          excéder une surface totale finale de 120 m². » (aucune habitation nouvelle admise)'
        seuil_m2: 120
        seuil_type: surface_plancher
        article: N2.2 (6)
        page_pdf: 114
      exploitation_agricole:
        statut: sous_condition
        condition: 'uniquement l''existant : « A l''exception des secteurs Ntvb, Npnr, Nr et Nli, les bâtiments
          d''exploitation agricole existants peuvent faire l''objet d''une adaptation, d''une réfection et d''une
          extension nécessaire à leur mises aux normes à condition de s''insérer dans le milieu environnant et de
          ne pas compromettre le caractère naturel de la zone. »'
        article: N2.2 (7)
        page_pdf: 114
      locaux_techniques_administrations:
        statut: sous_condition
        condition: « A l'exception des secteurs Nr et Nli, les constructions, ouvrages et travaux liés aux différents
          réseaux, à la voirie, à la production et à la distribution d'énergie, notamment les énergies renouvelables
          ainsi que les installations et ouvrages techniques d'infrastructure nécessaires au fonctionnement des
          services publics, dès lors qu'ils s'insèrent dans le milieu environnant et qu'ils ne compromettent pas
          le caractère naturel de la zone. »
        article: N2.2 (9)
        page_pdf: 115
    note: 'Non mappés (aménagements/travaux, pas des destinations R151-28) : aménagements légers à vocation touristique
      et de loisirs ouverts au public, « sans hébergement » (points d''arrêts, kiosques, mobilier urbain, terrains
      de jeux, bassins de baignade, poste de secours…), admis sauf secteur Nr (N2.2 (3), p. 114) ; travaux liés
      à la gestion des risques naturels autorisés par le PPR et sécurisation des voies (N2.2 (4), p. 114) ; constructions
      liées à l''entretien et la gestion des sites (abris pour le matériel, local technique…), sauf Nr (N2.2 (8),
      p. 114) ; carrières, concassage et transit de matériaux dans les secteurs R.151-34 délimités aux documents
      graphiques, remise en état agricole OU mise en valeur touristique, sportive ou de loisirs (N2.2 (11), p. 115
      — aucune exclusion de secteur écrite). Aléas littoraux : interdictions N1.2 (1) et (2) p. 113, admissions
      extension/reconstruction N2.2 (1) et (2) p. 114. Fin du chapitre N : article N16, PAGE_PDF 119 ; PAGE_PDF
      120-145 = annexes (voiries en impasse, bâtiments remarquables).'
