          d'entrepôt. »
        note: Seul l'entrepôt à destination EXCLUSIVE est interdit.
      exploitation_agricole:
        statut: interdit
        article: UA 1.2
        page_pdf: 11
        citation: « Les constructions, ouvrages et travaux à destination agricole et forestière. »
      exploitation_forestiere:
        statut: interdit
        article: UA 1.2
        page_pdf: 11
        citation: « Les constructions, ouvrages et travaux à destination agricole et forestière. »
    notes:
    - Le secteur UA1 ne diffère de UA qu'aux articles UA 7.3 (implantation en fond de terrain, p.16), UA 10.2 (hauteurs
      11/14 m, p.17) et UA 11.2 (toitures-terrasses ≤ 40 %, p.18) — aucune règle de destination propre.
