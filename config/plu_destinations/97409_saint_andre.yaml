      portent les renvois. Chapeau « ZONE AUindicée » (PAGE_PDF 89) couvrant les zones 1AUindicée et 2AUindicée.
      Renvoi PARAMÉTRIQUE : « Pour appliquer le présent règlement, il convient de se reporter en fonction de l''indice
      de la zone AU considérée au règlement des zones urbaines correspondantes » (p. 89) ; art. AUindicée 1.2 (p.
      90) : « Se reporter au règlement de la zone U indiquée en indice ». Aucune liste propre d''interdictions.
      Conditions communes (art. AUindicée 2.2, p. 90) : infrastructures suffisantes (voirie, réseaux, sécurité incendie),
      ne pas empêcher les principes des OAP ; ouverture des 2AUindicée « une fois l''aménagement de l''ensemble
      des zones 1AUindicée et 1AUcr entrepris » + offre de transport en commun ; ouverture de 2AUe une fois l''aménagement
