          dès lors qu'ils s'insèrent dans le milieu environnant »
        article: AUto 2, 4°
        page_pdf: 58
        citation: « Les constructions, ouvrages et travaux destinés à la pratique de sports, de loisirs, de la détente
          et du tourisme (restauration, bar, spa, thalasso, points d'arrêts, kiosques, mobilier urbain, terrains
          de jeux, etc.) ainsi que les équipements nécessaires à leur fonctionnement (accueil, sanitaires, etc.)
          dès lors qu'ils s'insèrent dans le milieu environnant. »
      equipements_sportifs:
        statut: sous_condition
        condition: constructions destinées à la pratique de sports (terrains de jeux, etc.) « dès lors qu'ils s'insèrent
          dans le milieu environnant »
        article: AUto 2, 4°
        page_pdf: 58
        citation: « Les constructions, ouvrages et travaux destinés à la pratique de sports, de loisirs, de la détente
          et du tourisme … dès lors qu'ils s'insèrent dans le milieu environnant. »
    notes:
    - Zone concernée par une OAP (« rapport de compatibilité », p. 58).
    - 'AUto 2, 1° (p. 58) : régime propre aux cinquante pas géométriques (terrains urbanisés/équipés au 01/01/1997
      : seuls équipements touristiques et hôteliers, préservation plage/espaces boisés/parcs et jardins publics).'
