zones:
  Ua:
    silence: autorise
    silence_src: 'Art. UA 2.2, p. 10 : « Sont admises toutes les occupations et utilisations du sol non citées à
      l''article UA 1.2, ainsi, que celles ci-après dès lors qu''elles respectent les conditions suivantes »'
    sous_destinations:
      industrie:
        statut: interdit
        article: UA 1.2, 1°
        page_pdf: 10
        citation: « Les constructions, ouvrages et travaux à destination industrielle et à destination exclusive
          d'entrepôt. »
      entrepot:
        statut: interdit
        article: UA 1.2, 1°
        page_pdf: 10
        citation: « … à destination exclusive d'entrepôt »
        note: L'interdiction vise la destination EXCLUSIVE d'entrepôt (mot du règlement).
      exploitation_agricole:
        statut: interdit
        article: UA 1.2, 2°
        page_pdf: 10
        citation: « Les constructions, ouvrages et travaux à destination agricole et forestière. »
      exploitation_forestiere:
        statut: interdit
        article: UA 1.2, 2°
        page_pdf: 10
        citation: « Les constructions, ouvrages et travaux à destination agricole et forestière. »
      logement:
        statut: sous_condition
        condition: 'programme de logements d''une surface de plancher supérieure à 2 000 m² : au minimum 40 % du
          programme affecté à des logements locatifs financés par un prêt aidé de l''État (LLTS/LLS ; PLS ou accession
          aidée PSLA, LES, PTZ) ; en deçà, admis sans condition particulière (silence)'
        seuil_m2: 2000
        seuil_type: surface_plancher
        article: UA 2.2, 4°
        page_pdf: 11
        citation: « En cas de réalisation d'un programme de logements représentant une surface de plancher supérieure
          à 2 000 m², au minimum 40% de ce programme doit être affecté à des logement locatifs financés par un prêt
          aidé de l'État »
    notes:
    - UA 1.2, 3°-4° (p. 10) interdisent aussi les terrains de camping/caravaning et les dépôts de ferrailles/décharges
      — occupations du sol, pas des sous-destinations R151-28.
    - 'UA 2.2, 1° (p. 10) : dans les cinquante pas géométriques délimités au document graphique, « seules sont autorisées
      les services publics, les équipements collectifs, les opérations de réaménagement de quartier, de logement
      à caractère social et de résorption de l''habitat insalubre, les commerces, les structures artisanales, les
      équipements touristiques et hôteliers ainsi que toute autre activité économique dont la localisation à proximité
      de la mer est justifiée… » — restriction GÉOGRAPHIQUE interne à la zone, pas une règle de zone entière.'
    - 'UA 2.2, 2° (p. 11) : les constructions à destination d''activités (hors interdits de l''art. 1.2), ICPE ou
      non, sont admises « sous réserve qu''elles n''entraînent pour le voisinage ni incommodité et ni aggravation
      des risques » — condition générale sur les activités, terme trop large pour être mappé à des sous-destinations
      précises.'
