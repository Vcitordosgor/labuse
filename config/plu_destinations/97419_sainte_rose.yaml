  1AUa:
    renvoi: Ua
    renvoi_src: 'Caractère de la zone AUindicée, p. 55 : « Pour appliquer le présent règlement, il convient de se
      reporter en fonction de l''indice de la zone AU considérée au règlement des zones urbaines correspondantes.
      » ; art. AUindicée 1.2, p. 55 : « Se reporter au règlement de la zone U indiquée en indice. » ; art. AUindicée
      2, p. 55 : « Sont admises toutes les occupations et utilisations du sol prévues au règlement de la zone U
      indiquée en indice… » — indice a → zone UA.'
    notes:
    - 'Conditions supplémentaires art. AUindicée 2 (p. 55-56) : infrastructures suffisantes (1°) ; densité minimale
      20 logements/ha à l''échelle de la zone, équivalent logement 80 m² de surface de plancher (3°).'
  1AUc:
