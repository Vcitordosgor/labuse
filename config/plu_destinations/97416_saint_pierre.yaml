  A:
    silence: interdit
    silence_src: 'art. A1, p. 202 : « Dans l''ensemble de la zone A, sont interdites toutes les occupations et utilisations
      du sol qui ne sont pas mentionnées ci-après. »'
    note: 'Sont également autorisées dans l''ensemble des zones A (sauf Acu/Acu1) : la reconstruction à l''identique
      après sinistre (limite 10 ans, hors aléas PPR), la rénovation de l''existant dont la destination n''est plus
      permise, et les constructions/ouvrages liés à la production et distribution d''énergies renouvelables compatibles
      avec l''activité agricole (p. 202-203) — hors nomenclature des destinations. L''autorisation générique « équipements
      d''intérêt collectif et services publics » est bornée par sa condition aux infrastructures et réseaux ne pouvant
      être implantés ailleurs (p. 203) ; les autres sous-destinations d''équipements ne sont accessibles que par
      changement de destination de bâtiments identifiés (p. 204). Extensions des habitations existantes : 25 % de
      la surface de plancher, 15 % dans les 50 pas géométriques (p. 204). Art. A2 (p. 205) : mixité fonctionnelle
      et sociale non réglementée.'
    sous_destinations:
      exploitation_agricole:
        statut: sous_condition
        condition: 'bâtiments techniques agricoles, annexes, ouvrages et travaux nécessaires aux besoins d''une
          exploitation agricole, justifiés par la superficie de l''exploitation, la nature de l''activité, le matériel
          et les bâtiments existants ; ICPE d''élevage et d''amélioration foncière agricole ; transformation/conditionnement/commercialisation
          des produits agricoles dans le prolongement de l''acte de production (commercialisation : emprise au sol
          max 20 m² par unité foncière, accord de l''État après avis CDNPS et CDPENAF)'
        seuil_m2: 20
        article: zone A, chap. 1, art. A1
        page_pdf: 203
        citation: « Les bâtiments techniques agricoles et leurs annexes ainsi que les ouvrages et travaux nécessaires
          aux besoins d'une exploitation agricole » ; « Concernant les constructions et installations nécessaires
          à la commercialisation, autorisées ci-avant, l'emprise ne pourra être supérieure à 20 m² par unité foncière.
          » (p. 204)
      logement:
        statut: sous_condition
        condition: strictement pour les agriculteurs ou exploitants agricoles dont la présence permanente est nécessaire
          au fonctionnement de l'exploitation, un seul logement par exploitation, surface de plancher max 150 m²,
          implantation à proximité de l'exploitation ou en limite d'une zone déjà construite ; extensions des habitations
          existantes limitées à 25 % de la surface de plancher (15 % dans les 50 pas géométriques)
        seuil_m2: 150
        seuil_type: surface_plancher
        article: zone A, chap. 1, art. A1 (Logement des agriculteurs)
        page_pdf: 204
        citation: « Les constructions et changements de destination vers l'habitat sont autorisés strictement pour
          les agriculteurs ou exploitants agricoles dont la présence permanente est nécessaire au fonctionnement
          de l'exploitation […] dans la limite d'un seul logement par exploitation […] se limiter à une surface
          de plancher maximale de 150 m². »
      restauration:
        statut: sous_condition
        condition: uniquement par changement de destination de bâtiments anciens dont l'usage agricole a cessé,
          identifiés au plan de zonage (L.151-11 I-2° et R.151-35), hors STECAL, sans compromettre l'activité agricole
          ni la qualité paysagère du site — pas de construction nouvelle
        article: zone A, chap. 1, art. A1 (Changement de destination)
        page_pdf: 204
        citation: « Le changement de destination se fasse vers la destination hébergement hôtelier et touristique,
          restauration et équipements d'intérêt collectifs et services publics dans son ensemble. »
      hotels:
