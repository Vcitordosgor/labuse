  Ue:
    silence: autorise
    silence_src: 'art. Ue1, p. 188 : « Tous les usages et affectations des sols, types d''activités et catégories
      de constructions qui ne sont pas "interdits" ou "autorisés sous conditions" sont autorisés. Le règlement et
      le tableau ci-dessous illustre, de manière non exhaustive, ceux qui se trouvent ainsi "autorisés". »'
    note: 'Les X du tableau visent les « Destinations interdites (nouvelles constructions) » (p. 188) ; l''extension
      ou la transformation des constructions existantes dans leur destination actuelle reste admise sous conditions
      (art. Ue1, p. 187). Secteur des 50 pas géométriques (plan de zonage) : « seuls sont autorisés » les services
      publics/équipements d''intérêt collectif, les opérations de réaménagement de quartier/logement social/RHI,
      les commerces, structures artisanales, équipements touristiques et hôteliers justifiés par la proximité de
      la mer, et l''adaptation/changement de destination/réfection/extension limitée de l''existant (20 % de l''emprise
      au sol) (p. 188). Autorisations nommées en Ue (p. 190) : Pôle Déchets Sud, station de traitement des eaux
      usées de Pierrefonds, unités de tri, installations du port, de l''hôpital, hébergements liés au fonctionnement
      des équipements (y compris étudiants d''un pôle de formation). Hors nomenclature des destinations : carrière
      V* (zone de Pierrefonds, gisement identifié au Schéma départemental des carrières, remise en état pour activités
      économiques, p. 191) ; terrain de camping et de caravaning X (p. 191). Art. Ue2 (p. 191) : mixité fonctionnelle
      et sociale non réglementée.'
