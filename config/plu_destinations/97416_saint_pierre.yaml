        article: zone N, chap. 1, art. N1 (zone Np)
        page_pdf: 215
        citation: « Les constructions, les aménagements légers, les occupations du sol, en relation avec la présence
          d'espaces de nature […] et le développement d'équipements sportifs ou récréatifs (aires de jeux, aires
          de pique-nique, …) […] celles-ci seront limitées à 50 m², et 150 m² pour les équipements publics d'intérêts
          collectifs, d'emprise au sol par hectare »
