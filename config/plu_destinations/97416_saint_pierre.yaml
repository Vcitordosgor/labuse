    silence_src: 'art. N1, p. 214 : « Seuls peuvent être implantés, dans les conditions définies ci-dessous, les
      aménagements légers suivants … » (réglementation conforme à l''art. R121-5 du code de l''urbanisme ; le secteur
      Nr est en outre exclu de la liste commune des zones N, p. 212)'
    note: 'Espaces remarquables de la loi Littoral. Autorisés uniquement des aménagements légers (p. 214) : équipements
      légers et démontables de préservation/restauration, cheminements piétonniers/cyclables et sentes équestres
      ni cimentés ni bitumés, mobilier d''accueil/information, postes d''observation de la faune, sanitaires et
      postes de secours démontables ; aires de stationnement indispensables non cimentées/bitumées sans accroissement
      de capacité ; réfection des bâtiments existants et extension limitée des bâtiments nécessaires aux activités
      économiques ; constructions liées à la pêche/cultures marines exigeant la proximité de l''eau ; canalisations
      enfouies des services publics (emprise ≤ 5 m²) ; gestion du patrimoine bâti classé/inscrit ; équipements d''intérêt
      général de sécurité des populations. Les aménagements 1°, 2°, 4° et les réfections/extensions du 3° doivent
      permettre un retour du site à l''état naturel (p. 214).'
