  edition: PLU approuvé 25/06/2024 (format moderne post-décret 2015, nomenclature 23 sous-destinations du décret
    2023-195)
  structure: 'Règlement moderne : par zone, « chapitre 1 — usage des sols et destination des constructions » avec
    TABLEAU des 23 sous-destinations (V autorisé / V* sous condition / X interdit). Silence dit par le tableau lui-même
    (« tous les usages… qui ne sont pas interdits ou autorisés sous conditions sont autorisés ») pour les zones
    U ; zones AU0/A/N « seules sont autorisées… » (silence = interdit). Uea/Uemi (aéroport Pierrefonds, Armée) :
    régime « toutes destinations nécessaires au fonctionnement » → 23 sous condition. Overlays hors nomenclature
    en note (50 pas géométriques, linéaires RDC Ucv, carrières).'
zones:
  Ucv:
    silence: autorise
    silence_src: 'art. Ucv1, p. 60 : « Tous les usages et affectations des sols, types d''activités et catégories
      de constructions qui ne sont pas "interdits" ou "autorisés sous conditions" sont autorisés. Le règlement et
      le tableau ci-dessous illustre, de manière non exhaustive, ceux qui se trouvent ainsi "autorisés". »'
    note: 'Secteur des 50 pas géométriques (plan de zonage) : « seuls sont autorisés » services publics/équipements
      collectifs, réaménagement de quartier/logement social/RHI, commerces-artisanat-tourisme justifiés par la proximité
      de la mer, et adaptation/extension limitée (20 % emprise) de l''existant (art. Ucv1, p. 59-60). Art. Ucv2
      (p. 62) : au sein des linéaires d''activités en RDC recensés au plan de zonage, le changement de destination
      en vue de créer des logements est interdit et les RDC doivent comporter restauration/hôtellerie/artisanat/commerce
      de détail. Interdits hors nomenclature (occupations du sol) : carrière, camping-caravaning (p. 61), ateliers
      de réparation automobile, postes de peinture, stations-services (p. 62).'
    sous_destinations:
      logement:
        statut: autorise
        article: zone Ucv, chap. 1, art. Ucv1 (tableau)
        page_pdf: 60
        citation: « Logement V »
