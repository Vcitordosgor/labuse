      qu''elle soit. Seules sont autorisées les installations et ouvrages nécessaires au fonctionnement des services
      publics (réseaux, …) et l''extension des constructions existantes. »'
    note: 'Zone à urbaniser insuffisamment équipée, non ouverte à l''urbanisation (ouverture par modification du
      PLU). Échéancier : « Zones AU0-1/AU0c-1 : ouverture entre 2 et 6 ans à compter de la date d''approbation de
      l''Eco-PLU » (p. 200). Extensions de l''existant limitées à 20 % de la surface de plancher existante à la
      date d''approbation (p. 200).'
    sous_destinations:
      locaux_techniques_administrations:
