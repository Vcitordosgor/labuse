  Npnr:
    silence: interdit
    silence_src: 'art. N1, p. 212 : « En zone Npnr sont interdis tous travaux, constructions et installations, à
      l''exception de ceux ayant reçus une autorisation spéciale de l''établissement public du Parc. »'
    note: 'Cœur du Parc national de la Réunion : « aucune construction n''est admise, sauf autorisation spéciale
      » (préambule, p. 212). Aucune destination ni sous-destination n''est autorisée par le règlement lui-même —
      la seule voie est l''autorisation spéciale de l''établissement public du Parc, hors nomenclature.'
