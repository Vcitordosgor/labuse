    note: Secteur parcs (valorisation sportive et culturelle). Constructions limitées à 50 m² d'emprise au sol par
      hectare, portées à 150 m² par hectare pour les équipements publics d'intérêt collectif, en plus des surfaces
      existantes, au prorata de l'unité foncière (p. 215) — plafonds en EMPRISE AU SOL, pas en surface de plancher/vente.
