  Ac:
    renvoi: A
    renvoi_src: 'art. A1, p. 204 : « En zone Ac, sont autorisées, en plus des dispositions prévues pour la zone
      A : … »'
    note: 'Les ajouts propres à Ac sont hors nomenclature des destinations : locaux et installations techniques
      liés à l''extraction/stockage/transport de matériaux pendant l''exploitation ICPE ; prélèvements de matériaux,
      ouverture de carrières et entreposage de matériel, sous réserve que la remise en état permette la continuité
      de l''activité agricole (p. 204). Hauteur max portée à 25 m en Ac/Ac1 (art. A3, p. 206).'
  Ac1:
    renvoi: Ac
    renvoi_src: 'art. A1, p. 204 : « En zone Ac1, sont autorisées, en plus des dispositions prévues pour la zone
      Ac : … »'
    note: 'Ajout propre à Ac1, hors nomenclature des destinations : locaux et installations techniques liés au traitement
      des matériaux par installations mobiles de traitement primaire (concassage, criblage, lavage), à caractère
      précaire, remise en état permettant la continuité de l''activité agricole, engins mobiles à 30 m minimum des
      constructions à usage d''habitation (p. 204-205).'
  Acu:
    silence: interdit
    silence_src: 'art. A1, p. 202 : « Dans l''ensemble de la zone A, sont interdites toutes les occupations et utilisations
      du sol qui ne sont pas mentionnées ci-après. » (les secteurs Acu et Acu1 sont expressément exclus de la liste
      commune des autorisations de la zone A : « Dans l''ensemble des zones A y compris ces secteurs (Ac, Ac1 et
      At) sauf les secteurs Acu et Acu1 », p. 202)'
    note: 'Coupure d''urbanisation du SAR. Autorisés aussi (hors nomenclature) : la valorisation des coupures par
      l''aménagement de zones destinées à la fréquentation touristique, aux loisirs ou à des pratiques sportives
      ne nécessitant que des équipements légers, sans artificialisation ni imperméabilisation (p. 205) ; à titre
      exceptionnel, infrastructures de transport de personnes/marchandises/énergie (p. 205).'
    sous_destinations:
      exploitation_agricole:
        statut: sous_condition
        condition: réhabilitation des bâtiments agricoles existants et extension uniquement si nécessaire à leur
          mise aux normes avec impact environnemental et paysager réduit ; aménagements nécessaires à la mise en
          culture, à l'exploitation agricole des terrains et à l'aquaculture, sous réserve d'intégration paysagère
        article: zone A, chap. 1, art. A1 (zone Acu)
        page_pdf: 205
        citation: « La réhabilitation des bâtiments agricoles existants et leur extension dans le cas où celle-ci
          est nécessaire à leur mise aux normes […] Les aménagements nécessaires à la mise en culture et à l'exploitation
          agricole des terrains concernés, à l'aquaculture et à l'exploitation forestière, sous réserve de faire
          l'objet d'une intégration paysagère. »
      exploitation_forestiere:
        statut: sous_condition
        condition: aménagements nécessaires à l'exploitation forestière, sous réserve d'intégration paysagère
        article: zone A, chap. 1, art. A1 (zone Acu)
        page_pdf: 205
        citation: « Les aménagements nécessaires à la mise en culture et à l'exploitation agricole des terrains
          concernés, à l'aquaculture et à l'exploitation forestière, sous réserve de faire l'objet d'une intégration
          paysagère. »
      equipements_sportifs:
        statut: sous_condition
        condition: uniquement l'aménagement de zones destinées à la fréquentation touristique, aux loisirs ou à
          des pratiques sportives ne nécessitant que des équipements légers, compatibles avec l'intérêt écologique
          de la zone, sans artificialisation des milieux ni imperméabilisation des sols, hors espaces exploités
          ou destinés à l'agriculture
        article: zone A, chap. 1, art. A1 (zone Acu)
        page_pdf: 205
        citation: « l'aménagement de zones destinées à la fréquentation touristique, aux loisirs ou à des pratiques
          sportives ne nécessitant que des équipements légers, sous réserve que cet aménagement soit compatible
          avec l'intérêt écologique de la zone »
      locaux_techniques_administrations:
        statut: sous_condition
        condition: 'à titre exceptionnel : infrastructures de transport de personnes, de marchandises ou d''énergie,
          et installations de distribution, de traitement ou de stockage de l''eau, sous réserve de compatibilité
          avec l''activité agricole, d''absence d''alternative à coût supportable, de transparence écologique et
          de mesures éviter/réduire/compenser'
        article: zone A, chap. 1, art. A1 (zone Acu)
        page_pdf: 205
        citation: « À titre exceptionnel, peuvent être autorisées dans les coupures d'urbanisation […] La réalisation
          d'infrastructures de transport de personnes, de marchandises ou d'énergie ; Les installations de distribution,
          de traitement ou de stockage de l'eau »
  Acu1:
    renvoi: Acu
    renvoi_src: 'art. A1, p. 205 : « En zone Acu1, sont autorisées, en plus des dispositions prévues pour la zone
      Acu : … »'
    note: 'Ajout propre à Acu1, hors nomenclature des destinations : ouverture et exploitation des carrières, locaux
      et installations techniques liés à l''extraction/stockage/transport de matériaux, sous réserve que la remise
      en état restaure le caractère naturel ou agricole initial de la coupure (p. 205).'
  At:
    silence: interdit
    silence_src: 'art. A1, p. 202 : « Dans l''ensemble de la zone A, sont interdites toutes les occupations et utilisations
      du sol qui ne sont pas mentionnées ci-après. »'
    note: 'STECAL à vocation touristique : « En zone At sont autorisées, en plus des dispositions prévues pour la
      zone A » (p. 205) — les entrées de la zone A (bâtiments agricoles, logement d''agriculteur 150 m², équipements
      collectifs/réseaux, changements de destination) s''appliquent donc aussi en At ; ne sont reprises ci-dessous
      que les entrées propres au secteur et celles de la zone A dont le statut est inchangé n''y sont pas dupliquées
      : se reporter à la zone A pour exploitation_agricole, logement, locaux_techniques_administrations et les sous-destinations
      ouvertes par changement de destination. Autorisés aussi (hors nomenclature stricte) : « Les espaces de manifestation,
      d''accueil, dans la limite de 50 m² de surface de plancher » (p. 205). Emprise au sol limitée à 50 % (unité
      foncière < 500 m²) ou 40 % (> 500 m²) (art. A3, p. 206) ; au moins 50 % du terrain végétalisé (art. A5, p.
      210).'
    sous_destinations:
      hotels:
        statut: sous_condition
        condition: hébergement hôtelier touristique dans la limite de 150 m² de surface de plancher (ligne unique
          « hébergement hôtelier touristique », appliquée aussi aux autres hébergements touristiques)
        seuil_m2: 150
        seuil_type: surface_plancher
        article: zone A, chap. 1, art. A1 (zone At)
        page_pdf: 205
        citation: « L'hébergement hôtelier touristique, et la restauration dans la limite de 150 m² de surface de
          plancher. »
      autres_hebergements_touristiques:
        statut: sous_condition
        condition: hébergement hôtelier touristique dans la limite de 150 m² de surface de plancher (ligne unique
          « hébergement hôtelier touristique »)
        seuil_m2: 150
        seuil_type: surface_plancher
        article: zone A, chap. 1, art. A1 (zone At)
        page_pdf: 205
        citation: « L'hébergement hôtelier touristique, et la restauration dans la limite de 150 m² de surface de
          plancher. »
      restauration:
        statut: sous_condition
        condition: dans la limite de 150 m² de surface de plancher
        seuil_m2: 150
        seuil_type: surface_plancher
        article: zone A, chap. 1, art. A1 (zone At)
        page_pdf: 205
        citation: « L'hébergement hôtelier touristique, et la restauration dans la limite de 150 m² de surface de
          plancher. »
      exploitation_agricole:
        statut: sous_condition
        condition: 'règles de la zone A applicables en At (« en plus des dispositions prévues pour la zone A »)
          : bâtiments techniques agricoles et annexes nécessaires aux besoins d''une exploitation agricole, justifiés
          ; commercialisation dans le prolongement de l''acte de production limitée à 20 m² d''emprise par unité
          foncière'
        article: zone A, chap. 1, art. A1
        page_pdf: 203
        citation: « En zone At sont autorisées, en plus des dispositions prévues pour la zone A » (p. 205) ; « Les
          bâtiments techniques agricoles et leurs annexes ainsi que les ouvrages et travaux nécessaires aux besoins
          d'une exploitation agricole » (p. 203)
      logement:
        statut: sous_condition
        condition: 'règles de la zone A applicables en At : strictement pour les agriculteurs/exploitants dont la
          présence permanente est nécessaire, un seul logement par exploitation, surface de plancher max 150 m²'
        seuil_m2: 150
        seuil_type: surface_plancher
        article: zone A, chap. 1, art. A1 (Logement des agriculteurs)
        page_pdf: 204
        citation: « En zone At sont autorisées, en plus des dispositions prévues pour la zone A » (p. 205) ; « […]
          dans la limite d'un seul logement par exploitation […] surface de plancher maximale de 150 m² » (p. 204)
      locaux_techniques_administrations:
        statut: sous_condition
        condition: 'règles de la zone A applicables en At : équipements collectifs uniquement si nécessaires aux
          infrastructures et réseaux ne pouvant être implantés ailleurs, compatibles avec l''activité agricole et
          la loi Littoral'
        article: zone A, chap. 1, art. A1 (équipements d'intérêt collectif et services publics)
        page_pdf: 203
        citation: '« En zone At sont autorisées, en plus des dispositions prévues pour la zone A » (p. 205) ; «
          Les constructions et installations nécessaires à des équipements collectifs dès lors : Qu''elles sont
          nécessaires à la réalisation, l''entretien et l''extension d''infrastructures et des réseaux […] » (p.
          203)'
