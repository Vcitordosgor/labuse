      légers touristiques sans hébergement (N2.2-7), gestion des risques (N2.2-9), réseaux/énergie sous réserve
      L.121-24 à 26 (N2.2-11), carrières R.151-34 (N2.2-12), reconstruction après sinistre (p. 53).'
