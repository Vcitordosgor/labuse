  structure: 'Format moderne : sections III (zones urbaines résidentielles), IV (zones urbaines d''activités), V
    (AU), VI (A), VII (N) ; chaque zone a un chapitre 1 « destination des constructions, usages des sols et natures
    d''activité ». La règle de silence est lue dans la structure de chaque chapitre et citée par zone.'
zones:
  UA:
    silence: autorise
    silence_src: 'Art. U2, p. 17 : « Sont admises toutes les occupations et utilisations du sol non citées à l''article
      U 1.2 »'
    sous_destinations:
      industrie:
        statut: interdit
        article: U1.2-1
        page_pdf: 16
        citation: « Les constructions, ouvrages et travaux à destination industrielle et à destination exclusive
          d'entrepôt »
      entrepot:
        statut: sous_condition
        condition: la destination EXCLUSIVE d'entrepôt est interdite (U1.2-1, p. 16) ; les entrepôts sont admis
          si la surface de réserve est inférieure à la surface de vente (U2-1, p. 17) ou s'ils sont liés aux occupations
          et utilisations des sols admises dans la zone, sans incommodité ni aggravation des risques pour le voisinage
          (U2-3, p. 17)
        article: U1.2-1 / U2-1 / U2-3
        page_pdf: 17
        citation: « Les constructions destinées à la fonction d'entrepôt liée aux occupations et utilisations des
          sols admises dans la zone… » (U2-3)
      exploitation_agricole:
        statut: interdit
        article: U1.2-2
        page_pdf: 16
        citation: « Les constructions, ouvrages et travaux à destination agricole et forestière » (citation commune
          avec exploitation_forestiere)
      exploitation_forestiere:
        statut: interdit
        article: U1.2-2
        page_pdf: 16
        citation: « Les constructions, ouvrages et travaux à destination agricole et forestière » (citation commune
          avec exploitation_agricole)
      artisanat_commerce_detail:
        statut: sous_condition
        condition: surface de réserve inférieure à la surface de vente
        article: U2-1
        page_pdf: 17
        citation: « Les entrepôts, artisanat et commerces dont la surface de réserve est inférieure à la surface
          de vente » (« commerces » couvre détail et gros)
      commerce_gros:
        statut: sous_condition
        condition: surface de réserve inférieure à la surface de vente
        article: U2-1
        page_pdf: 17
        citation: « Les entrepôts, artisanat et commerces dont la surface de réserve est inférieure à la surface
          de vente » (« commerces » couvre détail et gros)
      logement:
        statut: sous_condition
        condition: admis (silence) ; tout projet créant plus de 2 500 m² de surface de plancher destinée à l'habitation
          (hors secteurs d'OAP de mixité sociale et aménagements liés à la Défense nationale) doit affecter au logement
          social au moins 20 % de la surface de plancher d'habitation de l'opération
        seuil_m2: 2500
        seuil_type: surface_plancher
        article: U3
        page_pdf: 17
        citation: « En zones UA, UB et UC… tout projet visant à créer plus de 2 500 m² de surface de plancher destinée
          à l'habitation doit prévoir d'affecter au logement social… au moins 20 % »
    notes:
    - 'Usages du sol interdits (non mappés en sous-destinations) : aires naturelles de camping, terrains de camping
      et caravaning ; dépôts de ferrailles/matériaux/combustibles/ordures ; exploitations de carrières (U1.2-3/4/5,
      p. 16) ; habitations légères de loisirs (U1.2-6, p. 17).'
    - Le long des linéaires L.151-16 délimités aux documents graphiques, les rez-de-chaussée sur voie doivent obligatoirement
      être affectés aux commerces et activités de services (U2-5, p. 17).
    - 'Rappel U1.1-7 (p. 16) : commerce dont « la surface de vente est supérieure à 500 m² de surface de plancher
      » soumis au DAACL du SCoT de la CINOR.'
    - Tableau de synthèse p. 17-18 illisible à l'extraction (coches perdues) — relayé depuis le texte des articles.
  UAb:
    renvoi: UA
    renvoi_src: 'secteur de la zone UA (p. 16 : « Deux secteurs UAb et UAz sont définis ») ; DG p. 4 : « la règle
