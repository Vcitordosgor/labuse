  Ub1:
    renvoi: Ub
    renvoi_src: 'Dispositions générales, Article 3, p. 4 : « la règle générale de la zone s''applique à chacun d''eux
      sauf lorsqu''une disposition particulière est prévue pour l''un de ces secteurs » ; chapitre p. 7 : « Il existe
      5 secteurs Ub1, Ub2, Ub3 dont les hauteurs admises diffèrent » — seule la hauteur diffère (U 10.2, p. 13),
      aucune disposition propre de destinations.'
  Ub2:
    renvoi: Ub
    renvoi_src: 'Dispositions générales, Article 3, p. 4 : règle de zone sauf disposition particulière ; chapitre
      p. 7 : secteurs Ub1/Ub2/Ub3 « dont les hauteurs admises diffèrent » — seule la hauteur diffère (U 10.2, p.
      12), aucune disposition propre de destinations.'
  Ub3:
    renvoi: Ub
    renvoi_src: 'Dispositions générales, Article 3, p. 4 : règle de zone sauf disposition particulière ; chapitre
