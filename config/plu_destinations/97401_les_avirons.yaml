      13), aucune disposition propre de destinations.'
  Ub4:
    silence: interdit
    silence_src: 'Art. U 1.2 7., p. 7 : « En secteur Ub4, les constructions, ouvrages et travaux non liés à la réalisation
      d''équipements collectifs d''intérêt général » (sont interdits) — tout ce qui n''est pas lié aux équipements
      collectifs d''intérêt général est interdit.'
    note: 'Les équipements collectifs d''intérêt général ne sont pas cités par l''interdiction U 1.2 7. et relèvent
      donc du chapeau U 2.2 (p. 8 : « sont admises toutes les occupations et utilisations du sol non citées à l''article
      U 1.2 ») — lecture de structure, pas déduite du nom du secteur. Le terme de destination « équipements collectifs
      d''intérêt général » est mappé aux sous-destinations de la destination R151-27 « équipements d''intérêt collectif
      et services publics ».'
