  Ub5:
    silence: interdit
    silence_src: 'Art. U 1.2 8., p. 7 : « En secteur Ub5, toutes les constructions, ouvrages et travaux à l''exception
      de ceux mentionnés à l''article U 2 » (sont interdits) ; art. U 2.2 dernier alinéa, p. 8 : « En secteur Ub5,
      seules sont autorisés les chemins piétons et les voies d''accès permettant aux services d''entretenir les
      lits et remparts des ravines, sous réserve de protection contre l''érosion du bord de la ravine. »'
    note: 'Zone non aedificandi (ravines et talweg, chapitre p. 7). Aucune des 23 sous-destinations n''est admise
      : seuls chemins piétons et voies d''accès d''entretien (pas des constructions à destination).'
