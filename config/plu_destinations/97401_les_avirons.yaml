  Nli:
    silence: interdit
    silence_src: 'Art. N 1.2, p. 50 (« sont interdits toutes les constructions, ouvrages et travaux ») et N 2.2
      2., p. 51 : « Dans le secteur Nli, seuls sont admis les aménagements légers prévus à l''article R.121-5 du
      code de l''urbanisme et dans les conditions prévues à l''article L.121-24 » — « seuls » : liste exclusive.'
    note: 'Espaces remarquables du littoral. Aménagements légers admis « à condition que leur localisation et leur
      aspect ne dénaturent pas le caractère des sites, ne compromettent pas leur qualité architecturale et paysagère
      et ne portent pas atteinte à la préservation des milieux » ; le d) est « A l''exclusion de toute forme d''hébergement
      » ; le c) admet « la réfection des bâtiments existants et l''extension limitée des bâtiments et installations
      nécessaires à l''exercice d''activités économiques » (existants seulement, pas une construction neuve à destination)
      ; les aménagements a), b), d) et les réfections/extensions c) « doivent être conçus de manière à permettre
      un retour du site à l''état naturel ». Tension textuelle relevée : N 2.2 4. (extension des habitations) et
      N 2.2 8. (équipements collectifs) n''excluent expressément que Npnr et/ou Nr, mais le « seuls » de N 2.2 2.
      ferme le secteur Nli — lecture exclusive retenue, citée.'
    sous_destinations:
      exploitation_agricole:
        statut: sous_condition
        condition: « aménagements nécessaires à l'exercice des activités agricoles, pastorales et forestières dont
          à la fois la surface de plancher et l'emprise au sol au sens de l'article R.420-1 n'excèdent pas cinquante
          mètres carrés », en harmonie avec le site, à l'exclusion de toute forme d'hébergement, conçus pour permettre
          un retour du site à l'état naturel (N 2.2 2. d)).
        seuil_m2: 50
        seuil_type: surface_plancher
        article: N 2.2 2. d)
        page_pdf: 51
        citation: « Les aménagements nécessaires à l'exercice des activités agricoles, pastorales et forestières
          dont à la fois la surface de plancher et l'emprise au sol au sens de l'article R.420-1 n'excèdent pas
          cinquante mètres carrés »
        note: La limite de 50 m² porte à la fois sur la surface de plancher ET l'emprise au sol (texte cité).
      exploitation_forestiere:
        statut: sous_condition
        condition: « aménagements nécessaires à l'exercice des activités agricoles, pastorales et forestières »
          ≤ 50 m² de surface de plancher et d'emprise au sol, en harmonie avec le site, à l'exclusion de toute forme
          d'hébergement, retour du site à l'état naturel possible (N 2.2 2. d)).
        seuil_m2: 50
        seuil_type: surface_plancher
        article: N 2.2 2. d)
        page_pdf: 51
        citation: « Les aménagements nécessaires à l'exercice des activités agricoles, pastorales et forestières
          dont à la fois la surface de plancher et l'emprise au sol au sens de l'article R.420-1 n'excèdent pas
          cinquante mètres carrés »
  Npnr:
    silence: interdit
    silence_src: 'Art. N 1.2, p. 50 (« sont interdits toutes les constructions, ouvrages et travaux ») et N 2.2
      1., p. 50 : « Dans le secteur Npnr, seuls les travaux, constructions et installations notamment indispensables
      à l''approvisionnement en eau et en énergie, les constructions légères à usage touristique... ayant reçus
      une autorisation spéciale de l''établissement public du Parc National de la Réunion délivrée après avis de
      son Conseil Scientifique, conformément à l''article L.331-4 du code de l''Environnement, peuvent être admis.
      »'
    note: 'Cœur du parc national. Aucune sous-destination n''est admise de plein droit : tout passe par l''autorisation
      spéciale du Parc (les « constructions légères à usage touristique... » citées ne sont admissibles que par
      cette voie — pas un statut). Le secteur est en outre expressément exclu de N 2.2 4. (extension des habitations)
      et N 2.2 8. (équipements collectifs).'
  Nr:
    silence: interdit
    silence_src: 'Art. N 1.2, p. 50 (« sont interdits toutes les constructions, ouvrages et travaux ») ; N 2.2 8.,
      p. 51 : « Dans le secteur Nr, seules les constructions et installations nécessaires à des équipements collectifs
      ou à des services publics liées à l''exploitation ou la valorisation d''une ressource d''alimentation en eau
      potable sont autorisées. »'
    note: 'Réservoirs de biodiversité et corridors écologiques hors cœur de parc. Le secteur est expressément exclu
      de N 2.2 3. (entretien/gestion des sites : « A l''exception du secteur Nr ») et de N 2.2 4. (extension des
      habitations : « A l''exception des secteurs Npnr et Nr »). La seule ouverture écrite est l''équipement collectif/service
      public lié à l''eau potable — mappé locaux_techniques_administrations (ouvrages techniques AEP), sans étendre
      aux autres sous-destinations d''équipements.'
    sous_destinations:
      locaux_techniques_administrations:
        statut: sous_condition
        condition: « seules les constructions et installations nécessaires à des équipements collectifs ou à des
          services publics liées à l'exploitation ou la valorisation d'une ressource d'alimentation en eau potable
          sont autorisées » ; conditions générales N 2.2 8. (compatibilité activité agricole/pastorale/forestière,
          pas d'atteinte aux espaces naturels et paysages).
        article: N 2.2 8.
        page_pdf: 51
        citation: « Dans le secteur Nr, seules les constructions et installations nécessaires à des équipements
          collectifs ou à des services publics liées à l'exploitation ou la valorisation d'une ressource d'alimentation
          en eau potable sont autorisées. »
  Nto:
