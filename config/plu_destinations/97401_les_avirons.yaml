  N:
    silence: interdit
    silence_src: 'Art. N 1.2, p. 50 : « A l''exception de ceux visés à l''article N2.2., sont interdits toutes les
      constructions, ouvrages et travaux. »'
    note: 'N 2.2 admet aussi, hors statut de sous-destination : constructions/ouvrages « liés à l''entretien et
      la gestion des sites (abris pour le matériel, local technique, etc.) » à l''exception du secteur Nr (3., p.
      51) ; « aménagements légers à vocation touristique et de loisirs ouverts au public, sans hébergement » (5.,
      p. 51) ; travaux liés à la gestion des risques naturels (7., p. 51) ; réseaux/voirie/énergie et infrastructures
      de services publics (9., p. 51-52) ; reconstruction à l''identique après sinistre (10., p. 52). Rappel : avis
      favorable CDPENAF requis (N 2.1 2., p. 50). Les secteurs Nli, Npnr, Nr, Nto ont des régimes propres (entrées
      dédiées).'
