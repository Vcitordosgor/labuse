zones:
  Ua:
    silence: autorise
    silence_src: 'Art. U 2.2, p. 8 : « A l''exception du secteur Ub5, sont admises toutes les occupations et utilisations
      du sol non citées à l''article U 1.2, ainsi, que celles ci-après dès lors qu''elles respectent les conditions
      suivantes » — liste fermée d''interdictions (U 1.2, p. 7), tout le reste est admis.'
    note: 'Le terme « constructions à destination d''activités » (U 2.2 1., p. 8) est mappé aux sous-destinations
      des deux destinations économiques R151-27 (« commerce et activités de service », « autres activités des secteurs
      secondaire ou tertiaire »), exceptées celles interdites à l''article U 1.2, comme le texte le prévoit. « hebergement
      » (résidences/foyers) n''est pas mentionné → régime du silence (autorisé). Overlays non reportés en statut
      : constructions nouvelles interdites sur les espaces paysagers protégés L.151-19 identifiés aux documents
      graphiques (U 1.2 1., p. 7) ; le long du linéaire L.151-16 délimité, rez-de-chaussée obligatoirement affectés
      à « commerce de détail, restauration, artisanat, services, locaux et bureaux accueillant du public des administrations
      publiques et assimilés, bureaux » sur 7 m de profondeur (U 2.2 6., p. 8) ; rappels PPR/captages (U 1.1/2.1).
      Interdictions hors champ des 23 sous-destinations, non mappées : travaux R.421-19 c)-k) et R.421-23 c)-f)
      (U 1.2 4.), « dépôts de ferrailles et décharges » (U 1.2 5.), « création ou extension de carrières » (U 1.2
      6.). Bonus de hauteur « pour les opérations d''hébergement hôtelier » en zones Ua, Uc et Ud : +3 m (U 10.2,
      p. 13) — règle de gabarit, pas un statut.'
