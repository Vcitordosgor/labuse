  Ud1:
    silence: interdit
    silence_src: 'Art. U 2.2, p. 8 : « En secteur Ud1, les constructions et installations peuvent être autorisées
      à des fins exclusives d''amélioration de l''offre de logement ou d''hébergement et d''implantation de services
      publics » — « à des fins exclusives » : tout le reste est exclu (disposition de secteur en substitution à
      la règle générale, DG Article 3, p. 4).'
    note: 'Secteur déjà urbanisé en espace agricole/naturel (loi ELAN, chapitre p. 7). Conditions générales du secteur
      : les constructions « n''ont pas pour effet d''étendre le périmètre bâti existant ni de modifier de manière
      significative les caractéristiques de ce bâti » ; avis de la CDNPS au titre de l''article L.121-8 ; refus
      si atteinte à l''environnement ou aux paysages (U 2.2, p. 8). « Implantation de services publics » : terme
      cité tel quel, trop générique pour être mappé à une ou plusieurs sous-destinations précises sans déduction
      — non mappé.'
    sous_destinations:
      logement:
        statut: sous_condition
        condition: « à des fins exclusives d'amélioration de l'offre de logement ou d'hébergement » ; sans extension
          du périmètre bâti existant ni modification significative des caractéristiques du bâti ; avis CDNPS (L.121-8)
          ; refus si atteinte à l'environnement ou aux paysages.
        article: U 2.2 (secteur Ud1)
        page_pdf: 8
        citation: « En secteur Ud1, les constructions et installations peuvent être autorisées à des fins exclusives
          d'amélioration de l'offre de logement ou d'hébergement et d'implantation de services publics, lorsque
          ces constructions et installations n'ont pas pour effet d'étendre le périmètre bâti existant ni de modifier
          de manière significative les caractéristiques de ce bâti. »
      hebergement:
        statut: sous_condition
        condition: « à des fins exclusives d'amélioration de l'offre de logement ou d'hébergement » ; sans extension
          du périmètre bâti existant ni modification significative des caractéristiques du bâti ; avis CDNPS (L.121-8)
          ; refus si atteinte à l'environnement ou aux paysages.
        article: U 2.2 (secteur Ud1)
        page_pdf: 8
        citation: « En secteur Ud1, les constructions et installations peuvent être autorisées à des fins exclusives
          d'amélioration de l'offre de logement ou d'hébergement et d'implantation de services publics »
  Ud2:
    silence: interdit
    silence_src: 'Art. U 2.2, p. 8 : « En secteur Ud2, seules les constructions destinées à la pratique du tourisme,
      dont l''hébergement touristique, ainsi que l''extension limitée des constructions existantes sont autorisées.
      » — « seules » : liste exclusive, tout le reste est interdit (disposition de secteur en substitution, DG Article
      3, p. 4).'
    note: '« l''hébergement touristique » est cité comme composante de la « pratique du tourisme » admise : mappé
      hotels + autres_hebergements_touristiques (citation commune, doctrine « hébergement hôtelier et touristique
      »). L''« extension limitée des constructions existantes » est admise quelle que soit leur destination (dans
      les mêmes limites de surface). Toutes les constructions « doivent s''intégrer dans leur environnement sans
      le dénaturer ».'
    sous_destinations:
      hotels:
        statut: sous_condition
        condition: Constructions destinées à la pratique du tourisme, dont l'hébergement touristique ; intégration
          dans l'environnement sans le dénaturer ; « La surface de plancher totale admise est de 60 m² par bâtiment
          sans pouvoir excéder 120 m² par unité foncière. »
        seuil_m2: 60
        seuil_type: surface_plancher
        article: U 2.2 (secteur Ud2)
        page_pdf: 8
        citation: « En secteur Ud2, seules les constructions destinées à la pratique du tourisme, dont l'hébergement
          touristique, ainsi que l'extension limitée des constructions existantes sont autorisées. […] La surface
          de plancher totale admise est de 60 m² par bâtiment sans pouvoir excéder 120 m² par unité foncière. »
      autres_hebergements_touristiques:
        statut: sous_condition
        condition: Constructions destinées à la pratique du tourisme, dont l'hébergement touristique ; intégration
          dans l'environnement sans le dénaturer ; 60 m² de surface de plancher par bâtiment, 120 m² maximum par
          unité foncière.
        seuil_m2: 60
        seuil_type: surface_plancher
        article: U 2.2 (secteur Ud2)
        page_pdf: 8
        citation: « En secteur Ud2, seules les constructions destinées à la pratique du tourisme, dont l'hébergement
          touristique, ainsi que l'extension limitée des constructions existantes sont autorisées. […] La surface
          de plancher totale admise est de 60 m² par bâtiment sans pouvoir excéder 120 m² par unité foncière. »
