  AUt:
    silence: interdit
    silence_src: 'Art. AUt 1.2, p. 35 : « Sont interdits toutes les constructions, ouvrages et travaux à l''exception
      de ceux visés à l''article AUT 2. » — zone fermée, seul ce qui est visé à l''article AUt 2 est admis.'
    note: 'AUt 2.2 3. (p. 35) admet aussi « les constructions, ouvrages et travaux destinés à la pratique de sports,
      de loisirs, de la détente et du tourisme (restauration, bar, spa, thalasso, points d''arrêts, kiosques, mobilier
      urbain, terrains de jeux, etc.) ainsi que les équipements nécessaires à leur fonctionnement (accueil, sanitaires,
      etc.) dès lors qu''ils s''insèrent dans le milieu environnant » : « restauration » et les équipements sportifs
      sont mappés ; « spa, thalasso, kiosques, mobilier urbain… » ne se rattachent pas sans déduction à une sous-destination
      unique — cités en condition seulement. Anomalie relevée : AUt 15 (p. 41) renvoie « au règlement de la zone
      U indiquée en indice » alors qu''AUt n''a pas d''indice (copié-collé probable).'
    sous_destinations:
      hotels:
        statut: sous_condition
        condition: « Les constructions à destination d'hébergement hôtelier » (AUt 2.2 2.), sous la condition générale
          de « disposer des infrastructures suffisantes pour desservir le projet de construction » (AUt 2.2 1.).
        article: AUt 2.2 2.
        page_pdf: 35
        citation: « Les constructions à destination d'hébergement hôtelier. »
      autres_hebergements_touristiques:
        statut: sous_condition
        condition: « Les constructions à destination d'hébergement hôtelier » (AUt 2.2 2.) — mapping doctrine «
          hébergement hôtelier » → hotels + autres_hebergements_touristiques ; condition générale d'infrastructures
          suffisantes (AUt 2.2 1.).
        article: AUt 2.2 2.
        page_pdf: 35
        citation: « Les constructions à destination d'hébergement hôtelier. »
      restauration:
        statut: sous_condition
        condition: Admise au titre des constructions « destinées à la pratique de sports, de loisirs, de la détente
          et du tourisme (restauration, bar, spa, thalasso…) », « dès lors qu'ils s'insèrent dans le milieu environnant
          » ; condition générale d'infrastructures suffisantes (AUt 2.2 1.).
        article: AUt 2.2 3.
        page_pdf: 35
        citation: « Les constructions, ouvrages et travaux destinés à la pratique de sports, de loisirs, de la détente
          et du tourisme (restauration, bar, spa, thalasso, points d'arrêts, kiosques, mobilier urbain, terrains
          de jeux, etc.) […] dès lors qu'ils s'insèrent dans le milieu environnant. »
      equipements_sportifs:
        statut: sous_condition
        condition: Constructions « destinées à la pratique de sports, de loisirs […] (terrains de jeux, etc.) ainsi
          que les équipements nécessaires à leur fonctionnement (accueil, sanitaires, etc.) », « dès lors qu'ils
          s'insèrent dans le milieu environnant » ; condition générale d'infrastructures suffisantes (AUt 2.2 1.).
        article: AUt 2.2 3.
        page_pdf: 35
        citation: « Les constructions, ouvrages et travaux destinés à la pratique de sports, de loisirs, de la détente
          et du tourisme […] ainsi que les équipements nécessaires à leur fonctionnement (accueil, sanitaires, etc.)
          dès lors qu'ils s'insèrent dans le milieu environnant. »
      logement:
        statut: sous_condition
        condition: « exclusivement destinées et liées au gardiennage et à la surveillance des installations autorisées
          dans la zone dans la limite de surface de 50 m² d'emprise au sol ».
        seuil_m2: 50
        seuil_type: emprise_sol
        article: AUt 2.2 4.
        page_pdf: 35
        citation: « Les constructions à usage d'habitation à condition qu'elles soient exclusivement destinées et
          liées au gardiennage et à la surveillance des installations autorisées dans la zone dans la limite de
          surface de 50 m² d'emprise au sol. »
  AUes:
    silence: interdit
    silence_src: 'Art. AUes 1.2, p. 42 : « Sont interdits toutes les constructions, ouvrages et travaux à l''exception
      de ceux visés à l''article AUes 2. » — zone stricte, ouverture à l''urbanisation conditionnée à une modification
      du PLU (chapeau p. 42).'
    note: 'AUes 2 (p. 42) n''admet, « en attendant la réalisation d''études préalables […] et l''ouverture à l''urbanisation
      de la zone conditionnée à une modification du PLU », que : réseaux/voirie/stationnement/production-distribution
      d''énergie répondant aux besoins de l''urbanisation future (1.), ouvrages techniques de service public ou
      d''intérêt collectif (2., mappé locaux_techniques_administrations), reconstruction après sinistre (3.), et
      « travaux d''aménagement et d''extension mineure pour mise aux normes sanitaires et d''habitabilité dans la
      limite de 20 m2 de surface de plancher réalisés sur des constructions existantes » (4. — toutes destinations
      existantes, pas un statut de sous-destination). Aucune construction neuve à destination n''est admise.'
    sous_destinations:
      locaux_techniques_administrations:
        statut: sous_condition
        condition: « ouvrages techniques nécessaires au fonctionnement d'un service public ou d'intérêt collectif
          dont l'implantation dans la zone est rendue nécessaire pour des raisons techniques ou économiques », limitation
          de la gêne et bonne intégration dans le site.
        article: AUes 2, 2.
        page_pdf: 42
        citation: « Les ouvrages techniques nécessaires au fonctionnement d'un service public ou d'intérêt collectif
          dont l'implantation dans la zone est rendue nécessaire pour des raisons techniques ou économiques, sous
          réserve de prendre les dispositions utiles pour limiter la gêne qui pourrait en découler et assurer une
          bonne intégration dans le site. »
  A:
    silence: interdit
    silence_src: 'Art. A 1.2, p. 44 : « A l''exception de ceux visés à l''article A 2.2., sont interdits toutes
      les constructions et tous les ouvrages et travaux. »'
    note: 'A 2.2 admet aussi, hors statut de sous-destination : mesures ERC obligatoires pour tout projet (2., p.
      44) ; changement de destination des « constructions identifiées dans les documents graphiques comme bâtiments
      susceptibles de changer de destination » dès lors qu''il ne compromet ni l''activité agricole ni la qualité
      paysagère (10., p. 45) ; réseaux/voirie/stationnement/énergie et infrastructures de services publics (9.,
      p. 45) ; reconstruction à l''identique après sinistre (11., p. 45). Rappels : avis favorable CDPENAF requis
      (A 2.1 1., p. 44) ; ICPE agricoles et travaux d''amélioration foncière autorisés (A 1.1 5., p. 44). exploitation_forestiere
      : non mentionnée à l''article A 2.2 → régime du silence (interdit).'
    sous_destinations:
      exploitation_agricole:
        statut: sous_condition
        condition: 'Bâtiments techniques agricoles et annexes « justifiés au regard de la superficie de l''exploitation,
          de la nature de l''activité, du matériel utilisé et des bâtiments existants », implantation adaptée au
          site (A 2.2 1., p. 44) ; activités et constructions agricoles et d''élevage insérées dans le milieu, sans
          menace pour les espèces patrimoniales (3., p. 44) ; réhabilitation/extension pour mise aux normes (4.,
          p. 44) ; diversification : « constructions à usage agritouristique ou destinées à la vente » sur le terrain
          d''assiette d''une exploitation existante, nécessaires à l''activité agricole et valorisant les produits
          de l''exploitation, locaux limités à 100 m² de surface de plancher (7., p. 45).'
        article: A 2.2 1., 3., 4. et 7.
        page_pdf: 44
        citation: « Les bâtiments techniques agricoles et leurs annexes ainsi que les ouvrages et travaux nécessaires
          aux besoins d'une exploitation agricole. Ils doivent être justifiés au regard de la superficie de l'exploitation,
          de la nature de l'activité, du matériel utilisé et des bâtiments existants sur l'exploitation. »
      logement:
        statut: sous_condition
        condition: 'Deux voies : (a) extension/amélioration des habitations existantes régulièrement édifiées «
          sous réserve de ne pas augmenter la surface de plancher existante à la date d''approbation du plan local
          d''urbanisme de plus de 30%, dans la limite de 60m² et sans que les constructions existantes et leur extension
          n''excèdent une surface totale finale de 150 m² de surface de plancher » (A 2.2 5.) ; (b) construction
          neuve « dans la limite maximum de 150 m² de surface de plancher, sous réserve que leur implantation soit
          liée et nécessaire aux besoins d''une exploitation agricole, notamment justifiée par la nécessité d''une
          présence permanente et rapprochée sur le site d''exploitation » (A 2.2 6.).'
        seuil_m2: 150
        seuil_type: surface_plancher
        article: A 2.2 5. et 6.
        page_pdf: 45
        citation: « La construction à usage d'habitation dans la limite maximum de 150 m² de surface de plancher,
          sous réserve que leur implantation soit liée et nécessaire aux besoins d'une exploitation agricole »
      locaux_bureaux_administrations:
        statut: sous_condition
