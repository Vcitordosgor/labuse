    silence_src: 'Art. N 1.2, p. 50 : « A l''exception de ceux visés à l''article N2.2., sont interdits toutes les
      constructions, ouvrages et travaux. » — régime de zone N, complété pour le secteur par N 2.2 6. (p. 51).'
    note: 'Secteur touristique du Tévelave. « gardiennage, accueil, sanitaires » sont cités comme constructions
      nécessaires au fonctionnement des équipements admis (N 2.2 6.) — pas des sous-destinations autonomes. Aucun
      hébergement n''est écrit pour Nto (N 2.2 5. précise même « sans hébergement » pour les aménagements légers
      de zone) → hotels/autres_hebergements_touristiques relèvent du silence (interdit). Les règles de zone N non
      exclues du secteur s''appliquent aussi (DG Article 3, p. 4) : équipements collectifs N 2.2 8. (voir zone N),
      réseaux N 2.2 9., reconstruction N 2.2 10.'
