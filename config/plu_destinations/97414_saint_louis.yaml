  UZ:
    silence: autorise
    silence_src: 'art. UZ 2.2, p. 94 : « Sont admises toutes les occupations et utilisations du sol non citées à
      l''article U Z 1.2, ainsi, que celles ci-après dès lors qu''elles respectent les conditions suivantes » —
      liste fermée d''interdictions (UZ 1.2, p. 93) + clause expresse d''admission du reste.'
    note: 'Zone couvrant « le périmètre de la ZAC de l''Avenir » (p. 93). Le régime réel dépend d''un « schéma joint
      en annexe » (affectations « activités tertiaires » / « affectations dominantes en habitat », UZ 2.2 1. à 3.,
      p. 94) NON fourni dans la pièce écrite lue : les espaces « affectation en activités tertiaires » « sont seulement
      destinés à ce type d''occupation » (logements admis uniquement pour surveillance/gardiennage). « Équipements
      » et « services » (UZ 2.2 1.) : termes trop larges pour être mappés sur des sous-destinations précises → non
      mappés. « Constructions à destination d''activités » admises sans incommodité ni aggravation des risques pour
      le voisinage (UZ 2.2 4., p. 94) ; reconstruction à l''identique après sinistre sauf risque élevé d''inondation
      (UZ 2.2 5., p. 94).'
    sous_destinations:
      industrie:
        statut: interdit
        article: UZ 1.2 (1.)
        page_pdf: 93
        citation: '« Sont interdits : 1. Les constructions, ouvrages et travaux à destination industrielle et à
          destination exclusive d''entrepôt. »'
      entrepot:
        statut: interdit
        article: UZ 1.2 (1.)
        page_pdf: 93
        citation: « Les constructions, ouvrages et travaux à destination industrielle et à destination exclusive
          d'entrepôt. » — l'interdiction porte sur la destination EXCLUSIVE d'entrepôt.
      exploitation_agricole:
        statut: interdit
        article: UZ 1.2 (2.)
        page_pdf: 93
        citation: '« 2. Les constructions, ouvrages et travaux à destination agricole. » — « agricole » seul : exploitation_forestiere
          non couverte, demeure non mentionnée.'
      logement:
        statut: sous_condition
        condition: admis « dans le respect des affectations et implantations indiquées au schéma joint en annexe
          » ; dans les espaces « affectation en activités tertiaires », logements autorisés uniquement s'ils sont
          « nécessaires à la surveillance et au gardiennage des installations » ; dans les espaces « affectations
          dominantes en habitat », maximum 1 logement individuel par parcelle si la parcelle ne dépasse pas 400
          m² (400 m² = superficie de parcelle, pas un seuil de surface de destination → pas de seuil_m2)
        article: UZ 2.2 (1., 2., 3.)
        page_pdf: 94
        citation: « 1. Les constructions à destination de logements, d'équipements, d'activités tertiaires (commerces,
          services, bureaux,…), dans le respect des affectations et implantations indiquées au schéma joint en annexe.
          » / « 2. Les espaces indiqués au schéma […] "affectation en activités tertiaires" sont seulement destinés
          à ce type d'occupation. Toutefois les logements d'habitation y sont autorisés à la condition d'être nécessaires
          à la surveillance et au gardiennage des installations. » / « 3. Les logements individuels situés dans
          les espaces […] "affectations dominantes en habitat" ne peuvent excéder 1 logement par parcelle si la
          superficie de la parcelle ne dépasse pas 400 m² ; des activités professionnelles y sont possibles si la
          surface affectée à l'activité ne dépasse pas 30% de la surface de la construction. »
      artisanat_commerce_detail:
        statut: sous_condition
        condition: admis « dans le respect des affectations et implantations indiquées au schéma joint en annexe
          » ; les espaces « affectation en activités tertiaires » du schéma sont « seulement destinés à ce type
          d'occupation »
        article: UZ 2.2 (1., 2.)
        page_pdf: 94
        citation: « 1. Les constructions à destination de logements, d'équipements, d'activités tertiaires (commerces,
