  structure: 'Ancien format (articles 1.2 interdites / 2.2 conditions) : zones U avec clause expresse « sont admises
    toutes les occupations non citées à l''article 1.2 » (silence = autorisé) ; AU indicée = renvoi ÉCRIT au règlement
    de la zone U d''indice (art. 1.2/2.2, p. 108) ; AUst régime fermé ; A et N fermées (silence = interdit). Codes
    servis « 1AUb1/1AUb2/2AUb1/2AUb2 » sans secteur UB1/UB2 au règlement (renvoi UB, signalé) ; « 1AUste/2AUste
    » introuvables au règlement (non_lu).'
zones:
  UA:
    silence: autorise
    silence_src: 'art. UA 2.2, p. 13 : « Sont admises toutes les occupations et utilisations du sol non citées à
      l''article U A 1.2, ainsi, que celles ci-après dès lors qu''elles respectent les conditions suivantes » —
      liste fermée d''interdictions (UA 1.2, p. 12) + clause expresse d''admission du reste.'
    note: 'Ancien format R123 (art. 1 interdites / art. 2 conditions particulières). Conditions générales non rattachables
      à une sous-destination précise : « constructions à destination d''activités » admises à condition de n''entraîner
      « pour le voisinage aucune incommodité et aucune aggravation des risques » (UA 2.2 1., p. 13) ; constructions
      nécessaires aux services publics ou d''intérêt collectif admises « dès lors qu''ils s''insèrent dans le milieu
      environnant » (UA 2.2 2., p. 13) ; reconstruction à l''identique après sinistre sauf risque naturel élevé
      d''inondation (UA 2.2 3., p. 13). Rappels risques naturels (UA 1.1, p. 12) : construction nouvelle interdite
      en risque élevé, prescriptions en risque moyen — prescriptions graphiques, pas des règles de destination.'
    sous_destinations:
      industrie:
        statut: interdit
        article: UA 1.2 (1.)
        page_pdf: 12
        citation: '« Sont interdits : 1. Les constructions, ouvrages et travaux à destination industrielle et à
          destination exclusive d''entrepôt. »'
      entrepot:
        statut: interdit
        article: UA 1.2 (1.)
        page_pdf: 12
        citation: « Les constructions, ouvrages et travaux à destination industrielle et à destination exclusive
          d'entrepôt. » — l'interdiction porte sur la destination EXCLUSIVE d'entrepôt.
      exploitation_agricole:
        statut: interdit
        article: UA 1.2 (2.)
        page_pdf: 12
        citation: '« 2. Les constructions, ouvrages et travaux à destination agricole. » — « agricole » seul : exploitation_forestiere
          non couverte, demeure non mentionnée.'
      logement:
        statut: sous_condition
        condition: 'programme de logements de plus de 2000 m² de surface de plancher : au minimum 30 % du programme
          affecté à des logements aidés ; en deçà, aucune condition écrite (admis par UA 2.2 al. 1)'
        seuil_m2: 2000
        seuil_type: surface_plancher
        article: UA 2.2 (4.)
        page_pdf: 13
        citation: « En cas de réalisation d'un programme de logements représentant une surface de plancher supérieure
          à 2000 m², au minimum 30% de ce programme doit être affecté à des logements aidés (logements locatifs
          sociaux, logements intermédiaires…). »
  UA1:
    renvoi: UA
    renvoi_src: 'caractère de la zone UA, p. 12 : « Il existe le secteur UA1 correspondant au centre historique
      de Saint-Louis dont la morphologie et les fonctions urbaines doivent être préservées. » — secteur de la zone
      UA, les articles UA 1 et UA 2 ne prévoient aucune règle de destination propre à UA1.'
    note: 'Seules règles propres au secteur UA1 lues : emprise au sol non réglementée (UA 9.2, p. 19) et pas de
      règle d''espaces perméables (UA 13.1, p. 24) — sans effet sur les destinations.'
