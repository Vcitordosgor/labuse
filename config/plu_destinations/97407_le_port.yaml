  Nerl:
    silence: interdit
    silence_src: 'Sous-secteur de la zone N (caractère, p. 170) ; art. N 1, p. 170 : « A l''exception de ceux visés
      à l''article N 2, sont interdits toutes les constructions, ouvrages et travaux. » ; p. 172 : « Dans le secteur
      Nerl, sont admis les aménagements légers suivants, à condition que… »'
    sous_destinations:
      exploitation_forestiere:
        statut: sous_condition
        condition: à l'exclusion de toute forme d'hébergement, en harmonie avec le site et les constructions existantes
          ; surface de plancher ET emprise au sol n'excédant pas 50 m² ; localisation/aspect ne dénaturant pas les
          sites ni les milieux
        seuil_m2: 50
        seuil_type: surface_plancher
        article: N 2 (secteur Nerl)
        page_pdf: 172
        citation: « A l'exclusion de toute forme d'hébergement et à condition qu'ils soient en harmonie avec le
          site et les constructions existantes, les aménagements nécessaires à l'exercice des activités forestières
          dont à la fois la surface de plancher et l'emprise au sol n'excèdent pas cinquante mètres carrés. »
    note: 'Le seuil de 50 m² porte cumulativement sur la surface de plancher ET l''emprise au sol (une seule valeur
      seuil_type possible : surface_plancher retenue, l''emprise est dans la condition). Aménagements légers admis
      en Nerl p. 172 (usages, non mappés) : cheminements piétonniers/cyclables et sentes équestres ni cimentés ni
      bitumés, mobilier d''accueil/information, postes d''observation de la faune, sanitaires et postes de secours
      démontables si fréquentation l''exige ; aires de stationnement indispensables, ni cimentées ni bitumées, sans
      accroissement des capacités. Le régime général N 1/N 2 s''applique au sous-secteur (le texte ne dit pas «
      seuls sont admis » pour la liste Nerl).'
