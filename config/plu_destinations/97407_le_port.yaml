  A:
    silence: interdit
    silence_src: 'Art. A 1, p. 162 : « A l''exception de ceux visés à l''article A 2., sont interdits toutes les
      utilisations et occupations du sol ainsi que le changement de destination des bâtiments à usage agricole en
      bâtiment à usage autre qu''agricole, sauf s''ils présentent un caractère architectural ou patrimonial particulier
      et s''ils sont identifiés au document graphique du règlement (application du 2° de l''article R151-35 du Code
      de l''urbanisme)… »'
    sous_destinations:
      exploitation_agricole:
        statut: sous_condition
        condition: bâtiments techniques agricoles, annexes, ouvrages et travaux nécessaires aux besoins d'une exploitation
          agricole, justifiés (superficie de l'exploitation, nature de l'activité, matériel, bâtiments existants),
          implantation adaptée au site ; ICPE (autorisation/déclaration) nécessaires à la production agricole et
          travaux d'amélioration foncière admis
        article: A 2
        page_pdf: 163
        citation: « Les bâtiments techniques agricoles et leurs annexes ainsi que les ouvrages et travaux nécessaires
          aux besoins d'une exploitation agricole. Ils doivent être justifiés au regard de la superficie de l'exploitation,
          de la nature de l'activité, du matériel utilisé et des bâtiments existants sur l'exploitation. »
      logement:
        statut: sous_condition
        condition: 'bâtiments d''habitation existants et légaux uniquement : amélioration, extension mesurée et
          reconstruction après démolition, sur l''emplacement du bâtiment préexistant (sauf contrainte PPR) ; extension
          et reconstruction dans la limite totale de 120 m² de surface de plancher ; annexes (garage, piscine, cuisine
          extérieure, abri de jardin…) sous réserve de ne pas compromettre l''activité agricole ou la qualité paysagère'
        seuil_m2: 120
        seuil_type: surface_plancher
        article: A 2
        page_pdf: 163
        citation: « Sous réserve de la légalité du bâtiment existant en tant qu'habitation, l'amélioration, l'extension
          mesurée et la reconstruction après démolition des bâtiments à usage d'habitation. … Les travaux d'extension
          et de reconstruction peuvent se faire dans la limite totale de 120 m² de surface de plancher »
      restauration:
        statut: sous_condition
        condition: 'au titre de l''agrotourisme : complément de revenu d''une exploitation agricole existante et
          valorisation de ses produits ; les activités de restauration doivent être réalisées dans les bâtiments
          à usage d''habitation existants (sous réserve de leur légalité)'
        article: A 2
        page_pdf: 163
        citation: « Les activités de restauration et d'hébergement sur le site de l'exploitation doivent être réalisées
          dans les bâtiments à usage d'habitation existants (sous réserve de leur légalité) »
      locaux_bureaux_administrations:
        statut: sous_condition
        condition: constructions et installations nécessaires à des équipements collectifs ou services publics,
          implantation rendue nécessaire pour raisons techniques ou économiques, compatibles avec l'activité agricole/pastorale/forestière,
          sans atteinte aux espaces naturels et paysages, emprise limitée au strict minimum (mapping via la destination
          « Équipements d'intérêt collectif et services publics »)
        article: A 2
        page_pdf: 163
        citation: « Les constructions et installations nécessaires à des équipements collectifs ou à des services
          publics, dont l'implantation dans la zone est rendue nécessaire pour des raisons techniques ou économiques…
          Leur emprise est limitée au strict minimum nécessaire »
      locaux_techniques_administrations:
        statut: sous_condition
        condition: idem équipements collectifs/services publics (voir citation) ; en outre, constructions/ouvrages/travaux
          liés aux réseaux et à la voirie admis dès lors qu'ils s'insèrent dans le milieu environnant
        article: A 2
        page_pdf: 163
        citation: « Les constructions et installations nécessaires à des équipements collectifs ou à des services
          publics… » ; « Les constructions, ouvrages et travaux liés aux différents réseaux et à la voirie dès lors
          qu'ils s'insèrent dans le milieu environnant »
      enseignement_sante_action_sociale:
        statut: sous_condition
        condition: idem équipements collectifs/services publics (voir citation)
        article: A 2
        page_pdf: 163
        citation: « Les constructions et installations nécessaires à des équipements collectifs ou à des services
          publics, dont l'implantation dans la zone est rendue nécessaire pour des raisons techniques ou économiques…
          »
      salles_art_spectacles:
        statut: sous_condition
        condition: idem équipements collectifs/services publics (voir citation)
        article: A 2
        page_pdf: 163
        citation: « Les constructions et installations nécessaires à des équipements collectifs ou à des services
          publics… »
      equipements_sportifs:
        statut: sous_condition
        condition: idem équipements collectifs/services publics (voir citation)
        article: A 2
        page_pdf: 163
        citation: « Les constructions et installations nécessaires à des équipements collectifs ou à des services
