    renvoi_src: 'Caractère de la zone Uc, p. 50 : « Il existe un secteur spécifique : Le secteur Uca correspond
      aux poches d''habitations individuelles, commerces et services de proximité comprises entre le triangle agricole
      et les franges urbaines de la Possession. » Le secteur relève du chapitre Uc ; la Section 1 (articles Uc 1
      à Uc 3, pp. 50-52) ne distingue pas Uca : mêmes destinations que Uc.'
    notes: 'Uca n''est distingué qu''en Section 2/3 : emprise au sol 60 % au lieu de 80 % (art. Uc 7, p. 55), hauteur
      maximale 6 m au lieu de 16 m (art. Uc 8, p. 55), assainissement semi-collectif admis dans l''attente du raccordement
      au réseau collectif (art. Uc 14.3, p. 63) — rien sur les destinations.'
