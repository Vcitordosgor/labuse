  structure: 'Format moderne à cases : par zone, article 1 « Sont interdits les éléments cochés » (checklist des
    23 sous-destinations R151-28, nomenclature 2023 incluse), article 2 « Sont admises toutes les occupations non
    cochées » (silence = autorisé, avec réserve générale de non-nuisance). Zone Uoap : renvoi intégral à l''OAP
    Portes de l''Océan (pièce n°4 non réglementaire ici) → non_lu. PORTÉE JURIDIQUE : PLU partiellement annulé (TA
    1900330 + CAA 22BX01470), annulation LIMITÉE au secteur portuaire Uppp/Up2 — notes portées sur Up/Uppp ; le
    reste du PLU est intact (cf. config/plu_millesimes.yaml, statut annule_partiel).'
