        article: A 2
        page_pdf: 163
        citation: « Les constructions et installations nécessaires à des équipements collectifs ou à des services
          publics… »
    note: 'Agrotourisme (p. 163) : « Les constructions et installations à usage agrotouristique, à l''exception
      des constructions destinées à l''hébergement… sont admises dans la limite totale de 30 m² de surface de plancher
      (par type de construction) » — terme non mappable en une sous-destination unique (douteux → non écrit hors
      restauration, expressément nommée) ; « l''hébergement sur le site de l''exploitation » (gîte/chambre) ambigu
      entre hebergement et autres_hebergements_touristiques → non mappé. Dans les périmètres de protection rapprochés
      des forages : interdictions supplémentaires (ICPE, élevages, stockages toxiques, routes revêtues, captages),
      p. 162. Avis CDPENAF rappelé p. 163 (information).'
