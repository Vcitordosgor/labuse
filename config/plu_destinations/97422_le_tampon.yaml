  structure: 'Ancienne nomenclature : par zone, article 1.2 = occupations interdites (liste fermée), article 2.2
    = admises sous conditions, avec clause explicite « sont admises toutes les occupations non citées à l''article
    1.2 » (silence = autorisé) en Ua/Ub/Uc/Ud/Ue ; secteur Ucto fermé (« seules sont admises », silence = interdit)
    ; A et N fermées (« sont interdits toutes les constructions… sauf article 2.2 », silence = interdit). Chapitre
    AU = renvois écrits vers la zone U d''indice correspondant (AUto → Ucto). Règle secteur = règle de zone sauf
    disposition particulière (DG art. 3, p. 6).'
zones:
  Ua:
    silence: autorise
    silence_src: 'Art. Ua2, 2.2, p. 12 : « Sont admises toutes les occupations et utilisations du sol non citées
      à l''article Ua1.2 » — structure en liste fermée d''interdictions (Ua1.2), tout le reste est admis.'
    note: 'Périmètres particuliers non reportés en statut (overlays, pas des règles de zone) : Ua1.2 7°, p. 12 —
      dans les périmètres des Monuments Historiques délimités aux documents graphiques, « sont interdites les constructions
      à destination d''activités […] dès lors qu''ils sont susceptibles d''entrainer pour le voisinage des risques
      de nuisances sonores ou de dénaturer l''image des Monuments Historiques protégés » ; rappels PPRN/PPRT/captages
      (Ua1.1, p. 11). Interdictions hors champ des 23 sous-destinations, non mappées : « terrains de camping, de
      caravanning, d''aires naturelles de camping » (aménagement de terrains, pas une construction) et « création
      ou extension de carrières » (Ua1.2 4° et 5°, p. 12). Le terme « constructions à destination d''activités »
      (Ua2.2 1°) est mappé aux sous-destinations des deux destinations économiques R151-27 (« commerce et activités
      de service », « autres activités des secteurs secondaire ou tertiaire »), exceptées celles visées à l''article
      Ua1.2, comme le texte le prévoit.'
    sous_destinations:
      industrie:
        statut: interdit
        article: Ua1.2 1°
        page_pdf: 12
        citation: « Les constructions, ouvrages et travaux à destination industrielle et à destination exclusive
          d'entrepôt. »
      entrepot:
        statut: interdit
        article: Ua1.2 1°
        page_pdf: 12
        citation: « Les constructions, ouvrages et travaux à destination industrielle et à destination exclusive
          d'entrepôt. »
        note: Le texte interdit la destination « exclusive » d'entrepôt ; un local de stockage accessoire d'une
          activité admise n'est pas visé par cette interdiction (cf. aussi Ua1.2 3° pour le commerce).
      exploitation_agricole:
        statut: interdit
        article: Ua1.2 2°
        page_pdf: 12
        citation: « Les constructions, ouvrages et travaux à destination agricole. »
      artisanat_commerce_detail:
        statut: sous_condition
        condition: Interdit lorsque « la surface de stockage excède la surface de vente sise sur le terrain d'assiette
          » (Ua1.2 3°) ; admis sinon, en tant que « construction à destination d'activités », « sous réserve qu'elles
          correspondent à des besoins nécessaires à la vie et à la commodité des habitants de la zone », compatibilité
          avec les milieux environnants, ni incommodité ni aggravation des risques (Ua2.2 1°) et qu'elles prévoient
          tous moyens ou dispositifs nécessaires visant à atténuer les éventuels risques ou nuisances.
        article: Ua1.2 3° et Ua2.2 1°
        page_pdf: 12
        citation: « Les constructions, ouvrages et travaux à usage de commerce dont la surface de stockage excède
          la surface de vente sise sur le terrain d'assiette » (interdits).
      commerce_gros:
        statut: sous_condition
        condition: Interdit lorsque « la surface de stockage excède la surface de vente sise sur le terrain d'assiette
