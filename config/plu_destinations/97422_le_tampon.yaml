          au regard de la superficie de l'exploitation, de la nature de l'activité, du matériel et des bâtiments
          existants ; ICPE admises si nécessaires à l'activité de production agricole (A2, 2.2-2, p. 92) ; le choix
          de l'implantation sur l'exploitation de ces bâtiments techniques doit être adapté au site, notamment au
          regard de leur insertion paysagère (A2 2.2-1, 3e phrase)
