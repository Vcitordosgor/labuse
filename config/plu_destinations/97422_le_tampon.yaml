    silence_src: 'Art. A1, 1.2, p. 92 : « A l''exception de ceux visés à l''article A 2.2., sont interdits toutes
      les constructions, ouvrages et travaux, ainsi que le changement de destination des bâtiments à usage agricole
      en bâtiments à usage autre qu''agricole. »'
