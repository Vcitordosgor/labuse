    silence_src: 'Art. Ub2, 2.2, p. 27 : « Sont admises toutes les occupations et utilisations du sol non citées
      à l''article Uc1.2 » (sic — le renvoi vise « Uc1.2 », erreur matérielle probable pour Ub1.2, seul article
      d''interdictions du chapitre ; la structure — liste fermée d''interdictions Ub1.2 puis admission générale
      — vaut silence = autorise).'
    note: 'Ub1.2 (p. 27) est mot pour mot identique à Ua1.2. Périmètres particuliers non reportés en statut : Ub1.2
      7°, p. 27 (Monuments Historiques — activités susceptibles de nuisances interdites dans les périmètres délimités)
      ; rappels PPRN/PPRT/captages (Ub1.1, p. 26). Interdictions hors champ des 23 sous-destinations, non mappées
      : camping/caravanning et carrières (Ub1.2 4° et 5°, p. 27). « Constructions à destination d''activités » (Ub2.2
      1°) mappé comme en Ua (destinations économiques R151-27, exceptées celles visées à l''article 1-2).'
