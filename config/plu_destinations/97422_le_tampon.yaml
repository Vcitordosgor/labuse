  Uav:
    renvoi: Ua
    renvoi_src: 'Chapitre Ua, p. 11 : « Il existe un secteur Uav, couvrant la zone d''habitation de densité moyenne
      qui se situe au cœur centre-ville. » — secteur DE la zone Ua ; les articles Ua1 et Ua2 (destinations) ne comportent
      aucune disposition propre au secteur Uav, qui n''apparaît qu''aux articles Ua10 (hauteurs, p. 18 : « Dans
      le secteur Uav, ce seuil est limité à 16 mètres… ») et Ua13 (espaces libres, p. 25 : « En secteur Uav, ces
      seuils sont respectivement portés à 30% et 20%. »).'
  Ub:
