          non à une exploitation agricole), sous réserve de la légalité du bâti, sur l'emplacement du bâtiment préexistant
          sauf contrainte particulière (PPR par exemple), dans la limite totale cumulée de 250 m² de surface de
          plancher — aucun logement neuf
