          ainsi que l''agrandissement ou la réhabilitation des habitations existantes et leurs annexes (A.2 1°,
          p. 144) ; extensions liées à une habitation existante limitées à 80 m² de surface de plancher dans la
          limite de 250 m² au total, habitation existante comprise (A.2 5°, p. 145) ; annexes liées à une habitation
          existante limitées à 30 m² de surface de plancher (A.2 6°, p. 145) ; interdit dans le périmètre de 130
          m autour des bâtiments d''élevage identifiés au zonage pour les extensions et annexes (A.1 « De plus »,
          p. 144)'
        article: A.1 1° ; A.2 1°, 5°, 6°
        page_pdf: 143
        citation: « Les constructions nouvelles à usage d'habitation excepté celles indiquées à l'article A.2. »
          (p. 143) ; « les constructions à usage d'habitation, l'agrandissement ou la réhabilitation des habitations
          existantes ainsi que les annexes qui leur sont complémentaires » (A.2 1°, p. 144)
      exploitation_agricole:
        statut: sous_condition
        condition: bâtiments d'exploitation, installations ou ouvrages techniques nécessaires à la production agricole,
          à condition d'être directement nécessaires à l'exploitation agricole, de respecter le caractère de la
          zone et d'être regroupés autour du siège d'exploitation ; y compris constructions d'accueil journalier
          des salariés jusqu'à 200 m² de surface de plancher et installations classées (A.2 1°, p. 144) ; vente
          directe à la ferme → voir artisanat_commerce_detail (A.2 2°, p. 144)
