        page_pdf: 144
        citation: '« À condition qu''ils soient directement nécessaires à l''exploitation agricole en respectant
          le caractère de la zone, et qu''ils soient regroupés autour du siège d''exploitation (…) : les bâtiments
          d''exploitation, installations ou ouvrages techniques nécessaires à la production agricole »'
