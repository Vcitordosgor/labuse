      autres_hebergements_touristiques:
        statut: interdit
        article: A.1 2°
        page_pdf: 143
        citation: « Les constructions à usage d'hébergement hôtelier. » (mappé hotels + autres_hebergements_touristiques,
          doctrine ancien format)
