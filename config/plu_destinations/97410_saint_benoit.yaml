      logement:
        statut: sous_condition
        condition: uniquement les constructions affectées au logement du personnel travaillant sur le site
        article: U-2 6°
        page_pdf: 7
        citation: « […] et des constructions affectées au logement du personnel travaillant sur le site. »
    notes:
    - « équipements […] touristiques » (exception de l'Art. U-2 6°) n'est rattachable en plein à aucune sous-destination
      R151-28 (douteux → non écrit) ; l'exception reste lisible dans silence_src.
    - Le « caractère » de la zone (« une zone Ut aux Orangers, affectée au tourisme », p. 3, colonne explicative)
      est indicatif, non opposable.
