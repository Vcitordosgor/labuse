  edition: PLU 2020 opposable servi par le GPU. Modifications postérieures éventuelles (n°2/n°3 évoquées au catalogue)
    NON intégrées au GPU — incertitude consignée, non fabriquée (cf. note M40 de config/plu_millesimes.yaml).
  structure: 'Règlement à chapitres groupés (ZONES U / ZONES AU / ZONES A / ZONES N) avec règles par famille et
    par secteur à l''intérieur ; colonne « Règles » seule opposable (la colonne explicative est déclarée non opposable
    p. 3). AU numérotées réglées par famille (fiches annexes n°01-19 = phasage, sans destinations) ; STECAL Ns/Nta/Ntb
    réglés par famille au chapitre N + fiches n°53/55/57/59 propres (seuils surface_plancher et emprise_sol) ; CADUCITÉ
    ELAN opposable (permis avant le 31/12/2021, N-3) reprise dans les conditions — STECAL largement éteints. A/N
    : listes positives (silence = interdit) ; U/AU : silence = autorisé sauf Ut.'
zones:
  Ua:
    silence: autorise
    silence_src: 'Structure du chapitre ZONES U : Art. U-2 « Sont interdites : » (liste limitative d''interdictions,
      pp. 5-7) puis Art. U-3 « Sont autorisées, dans les conditions définies ci-après : » (p. 7). Aucune clause
      « seules sont admises » ne vise la zone Ua : ce qui n''est ni interdit ni conditionné est autorisé.'
    sous_destinations:
      exploitation_agricole:
        statut: interdit
        article: U-2 1°
        page_pdf: 5
        citation: '« 1° En zones Ua et Ub : […] - Les constructions destinées aux exploitations agricoles ou forestières.
          »'
      exploitation_forestiere:
        statut: interdit
        article: U-2 1°
        page_pdf: 5
        citation: '« 1° En zones Ua et Ub : […] - Les constructions destinées aux exploitations agricoles ou forestières.
          »'
      industrie:
        statut: interdit
        article: U-2 1°
        page_pdf: 5
        citation: « - Les constructions à usage industriel, sous réserve, pour la zone Ub, de l'article U 3. » (la
          réserve ne vaut que pour Ub ; en Ua l'interdiction est sèche)
      entrepot:
        statut: sous_condition
        condition: uniquement s'ils sont l'annexe d'un commerce ou d'une activité artisanale
        article: U-3 2°
        page_pdf: 7
        citation: '« 2° En zone Ua : - Les entrepôts, ne sont autorisés que s''ils sont l''annexe d''un commerce
          ou d''une activité artisanale. »'
    notes:
    - 'Interdiction générale non rattachable à une sous-destination : « Les occupations et utilisations du sol présentant
      des caractéristiques incompatibles avec la proximité de l''habitat. » (Art. U-2 1°, p. 5) — s''applique en
      Ua et Ub quelle que soit la destination.'
    - 'ICPE (toutes destinations) : « Les installations classées pour la protection de l''environnement (ICPE) sont
      autorisées sous réserve qu''elles correspondent à des services de proximité nécessaires aux habitants » (Art.
      U-3 1°, p. 7 — zones Ua et Ub).'
    - 'Servitude de projet (secteur au trait bleu, non liée à une destination) : « toute construction d''une superficie
      supérieure à 20m² est interdite pendant un maximum de cinq ans […] à l''exception des travaux ayant pour objet
      l''adaptation, le changement de destination, la réfection ou l''extension limitée des constructions existantes
      » (Art. U-2 2°, p. 5).'
  Uap:
    silence: autorise
    silence_src: 'Le secteur Uap relève du chapitre ZONES U : « Chaque bâti protégé fait l''objet d''une fiche d''immeuble
      : […] comprenant les règles à respecter en complément du règlement de la zone U. » (Art. U-1, p. 3). Dans
      ce chapitre, Art. U-2 « Sont interdites : » est une liste limitative (pp. 5-7) dont aucun alinéa ne vise le
      secteur Uap : ce qui n''est ni interdit ni conditionné est autorisé.'
    sous_destinations: {}
    notes:
    - 'ANOMALIE — Uap n''est pas dans le champ d''application de l''Art. U-1 (« Le présent règlement est applicable
      dans les zones urbaines Ua, Ub, Ue, Up et Ut », p. 3) : c''est un secteur (« Il existe un secteur Uap, situé
      le long de la RN de Saint-François à Petit-Saint-Pierre, correspondant au secteur patrimonial de Ste-Anne
      », p. 3, colonne explicative). Les articles U-2/U-3 règlent les destinations zone par zone (Ua, Ub, Ue, Up,
      Ut) sans jamais citer Uap, et le rattachement de Uap à Ua ou Ub n''est écrit nulle part → aucune interdiction/condition
      de destination ne lui est textuellement rattachée (douteux → non écrit).'
    - 'Le règlement ne mentionne Uap que pour la forme : hauteur (point bas, Art. U-4 II 1°, p. 10), toitures «
      pente supérieure ou égale à 35° » (Art. U-8 2°, p. 12), protection du patrimoine bâti (Art. U-8 4°, p. 13).
      Les fiches annexes n°60 à 82 (pp. 97 sq.) sont des fiches d''immeubles patrimoniales : aucune règle de destination.'
  Ub:
    silence: autorise
    silence_src: 'Structure du chapitre ZONES U : Art. U-2 « Sont interdites : » (liste limitative, pp. 5-7) puis
      Art. U-3 « Sont autorisées, dans les conditions définies ci-après : » (p. 7). Aucune clause « seules sont
      admises » ne vise la zone Ub.'
    sous_destinations:
      exploitation_agricole:
        statut: interdit
        article: U-2 1°
        page_pdf: 5
        citation: '« 1° En zones Ua et Ub : […] - Les constructions destinées aux exploitations agricoles ou forestières.
          »'
      exploitation_forestiere:
        statut: interdit
        article: U-2 1°
        page_pdf: 5
        citation: '« 1° En zones Ua et Ub : […] - Les constructions destinées aux exploitations agricoles ou forestières.
          »'
      industrie:
        statut: sous_condition
        condition: emprise au sol n'excédant pas 250 m² et caractéristiques non incompatibles avec la proximité
          de l'habitat
        seuil_m2: 250
        seuil_type: emprise_sol
        article: U-3 3°
        page_pdf: 8
        citation: '« 3° En zone Ub : - Les constructions à usage industriel, dès lors que leur emprise au sol n''excède
          pas 250 m² et que leurs caractéristiques ne sont pas incompatibles avec la proximité de l''habitat. »
          (interdites par défaut : Art. U-2 1°, p. 5, « sous réserve, pour la zone Ub, de l''article U 3 »)'
    notes:
    - 'Interdiction générale non rattachable à une sous-destination : « Les occupations et utilisations du sol présentant
      des caractéristiques incompatibles avec la proximité de l''habitat. » (Art. U-2 1°, p. 5).'
    - 'ICPE : autorisées « sous réserve qu''elles correspondent à des services de proximité nécessaires aux habitants
      » (Art. U-3 1°, p. 7 — zones Ua et Ub).'
    - 'ANOMALIE — la colonne explicative (non opposable) annonce : « Les constructions destinées aux exploitations
      agricoles ou forestières sont en revanche autorisées dans des secteurs spécifiques de la zone Ub. » (p. 5)
      ; aucune règle opposable correspondante n''existe dans la colonne Règles du chapitre. L''interdiction opposable
      reste sèche.'
    - 'Règle spatiale (pas une destination) : « En zones Up et Ub, dans les espaces hachurés en vert sur le document
      graphique, qui correspondent à un corridor écologique protégé (de part et d''autre de la ravine la Sourdine),
      toute construction est interdite. » (Art. U-2 7°, p. 7).'
  Ue:
    silence: autorise
    silence_src: 'Structure du chapitre ZONES U : Art. U-2 « Sont interdites : » (liste limitative, pp. 5-7) puis
      Art. U-3 « Sont autorisées, dans les conditions définies ci-après : » (p. 7). Aucune clause « seules sont
      admises » ne vise la zone Ue en général — SAUF le secteur de la loupe L2 (Petit Saint-Pierre), voir notes
      : le silence y vaut interdit.'
    sous_destinations:
      logement:
        statut: sous_condition
        condition: interdits, sauf 1) logements de gardiennage incorporés au bâtiment d'activité, 2) logements étudiants
          de l'internat du CFPPA (zone d'activités de Beaulieu)
        article: U-2 5°
        page_pdf: 6
        citation: '« 5° En zone Ue et Up : - Les constructions à usage d''habitation à l''exception : 1) des logements
          de gardiennage incorporés au bâtiment d''activité, 2) des logements étudiants de l''internat du CFPPA
          situé en zone Ue sur le secteur de la zone d''activités de Beaulieu. »'
      hebergement:
        statut: sous_condition
        condition: interdits, sauf 1) logements de gardiennage incorporés au bâtiment d'activité, 2) logements étudiants
          de l'internat du CFPPA (zone d'activités de Beaulieu)
        article: U-2 5°
        page_pdf: 6
        citation: '« - Les constructions à usage d''habitation à l''exception : 1) des logements de gardiennage
          incorporés au bâtiment d''activité, 2) des logements étudiants de l''internat du CFPPA situé en zone Ue
          sur le secteur de la zone d''activités de Beaulieu. » (le terme « habitation » = destination R151-27 couvrant
          logement + hébergement ; citation commune)'
    sous_destinations_note: « constructions à usage d'habitation » est mappé aux deux sous-destinations de la destination
      Habitation (logement, hebergement) ; les exceptions sont citées mot à mot.
    notes:
    - 'Loupe L1 — Ue de la distillerie « Rivière du Mât » (Beaufonds) : Art. U-2 3° (p. 6) : « les constructions
      nouvelles sont interdites sur l''espace non aedificandi apparaissant dans l''annexe L1 du présent règlement
      » ; annexe L1 (fiche N°L01, p. 51) : « Secteur de 5 mètres, à compter de la limite de propriété, où toute
      construction est interdite. Seuls les aménagements de voirie sont autorisés. » — règle spatiale (espace non
      aedificandi + écran végétalisé), AUCUNE règle de destination : l''entrée Ue n''est pas modifiée par L1.'
    - 'Loupe L2 — Ue de Petit Saint-Pierre (Sainte-Anne) : Art. U-2 4° (p. 6) : « les règles qui s''appliquent sont
      celles contenues dans l''annexe L2 du présent règlement » ; annexe L2 (fiche N°L02, p. 52) : « Dans la zone
      Ue de Petit Saint-Pierre, sont autorisées : - les stations-services et leurs activités connexes (station de
      lavage, vente de gaz, vérification de la pression des pneus, boutique de proximité…), - les logements de gardiennage
      incorporés au bâtiment d''activité. » → dans CE secteur, liste fermée d''autorisations : le silence y vaut
      interdit. « stations-services et leurs activités connexes » n''est pas rattachable en plein à une sous-destination
      R151-28 (douteux → non écrit) ; secteur non servi comme code de zone distinct, régime consigné ici.'
    - 'ICPE : Ue n''est pas visée par la condition « services de proximité » de l''Art. U-3 1° (limitée aux zones
      Ua et Ub) ; la colonne explicative (non opposable, p. 5) confirme que les industries sont attendues en Ue,
      mais aucune règle opposable de destination « industrie » n''est écrite pour Ue → non mentionnée (silence).'
  Up:
    silence: autorise
    silence_src: 'Structure du chapitre ZONES U : Art. U-2 « Sont interdites : » (liste limitative, pp. 5-7) puis
      Art. U-3 « Sont autorisées, dans les conditions définies ci-après : » (p. 7). Aucune clause « seules sont
      admises » ne vise la zone Up. (Le « caractère » de la zone p. 3, « commerces et services strictement limités
