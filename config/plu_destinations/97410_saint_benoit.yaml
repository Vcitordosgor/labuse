        article: U-2 5°
        page_pdf: 6
        citation: '« 5° En zone Ue et Up : - Les constructions à usage d''habitation à l''exception : 1) des logements
          de gardiennage incorporés au bâtiment d''activité, 2) des logements étudiants de l''internat du CFPPA
          situé en zone Ue sur le secteur de la zone d''activités de Beaulieu. »'
      hebergement:
        statut: sous_condition
        condition: interdits, sauf logements de gardiennage incorporés au bâtiment d'activité
        article: U-2 5°
        page_pdf: 6
        citation: '« - Les constructions à usage d''habitation à l''exception : 1) des logements de gardiennage
          incorporés au bâtiment d''activité […] » (« habitation » = destination R151-27 couvrant logement + hébergement
          ; citation commune)'
      artisanat_commerce_detail:
        statut: sous_condition
        condition: autorisés uniquement dans la limite de 5 % de la surface totale de la zone (limite en %, pas
          de seuil en m²)
        article: U-3 4°
        page_pdf: 8
        citation: '« 4° En zone Up : - les constructions et installations à destination de commerces et de services
          ne sont autorisées que dans la limite de 5% de la surface totale de la zone. » (« commerce » → artisanat_commerce_detail
          + commerce_gros)'
      commerce_gros:
        statut: sous_condition
        condition: autorisés uniquement dans la limite de 5 % de la surface totale de la zone
        article: U-3 4°
        page_pdf: 8
        citation: « les constructions et installations à destination de commerces et de services ne sont autorisées
          que dans la limite de 5% de la surface totale de la zone. »
      activites_services_clientele:
        statut: sous_condition
        condition: autorisées uniquement dans la limite de 5 % de la surface totale de la zone
        article: U-3 4°
        page_pdf: 8
        citation: « les constructions et installations à destination de commerces et de services ne sont autorisées
          que dans la limite de 5% de la surface totale de la zone. » (« services » couvre pleinement les activités
          de services où s'effectue l'accueil d'une clientèle)
    notes:
    - 'Mapping : « commerces et de services » (Art. U-3 4°) → artisanat_commerce_detail + commerce_gros (« commerce
      ») et activites_services_clientele (« services ») ; restauration, cinéma, hôtels, bureaux, etc. ne sont pas
      couverts en plein par ces termes → non écrits.'
    - 'Règle spatiale : « En zones Up et Ub, dans les espaces hachurés en vert […] corridor écologique protégé (de
      part et d''autre de la ravine la Sourdine), toute construction est interdite. » (Art. U-2 7°, p. 7).'
  Ut:
    silence: interdit
    silence_src: 'Art. U-2 6° (p. 7) : « 6° En zone Ut : - Toutes les constructions à l''exception des équipements
      et hébergements touristiques et des constructions affectées au logement du personnel travaillant sur le site.
      » — tout ce qui n''est pas dans les exceptions est interdit.'
    sous_destinations:
