  A:
    silence: interdit
    silence_src: 'Art. A-2, p. 34 : « Sont interdites : En zone A : toute construction nouvelle, à l''exception
      des constructions et installations nécessaires à l''exploitation agricole, dans les limites définies à l''article
      A-3 » — structure en liste positive d''exceptions : tout ce qui n''est pas excepté est interdit.'
    sous_destinations:
      exploitation_agricole:
        statut: sous_condition
        condition: seules échappent à l'interdiction générale les constructions et installations nécessaires à l'exploitation
          agricole, dans les limites définies à l'article A-3 ; l'article A-3 3° (p. 34) admet en outre les constructions
          et installations nécessaires à la transformation, au conditionnement et à la commercialisation des produits
          agricoles lorsque ces activités constituent le prolongement de l'acte de production, à condition de ne
          pas être incompatibles avec l'exercice d'une activité agricole, pastorale ou forestière sur le terrain
          et de ne pas porter atteinte à la sauvegarde des espaces naturels et des paysages
        article: A-2 / A-3 3°
        page_pdf: 34
        citation: « toute construction nouvelle, à l'exception des constructions et installations nécessaires à
          l'exploitation agricole, dans les limites définies à l'article A-3 » (A-2, p. 34)
      logement:
        statut: sous_condition
        condition: '1) le logement de l''exploitant agricole est autorisé dès lors que la présence permanente de
          l''exploitant sur le site de son exploitation est nécessaire à son fonctionnement (A-3 2°, p. 34) ; 2)
          les bâtiments d''habitation existants à la date d''approbation du PLU peuvent faire l''objet d''annexes
          et d''extensions limitées, sous réserve de la légalité du bâtiment existant, sans compromettre l''activité
          agricole ni la qualité paysagère : surface de plancher totale (maison, annexes et extensions comprises)
          ≤ 160 m² (A-3 4°, p. 35) ; portée à 300 m² au total lorsque les annexes ou extensions accueillent des
          activités agrotouristiques (A-3 5°, p. 35) ; annexes et extensions à ≤ 20 m du bâtiment principal (A-7,
          p. 38)'
        seuil_m2: 160
        seuil_type: surface_plancher
        article: A-3 2°, 4° et 5°
        page_pdf: 34
        citation: « Le logement de l'exploitant agricole est autorisé dès lors que la présence permanente de l'exploitant
          sur le site de son exploitation est nécessaire à son fonctionnement » (A-3 2°, p. 34) ; « La surface de
          plancher totale autorisée pour ces constructions (maison d'habitation, annexes et extensions comprises)
