# COMMUNES AU RNU (règlement national d'urbanisme) — SOURCE DE VÉRITÉ du flag commune-level.
#
# MANDAT RNU (C) : le mécanisme est GÉNÉRAL — « toute commune sans document local » — pas un
# cas Saint-Philippe. Un PLU annulé au contentieux ou caduc fait retomber n'importe quelle
# commune ici : AJOUTER une entrée suffit (aucun code à toucher).
#
# Doctrine :
# - ce fichier est DÉCLARATIF et VÉRIFIÉ À LA MAIN (la donnée automatique la plus proche,
#   le flag GPU `is_rnu`, est PROUVÉE périmée — cf. reports/algo1b-diagnostic-rr.md annexe) ;
# - chaque entrée porte sa PREUVE (sources + date de vérification) ;
# - conséquences produit : étiquette « commune au règlement national d'urbanisme — pas de
#   PLU local » sur la fiche et les exports ; à terme (après validation de la méthode PAU),
#   branche RNU du moteur de faisabilité + plancher C adapté.
# - retirer une commune = son document local est approuvé ET ingéré (zones GPU/AGORAH en base).

