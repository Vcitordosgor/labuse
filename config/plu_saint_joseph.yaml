# Zones à CONSTRUCTION NEUVE NON AUTORISÉE (mécanisme zones_au_st — friction F2 : étiquette
# moteur « secteur de transition » approximative, capacité zéro EXACTE) :
#  - 2AU* : « L'ouverture à l'urbanisation des zones 2AUindicée ne pourra intervenir qu'une
#    fois l'aménagement de l'ensemble des zones 1AUindicée du pôle urbain de référence
#    entrepris » (caractère, p.105).
#  - 3AU* : idem après les 2AU « et à partir de 2026 » (p.105) — la condition d'aménagement
#    des 2AU reste non remplie : fermées.
#  - suffixe st (2AU5st, 3AU3st, 3AU5st, 3AU5vist) : chapitre AUst p.100-104 — « l'ouverture
#    à l'urbanisation de la zone est conditionnée à une MODIFICATION du PLU » ; seuls
#    réseaux/ouvrages publics et extensions <= 20 m² SDP admis (Art. AUst 2.2, p.101-102).
#  - 3AUto : degré 3 → fermée (le caractère AUto ne lève pas la condition de degré).
zones_au_st:
  liste: ["2AU2", "2AU3", "2AU3a", "2AU5", "2AU5cvd", "2AU5ma", "2AU5ru", "2AU5st", "2AU5vi",
          "2AU6", "2AU6ch", "3AU3", "3AU3a", "3AU3st", "3AU5", "3AU5ma", "3AU5st", "3AU5vist",
          "3AU6", "3AU6ch", "3AUto"]
  portee: "Construction neuve non autorisée en l'état : 2AU ouvrables seulement après aménagement de toutes les 1AU du pôle SAR ; 3AU après les 2AU (et à partir de 2026) ; zones *st par MODIFICATION du PLU (extensions <= 20 m² SDP uniquement, Art. AUst 2.2)."
  source: "Caractère ZONE AUindicée, p.105 ; chapitre ZONE AUst, p.100-104."

# Zones NON constructibles (urbanisation) — décision motivée (principe mandat-cadre) :
