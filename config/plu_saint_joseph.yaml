# =============================================================================
# PLU SAINT-JOSEPH (97412) — règles chiffrées par zone constructible (U / AU)
# =============================================================================
# Source unique : règlement écrit du PLU de Saint-Joseph (archive GPU 97412_PLU_20251210).
#   document : 97412_reglement.pdf (cache pré-vol nuit), 185 p. EN VIGUEUR, concordance
#   manifeste/GPU re-vérifiée au pré-vol du 27/07/2026 (17/17).
#
# FIABILITÉ (n'inventer AUCUNE valeur) :
#   - page_pdf = page_imprimee + 1 (pré-vol, vérifié sur les en-têtes d'articles).
#     Les _src citent la page IMPRIMÉE.
#   - null = « non réglementé » explicite ; "a_verifier" = ambigu/conditionnel.
#   - ANCIEN FORMAT à articles préfixés (U1 1..U1 14) : 6=voies, 7=limites, 9=emprise,
#     10=hauteur, 12=stationnement, 13=espaces libres. Aucun COS (pré-vol : 0 occurrence).
#   - HAUTEURS PAR BANDES DE PROFONDEUR depuis l'alignement (U1/U2/U3/U5cvd) : convention
#     = graver la bande LA PLUS PROFONDE (règle du cœur de parcelle, dominante en surface),
#     bandes de front en note — PRÉCÉDENT Saint-Paul U1a (extraction d'origine validée).
#     Friction v1 consignée au rapport de nuit.
#   - PLEINE TERRE = « % espace vert et perméable » des Art. 13 (convention Saint-Paul).
#   - RETRAIT LIMITES : U2-U6 = « moitié de la hauteur de façade, minimum X m » → gravé X
#     (minimum plancher, prudent ; règle H/2 en note).
#   - ZONES AU : chapitre unique « AUindicée » (renvoi à la zone U d'indice) ; AUto/AUtok à
#     règles PROPRES (Art. AUindicée 9/10). Degrés : 1AU ouvertes ; 2AU fermées (après
#     aménagement des 1AU du pôle SAR) ; 3AU fermées (après les 2AU, à partir de 2026) ;
#     AU*st fermées (ouverture par MODIFICATION du PLU, extensions <= 20 m² SDP).
#   - Renvoi moteur inopérant sur les codes 1AU…/2AU…/3AU… (préfixe chiffré) => entrées
#     explicites ; gels portés par zones_au_st (friction F2 du pilote, étiquette inexacte,
#     capacité zéro exacte).
# =============================================================================

