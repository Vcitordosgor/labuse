# =============================================================================
# PLU BRAS-PANON (97402) — règles chiffrées par zone constructible (U / AU)
# =============================================================================
# Source unique : règlement écrit du PLU (archive GPU 97402_PLU_20260428 — document
#   le plus récent de l'île au calibrage).
#   document : 97402_reglement.pdf (110 p.) — PLU prescrit le 21/09/2011, arrêté le
#   27/03/2019, approuvé le 30/11/2019 ; révision allégée n°1 approuvée le 20/10/2021,
#   révision allégée n°2 approuvée le 28/09/2022, déclaration de projet emportant mise
#   en compatibilité (projet médico-social du Domaine de l'Union, secteur Udu) approuvée
#   le 28/04/2026 (page de garde p.1 PDF + tableau des procédures p.1 imprimée).
#
# FIABILITÉ (n'inventer AUCUNE valeur) :
#   - page_pdf = page_imprimee + 2 (vote extract.py +2 avec 4 voix, CONFIRMÉ : imprimée 1
#     = PDF 3, sommaire imprimé 2 = PDF 4, « TITRE I » sommaire p.3 = PDF 5, dispositions
#     générales p.4-8 = PDF 6-10, « ZONE Ua » sommaire p.10 = PDF 12). Les numéros
#     imprimés figurent en EN-TÊTE de page. Les _src citent la page IMPRIMÉE.
#   - COS : ZÉRO occurrence dans tout le document (vérifié full.txt + dedouble.txt,
#     0/0) — document post-ALUR (28/04/2026), rien à consigner, rien à appliquer.
#   - null = « Non réglementé » / « Sans objet » explicite (sourcé), ou absence de
#     sous-minimum de pleine terre (voir ci-dessous).
#   - ANCIEN FORMAT à articles préfixés (UA1..UA15) : 6=recul voirie, 7=recul limites,
#     9=emprise, 10=hauteur, 12=stationnement, 13=espaces libres.
#   - PLEINE TERRE : chaque Art. <Z>13.1 impose un % « espace vert et perméable »
#     (Ua/Ub/Uc 30 %, Ud 40 %, Ue 20 %) SANS AUCUN sous-minimum de pleine terre =>
#     pleine_terre_pct null PARTOUT, % perméable en note (précédents Saint-Louis,
#     Le Port, Les Avirons, La Plaine-des-Palmistes).
#   - RECUL LIMITES : implantation en limite(s) latérale(s) autorisée (2 en Ua/Ub ;
#     1 seule en Uba, Uc, Ud sur 20 m de profondeur, 2 si largeur < 14 m) OU retrait
#     H/2 >= 3 m ; fond de parcelle : retrait H/2 >= 3 m obligatoire (annexes en limite
#     de fond admises) => gravé 3 (valeur du retrait), faculté d'implantation en limite
#     en note (convention Tampon). Ue : retrait 5 m (obligatoire en limite de zone
#     habitat U/AU, sinon 1 limite possible).
#   - STATIONNEMENT : tableau IDENTIQUE dans toutes les zones U (Art. <Z>12.2) :
#     1 place / logement de SDP <= 100 m² ; 1,5 place / logement >= 100 m² ; 1 place
#     MAXIMUM par logement aidé. Gravé « 1 place / logement » : les hypothèses de
#     faisabilité (65-80 m²/logt) placent tout le produit modélisé sous le seuil de
#     100 m² ; tranche 1,5 en note.
#   - RÈGLE GÉNÉRALE DES SECTEURS (dispositions générales, p.6) : « Dès lors que la
#     zone comprend un ou plusieurs secteurs, la règle générale de la zone s'applique
#     à chacun d'eux sauf lorsqu'une disposition particulière est prévue pour l'un de
#     ces secteurs » => Uba (dispositions propres : Art. UB 7.2 et exception hauteur
#     UB 10.2) et Udu (dispositions propres : Art. UD 1.1.5 et UD 2.1.4, destinations)
#     héritent du reste des règles Ub / Ud — héritage ÉCRIT, pas inféré.
#   - ZONES AU (chapitre unique « ZONE AUindicée », p.75-79) : renvoi explicite « il
#     convient de se reporter en fonction de l'indice de la zone AU considérée au
#     règlement des zones urbaines correspondantes » (p.75, idem dispositions générales
#     p.6), répété « Se reporter au règlement de la zone U indiquée en indice » aux
#     articles 1.2 et 3 à 14 ; « Pour les zones AUt et AUec, il convient de se reporter
#     au règlement de la zone Ua » (répété aux articles 3 à 9 et 11 à 14 ; art. 10 :
#     AUt -> Ua, AUec -> hauteur absolue 18 m). Le renvoi mécanique du moteur ne couvre
#     pas les codes 1AUx/2AUx (préfixe chiffré) => entrées EXPLICITES.
#   - GRAPHIES AU (point de vigilance n°3 — 27 renvois, tous dans le chapitre AUindicée
#     et les dispositions générales, tous résolus) : le corps du texte écrit les indices
#     SANS préfixe chiffré (« zone AUt », « zone AUec », « zones AUa et AUb », « zone
#     AUc », « zone AUd », Art. AUINDICEE 2.2.4-2.2.7, p.76), le préambule définit les
#     « deux types de zones » 1AUindicée / 2AUindicée (p.75) et nomme EXPLICITEMENT
#     « les zones 1AUec » et « les zones 2AUec » (p.75 ; idem dispositions générales
#     p.6) ; « 1AUb » et « 1AUe » sont nommées au tableau des procédures (p.1).
#     L'équivalence 1AUx/2AUx <-> AUx est donc écrite, pas inférée.
#   - GELS : 2AUa/2AUb/2AUc/2AUec (Art. AUINDICEE 2.2.3, p.76 : ouverture conditionnée
#     à l'aménagement de l'ensemble des 1AUindicée du pôle SAR) et AUst (chapitre
#     p.80-82 : tout interdit sauf réseaux / ouvrages techniques / extension mineure
#     20 m², ouverture conditionnée à une MODIFICATION du PLU) => zones_au_st.
#     AUst, candidate O12 « activité » du pré-vol : le régime réel vérifié est un GEL
#     total (aucune vocation d'activité dans le chapitre), pas une zone d'activité.
# =============================================================================

