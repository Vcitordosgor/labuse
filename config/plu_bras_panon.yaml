# GELS — capacité zéro exacte (étiquette moteur « secteur de transition » inexacte,
# friction F2 connue depuis le pilote) :
#   - 2AUa / 2AUb / 2AUc / 2AUec : « leur ouverture à l'urbanisation ne pourra intervenir
#     qu'une fois l'aménagement de l'ensemble des zones 1AUindicée du pôle urbain de
#     référence fixé par le SAR associée au classement de la zone considérée (zone Ua,
#     Ub, Uc, Ud, Ue) soit entrepris » (Art. AUINDICEE 2.2.3, p.76 ; idem préambule p.75
#     et dispositions générales p.6). 2AUec cumule le régime AUec (habitat interdit hors
#     gardiennage 70 m², Art. AUINDICEE 2.2.7, p.76).
#   - AUst : chapitre propre p.80-82 — « l'ouverture à l'urbanisation de la zone est
#     conditionnée à une modification du PLU » (caractère de zone, p.80) ; Art. AUst 1.2
#     (p.80) : « Toutes les occupations et utilisations du sol sont interdites à
#     l'exception de celles admises à l'article AUst 2.2 » ; Art. AUst 2.2 (p.81) :
#     réseaux/voirie/stationnement/énergie, ouvrages techniques de service public,
#     extension mineure <= 20 m² SDP sur constructions existantes (recul voirie 4 m,
#     limites 3 m pour ces seuls travaux ; articles 9/10/12/13 « Sans objet », p.81-82).
#     Candidate O12 du pré-vol : régime réel vérifié = GEL total, pas zone d'activité.
zones_au_st:
  liste: ["2AUa", "2AUb", "2AUc", "2AUec", "AUst"]
  portee: "Construction neuve non autorisée en l'état : 2AUa/2AUb/2AUc/2AUec = extension urbaine SAR, ouverture conditionnée à l'engagement de l'aménagement de TOUTES les 1AUindicée du pôle urbain SAR de référence (Art. AUINDICEE 2.2.3, p.76) ; AUst = urbanisation future gelée, ouverture conditionnée à une MODIFICATION du PLU (réseaux et accès insuffisants, études préalables requises), seuls admis réseaux/ouvrages techniques/extension mineure <= 20 m² SDP (Art. AUst 1.2, p.80 et 2.2, p.81). Le manifeste ne compte AUCUN polygone 2AUd, 2AUe ni 2AUt."
  source: "Art. AUINDICEE 2.2.3, p.76 ; ZONE AUst : Art. AUst 1.2, p.80 et Art. AUst 2.2, p.81."

# Zones NON constructibles (urbanisation) — hors périmètre faisabilité U/AU.
# DÉCISION (principe du mandat-cadre, modèle Tampon) : constructibilité d'EXCEPTION
# uniquement — les graver ferait calculer une capacité logement fictive => repli
# générique (non constructibles), verdict produit correct.
#   - A (chap. p.84-92) : Art. A1.2 tout interdit sauf A2.2 (p.85-86) — bâtiments
#     techniques agricoles, extension habitat existant +30 % <= 30 m² et 120 m² total,
#     agritourisme 30 m² accolé, équipements/réseaux, carrières. Acu (coupure
#     d'urbanisation SAR) : réhabilitation/mise aux normes de l'existant seulement.
#   - N (chap. p.94-103) : Art. N1.2 tout interdit sauf N2.2 (p.95-97) — extension
#     habitat existant +30 % <= 30 m²/120 m² (hors Npnr/Nr/Nsc/Nli) ; hauteur zone N
#     6 m (Art. N10.2, p.100). Nli : aménagements légers R.121-5 seuls ; Npnr : cœur du
#     Parc national, autorisation spéciale ; Nr : réservoirs de biodiversité ; Nsc :
#     site classé Rivière des Roches ; Nt2/Nt3 : STECAL touristiques à SDP plafonnée
#     (500 m² hébergement hôtelier Nt2 ; 1 000 m² + 1 logement de fonction 110 m² Nt3,
#     Art. N2.2.11-12, p.96-97 ; hauteurs 4 m égout / 7 m faîtage, Art. N10.2, p.100) ;
#     Nup : station de potabilisation (7 m).
zones_non_constructibles: ["A, Acu (chap. p.84-92)",
                           "N, Nli, Npnr, Nr, Nsc, Nt2, Nt3, Nup (chap. p.94-103)"]
