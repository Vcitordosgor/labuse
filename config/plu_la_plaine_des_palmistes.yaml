# Zone AUs (chapitre p.71-74) — GEL : « l'ouverture à l'urbanisation de la zone est
# conditionnée à une modification du PLU » (caractère de zone, p.71 ; idem dispositions
# générales, p.7). Art. AUs 1.2 (p.71) : « Toutes les occupations et utilisations du sol
# sont interdites à l'exception de celles admises à l'article AUs 2.2 » ; Art. AUs 2.2
# (p.72) : réseaux/voirie/stationnement, ouvrages techniques de service public,
# reconstruction après sinistre, extension mineure <= 20 m² SDP sur constructions
# existantes. Hauteur des rares travaux admis : 6 m égout / 9 m faîtage (Art. AUs 10,
# p.73). COS nul (Art. AUs 14, p.74) : consigné en tête, PAS consommé — le gel repose
# sur Art. AUs 1.2/2.2. AUs1/AUs2 : secteurs sans AUCUNE disposition particulière au
# chapitre => règle générale de la zone (dispositions générales, p.7) ; graphies
# attestées par la modification n°3 (p.134 PDF) et la notice 2016 (p.190 PDF).
# Capacité zéro EXACTE (étiquette moteur « secteur de transition » inexacte — friction
# F2 connue depuis le pilote).
zones_au_st:
  liste: ["AUs1", "AUs2"]
  hauteur_max_m: 9
  portee: "Construction neuve non autorisée en l'état : zone AUs d'urbanisation future gelée, ouverture conditionnée à une MODIFICATION du PLU (réseaux et accès insuffisants). Seuls admis : réseaux/voirie, ouvrages techniques de service public, reconstruction après sinistre, extension mineure <= 20 m² SDP sur l'existant (hauteur 6 m égout / 9 m faîtage). AUs1 (« moyen terme ») et AUs2 (« long terme », notice 2016 p.190 PDF) : aucune disposition particulière au chapitre AUs => règle de la zone entière pour chacun (dispositions générales, p.7). La parcelle AV 613 (ex-AUs1/AUs2) a été reclassée AUb par la modification n°3 du 27/05/2023 — le zonage du manifeste (millésime 20230527) intègre déjà ce reclassement."
  source: "ZONE AUs (caractère de zone, p.71) ; Art. AUs 1.2, p.71 ; Art. AUs 2.2, p.72 ; Art. AUs 10, p.73 ; Art. AUs 14, p.74."

# Zones NON constructibles (urbanisation) — hors périmètre faisabilité U/AU.
# DÉCISION (principe du mandat-cadre, modèle Tampon) : constructibilité d'EXCEPTION
# uniquement — les graver ferait calculer une capacité logement fictive => repli
# générique (non constructibles), verdict produit correct.
#   - A (p.79-87) : seules les constructions nécessaires à l'exploitation agricole ;
#     1 habitation par exploitation, 170 m² SDP max, hors secteur Aco (Art. A 2.2 (7.),
#     p.80). Aco (corridors écologiques) : encore plus restrictif ; Ama : carrières.
#   - N (p.89-98) : Art. N 1.2 tout est interdit sauf N 2.2 ; N : extension de l'existant
#     limitée à 120 m² SDP cumulée (hors Nco/Nr/Np/Nu) ; Nto : STECAL touristique à SDP
#     plafonnée 250 m² hébergement + 250 m² autres par unité foncière, emprise 20 %
#     (Art. N 9.2, p.94), hauteurs 3 m égout / 7 m faîtage (Art. N 10.1, p.94) ; Nco/Nr/
#     Np : quasi-inconstructibles (corridors, réservoirs de biodiversité, pâturages du
#     coeur de Parc national) ; Nma : carrières ; Nu : parcs et jardins familiaux.
zones_non_constructibles: ["A, Aco, Ama (chap. p.79-87)",
                           "N, Nco, Nma, Np, Nr, Nto, Nu (chap. p.89-98)"]
