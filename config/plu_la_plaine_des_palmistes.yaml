# =============================================================================
# PLU LA PLAINE-DES-PALMISTES (97406) — règles chiffrées par zone constructible (U / AU)
# =============================================================================
# Source unique : règlement écrit du PLU (archive GPU 97406_PLU_20230527).
#   document : 97406_reglement.pdf (217 p.) — PLU approuvé le 29/05/2013, modifié le
#   11/03/2019 (modification n°2) et le 27/05/2023 (modification n°3, idurba).
#
# STRUCTURE DU PDF (4 blocs concaténés — vérifiée page à page) :
#   - p.1-117   : RÈGLEMENT consolidé (CODRA 2019, « Approuvé le 29 mai 2013, Modifié le
#                 11 mars 2019 ») — pagination imprimée = page PDF (offset 0, vérifié :
#                 « ZONE Ua » imprimée 11 = PDF 11, « ZONE Ub » 23 = PDF 23, glossaire 113
#                 = PDF 113, conforme au sommaire p.3). C'EST LE SEUL TEXTE RÈGLEMENTAIRE
#                 EN VIGUEUR ; toutes les citations _src pointent dans ce bloc (offset 0).
#   - p.118-149 : notice de la MODIFICATION n°3 (mai 2023, pagination propre 1-31) —
#                 REZONAGE PUR : la parcelle AV 613 (5 640 m² AUs1 + 1 670 m² AUs2) est
#                 reclassée AUb (p.134-135 PDF, en image) ; AUCUNE modification du texte
#                 du règlement (« Pour appliquer le règlement, il convient de se reporter
#                 … au règlement des zones urbaines correspondantes à savoir Ub pour
#                 AUb », p.135 PDF). Couche texte fantôme superposée (articles du
#                 règlement en filigrane) — ignorée, sans valeur normative propre.
#   - p.150-177 : notice de la modification n°2 (février 2019, pagination propre) — déjà
#                 intégrée au bloc consolidé p.1-117.
#   - p.178-217 : notice de la modification « Plateau vert » (2016, pagination propre
#                 1-40 : c'est elle qui produisait le faux vote d'offset +177) — périmée,
#                 intégrée au consolidé.
#
# COS (invariant 5, ALUR 2014) — document GPU en vigueur du 27/05/2023 (post-ALUR) :
#   occurrences CONSIGNÉES, JAMAIS APPLIQUÉES :
#     - Art. Ua 14 p.22, Ub 14 p.34, Uc 14 p.46, Ur 14 p.58, Ue 14 p.69 : « Il n'est pas
#       fixé de coefficient d'occupation du sol. »
#     - Art. AUs 14, p.74 : « Le coefficient d'occupation des sols est nul à l'exception
#       des travaux d'aménagement et d'extension mineure pour mise aux normes sanitaires
#       et d'habitabilité limités à 20 m2 de surface de plancher réalisés sur des
#       constructions existantes. » — le gel AUs gravé ici est porté par Art. AUs 1.2/2.2
#       (liste limitative, indépendante du COS), pas par ce COS nul.
#     - Art. AUINDICEE 14, p.77 : « Se reporter au règlement de la zone U indiquée en
#       indice. » ; Art. A 14, p.87 et Art. N 14, p.98 : « Sans objet. »
#     - Reprises fantômes des mêmes articles 14 dans les couches texte superposées des
#       blocs annexés (p.118-177 PDF) — mêmes textes, aucune valeur nouvelle.
#   Aucun COS n'est gravé ni consommé.
#
# FIABILITÉ (n'inventer AUCUNE valeur) :
#   - null = « Non réglementé(e) » / « Sans objet » explicite (sourcé).
#   - ANCIEN FORMAT à articles préfixés (Ua1..Ua14) : 6=recul voirie, 7=recul limites,
#     9=emprise, 10=hauteur, 12=stationnement, 13=espaces libres.
#   - RECUL VOIRIE Ua : « peuvent être implantées en retrait ou à l'alignement », le
#     retrait étant PLAFONNÉ à 6 m (bande d'implantation, Art. Ua 6.2) => minimum 0
#     gravé, plafond en note. Ub/Uc : retrait obligatoire 4 m ; Ur : 5 m ; Ue : 3 m.
#   - RECUL LIMITES : implantation sur limite(s) autorisée en Ua (2 max), Ub/Uc (1 max),
#     Ue (2 max) OU retrait 3,50 m ; Ur : retrait 3,50 m OBLIGATOIRE => gravé 3.5
#     partout (valeur du retrait), faculté d'implantation en limite en note (convention
#     Tampon).
#   - PLEINE TERRE : Art. 13.3 impose un % « espace vert et perméable » SANS AUCUN
#     sous-minimum de pleine terre => pleine_terre_pct null PARTOUT, % perméable en note
#     (précédents Saint-Louis, Le Port, Les Avirons). En Ua, les aires de stationnement
#     peuvent MÊME compter dans ce % (p.22) ; en Ub/Uc/Ur/Ue elles en sont exclues.
#   - STATIONNEMENT : tableau UNIQUE en annexe (p.103) pour toutes les zones (chaque
#     Art. 12.2 : « cf. annexe du règlement ») : logement < 30 m² => 1 place ; logement
#     > 30 m² => 1,5 place/logement arrondi à l'entier inférieur pour l'opération.
#   - ZONES AU indicées (chapitre « ZONE AUindicée », p.75-77) : renvoi explicite « il
#     convient de se reporter, en fonction de l'indice de la zone AU considérée, au
#     règlement des zones urbaines correspondantes à savoir Ub pour AUb, etc. » (p.75),
#     répété « Se reporter au règlement de la zone U indiquée en indice » à chaque
#     article => AUb→Ub, AUc→Uc, AUe→Ue, AUr→Ur en entrées EXPLICITES (le renvoi
#     mécanique du moteur ne couvre que les codes AU à indice numérique).
#   - AUs1/AUs2 : le chapitre AUs (p.71-74) ne nomme pas les secteurs, mais la règle
#     générale des dispositions générales s'applique : « Dès lors qu'une zone comprend
#     un ou plusieurs secteurs, la règle générale de la zone s'applique à chacun d'eux
#     sauf lorsqu'une disposition particulière est prévue » (p.7) ; AUCUNE disposition
#     particulière AUs1/AUs2 n'existe dans le règlement. Les graphies AUs1/AUs2 sont
#     attestées dans le dossier : modification n°3 p.134 PDF (« 5 640 m² sont classés en
#     zone AUs1 et 1 670 m² en zone AUs2 », en image) et notice 2016 p.190 PDF (AUs1
#     « moyen terme », zone AUs2 chemin Dureau) => gel de la zone AUs entière.
# =============================================================================

# DOCTRINE HARMONISÉE A/B/C (28/07/2026, arbitrage Vic) : le % « espace vert et
# perméable » est GRAVÉ dans pleine_terre_pct, libellé verbatim conservé en _src —
# ce n'est PAS un minimum de pleine terre stricto sensu. Retraits en H/2 :
# valeur gravée = max(H/2 à la hauteur maximale gravée, plancher du texte).

