# publication_gpu  = date de publication du lot au Géoportail de l'Urbanisme.
# edition          = date d'édition matérielle du PDF (couverture), format libre.
# modifications    = actes postérieurs à l'approbation (type/date/source/note).
# procedures       = procédures d'évolution EN COURS (type/source), libellé distinct.
