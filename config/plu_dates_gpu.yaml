# renseignée QUE lorsqu'une pièce la donne (Saint-Paul : « Edition mars 2026 » en couverture) — jamais
# devinée. Les procédures reprennent les révisions générales / allégées relevées par le relecteur ; le
# compteur de l'annuaire reste, lui, la source unique veille_plu (non modifiée).
